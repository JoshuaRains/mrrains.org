<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorts Activity</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: rgba(30, 41, 59, 0.6);
      --accent: #6366f1;
      /* Indigo */
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: transparent;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    /* Main Layout */
    main {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: 24px;
      min-height: 0;
      /* Important for scrolling */
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Video Column */
    .col-video {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .video-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 80vh;
      aspect-ratio: 9/16;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* Panels */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Questions */
    .question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-opt {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .answer-opt:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .answer-opt.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    .timestamp-btn {
      margin-top: 12px;
      font-size: 0.85rem;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--accent);
      width: fit-content;
    }

    /* Comments */
    .comment-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 12px;
      border-left: 3px solid var(--accent);
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .comment-author {
      font-weight: 600;
      color: var(--text-main);
    }

    .comment-body {
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Loading / Error */
    .overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      main {
        grid-template-columns: auto 1fr;
      }

      .col-comments {
        display: none;
      }

      /* Hide comments on medium screens if needed, or stack */
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .video-frame {
        max-height: 60vh;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Shorts Activity</h1>
    <div class="controls">
      <button id="prevBtn" disabled>← Prev</button>
      <button id="nextBtn" class="primary">Next →</button>
      <div style="width: 1px; height: 24px; background: var(--border); margin: 0 8px;"></div>
      <label style="font-size: 0.9rem; color: var(--text-muted);">Vol</label>
      <input type="range" id="volRange" min="0" max="100" value="100" style="width: 80px;">
    </div>
  </header>

  <main id="mainGrid">
    <!-- Video Column -->
    <div class="col-video">
      <div class="video-frame">
        <div id="player"></div>
        <div id="loadingOverlay" class="overlay-msg">
          <div class="spinner"></div>
          <div>Loading Video...</div>
        </div>
        <div id="errorOverlay" class="overlay-msg hidden">
          <div style="font-size: 2rem; margin-bottom: 8px;">⚠️</div>
          <div id="errorText">Video Error</div>
          <button onclick="retryVideo()" style="margin-top: 16px;">Retry</button>
        </div>
      </div>
    </div>

    <!-- Questions Panel -->
    <div class="panel col-questions" id="panelQuestions">
      <div class="panel-header">
        <span>❓</span> Questions
      </div>
      <div class="panel-content" id="questionsList">
        <!-- Questions injected here -->
      </div>
    </div>

    <!-- Comments Panel -->
    <div class="panel col-comments" id="panelComments">
      <div class="panel-header">
        <span>💬</span> Comments
      </div>
      <div class="panel-content" id="commentsList">
        <!-- Comments injected here -->
      </div>
    </div>
  </main>

  <script>
    // State
    let slidesData = [];
    let currentIndex = 0;
    let player = null;
    let segmentTimer = null;
    let isPlayerReady = false;

    // Config
    const DEFAULT_SET = 'doomscrolling1'; // Changed from shorts1 to existing file

    // Elements
    const els = {
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      volRange: document.getElementById('volRange'),
      questionsList: document.getElementById('questionsList'),
      commentsList: document.getElementById('commentsList'),
      panelQuestions: document.getElementById('panelQuestions'),
      panelComments: document.getElementById('panelComments'),
      loading: document.getElementById('loadingOverlay'),
      error: document.getElementById('errorOverlay'),
      errorText: document.getElementById('errorText'),
      mainGrid: document.getElementById('mainGrid')
    };

    // Init
    (async function init() {
      try {
        const params = new URLSearchParams(window.location.search);
        const setName = params.get('set') || DEFAULT_SET;

        const res = await fetch(`./shortsConfigs/${setName}.json`);
        if (!res.ok) throw new Error(`Config not found: ${setName}`);

        slidesData = await res.json();
        if (!Array.isArray(slidesData) || !slidesData.length) throw new Error("Invalid or empty config");

        // Load YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

      } catch (e) {
        showError(e.message);
      }
    })();

    // YouTube API Callback
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: slidesData[0].videoId,
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'controls': 1,
          'fs': 0,
          'hl': 'es',
          'cc_lang_pref': 'es',
          'origin': window.location.origin // Critical fix for some embeds
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError,
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerReady(event) {
      isPlayerReady = true;
      els.loading.classList.add('hidden');
      player.setVolume(els.volRange.value);
      loadSlide(0);
    }

    function onPlayerError(event) {
      let msg = "Unknown Error";
      switch (event.data) {
        case 2: msg = "Invalid Parameter"; break;
        case 5: msg = "HTML5 Player Error"; break;
        case 100: msg = "Video Not Found"; break;
        case 101:
        case 150: msg = "Embed Not Allowed"; break;
      }
      showError(`YouTube Error: ${msg} (${event.data})`);
    }

    function onPlayerStateChange(event) {
      // Could handle auto-next here if desired
    }

    function loadSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      currentIndex = index;

      // Update Buttons
      els.prevBtn.disabled = index === 0;
      els.nextBtn.disabled = index === slidesData.length - 1;

      // Load Video
      const data = slidesData[index];
      if (isPlayerReady) {
        els.loading.classList.remove('hidden');
        els.error.classList.add('hidden');
        player.loadVideoById(data.videoId);
        // Loading overlay will be hidden when video starts buffering/playing? 
        // Actually loadVideoById doesn't fire onReady again.
        // We can hide loading after a short delay or listen to state change.
        setTimeout(() => els.loading.classList.add('hidden'), 500);
      }

      // Render Content
      renderQuestions(data.questions);
      renderComments(data.comments);
      updateLayout(data);
    }

    function renderQuestions(questions) {
      els.questionsList.innerHTML = '';
      if (!questions || !questions.length) {
        els.panelQuestions.style.display = 'none';
        return;
      }
      els.panelQuestions.style.display = 'flex';

      questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const text = document.createElement('div');
        text.className = 'q-text';
        text.textContent = q.text;
        card.appendChild(text);

        const answersDiv = document.createElement('div');
        answersDiv.className = 'answers';

        q.answers.forEach((ans, aIdx) => {
          const opt = document.createElement('div');
          opt.className = 'answer-opt';
          if (q.selectedIndex === aIdx) opt.classList.add('selected');

          opt.textContent = ans;
          opt.onclick = () => {
            q.selectedIndex = aIdx;
            // Redraw this card's options
            Array.from(answersDiv.children).forEach((c, i) => {
              c.classList.toggle('selected', i === aIdx);
            });
          };
          answersDiv.appendChild(opt);
        });
        card.appendChild(answersDiv);

        if (q.timeStart !== undefined && q.timeEnd !== undefined) {
          const btn = document.createElement('button');
          btn.className = 'timestamp-btn';
          btn.textContent = `▶ Play Segment (${formatTime(q.timeStart)} - ${formatTime(q.timeEnd)})`;
          btn.onclick = () => playSegment(q.timeStart, q.timeEnd);
          card.appendChild(btn);
        }

        els.questionsList.appendChild(card);
      });
    }

    function renderComments(comments) {
      els.commentsList.innerHTML = '';
      if (!comments || !comments.length) {
        els.panelComments.style.display = 'none';
        return;
      }
      els.panelComments.style.display = 'flex';

      comments.forEach(c => {
        const card = document.createElement('div');
        card.className = 'comment-card';

        const meta = document.createElement('div');
        meta.className = 'comment-meta';
        meta.innerHTML = `<span class="comment-author">${c.author || 'User'}</span><span>${c.timeAgo || ''}</span>`;

        const body = document.createElement('div');
        body.className = 'comment-body';
        body.textContent = c.text;

        card.appendChild(meta);
        card.appendChild(body);
        els.commentsList.appendChild(card);
      });
    }

    function updateLayout(data) {
      const hasQ = data.questions && data.questions.length > 0;
      const hasC = data.comments && data.comments.length > 0;

      // CSS Grid Template adjustments
      if (hasQ && hasC) {
        els.mainGrid.style.gridTemplateColumns = "auto 1fr 1fr";
      } else if (hasQ) {
        els.mainGrid.style.gridTemplateColumns = "auto 1fr";
      } else if (hasC) {
        els.mainGrid.style.gridTemplateColumns = "auto 1fr";
      } else {
        els.mainGrid.style.gridTemplateColumns = "1fr";
      }
    }

    function playSegment(start, end) {
      if (!player) return;
      if (segmentTimer) clearInterval(segmentTimer);
      player.seekTo(start, true);
      player.playVideo();

      segmentTimer = setInterval(() => {
        if (player.getCurrentTime() >= end) {
          player.pauseVideo();
          clearInterval(segmentTimer);
        }
      }, 250);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function showError(msg) {
      els.loading.classList.add('hidden');
      els.error.classList.remove('hidden');
      els.errorText.textContent = msg;
    }

    function retryVideo() {
      els.error.classList.add('hidden');
      loadSlide(currentIndex);
    }

    // Event Listeners
    els.prevBtn.onclick = () => loadSlide(currentIndex - 1);
    els.nextBtn.onclick = () => loadSlide(currentIndex + 1);
    els.volRange.oninput = (e) => {
      if (player) player.setVolume(e.target.value);
    };

  </script>
</body>

</html>
