<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeos Cortos con Preguntas</title>
  <style>
    :root {
      --green-light: #79b791;
      --green-dark: #517860;
      --bg-gradient: linear-gradient(90deg, var(--green-light) 60%, var(--green-dark) 100%);
      --text-color: #fff;
      --card-bg: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.2);
      --border-radius: 8px;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      --spacing: 1rem;
    }

    html, body { height: 100%; margin: 0; }
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: var(--spacing);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.15);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .nav-buttons { display: flex; gap: 0.5rem; }
    .nav-buttons button {
      background-color: var(--card-bg);
      border: 1px solid #fff;
      color: var(--text-color);
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-buttons button:hover:not(:disabled) { background-color: var(--card-hover); }
    .nav-buttons button:disabled { opacity: 0.5; cursor: default; }

    .volume-slider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }
    .volume-slider label { font-size: 0.9rem; }
    .volume-slider input[type="range"] { width: 100px; cursor: pointer; }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: var(--spacing);
      gap: var(--spacing);
    }

    /* Grid container — columns adjust dynamically via JS */
    .video-and-panels {
      display: grid;
      gap: var(--spacing);
      height: 100%;
      min-height: 0;
      align-items: stretch;
      grid-template-columns: auto 1fr 0.9fr; /* default: video | questions | comments */
    }

    /* Video */
    .video-container {
      position: relative;
      background: #000;
      border-radius: var(--border-radius);
      overflow: hidden;
      aspect-ratio: 9 / 16;
      width: 100%;
      max-width: calc(80vh * 9 / 16);
      max-height: 80vh;
      box-shadow: var(--shadow);
      flex-shrink: 0;
      margin: 0 auto;
    }
    .video-container iframe,
    .video-container #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Questions */
    .questions {
      display: flex;
      flex-direction: column;
      gap: var(--spacing);
      overflow-y: auto;
      padding-right: 0.5rem;
      height: 100%;
    }
    .question {
      background: var(--card-bg);
      padding: var(--spacing);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }
    .question-text {
      font-weight: bold;
      margin-bottom: 0.5rem;
      font-size: 2rem;   /* increased size */
      line-height: 1.45;
    }
    .answers {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .answers label {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
      font-size: 1.5rem;
      border: 2px solid transparent;
    }
    .answers label:hover { background: rgba(255, 255, 255, 0.12); }
    .answers input[type="radio"] { display: none; }
    .answers label.selected {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid var(--green-light);
    }

    .timestamp {
      background: var(--card-bg);
      border: 1px solid #fff;
      color: var(--text-color);
      padding: 0.35rem 0.65rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-start;
    }
    .timestamp:hover { background: var(--card-hover); }

    /* Comments */
    .comments {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      overflow-y: auto;
      padding-right: 0.5rem;
      height: 100%;
      min-width: 0;
    }
    .comments-header {
      font-weight: bold;
            font-size: 2.5rem;   /* increased size */

      opacity: 0.95;
      letter-spacing: 0.2px;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }
    .comment {
      background: var(--card-bg);
      padding: 0.9rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      font-size: 2rem;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    .comment .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.8rem;
      margin-bottom: 0.45rem;
      font-size: 1.5rem;
      color: #dce5de;
      opacity: 0.95;
    }
    .comment .author { font-weight: bold; color: #fff; }
    .comment .time { opacity: 0.9; }

    /* Responsive */
    @media (max-width: 1100px) {
      .video-and-panels { grid-template-columns: auto 1fr; } /* video | (one panel) */
    }
    @media (max-width: 860px) {
      .video-and-panels { grid-template-columns: 1fr; grid-auto-rows: min-content; }
      .video-container { margin-bottom: 0.5rem; max-width: min(70vw, calc(80vh * 9 / 16)); }
      .comments, .questions { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="nav-buttons">
      <button id="prevBtn">Anterior</button>
      <button id="nextBtn">Siguiente</button>
    </div>
    <div class="volume-slider">
      <label for="volumeRange">Volumen:</label>
      <input type="range" id="volumeRange" min="0" max="100" value="50" />
    </div>
  </header>

  <main>
    <div id="grid" class="video-and-panels">
      <div class="video-container"><div id="player"></div></div>
      <div class="questions" id="questionsContainer"></div>
      <div class="comments" id="commentsContainer"></div>
    </div>
  </main>

  <script>
    // --- URL param: which set to load ---
    function getSetName() {
      const params = new URLSearchParams(window.location.search);
      return params.get('set') || 'shorts1'; // default
    }

    // --- Fetch the config JSON ---
    async function fetchSlidesConfig() {
      const setName = getSetName();
      const url = `./shortsConfigs/${setName}.json`;
      const response = await fetch(url);
      if (!response.ok) {
        alert('No se pudo cargar el archivo de preguntas.');
        return null;
      }
      return await response.json();
    }

    let slidesData = [];
    let currentIndex = 0;
    let player;
    let segmentTimer = null;

    // --- YouTube API ready callback (assigned dynamically below) ---
    function onYouTubeIframeAPIReady() {
      if (slidesData.length === 0) return;
      player = new YT.Player("player", {
        videoId: slidesData[0].videoId,
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          controls: 1,     // hide native controls; we use our own UI
          disablekb: 1,
          fs: 0,
          hl: "es",           // Spanish UI
         cc_lang_pref: "es"  // prefer Spanish captions
        },
        host: "https://www.youtube-nocookie.com",
        events: { onReady: onPlayerReady }
      });
    }

    function onPlayerReady() {
      const volumeRange = document.getElementById("volumeRange");
      player.setVolume(volumeRange.value);
      volumeRange.addEventListener("input", () => player.setVolume(volumeRange.value));

      renderQuestions(currentIndex);
      renderComments(currentIndex);
      updateLayout();       // adjust columns based on visibility
      updateNavButtons();
    }

    function renderQuestions(index) {
      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";
      const data = slidesData[index];
      const hasQs = Array.isArray(data.questions) && data.questions.length > 0;

      if (!hasQs) {
        container.style.display = "none";
        return;
      }
      container.style.display = "flex";

      data.questions.forEach((q, qIndex) => {
        const qDiv = document.createElement("div");
        qDiv.classList.add("question");

        const qText = document.createElement("div");
        qText.classList.add("question-text");
        qText.textContent = q.text;
        qDiv.appendChild(qText);

        const answersDiv = document.createElement("div");
        answersDiv.classList.add("answers");
        q.answers.forEach((ans, aIndex) => {
          const label = document.createElement("label");
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `q-${index}-${qIndex}`;
          radio.value = aIndex;
          radio.checked = q.selectedIndex === aIndex;
          radio.addEventListener("change", () => {
            q.selectedIndex = aIndex;
            answersDiv.querySelectorAll("label").forEach(l => l.classList.remove("selected"));
            label.classList.add("selected");
          });
          label.appendChild(radio);
          label.appendChild(document.createTextNode(ans));
          answersDiv.appendChild(label);
        });
        qDiv.appendChild(answersDiv);

        if (typeof q.timeStart === "number" && typeof q.timeEnd === "number") {
          const tsButton = document.createElement("button");
          tsButton.classList.add("timestamp");
          tsButton.textContent = `▶︎ ${formatTime(q.timeStart)} - ${formatTime(q.timeEnd)}`;
          tsButton.addEventListener("click", () => playSegment(q.timeStart, q.timeEnd));
          qDiv.appendChild(tsButton);
        }

        container.appendChild(qDiv);
      });
    }

    function renderComments(index) {
      const container = document.getElementById("commentsContainer");
      container.innerHTML = "";
      const data = slidesData[index];
      const hasComments = Array.isArray(data.comments) && data.comments.length > 0;

      if (!hasComments) {
        container.style.display = "none";
        return;
      }
      container.style.display = "flex";

      // Header
      const header = document.createElement("div");
      header.className = "comments-header";
      header.textContent = "Comentarios";
      container.appendChild(header);

      data.comments.forEach(c => {
        const cDiv = document.createElement("div");
        cDiv.classList.add("comment");

        const meta = document.createElement("div");
        meta.classList.add("meta");

        const author = document.createElement("span");
        author.classList.add("author");
        author.textContent = c.author || "Anónimo";

        const time = document.createElement("span");
        time.classList.add("time");
        time.textContent = c.timeAgo || "";

        meta.appendChild(author);
        meta.appendChild(time);
        cDiv.appendChild(meta);

        const text = document.createElement("div");
        text.textContent = c.text || "";
        cDiv.appendChild(text);

        container.appendChild(cDiv);
      });
    }

    function updateLayout() {
      const grid = document.getElementById("grid");
      const qs = document.getElementById("questionsContainer");
      const cm = document.getElementById("commentsContainer");

      const qsVisible = qs.style.display !== "none";
      const cmVisible = cm.style.display !== "none";

      if (qsVisible && cmVisible) {
        // video | questions | comments
        grid.style.gridTemplateColumns = "auto 1fr 0.9fr";
      } else if (qsVisible && !cmVisible) {
        // video | questions
        grid.style.gridTemplateColumns = "auto 1fr";
      } else if (!qsVisible && cmVisible) {
        // video | comments
        grid.style.gridTemplateColumns = "auto 1fr";
      } else {
        // video only
        grid.style.gridTemplateColumns = "1fr";
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function playSegment(start, end) {
      if (!player) return;
      clearInterval(segmentTimer);
      player.seekTo(start, true);
      player.playVideo();
      segmentTimer = setInterval(() => {
        if (player.getCurrentTime() >= end) {
          player.pauseVideo();
          clearInterval(segmentTimer);
        }
      }, 200);
    }

    function loadVideoByIndex(index) {
      const data = slidesData[index];
      player.loadVideoById(data.videoId);
      renderQuestions(index);
      renderComments(index);
      updateLayout();
      updateNavButtons();
    }

    function updateNavButtons() {
      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === slidesData.length - 1;
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentIndex > 0) { currentIndex--; loadVideoByIndex(currentIndex); }
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentIndex < slidesData.length - 1) { currentIndex++; loadVideoByIndex(currentIndex); }
    });

    (async function init() {
      slidesData = await fetchSlidesConfig();
      if (!slidesData) return;

      // Load YouTube API
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    })();
  </script>
</body>
</html>
