<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Info Panel</title>
  <style>
    /* full-height dark background */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background-color: #121212; color: #e0e0e0;
      position: relative; overflow: hidden;
      font-family: sans-serif;
    }
    /* sliding info panel (hidden initially) */
    #info-panel {
      position: absolute;
      top: 20px; bottom: 20px; left: 20px;
      width: 0; opacity: 0; pointer-events: none;
      background: #272727; border-radius: 8px;
      padding: 20px; box-shadow: 2px 0 8px rgba(0,0,0,0.5);
      overflow: auto;
      transition: width 0.6s ease, opacity 0.6s ease;
    }
    #info-panel > * { opacity: 0; transition: opacity 0.4s ease; }
    /* map container centered */
    #map-container {
      position: absolute;
      top: 20px; bottom: 20px;
      left: 50%; transform: translateX(-50%);
      transition: left 0.6s ease, transform 0.6s ease;
    }
    #map-container svg {
      height: 100%; width: auto; display: block;
      transition: width 0.6s ease, height 0.6s ease;
    }
    /* open state */
    body.detail-open #info-panel { width: 60%; opacity: 1; pointer-events: auto; }
    body.detail-open #map-container { left: 60%; transform: translateX(0); }
    body.detail-open #map-container svg { width: 100%; height: 100%; }

    /* country styling */
    #map-container path[id] { stroke: #fff; stroke-width: 1; transition: fill 0.2s; }
    #map-container path[id]:hover { fill: #F0C040 !important; cursor: pointer; }

    #weather {
      font-size: 1.5em; line-height: 1.5;
      background-color: #333; padding: 10px; border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-top: 20px; text-align: center;
    }
    #weather .header { font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
    #weather .data { font-size: 1.2em; margin-bottom: 15px; }
    #info-panel h2 { text-align: center; font-size: 38px; margin-bottom: 10px; }
    #flag { display: block; margin: 0 auto; text-align: center; height: 100px; }

    /* Street View button */
    .actions { display: flex; justify-content: center; margin-top: 16px; gap: 10px; }
    .btn {
      background: #F0C040; color: #222; border: none; border-radius: 8px;
      padding: 10px 16px; font-size: 16px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn:focus { outline: 2px solid #fff3; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="info-panel"></div>
  <div id="map-container"></div>

    // --- fade helpers ---
    function fadeIn() {
      Array.from(infoPanel.children).forEach((c,i)=>
        setTimeout(()=>c.style.opacity='1', i*200)
      );
    }
    function reset() {
      Array.from(infoPanel.children).forEach(c=>c.style.opacity='0');
    }

    // --- country click handlers ---
    const svg = container.querySelector('svg');
    svg.querySelectorAll('path[id]').forEach((path,i)=>{
      path.style.fill = pastel[i % pastel.length];
      path.addEventListener('click', async e=>{
        e.stopPropagation();
        const country = countryById[path.id] || path.id;
        const capital = capitalByCountry[country];
        const coords  = capitalCoords[capital];

        // build panel HTML (adds Street View button)
        infoPanel.innerHTML = `
          <h2>${country} <span style="font-size: 0.6em; font-weight: normal;">(${capital ?? '—'})</span></h2>
          <img id="flag"
               src="https://flagcdn.com/h240/${isoByCountry[country]}.png"
               alt="Bandera de ${country}" />
          <div id="weather"></div>
          <div class="actions">
            <a id="street-btn" class="btn" href="#" target="_blank" rel="noopener noreferrer">
              Street View de ${capital ?? 'la capital'}
            </a>
          </div>
        `;

        // Street View from hard-coded links (hide if missing)
        const streetBtn = document.getElementById('street-btn');
        const hardLink = streetViewUrlByCountry[country];
        if (hardLink) {
          streetBtn.href = hardLink;
          streetBtn.style.display = 'inline-block';
        } else {
          streetBtn.style.display = 'none';
        }

        // Weather (Open-Meteo)
        if (coords) {
          try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true`;
            const { current_weather } = await fetch(url).then(r=>r.json());
            const c = current_weather.temperature;
            const f = Math.round(c * 9/5 + 32);
            const windSpeed = current_weather.windspeed;
            const windDirection = current_weather.winddirection;
            const directions = ['Norte','Noreste','Este','Sureste','Sur','Suroeste','Oeste','Noroeste'];
            const cardinalDirection = directions[Math.round(windDirection / 45) % 8];
            document.getElementById('weather').innerHTML = `
              <div class="header">Temperatura</div>
              <div class="data">${c} °C / ${f} °F</div>
              <div class="header">Velocidad del viento</div>
              <div class="data">${windSpeed} km/h</div>
              <div class="header">Dirección del viento</div>
              <div class="data">${cardinalDirection}</div>
            `;
          } catch {
            document.getElementById('weather').innerHTML = `
              <p style="text-align:center;margin:0.5rem 0;">Error al obtener temperatura.</p>
            `;
          }
        } else {
          document.getElementById('weather').textContent = 'Sin coordenadas de la capital.';
        }

        document.body.classList.add('detail-open');
        setTimeout(fadeIn, 600);
      });
    });

    // click outside to close
    const svgRoot = container.querySelector('svg');
    svgRoot.addEventListener('click', e=>{
      if (document.body.classList.contains('detail-open') && e.target===svgRoot) {
        document.body.classList.remove('detail-open');
        reset();
      }
    });
  });
  </script>
</body>
</html>
