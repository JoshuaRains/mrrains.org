<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colombia Departments Map Game</title>
  <style>
    :root {
      --correct: #21a366;
      --wrong: #d94a3a;
      --neutral: #f1f3f5;
      --water: #b9d7ff;
      --line: #111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--water);
    }

    #mapContainer {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px 10px 58px;
    }

    #mapContainer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    [data-region-id] {
      cursor: pointer;
      fill: var(--neutral);
      stroke: var(--line);
      stroke-width: 2.5;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      transition: fill 0.12s ease;
    }

    [data-region-id]:hover {
      fill: #d8dde4;
    }

    [data-region-id]:focus {
      outline: none;
    }

    .bottom-bar {
      position: fixed;
      left: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #000;
      font-size: clamp(14px, 1.6vw, 20px);
      font-weight: 700;
      line-height: 1;
      z-index: 10;
    }

    .credits {
      position: fixed;
      top: 10px;
      right: 12px;
      max-width: min(540px, calc(100vw - 24px));
      color: #000;
      font-size: 12px;
      line-height: 1.35;
      text-align: right;
      z-index: 10;
    }

    .credits a {
      color: #000;
    }

    #restartButton {
      min-height: 38px;
      padding: 0 16px;
      border: 2px solid #000;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font: inherit;
      cursor: pointer;
    }

    #restartButton:hover {
      background: #f0f0f0;
    }

    #restartButton:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .bottom-bar {
        right: 12px;
        flex-wrap: wrap;
        gap: 10px 14px;
        line-height: 1.15;
      }
    }
  </style>
</head>
<body>
  <div id="mapContainer" aria-label="Interactive map of Colombia departments"></div>

  <div class="credits">
    Map data: Highcharts/Natural Earth. Reference: <a href="https://commons.wikimedia.org/wiki/File:Colombia-departaments-sa.svg">Colombia-departaments-sa.svg</a>
    by canislupusarctos, <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>; adapted.
  </div>

  <div class="bottom-bar" aria-live="polite">
    <button id="restartButton" type="button">Restart</button>
    <span id="timeText">Time: 0:00</span>
    <span id="accuracyText">Accuracy: 100%</span>
    <span id="targetText">Select: Loading...</span>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const elements = {
      mapContainer: document.getElementById("mapContainer"),
      restartButton: document.getElementById("restartButton"),
      timeText: document.getElementById("timeText"),
      accuracyText: document.getElementById("accuracyText"),
      targetText: document.getElementById("targetText")
    };

    let svg = null;
    let regions = [];
    let remaining = [];
    let currentRegion = null;
    let correct = 0;
    let attempts = 0;
    let completed = new Set();
    let missesOnCurrent = 0;
    let flashTimerId = null;
    let flashOn = false;
    let startedAt = 0;
    let timerId = null;

    function displayName(name) {
      if (name === "Bogota") return "Bogotá";
      return name;
    }

    function slugify(text) {
      return text.normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function updateTimer() {
      elements.timeText.textContent = `Time: ${formatTime(Date.now() - startedAt)}`;
    }

    function updateAccuracy() {
      const accuracy = attempts ? Math.round((correct / attempts) * 100) : 100;
      elements.accuracyText.textContent = `Accuracy: ${accuracy}%`;
    }

    function setTargetText(text) {
      elements.targetText.textContent = `Select: ${text}`;
    }

    function getRegionFromPath(path) {
      const regionId = path.closest("[data-region-id]")?.dataset.regionId;
      return regions.find((region) => region.id === regionId);
    }

    function paintRegion(region, fill) {
      const path = svg.querySelector(`[data-region-id="${region.id}"]`);
      if (path) path.style.fill = fill;
    }

    function stopCorrectFlash() {
      clearInterval(flashTimerId);
      flashTimerId = null;
      flashOn = false;
      if (currentRegion && !completed.has(currentRegion.id)) {
        paintRegion(currentRegion, "var(--neutral)");
      }
    }

    function startCorrectFlash() {
      if (!currentRegion || flashTimerId) return;

      flashTimerId = setInterval(() => {
        flashOn = !flashOn;
        paintRegion(currentRegion, flashOn ? "#ffd84d" : "var(--neutral)");
      }, 380);
    }

    function chooseNextRegion() {
      stopCorrectFlash();
      if (!remaining.length) {
        currentRegion = null;
        setTargetText("Complete");
        clearInterval(timerId);
        updateTimer();
        return;
      }

      currentRegion = remaining.shift();
      missesOnCurrent = 0;
      setTargetText(currentRegion.name);
    }

    function handleRegionClick(event) {
      const selected = getRegionFromPath(event.currentTarget);
      event.currentTarget.blur?.();
      if (!selected || !currentRegion || completed.has(selected.id)) return;

      attempts += 1;

      if (selected.id === currentRegion.id) {
        stopCorrectFlash();
        correct += 1;
        completed.add(selected.id);
        paintRegion(selected, "var(--correct)");
        updateAccuracy();
        chooseNextRegion();
        return;
      }

      missesOnCurrent += 1;
      paintRegion(selected, "var(--wrong)");
      setTimeout(() => {
        if (!completed.has(selected.id)) paintRegion(selected, "var(--neutral)");
      }, 260);
      if (missesOnCurrent >= 2) startCorrectFlash();
      updateAccuracy();
    }

    function projectPoint(point, bounds, padding) {
      return [
        point[0] - bounds.minX + padding,
        bounds.maxY - point[1] + padding
      ];
    }

    function coordinatesToPath(coordinates, bounds, padding) {
      return coordinates.map((polygon) => {
        return polygon.map((ring) => {
          return ring.map((point, index) => {
            const [x, y] = projectPoint(point, bounds, padding);
            return `${index ? "L" : "M"}${x},${y}`;
          }).join(" ") + " Z";
        }).join(" ");
      }).join(" ");
    }

    function featureToPath(feature, bounds, padding) {
      const geometry = feature.geometry;
      if (geometry.type === "Polygon") return coordinatesToPath([geometry.coordinates], bounds, padding);
      if (geometry.type === "MultiPolygon") return coordinatesToPath(geometry.coordinates, bounds, padding);
      return "";
    }

    function collectBounds(features) {
      const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      const visit = (coords) => {
        if (typeof coords[0] === "number") {
          bounds.minX = Math.min(bounds.minX, coords[0]);
          bounds.maxX = Math.max(bounds.maxX, coords[0]);
          bounds.minY = Math.min(bounds.minY, coords[1]);
          bounds.maxY = Math.max(bounds.maxY, coords[1]);
          return;
        }
        coords.forEach(visit);
      };

      features.forEach((feature) => visit(feature.geometry.coordinates));
      return bounds;
    }

    function renderMap(geojson) {
      const features = geojson.features
        .filter((feature) => feature.properties?.name)
        .sort((a, b) => displayName(a.properties.name).localeCompare(displayName(b.properties.name)));
      const bounds = collectBounds(features);
      const padding = 120;

      regions = features.map((feature) => ({
        id: slugify(displayName(feature.properties.name)),
        name: displayName(feature.properties.name),
        path: featureToPath(feature, bounds, padding)
      }));

      svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", `0 0 ${bounds.maxX - bounds.minX + padding * 2} ${bounds.maxY - bounds.minY + padding * 2}`);
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Departments of Colombia");

      regions.forEach((region) => {
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", region.path);
        path.dataset.regionId = region.id;
        path.setAttribute("aria-label", region.name);
        path.addEventListener("click", handleRegionClick);
        svg.append(path);
      });

      elements.mapContainer.replaceChildren(svg);
    }

    function restartGame() {
      stopCorrectFlash();
      correct = 0;
      attempts = 0;
      completed = new Set();
      missesOnCurrent = 0;
      remaining = shuffle(regions);
      regions.forEach((region) => paintRegion(region, "var(--neutral)"));
      updateAccuracy();
      startedAt = Date.now();
      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
      updateTimer();
      chooseNextRegion();
    }

    async function loadMap() {
      const response = await fetch("co-all.geo.json");
      if (!response.ok) throw new Error("Map failed to load.");
      const geojson = await response.json();
      renderMap(geojson);
      restartGame();
    }

    elements.restartButton.addEventListener("click", restartGame);

    loadMap().catch((error) => {
      setTargetText(error.message);
    });
  </script>
</body>
</html>
