<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish-Speaking Countries Map Game</title>
  <style>
    :root {
      --correct: #21a366;
      --wrong: #d94a3a;
      --neutral: #f1f3f5;
      --water: #b9d7ff;
      --line: #111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--water);
    }

    #mapContainer {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px 10px 58px;
    }

    #mapContainer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #mapContainer path[id] {
      fill: var(--neutral);
      stroke: var(--line);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      transition: fill 0.12s ease;
      pointer-events: none;
    }

    #mapContainer path[data-country-id] {
      cursor: pointer;
      pointer-events: auto;
    }

    #mapContainer path[data-country-id]:hover {
      fill: #d8dde4;
    }

    #mapContainer path[data-country-id]:focus {
      outline: none;
    }

    .bottom-bar {
      position: fixed;
      left: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #000;
      font-size: clamp(14px, 1.6vw, 20px);
      font-weight: 700;
      line-height: 1;
      z-index: 10;
    }

    #restartButton {
      min-height: 38px;
      padding: 0 16px;
      border: 2px solid #000;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font: inherit;
      cursor: pointer;
    }

    #restartButton:hover {
      background: #f0f0f0;
    }

    #restartButton:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .bottom-bar {
        right: 12px;
        flex-wrap: wrap;
        gap: 10px 14px;
        line-height: 1.15;
      }
    }
  </style>
</head>
<body>
  <div id="mapContainer" aria-label="Interactive map of countries"></div>

  <div class="bottom-bar" aria-live="polite">
    <button id="restartButton" type="button">Restart</button>
    <span id="timeText">Time: 0:00</span>
    <span id="accuracyText">Accuracy: 100%</span>
    <span id="targetText">Select: Loading...</span>
  </div>

  <script>
    const countries = [
      { id: "path17", name: "México" },
      { id: "path12", name: "Guatemala" },
      { id: "path4", name: "Belice" },
      { id: "path24", name: "El Salvador" },
      { id: "path14", name: "Honduras" },
      { id: "path18", name: "Nicaragua" },
      { id: "path7", name: "Costa Rica" },
      { id: "path19", name: "Panamá" },
      { id: "path8", name: "Cuba" },
      { id: "path15", name: "Haití" },
      { id: "path9", name: "República Dominicana" },
      { id: "path16", name: "Jamaica" },
      { id: "path21", name: "Puerto Rico" },
      { id: "path6", name: "Colombia" },
      { id: "path26", name: "Venezuela" },
      { id: "path13", name: "Guyana" },
      { id: "path23", name: "Surinam" },
      { id: "path11", name: "Guayana Francesa" },
      { id: "path29", name: "Brasil" },
      { id: "path22", name: "Paraguay" },
      { id: "path25", name: "Uruguay" },
      { id: "path27", name: "Argentina" },
      { id: "path5", name: "Chile" },
      { id: "path20", name: "Perú" },
      { id: "path28", name: "Bolivia" },
      { id: "path10", name: "Ecuador" }
    ];

    const elements = {
      mapContainer: document.getElementById("mapContainer"),
      restartButton: document.getElementById("restartButton"),
      timeText: document.getElementById("timeText"),
      accuracyText: document.getElementById("accuracyText"),
      targetText: document.getElementById("targetText")
    };

    let svg = null;
    let remaining = [];
    let currentCountry = null;
    let correct = 0;
    let attempts = 0;
    let completed = new Set();
    let missesOnCurrent = 0;
    let flashTimerId = null;
    let flashOn = false;
    let startedAt = 0;
    let timerId = null;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function updateTimer() {
      elements.timeText.textContent = `Time: ${formatTime(Date.now() - startedAt)}`;
    }

    function updateAccuracy() {
      const accuracy = attempts ? Math.round((correct / attempts) * 100) : 100;
      elements.accuracyText.textContent = `Accuracy: ${accuracy}%`;
    }

    function setTargetText(text) {
      elements.targetText.textContent = `Select: ${text}`;
    }

    function getCountryFromPath(path) {
      return countries.find((country) => country.id === path.dataset.countryId);
    }

    function paintCountry(country, fill) {
      const path = svg.querySelector(`#${country.id}`);
      if (path) path.style.fill = fill;
    }

    function stopCorrectFlash() {
      clearInterval(flashTimerId);
      flashTimerId = null;
      flashOn = false;
      if (currentCountry && !completed.has(currentCountry.id)) {
        paintCountry(currentCountry, "var(--neutral)");
      }
    }

    function startCorrectFlash() {
      if (!currentCountry || flashTimerId) return;

      flashTimerId = setInterval(() => {
        flashOn = !flashOn;
        paintCountry(currentCountry, flashOn ? "#ffd84d" : "var(--neutral)");
      }, 380);
    }

    function chooseNextCountry() {
      stopCorrectFlash();
      if (!remaining.length) {
        currentCountry = null;
        setTargetText("Complete");
        clearInterval(timerId);
        updateTimer();
        return;
      }

      currentCountry = remaining.shift();
      missesOnCurrent = 0;
      setTargetText(currentCountry.name);
    }

    function handleCountryClick(event) {
      const selected = getCountryFromPath(event.currentTarget);
      event.currentTarget.blur?.();
      if (!selected || !currentCountry || completed.has(selected.id)) return;

      attempts += 1;

      if (selected.id === currentCountry.id) {
        stopCorrectFlash();
        correct += 1;
        completed.add(selected.id);
        paintCountry(selected, "var(--correct)");
        updateAccuracy();
        chooseNextCountry();
        return;
      }

      missesOnCurrent += 1;
      paintCountry(selected, "var(--wrong)");
      setTimeout(() => {
        if (!completed.has(selected.id)) paintCountry(selected, "var(--neutral)");
      }, 260);
      if (missesOnCurrent >= 2) startCorrectFlash();
      updateAccuracy();
    }

    function restartGame() {
      stopCorrectFlash();
      correct = 0;
      attempts = 0;
      completed = new Set();
      missesOnCurrent = 0;
      remaining = shuffle(countries);
      countries.forEach((country) => paintCountry(country, "var(--neutral)"));
      updateAccuracy();
      startedAt = Date.now();
      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
      updateTimer();
      chooseNextCountry();
    }

    function prepareMap(svgText) {
      const parser = new DOMParser();
      svg = parser.parseFromString(svgText, "image/svg+xml").querySelector("svg");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Countries of the Americas");

      svg.querySelectorAll("path[id]").forEach((path) => {
        path.removeAttribute("fill");
        path.style.fill = "var(--neutral)";
      });

      countries.forEach((country) => {
        const path = svg.querySelector(`#${country.id}`);
        if (!path) return;
        path.dataset.countryId = country.id;
        path.setAttribute("aria-label", country.name);
        path.addEventListener("click", handleCountryClick);
      });

      elements.mapContainer.replaceChildren(svg);
    }

    async function loadMap() {
      const response = await fetch("map_with_ids.svg");
      if (!response.ok) throw new Error("Map failed to load.");
      prepareMap(await response.text());
      restartGame();
    }

    elements.restartButton.addEventListener("click", restartGame);

    loadMap().catch((error) => {
      setTargetText(error.message);
    });
  </script>
</body>
</html>
