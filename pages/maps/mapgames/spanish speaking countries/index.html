<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish-Speaking Countries Map Game</title>
  <style>
    :root {
      --correct: #21a366;
      --wrong: #d94a3a;
      --neutral: #f1f3f5;
      --non-spanish: #929aa3;
      --water: #b9d7ff;
      --line: #111;
      --prompt-width: clamp(190px, 22vw, 320px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--water);
    }

    #mapContainer {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px 10px 58px;
    }

    #mapContainer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #mapContainer path[id] {
      fill: var(--non-spanish);
      stroke: var(--line);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      transition: fill 0.12s ease;
      pointer-events: none;
    }

    #mapContainer path[data-country-id] {
      cursor: pointer;
      pointer-events: auto;
    }

    #mapContainer path[data-country-id]:hover {
      fill: #d8dde4;
    }

    #mapContainer path[data-country-id]:focus {
      outline: none;
    }

    #targetPanel {
      position: fixed;
      left: 0;
      top: 50%;
      width: var(--prompt-width);
      padding: 18px 4px 18px 18px;
      transform: translateY(-50%);
      color: #000;
      text-align: right;
      z-index: 10;
    }

    #targetText {
      font-size: clamp(24px, 3vw, 44px);
      font-weight: 800;
      line-height: 1.08;
      text-wrap: balance;
    }

    #endSummary[hidden],
    #restartButton[hidden],
    .stats-bar[hidden] { display: none; }

    .end-title {
      font-size: clamp(26px, 3.2vw, 46px);
      font-weight: 900;
      line-height: 1;
    }

    #endRestartButton {
      min-height: 40px;
      margin: 14px 0 10px;
      padding: 0 16px;
      border: 2px solid #000;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 800;
      cursor: pointer;
    }

    #endRestartButton:hover { background: #f0f0f0; }

    .end-stats {
      display: grid;
      gap: 5px;
      font-size: clamp(12px, 1.25vw, 16px);
      font-weight: 700;
      line-height: 1.15;
    }

    .stats-bar {
      position: fixed;
      right: 14px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #000;
      font-size: clamp(14px, 1.5vw, 19px);
      font-weight: 700;
      line-height: 1;
      z-index: 10;
    }

    #restartButton {
      position: fixed;
      left: 50%;
      bottom: 10px;
      min-height: 42px;
      padding: 0 20px;
      transform: translateX(-50%);
      border: 2px solid #000;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-size: clamp(15px, 1.5vw, 19px);
      font-weight: 700;
      cursor: pointer;
      z-index: 11;
    }

    #restartButton:hover { background: #f0f0f0; }

    #restartButton:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      :root { --prompt-width: clamp(140px, 27vw, 200px); }
      #targetPanel { padding: 10px 4px 10px 10px; }
      #targetText { font-size: clamp(19px, 4vw, 30px); }
      .stats-bar { gap: 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="mapContainer" aria-label="Interactive map of countries"></div>

  <div id="targetPanel" aria-live="polite">
    <div id="targetText">Select: Loading...</div>
    <div id="endSummary" hidden>
      <div class="end-title">Complete!</div>
      <button id="endRestartButton" type="button">Restart</button>
      <div class="end-stats">
        <span id="endTimeText"></span>
        <span id="endAccuracyText"></span>
        <span id="endCorrectText"></span>
      </div>
    </div>
  </div>
  <button id="restartButton" type="button">Restart</button>
  <div class="stats-bar" id="statsBar" aria-live="polite">
    <span id="timeText">Time: 0:00</span>
    <span id="accuracyText">Accuracy: 100%</span>
  </div>

  <script>
    const countries = [
      { id: "path17", name: "México" },
      { id: "path12", name: "Guatemala" },
      { id: "path24", name: "El Salvador" },
      { id: "path14", name: "Honduras" },
      { id: "path18", name: "Nicaragua" },
      { id: "path7", name: "Costa Rica" },
      { id: "path19", name: "Panamá" },
      { id: "path8", name: "Cuba" },
      { id: "path9", name: "República Dominicana" },
      { id: "path21", name: "Puerto Rico" },
      { id: "path6", name: "Colombia" },
      { id: "path26", name: "Venezuela" },
      { id: "path22", name: "Paraguay" },
      { id: "path25", name: "Uruguay" },
      { id: "path27", name: "Argentina" },
      { id: "path5", name: "Chile" },
      { id: "path20", name: "Perú" },
      { id: "path28", name: "Bolivia" },
      { id: "path10", name: "Ecuador" }
    ];

    const elements = {
      mapContainer: document.getElementById("mapContainer"),
      restartButton: document.getElementById("restartButton"),
      timeText: document.getElementById("timeText"),
      accuracyText: document.getElementById("accuracyText"),
      targetPanel: document.getElementById("targetPanel"),
      targetText: document.getElementById("targetText"),
      endSummary: document.getElementById("endSummary"),
      endRestartButton: document.getElementById("endRestartButton"),
      endTimeText: document.getElementById("endTimeText"),
      endAccuracyText: document.getElementById("endAccuracyText"),
      endCorrectText: document.getElementById("endCorrectText"),
      statsBar: document.getElementById("statsBar")
    };

    let svg = null;
    let remaining = [];
    let currentCountry = null;
    let correct = 0;
    let attempts = 0;
    let completed = new Set();
    let missesOnCurrent = 0;
    let flashTimerId = null;
    let flashOn = false;
    let startedAt = 0;
    let timerId = null;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function updateTimer() {
      elements.timeText.textContent = `Time: ${formatTime(Date.now() - startedAt)}`;
    }

    function updateAccuracy() {
      const accuracy = attempts ? Math.round((correct / attempts) * 100) : 100;
      elements.accuracyText.textContent = `Accuracy: ${accuracy}%`;
    }

    function setTargetText(text) {
      elements.targetText.textContent = `Select: ${text}`;
    }

    function getCountryFromPath(path) {
      return countries.find((country) => country.id === path.dataset.countryId);
    }

    function paintCountry(country, fill) {
      const path = svg.querySelector(`#${country.id}`);
      if (path) path.style.fill = fill;
    }

    function stopCorrectFlash() {
      clearInterval(flashTimerId);
      flashTimerId = null;
      flashOn = false;
      if (currentCountry && !completed.has(currentCountry.id)) {
        paintCountry(currentCountry, "var(--neutral)");
      }
    }

    function startCorrectFlash() {
      if (!currentCountry || flashTimerId) return;

      flashTimerId = setInterval(() => {
        flashOn = !flashOn;
        paintCountry(currentCountry, flashOn ? "#ffd84d" : "var(--neutral)");
      }, 380);
    }

    function chooseNextCountry() {
      stopCorrectFlash();
      if (!remaining.length) {
        currentCountry = null;
        clearInterval(timerId);
        updateTimer();
        const elapsed = Date.now() - startedAt;
        const accuracy = attempts ? Math.round((correct / attempts) * 100) : 100;
        elements.endTimeText.textContent = "Time: " + formatTime(elapsed);
        elements.endAccuracyText.textContent = "Accuracy: " + accuracy + "%";
        elements.endCorrectText.textContent = "Countries: " + correct + "/" + countries.length;
        elements.targetText.hidden = true;
        elements.endSummary.hidden = false;
        elements.restartButton.hidden = true;
        elements.statsBar.hidden = true;
        requestAnimationFrame(positionTargetBesideMap);
        return;
      }

      currentCountry = remaining.shift();
      missesOnCurrent = 0;
      setTargetText(currentCountry.name);
    }

    function handleCountryClick(event) {
      const selected = getCountryFromPath(event.currentTarget);
      event.currentTarget.blur?.();
      if (!selected || !currentCountry || completed.has(selected.id)) return;

      attempts += 1;

      if (selected.id === currentCountry.id) {
        stopCorrectFlash();
        correct += 1;
        completed.add(selected.id);
        paintCountry(selected, "var(--correct)");
        updateAccuracy();
        chooseNextCountry();
        return;
      }

      missesOnCurrent += 1;
      paintCountry(selected, "var(--wrong)");
      setTimeout(() => {
        if (!completed.has(selected.id)) paintCountry(selected, "var(--neutral)");
      }, 260);
      if (missesOnCurrent >= 2) startCorrectFlash();
      updateAccuracy();
    }

    function restartGame() {
      stopCorrectFlash();
      elements.targetText.hidden = false;
      elements.endSummary.hidden = true;
      elements.restartButton.hidden = false;
      elements.statsBar.hidden = false;
      correct = 0;
      attempts = 0;
      completed = new Set();
      missesOnCurrent = 0;
      remaining = shuffle(countries);
      countries.forEach((country) => paintCountry(country, "var(--neutral)"));
      updateAccuracy();
      startedAt = Date.now();
      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
      updateTimer();
      chooseNextCountry();
    }

    function positionTargetBesideMap() {
      if (!svg) return;
      const svgRect = svg.getBoundingClientRect();
      const viewBox = svg.viewBox.baseVal;
      if (!viewBox.width || !viewBox.height) return;
      const scale = Math.min(svgRect.width / viewBox.width, svgRect.height / viewBox.height);
      const renderedMapLeft = svgRect.left + (svgRect.width - viewBox.width * scale) / 2;
      const promptLeft = Math.max(0, renderedMapLeft - elements.targetPanel.offsetWidth - 4);
      elements.targetPanel.style.left = promptLeft + "px";
    }

    function prepareMap(svgText) {
      const parser = new DOMParser();
      svg = parser.parseFromString(svgText, "image/svg+xml").querySelector("svg");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Countries of the Americas");

      svg.querySelectorAll("path[id]").forEach((path) => {
        path.removeAttribute("fill");
        path.style.fill = "var(--non-spanish)";
      });

      countries.forEach((country) => {
        const path = svg.querySelector(`#${country.id}`);
        if (!path) return;
        path.style.fill = "var(--neutral)";
        path.dataset.countryId = country.id;
        path.setAttribute("aria-label", country.name);
        path.addEventListener("click", handleCountryClick);
      });

      elements.mapContainer.replaceChildren(svg);
      requestAnimationFrame(positionTargetBesideMap);
    }

    async function loadMap() {
      const response = await fetch("map_with_ids.svg");
      if (!response.ok) throw new Error("Map failed to load.");
      prepareMap(await response.text());
      restartGame();
    }

    elements.restartButton.addEventListener("click", restartGame);
    elements.endRestartButton.addEventListener("click", restartGame);
    window.addEventListener("resize", () => requestAnimationFrame(positionTargetBesideMap));

    loadMap().catch((error) => {
      setTargetText(error.message);
    });
  </script>
</body>
</html>
