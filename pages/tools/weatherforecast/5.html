<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa del tiempo interactivo — Sudamérica (demo v15)</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    :root{ --ui-bg: rgba(0,0,0,.65); --ui-border: rgba(255,255,255,.25); --ui-text: #fff; --accent: #79b791; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans"; }
    #map { position: fixed; inset: 0; }

    .controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: 72px; display: grid; gap: .5rem; grid-auto-flow: column; align-items: center; background: var(--ui-bg); border: 1px solid var(--ui-border); color: var(--ui-text); padding: .6rem .8rem; border-radius: 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 6; }
    .controls .chip { background: rgba(255,255,255,.1); color: var(--ui-text); border: 1px solid var(--ui-border); border-radius: 10px; padding: .45rem .7rem; font-weight: 600; letter-spacing: .2px; }

    .timeline { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; background: var(--ui-bg); border:1px solid var(--ui-border); border-radius:12px; padding:.6rem .8rem .8rem; display:grid; gap:.35rem; z-index:6; backdrop-filter: blur(6px); }
    .timeline input[type="range"]{ width: 520px; accent-color: var(--accent); }
    .ticks{ display:grid; grid-template-columns: repeat(7, 1fr); gap:.25rem; font-size: 12px; color:#eee; opacity:.9; }
    .ticks span{ text-align:center; }

    .legend { position: fixed; top: 12px; right: 12px; color: var(--ui-text); background: var(--ui-bg); border:1px solid var(--ui-border); padding: .8rem; border-radius: 12px; max-width: 420px; backdrop-filter: blur(6px); z-index: 6; }
    .legend h3{ margin: 0 0 .35rem; font-size: 1rem; }
    .row{ display:flex; align-items:center; gap:.5rem; margin:.25rem 0; }
    .swatch{ width: 14px; height: 14px; border-radius:3px; display:inline-block; margin-right:.4rem; vertical-align: middle; }
    .mini{ font-size:.9em; opacity:.85; }

    /* Hide stamp + custom attribution (use built-in attribution control) */
    .stamp { display:none !important; }
    .map-attrib { display:none !important; }

    /* Vertical opacity slider */
    .opacity-ctrl { position: fixed; left: 10px; top: 50%; transform: translateY(-50%); z-index: 7; background: var(--ui-bg); border:1px solid var(--ui-border); border-radius:12px; padding:.6rem; display:flex; flex-direction:column; align-items:center; gap:.5rem; }
    .opacity-ctrl label{ color:#fff; font-size:12px; opacity:.9; }
    .opacity-ctrl input[type=range]{
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      height: 220px; width: 22px; accent-color: var(--accent);
    }

    /* ===== HTML marker structure (no-drift) ===== */
    .marker-wrap{ position:relative; width:0; height:0; }
    .temp-marker{
      position:absolute; left:0; top:0;
      width: 48px; height: 48px; /* base size; scaled via transform */
      border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:800; text-align:center; line-height:1.05;
      box-shadow: 0 6px 14px rgba(0,0,0,.35), 0 0 0 3px rgba(0,0,0,.35);
      border: 2px solid rgba(255,255,255,.55);
      user-select:none; pointer-events:none;
      transform: translate(-50%,-50%) scale(1);
      will-change: transform;
    }
    .temp-marker .t{
      display:block;
      white-space: pre-line;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      font-size: 13px;
      padding: 0 .2rem;
    }
    .maplibregl-marker { z-index: 8; }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside class="legend" aria-label="Leyenda del mapa">
    <h3>Leyenda (precipitación IMERG · NASA GIBS)</h3>
    <div class="row"><span class="swatch" style="background:#ef4444"></span> <strong>Rojo:</strong> mucha lluvia</div>
    <div class="row"><span class="swatch" style="background:#22c55e"></span> <strong>Verde:</strong> lluvia</div>
    <div class="row"><span class="swatch" style="background:#3b82f6"></span> <strong>Azul:</strong> nieve <span class="mini"></span></div>
    <div class="row mini"></div>
  </aside>

  <div class="controls" role="group" aria-label="Capas">
    <label class="chip"><input id="togglePrecip" type="checkbox" checked /> Precipitación</label>
    <label class="chip"><input id="toggleTemp" type="checkbox" checked /> Temperatura</label>
  </div>

  <div class="timeline" aria-label="Selector de días">
    <input id="dayRange" type="range" min="0" max="6" step="1" value="0" />
    <div class="ticks"><span>Lunes</span><span>Martes</span><span>Miércoles</span><span>Jueves</span><span>Viernes</span><span>Sábado</span><span>Domingo</span></div>
  </div>

  <div class="opacity-ctrl" aria-label="Opacidad de nubes">
    <label for="opacityRange">Opacidad</label>
    <input id="opacityRange" type="range" min="0" max="1" step="0.02" value="0.20" />
  </div>

  <div class="stamp" id="snapshotStamp">Elige un día…</div>
  <div class="map-attrib">Base © <a href="https://www.carto.com/" target="_blank" rel="noopener">CARTO</a> · Datos © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Precipitación © <a href="https://nasa-gibs.github.io/gibs-api-docs/" target="_blank" rel="noopener">NASA GIBS / GPM IMERG</a></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script>
  // =====================
  // ✨ CLASSROOM CONFIG ✨
  // =====================
  const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

  // Base pixel size for HTML temp markers (before zoom scaling)
  const BASE_MARKER_PX = 48;

const TIMES = {
  'Lunes':     '2009-09-08T00:00:00Z',  // Tornado outbreak
  'Martes':    '2017-06-15T12:00:00Z',  // Southern Andes snowstorm
  'Miércoles': '2018-06-12T00:00:00Z',  // Tornado outbreak
  'Jueves':    '2007-07-10T03:00:00Z',  // Uncommon Buenos Aires snowfall
  'Viernes':   '2024-05-15T12:00:00Z',  // Chile cold snap
  'Sábado':    '2015-12-28T12:00:00Z',  // El Niño floods in AR/PRY/URY
  'Domingo':   '2023-10-25T18:00:00Z'   // Hurricane Otis landfall
};





  const CITIES = [
    {name:'São Paulo',   lat:-23.5505, lon:-46.6333},
    {name:'Rio de Janeiro', lat:-22.9068, lon:-43.1729},
    {name:'Buenos Aires', lat:-34.6037, lon:-58.3816},
    {name:'Santiago',    lat:-33.4489, lon:-70.6693},
    {name:'Lima',        lat:-12.0464, lon:-77.0428},
    {name:'Bogotá',      lat:  4.7110, lon:-74.0721},
    {name:'Quito',       lat:  -0.1807, lon:-78.4678},
    {name:'La Paz',      lat: -16.4897, lon:-68.1193},
    {name:'Asunción',    lat: -25.2637, lon:-57.5759},
    {name:'Montevideo',  lat: -34.9011, lon:-56.1645},
    {name:'Caracas',     lat:  10.4806, lon:-66.9036},
    {name:'Manaus',      lat:  -3.1190, lon:-60.0217},
    {name:'Recife',      lat:  -8.0476, lon:-34.8770},
    {name:'Salvador',    lat: -12.9777, lon:-38.5016},
    {name:'Porto Alegre',lat: -30.0346, lon:-51.2177},
    {name:'Ciudad de México', lat:19.4326, lon:-99.1332},
    {name:'Guatemala',       lat:14.6349, lon:-90.5069},
    {name:'Tegucigalpa',     lat:14.0723, lon:-87.1921},
    {name:'San Salvador',    lat:13.6929, lon:-89.2182},
    {name:'Managua',         lat:12.1140, lon:-86.2362},
    {name:'San José (CR)',   lat: 9.9281, lon:-84.0907},
    {name:'Panamá',          lat: 8.9824, lon:-79.5199},
    {name:'La Habana',       lat:23.1136, lon:-82.3666},
    {name:'Santo Domingo',   lat:18.4861, lon:-69.9312},
    {name:'San Juan',        lat:18.4655, lon:-66.1057}
  ];

const TEMPS_C = {
  'Lunes': { // 2009 Tornado outbreak (Argentina/Brazil spring storms)
    'São Paulo': 26, 'Rio de Janeiro': 28, 'Buenos Aires': 29,
    'Santiago': 22, 'Lima': 20, 'Bogotá': 18, 'Quito': 17,
    'La Paz': 12, 'Asunción': 30, 'Montevideo': 27,
    'Caracas': 30, 'Manaus': 28, 'Recife': 29, 'Salvador': 28,
    'Porto Alegre': 27, 'Ciudad de México': 24, 'Guatemala': 25,
    'Tegucigalpa': 24, 'San Salvador': 26, 'Managua': 27,
    'San José (CR)': 26, 'Panamá': 28, 'La Habana': 29,
    'Santo Domingo': 30, 'San Juan': 30
  },

  'Martes': { // 2017 Southern Andes snowstorm
    'São Paulo': 12, 'Rio de Janeiro': 15, 'Buenos Aires': 5,
    'Santiago': -2, 'Lima': 16, 'Bogotá': 10, 'Quito': 9,
    'La Paz': -3, 'Asunción': 8, 'Montevideo': 4,
    'Caracas': 20, 'Manaus': 24, 'Recife': 25, 'Salvador': 24,
    'Porto Alegre': 3, 'Ciudad de México': 10, 'Guatemala': 12,
    'Tegucigalpa': 14, 'San Salvador': 14, 'Managua': 16,
    'San José (CR)': 15, 'Panamá': 22, 'La Habana': 18,
    'Santo Domingo': 22, 'San Juan': 23
  },

  'Miércoles': { // 2018 Tornado outbreak
    'São Paulo': 25, 'Rio de Janeiro': 28, 'Buenos Aires': 26,
    'Santiago': 19, 'Lima': 20, 'Bogotá': 17, 'Quito': 16,
    'La Paz': 11, 'Asunción': 29, 'Montevideo': 25,
    'Caracas': 30, 'Manaus': 29, 'Recife': 30, 'Salvador': 29,
    'Porto Alegre': 26, 'Ciudad de México': 23, 'Guatemala': 25,
    'Tegucigalpa': 24, 'San Salvador': 25, 'Managua': 26,
    'San José (CR)': 25, 'Panamá': 28, 'La Habana': 29,
    'Santo Domingo': 30, 'San Juan': 30
  },

  'Jueves': { // 2007 Buenos Aires rare snowfall
    'São Paulo': 9, 'Rio de Janeiro': 12, 'Buenos Aires': 0,
    'Santiago': -4, 'Lima': 14, 'Bogotá': 8, 'Quito': 7,
    'La Paz': -5, 'Asunción': 4, 'Montevideo': 1,
    'Caracas': 18, 'Manaus': 22, 'Recife': 23, 'Salvador': 22,
    'Porto Alegre': 2, 'Ciudad de México': 8, 'Guatemala': 10,
    'Tegucigalpa': 12, 'San Salvador': 12, 'Managua': 14,
    'San José (CR)': 13, 'Panamá': 20, 'La Habana': 16,
    'Santo Domingo': 20, 'San Juan': 21
  },

  'Viernes': { // 2024 Chile cold snap (historic May freeze)
    'São Paulo': 10, 'Rio de Janeiro': 12, 'Buenos Aires': 8,
    'Santiago': -6, 'Lima': 13, 'Bogotá': 9, 'Quito': 8,
    'La Paz': -4, 'Asunción': 6, 'Montevideo': 7,
    'Caracas': 18, 'Manaus': 22, 'Recife': 23, 'Salvador': 22,
    'Porto Alegre': 5, 'Ciudad de México': 9, 'Guatemala': 11,
    'Tegucigalpa': 12, 'San Salvador': 12, 'Managua': 14,
    'San José (CR)': 13, 'Panamá': 20, 'La Habana': 17,
    'Santo Domingo': 20, 'San Juan': 21
  },

  'Sábado': { // 2015 El Niño flooding rains (warm, humid, stormy)
    'São Paulo': 27, 'Rio de Janeiro': 29, 'Buenos Aires': 28,
    'Santiago': 20, 'Lima': 23, 'Bogotá': 18, 'Quito': 17,
    'La Paz': 12, 'Asunción': 30, 'Montevideo': 28,
    'Caracas': 31, 'Manaus': 29, 'Recife': 30, 'Salvador': 29,
    'Porto Alegre': 28, 'Ciudad de México': 24, 'Guatemala': 26,
    'Tegucigalpa': 25, 'San Salvador': 26, 'Managua': 27,
    'San José (CR)': 26, 'Panamá': 28, 'La Habana': 29,
    'Santo Domingo': 30, 'San Juan': 30
  },

  'Domingo': { // 2023 Hurricane Otis landfall (Mexico tropical heat)
    'São Paulo': 27, 'Rio de Janeiro': 29, 'Buenos Aires': 26,
    'Santiago': 21, 'Lima': 23, 'Bogotá': 19, 'Quito': 18,
    'La Paz': 12, 'Asunción': 30, 'Montevideo': 27,
    'Caracas': 31, 'Manaus': 29, 'Recife': 30, 'Salvador': 29,
    'Porto Alegre': 27, 'Ciudad de México': 28, 'Guatemala': 29,
    'Tegucigalpa': 28, 'San Salvador': 29, 'Managua': 30,
    'San José (CR)': 29, 'Panamá': 30, 'La Habana': 30,
    'Santo Domingo': 31, 'San Juan': 31
  }
};


  const START_DAY_INDEX = 0;
  const INITIAL_PRECIP_OPACITY = 0.20;

  // ===== Zoom → scale (keeps circles steady) =====
  function zoomScale(z){
    const minZ = 2, maxZ = 12;
    const t = Math.max(0, Math.min(1, (z - minZ) / (maxZ - minZ)));
    return 0.72 + t * (1.25 - 0.72);
  }
  // Temp → green/red color
  function tempToColor(tempC){
    const t = Math.max(-5, Math.min(40, Number(tempC)||20));
    const hot = 24;
    if (t >= hot){
      const f = Math.min(1, (t - hot) / (40 - hot));
      const L = 65 - f*35, S = 70 + f*20;
      return `hsl(0 ${Math.round(S)}% ${Math.round(L)}%)`;
    } else {
      const f = Math.min(1, (t + 5) / (hot + 5));
      const L = 65 - f*35, S = 60 + f*25;
      return `hsl(140 ${Math.round(S)}% ${Math.round(L)}%)`;
    }
  }
  function cToF(c){ return Math.round(c*9/5 + 32); }

  const map = new maplibregl.Map({ container: 'map', style: {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: { carto: { type: 'raster', tiles: [
        'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
      ], tileSize: 256, attribution: 'Map tiles © CARTO, Data © OpenStreetMap contributors' } },
      layers: [ { id: 'carto', type: 'raster', source: 'carto', minzoom: 0, maxzoom: 19 } ]
    }, center: [-60, -15], zoom: 3.3, pitch: 0, bearing: 0, attributionControl: false });

  map.addControl(new maplibregl.NavigationControl({ showZoom: true, showCompass: false }), 'top-left');
  map.addControl(new maplibregl.AttributionControl({compact: true}));

  const dayRange = document.getElementById('dayRange');
  const stamp    = document.getElementById('snapshotStamp');
  const opacityRange = document.getElementById('opacityRange');

  // ===== HTML markers (no-drift wrappers) =====
  let tempMarkers = []; // { marker, el }
  function clearTempMarkers(){
    for (const m of tempMarkers) m.marker.remove();
    tempMarkers = [];
  }
  function drawTempMarkers(dayIdx){
    clearTempMarkers();
    const s = zoomScale(map.getZoom());
    const dayName = DAYS[dayIdx];
    const temps = TEMPS_C[dayName] || {};

    for (const c of CITIES){
      const tc = Number(temps[c.name]);
      const tempC = isFinite(tc) ? tc : 20;
      const tempF = cToF(tempC);

      const wrap = document.createElement('div');
      wrap.className = 'marker-wrap';

      const el = document.createElement('div');
      el.className = 'temp-marker';
      el.style.background = tempToColor(tempC);
      el.style.transform = `translate(-50%,-50%) scale(${s})`;

      const t = document.createElement('span');
      t.className = 't';
      t.textContent = `${Math.round(tempC)}°C\n${tempF}°F`;
      el.appendChild(t);
      wrap.appendChild(el);
      wrap.setAttribute('aria-label', `${c.name}: ${tempC}°C, ${tempF}°F`);

      const marker = new maplibregl.Marker({ element: wrap, anchor: 'center' })
        .setLngLat([c.lon, c.lat])
        .addTo(map);

      tempMarkers.push({ marker, el });
    }
  }
  function setMarkersVisible(visible){
    for (const m of tempMarkers){
      m.marker.getElement().style.display = visible ? '' : 'none';
    }
  }
  function updateMarkerScales(){
    const s = zoomScale(map.getZoom());
    for (const m of tempMarkers){
      m.el.style.transform = `translate(-50%,-50%) scale(${s})`;
    }
  }

  // === Persist Temperature visibility across day changes ===
  function applyTempVisibility(){
    const show = document.getElementById('toggleTemp').checked;
    const v = show ? 'visible' : 'none';
    if (map.getLayer('temp-circles')) map.setLayoutProperty('temp-circles','visibility', v);
    if (map.getLayer('temp-labels'))  map.setLayoutProperty('temp-labels','visibility',  v);
    setMarkersVisible(show);
  }

  // === Persist Precipitation visibility across day changes ===
  function applyPrecipVisibility(){
    const show = document.getElementById('togglePrecip').checked;
    const v = show ? 'visible' : 'none';
    if (map.getLayer('precip')) map.setLayoutProperty('precip','visibility', v);
  }

  map.on('load', () => {
    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();

    // ======== NASA GIBS IMERG (time-aware) ========
    const NASA_LAYER = 'IMERG_Precipitation_Rate_30min';
    const NASA_TMS   = 'GoogleMapsCompatible_Level6';

    function gibsUrlFor(timeISO){
      return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${NASA_LAYER}/default/${timeISO}/${NASA_TMS}/{z}/{y}/{x}.png`;
    }

    function setPrecipTime(dayIdx){
      const dayName = DAYS[dayIdx];
      const timeISO = TIMES[dayName];

      // keep current opacity
      const prevOpacity = map.getLayer('precip')
        ? map.getPaintProperty('precip','raster-opacity')
        : parseFloat(opacityRange.value);

      if (map.getLayer('precip')) map.removeLayer('precip');
      if (map.getSource('precip-gibs')) map.removeSource('precip-gibs');

      map.addSource('precip-gibs', {
        type:'raster',
        tiles:[ gibsUrlFor(timeISO) ],
        tileSize:256,
        attribution:'NASA GIBS / GPM (IMERG)'
      });

      map.addLayer({
        id:'precip',
        type:'raster',
        source:'precip-gibs',
        minzoom:0,
        maxzoom:6,
        paint:{
          'raster-opacity': prevOpacity,
          'raster-fade-duration': 0
        }
      }, 'temp-circles');

      if (map.getLayer('temp-circles')) map.moveLayer('temp-circles');
      if (map.getLayer('temp-labels'))  map.moveLayer('temp-labels');

      // (stamp hidden via CSS, but keep code harmless)
      const d = new Date(timeISO);
      stamp.textContent = `${dayName} · ${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()} · ${String(d.getUTCHours()).padStart(2,'0')}:00 UTC`;

      // sync UI to preserved opacity
      opacityRange.value = String(prevOpacity);

      // NEW: ensure precip visibility matches the toggle after re-adding the layer
      applyPrecipVisibility();
    }

    // ======== Temperature GL layers (kept) ========
    map.addSource('temp-points', { type:'geojson', data: { type:'FeatureCollection', features: [] } });
    map.addLayer({ id:'temp-circles', type:'circle', source:'temp-points', paint:{
      'circle-radius': [
        'interpolate',['linear'],['zoom'],
        0, 8, 5, 9.5, 8, 10.5, 12, 12, 16, 13.5, 22, 15
      ],
      'circle-color': [ 'interpolate', ['linear'], ['get','tempC'],
        -5,'#60a5fa', 0,'#38bdf8', 10,'#34d399', 20,'#fbbf24', 28,'#f97316', 35,'#ef4444' ],
      'circle-opacity': 0.95,
      'circle-stroke-color':'#000000',
      'circle-stroke-opacity': 0.55,
      'circle-stroke-width': 3
    }});
    map.addLayer({ id:'temp-labels', type:'symbol', source:'temp-points', layout:{
      'text-field': ['get','label'],
      'text-size': 12,
      'text-font': ['sans-serif'],
      'text-offset': [0, 0],
      'text-anchor': 'center',
      'text-allow-overlap': true,
      'text-ignore-placement': true,
      'text-line-height': 1.1
    }, paint:{ 'text-color':'#ffffff', 'text-halo-color':'rgba(0,0,0,0.65)', 'text-halo-width': 1.6 }});

    function updateTempsFor(dayIdx){
      const dayName = DAYS[dayIdx];
      const temps = TEMPS_C[dayName] || {};
      const features = CITIES.map(c => {
        const tc = Number(temps[c.name]);
        const tempC = isFinite(tc) ? tc : 20;
        const tempF = cToF(tempC);
        const label = `${Math.round(tempC)}°C\n${tempF}°F`;
        return { type:'Feature', geometry:{ type:'Point', coordinates:[c.lon, c.lat] }, properties:{ name:c.name, tempC, label } };
      });
      const src = map.getSource('temp-points'); if (src) src.setData({ type:'FeatureCollection', features });
    }

    // ======== Init & interactions ========
    dayRange.value = String(START_DAY_INDEX);
    setPrecipTime(START_DAY_INDEX);
    updateTempsFor(START_DAY_INDEX);
    drawTempMarkers(START_DAY_INDEX);
    applyTempVisibility();    // keep Temperature toggle on load
    applyPrecipVisibility();  // keep Precipitation toggle on load

    dayRange.addEventListener('input', () => {
      const idx = Number(dayRange.value);
      setPrecipTime(idx);     // re-add precip layer at new time (keeps opacity)
      updateTempsFor(idx);
      drawTempMarkers(idx);
      updateMarkerScales();
      applyTempVisibility();   // persist temperature visibility
      applyPrecipVisibility(); // persist precipitation visibility
    });

    document.getElementById('togglePrecip').onchange = (e)=>{
      const v = e.target.checked ? 'visible' : 'none';
      if (map.getLayer('precip')) map.setLayoutProperty('precip','visibility', v);
    };
    document.getElementById('toggleTemp').onchange = (e)=>{
      const v = e.target.checked ? 'visible' : 'none';
      if (map.getLayer('temp-circles')) map.setLayoutProperty('temp-circles','visibility', v);
      if (map.getLayer('temp-labels')) map.setLayoutProperty('temp-labels','visibility', v);
      setMarkersVisible(e.target.checked);
    };

    opacityRange.addEventListener('input', () => {
      const val = parseFloat(opacityRange.value);
      if (map.getLayer('precip')) map.setPaintProperty('precip','raster-opacity', val);
    });

    // Keep circles centered while zooming
    map.on('zoom', updateMarkerScales);
    map.on('zoomend', updateMarkerScales);
    map.on('resize', updateMarkerScales);
  });
  </script>
</body>
</html>
