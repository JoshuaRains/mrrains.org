<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoy es… — Colores</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0d0f12;
    color: #e9eef4;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  .wrap {
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    place-items: center;
    gap: 2rem;
    padding: 6vh 4vw 4vh;
    text-align: center;
  }
  .brand {
    position: fixed;
    top: 10px;
    left: 14px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .06em;
    opacity: .55;
    user-select: none;
  }
  .swatch {
    width: min(60vmin, 520px);
    height: min(60vmin, 520px);
    border-radius: 18px;
    border: 6px solid #1f2733;
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    background: #222; /* default before first round */
    transition: background-color 160ms ease-out, transform 120ms ease-out;
  }
  .swatch.bump { transform: scale(1.015); }
  .prompt, .answer, .hint {
    margin: .35em 0;
    font-weight: 800;
    letter-spacing: .02em;
  }
  .prompt { font-size: clamp(28px, 5.5vw, 64px); opacity: .95; }
  .answer {
    font-size: clamp(28px, 5vw, 56px);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 180ms ease-out, transform 180ms ease-out;
  }
  .answer.revealed { opacity: 1; transform: translateY(0); }
  .hint {
    opacity: .7;
    font-weight: 700;
    font-size: clamp(14px, 1.8vw, 18px);
  }
  .kbd {
    border:1px solid #4a5568; border-radius:6px; padding:2px 8px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="brand">Colores</div>
  <div class="wrap">
    <main aria-live="polite">
      <div id="swatch" class="swatch" aria-hidden="true"></div>
      <div id="prompt" class="prompt">Pulsa <span class="kbd">Espacio</span> para empezar</div>
      <div id="answer" class="answer" aria-hidden="true"></div>
    </main>
    <div class="hint" id="hint">Espacio: mostrar color / revelar nombre</div>
  </div>

<script>
(() => {
  // Predefined Spanish colors (incluye variantes claro/oscuro)
  const COLORS = [
    { n:"rojo", h:"#E53935" }, { n:"rojo oscuro", h:"#8B1C1C" },
    { n:"azul", h:"#1E88E5" }, { n:"azul claro", h:"#64B5F6" }, { n:"azul oscuro", h:"#1E3A8A" },
    { n:"verde", h:"#2E7D32" }, { n:"verde claro", h:"#81C784" }, { n:"verde oscuro", h:"#14532D" },
    { n:"amarillo", h:"#FFE066" }, 
    { n:"anaranjado", h:"#FB8C00" }, { n:"anaranjado claro", h:"#FFB74D" }, { n:"anaranjado oscuro", h:"#C05621" },
    { n:"morado", h:"#7E57C2" }, { n:"morado claro", h:"#B39DDB" }, 
  { n:"rosa", h:"#F48FB1" },
    { n:"marrón claro", h:"#8D6E63" },  { n:"marrón", h:"#5D4037" },
    { n:"gris", h:"#9AA0A6" },  { n:"gris oscuro", h:"#374151" },
    { n:"negro", h:"#000000" }, { n:"blanco", h:"#FFFFFF" }
  ];

  const swatchEl = document.getElementById('swatch');
  const promptEl = document.getElementById('prompt');
  const answerEl = document.getElementById('answer');
  const hintEl = document.getElementById('hint');

  let state = "idle"; // "idle" | "question" | "answer"
  let lastIdx = null;
  let current = null;

  function randInt(n){ return Math.floor(Math.random()*n); }
  function pickNewIndex() {
    if (COLORS.length < 2) return 0;
    let idx;
    do { idx = randInt(COLORS.length); } while (idx === lastIdx);
    lastIdx = idx;
    return idx;
  }

  // NEW: instantly hide answer (no fade) before updating text to avoid flash
 function instantHideAnswer() {
  // Temporarily disable transition so it hides immediately
  answerEl.style.transition = 'none';
  // Return to base (hidden) state ONLY via class toggle (no inline opacity/transform)
  answerEl.classList.remove('revealed');
  answerEl.setAttribute('aria-hidden', 'true');

  // Clear any leftover inline styles that could block the CSS class
  answerEl.style.opacity = '';
  answerEl.style.transform = '';

  // Force reflow, then restore transition so the next reveal animates
  void answerEl.offsetWidth;
  answerEl.style.transition = '';
}


  function newRound(){
    // Hide any currently visible answer immediately to prevent early reveal
    instantHideAnswer();

    const idx = pickNewIndex();
    const { n:name, h:hex } = COLORS[idx];
    current = { name, hex };

    // update swatch and prompt
    swatchEl.style.background = hex;
    swatchEl.classList.remove('bump'); void swatchEl.offsetWidth; swatchEl.classList.add('bump');

    promptEl.textContent = "¿Qué color es?";
    // set the (hidden) answer text AFTER we've hidden it
    answerEl.textContent = capitalize(name);

    state = "question";
    hintEl.textContent = "Espacio: revelar nombre";
  }

  function reveal(){
    if (!current) return;
    answerEl.classList.add('revealed');
    answerEl.setAttribute('aria-hidden', 'false');
    state = "answer";
    hintEl.textContent = "Espacio: nuevo color";
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function onSpace(e){
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === "idle" || state === "answer") newRound();
      else if (state === "question") reveal();
    }
  }

  window.addEventListener('keydown', onSpace, {passive:false});
  window.addEventListener('click', () => {
    if (state === "idle" || state === "answer") newRound();
    else if (state === "question") reveal();
  });
})();
</script>

</body>
</html>
