<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MP3 Audio Recorder</title>
<style>
	:root{
		color-scheme: dark;
		--ink:#eaeaea; --muted:#bdbdbd; --accent:#5c8a6d;
	}
	body{
		font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
		background:#111;color:var(--ink);
		margin:0;padding:24px;
		display:flex;flex-direction:column;gap:20px;
	}
	h1{margin:0;font-size:22px;}
	.panel{
		display:grid;grid-template-columns:1fr;gap:12px;
		background:#151515;border:1px solid #222;border-radius:12px;padding:16px;
	}
	.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
	label{font-size:14px;color:var(--muted)}
	select,button,input{
		background:#1b1b1b;color:#fff;border:1px solid #2a2a2a;border-radius:10px;
		padding:10px 12px;font-size:14px
	}
	input{min-width:220px}
	button{cursor:pointer}
	button.primary{background:var(--accent);border-color:#487259}
	button.destructive{background:#3b1f1f;border-color:#5a2a2a}
	button:disabled{opacity:.6;cursor:not-allowed}
	audio{width:100%}
	.small{font-size:12px;color:var(--muted)}
	.saver{
		display:grid;
		grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
		gap:10px
	}
	.tag{
		font-size:12px;padding:3px 8px;border:1px solid #333;border-radius:999px;color:#ddd
	}
	.badge{
		font-weight:600;background:#1f1f1f;border:1px solid #2a2a2a;border-radius:8px;padding:6px 8px
	}
	hr{border:none;height:1px;background:#222;margin:0}
	.hint{
		font-size:12px;color:var(--muted);
		display:flex;gap:10px;align-items:center;flex-wrap:wrap
	}
	.hint code{
		background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:2px 6px
	}
</style>

<!-- LAME MP3 encoder (client-side) -->
<script src="https://unpkg.com/lamejs@1.2.0/lame.min.js"></script>
</head>
<body>
	<h1>MP3 Audio Recorder</h1>

	<div class="panel">
		<div class="row">
			<div>
				<div class="small">Format</div>
				<div id="formatBadge" class="badge">MP3 · 44.1kHz · 128kbps · Mono</div>
			</div>

			<div style="flex:1"></div>

			<div>
				<label for="setNameInput">Audio set name</label><br/>
				<input id="setNameInput" type="text" value="food" spellcheck="false" autocomplete="off" />
			</div>

			<div>
				<label for="deviceSelect">Microphone</label><br/>
				<select id="deviceSelect" title="Select an audio input"></select>
			</div>

			<button id="refreshBtn" title="Refresh devices">Refresh</button>
		</div>

		<div class="hint">
			Type a set name like <code>bodyParts</code> to generate save buttons:
			<code>bodyParts1.mp3</code> … <code>bodyParts50.mp3</code>
		</div>

		<div class="row">
			<button id="recordBtn" class="primary">● Record</button>
			<button id="stopBtn" disabled>■ Stop</button>
			<button id="playBtn" disabled>▶ Play</button>
			<button id="rerecordBtn" class="destructive" disabled>↺ Re-record (discard take)</button>
			<div id="status" class="tag">Ready</div>
		</div>

		<audio id="player" controls></audio>
		<div class="small">
			Record a take. When it sounds good, use the buttons below to download it with the correct filename (.mp3).
		</div>
	</div>

	<div class="panel">
		<div class="row"><strong>Save the current take as…</strong></div>
		<hr />
		<div id="saverGrid" class="saver"></div>
	</div>

<script>
(() => {
	// --- Settings ---
	const DEFAULT_SET_NAME = "food";
	const BUTTON_COUNT = 50;

	// --- UI refs ---
	const deviceSelect = document.getElementById('deviceSelect');
	const refreshBtn = document.getElementById('refreshBtn');
	const recordBtn = document.getElementById('recordBtn');
	const stopBtn = document.getElementById('stopBtn');
	const playBtn = document.getElementById('playBtn');
	const rerecordBtn = document.getElementById('rerecordBtn');
	const player = document.getElementById('player');
	const saverGrid = document.getElementById('saverGrid');
	const statusTag = document.getElementById('status');
	const setNameInput = document.getElementById('setNameInput');

	// --- Audio graph state ---
	let audioCtx = null;
	let currentStream = null;
	let sourceNode = null;
	let processor = null;

	// capture buffer
	let inputSampleRate = 44100;
	let captured = []; // Array of Float32Array mono chunks
	let isRecording = false;

	// mp3 blob of current take
	let currentBlob = null;

	function setStatus(msg){ statusTag.textContent = msg; }

	function setControls({record=true, stop=false, play=false, rerecord=false}){
		recordBtn.disabled = !record;
		stopBtn.disabled = !stop;
		playBtn.disabled = !play;
		rerecordBtn.disabled = !rerecord;
	}

	function clearTake() {
		captured = [];
		currentBlob = null;
		player.src = "";
		setControls({record:true, stop:false, play:false, rerecord:false});
		setStatus("Ready");
	}

	function sanitizeSetName(raw) {
		// keep it filename-friendly: letters, numbers, underscore, hyphen only
		let s = (raw || "").trim();
		s = s.replace(/\s+/g, "_");
		s = s.replace(/[^a-zA-Z0-9_-]/g, "");
		return s || DEFAULT_SET_NAME;
	}

	function currentSetName() {
		return sanitizeSetName(setNameInput.value);
	}

	async function listDevices() {
		const devices = await navigator.mediaDevices.enumerateDevices();
		const inputs = devices.filter(d => d.kind === 'audioinput');
		deviceSelect.innerHTML = "";
		inputs.forEach((d, i) => {
			const opt = document.createElement('option');
			opt.value = d.deviceId;
			opt.textContent = d.label || `Microphone (${i+1})`;
			deviceSelect.appendChild(opt);
		});
	}

	async function getStreamFor(deviceId) {
		// stop old stream
		if (currentStream) currentStream.getTracks().forEach(t => t.stop());
		currentStream = null;

		const constraints = { audio: { deviceId: deviceId ? { exact: deviceId } : undefined } };
		currentStream = await navigator.mediaDevices.getUserMedia(constraints);
		return currentStream;
	}

	function teardownGraph() {
		if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
		if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
		// keep audioCtx for reuse
	}

	function setupGraph(stream) {
		if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
		inputSampleRate = audioCtx.sampleRate || 44100;

		sourceNode = audioCtx.createMediaStreamSource(stream);

		// ScriptProcessorNode: widely supported and simple for this use
		const bufferSize = 4096;
		processor = audioCtx.createScriptProcessor(bufferSize, 1, 1);
		processor.onaudioprocess = (e) => {
			if (!isRecording) return;
			const chan = e.inputBuffer.getChannelData(0);
			captured.push(new Float32Array(chan)); // clone
		};

		sourceNode.connect(processor);
		processor.connect(audioCtx.destination); // required in some browsers
	}

	// Resample Float32 mono to 44.1kHz if needed (simple linear)
	function resampleTo44100(float32, fromRate) {
		const toRate = 44100;
		if (fromRate === toRate) return float32;

		const ratio = fromRate / toRate;
		const newLen = Math.round(float32.length / ratio);
		const out = new Float32Array(newLen);

		for (let i = 0; i < newLen; i++) {
			const idx = i * ratio;
			const i0 = Math.floor(idx);
			const i1 = Math.min(i0 + 1, float32.length - 1);
			const frac = idx - i0;
			out[i] = float32[i0] * (1 - frac) + float32[i1] * frac;
		}
		return out;
	}

	function floatTo16BitPCM(float32) {
		const out = new Int16Array(float32.length);
		for (let i = 0; i < float32.length; i++) {
			let s = Math.max(-1, Math.min(1, float32[i]));
			out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
		}
		return out;
	}

	function encodeMp3FromCaptured() {
		// merge chunks
		let totalLength = 0;
		for (const ch of captured) totalLength += ch.length;

		const mono = new Float32Array(totalLength);
		let offset = 0;
		for (const ch of captured) { mono.set(ch, offset); offset += ch.length; }

		// resample if needed
		const resampled = resampleTo44100(mono, inputSampleRate);

		// convert to 16-bit PCM
		const pcm16 = floatTo16BitPCM(resampled);

		// encode MP3 (mono, 44.1k, 128kbps)
		const channels = 1, sampleRate = 44100, kbps = 128;
		const encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);

		const blockSize = 1152;
		const mp3Data = [];
		for (let i = 0; i < pcm16.length; i += blockSize) {
			const chunk = pcm16.subarray(i, i + blockSize);
			const mp3buf = encoder.encodeBuffer(chunk);
			if (mp3buf.length > 0) mp3Data.push(mp3buf);
		}
		const end = encoder.flush();
		if (end.length > 0) mp3Data.push(end);

		return new Blob(mp3Data, { type: 'audio/mpeg' });
	}

	function downloadBlob(blob, filename) {
		const a = document.createElement('a');
		const url = URL.createObjectURL(blob);
		a.href = url;
		a.download = filename;
		document.body.appendChild(a);
		a.click();
		a.remove();
		URL.revokeObjectURL(url);
	}

	// --- Saver buttons ---
	function buildSaverButtons() {
		saverGrid.innerHTML = "";
		const setName = currentSetName();

		for (let n = 1; n <= BUTTON_COUNT; n++) {
			const btn = document.createElement('button');
			const filename = `${setName}${n}.mp3`;
			btn.textContent = filename;
			btn.title = `Download as ${filename}`;

			btn.addEventListener('click', () => {
				if (!currentBlob) { setStatus("No take to save"); return; }
				downloadBlob(currentBlob, filename);
				setStatus(`Saved ${filename}`);
			});

			saverGrid.appendChild(btn);
		}
	}

	// Rebuild buttons whenever the set name changes
	setNameInput.addEventListener('input', () => {
		buildSaverButtons();
	});

	// --- Controls ---
	recordBtn.addEventListener('click', async () => {
		try {
			if (!currentStream) {
				await getStreamFor(deviceSelect.value || null);
				teardownGraph();
				setupGraph(currentStream);
			}
			captured = [];
			isRecording = true;
			setStatus("Recording…");
			setControls({record:false, stop:true, play:false, rerecord:false});
		} catch (err) {
			console.error(err);
			alert("Could not start recording. Please check microphone permissions.");
		}
	});

	stopBtn.addEventListener('click', () => {
		if (!isRecording) return;
		isRecording = false;
		setStatus("Encoding MP3…");

		setTimeout(() => {
			currentBlob = encodeMp3FromCaptured();
			player.src = URL.createObjectURL(currentBlob);
			setStatus("Take ready");
			setControls({record:true, stop:false, play:true, rerecord:true});
		}, 10);
	});

	playBtn.addEventListener('click', () => { if (player.src) player.play(); });
	rerecordBtn.addEventListener('click', () => { clearTake(); });

	refreshBtn.addEventListener('click', async () => { await listDevices(); });

	deviceSelect.addEventListener('change', async () => {
		clearTake();
		try{
			await getStreamFor(deviceSelect.value);
			teardownGraph();
			setupGraph(currentStream);
		}catch(e){
			console.error(e);
			alert("Could not switch microphones.");
		}
	});

	// Init
	async function init() {
		if (!navigator.mediaDevices?.getUserMedia) {
			alert("Your browser does not support audio capture. Use a recent Chrome/Edge.");
			return;
		}
		try {
			// Request permission so device labels appear
			const s = await getStreamFor(null);
			audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			teardownGraph();
			setupGraph(s);
			await listDevices();

			if (deviceSelect.options.length) deviceSelect.selectedIndex = 0;

			setNameInput.value = DEFAULT_SET_NAME;
			buildSaverButtons();

			setControls({record:true, stop:false, play:false, rerecord:false});
			setStatus("Ready");
		} catch (err) {
			console.error(err);
			alert("Could not access the microphone. Check browser permissions.");
		}
	}
	init();
})();
</script>
</body>
</html>
