<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spanish-Speaking Countries and Flags</title>
  <style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}main{width:min(720px,calc(100% - 32px));margin:36px auto 70px}h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px)}.intro{margin:0 0 34px;color:#555;font-size:16px}.grid{display:flex;flex-direction:column;gap:42px}.country{width:100%;text-align:center;break-inside:avoid;border-bottom:1px solid #e5e5e5;padding-bottom:42px}.country:last-child{border-bottom:0}.country img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;margin:0 auto 16px}.country span{display:block;font-size:clamp(22px,4vw,30px);font-weight:700}.note{margin-top:38px;color:#666;font-size:13px}@media(max-width:520px){main{width:calc(100% - 24px);margin-top:24px}.grid{gap:30px}.country{padding-bottom:30px}.country img{max-height:240px}}@media print{main{width:100%;margin:0}.intro,.note{display:none}.grid{gap:20px}.country{padding-bottom:20px}.country img{max-height:180px}h1{margin-bottom:20px;font-size:26px}}</style>
</head>
<body><main><h1>Spanish-Speaking Countries</h1><p class="intro">A simple flag and country-name reference for class worksheets.</p><div id="flags" class="grid"></div><p class="note">Puerto Rico is included as a Spanish-speaking territory.</p></main>
<script>const countries=[["Argentina","ar"],["Bolivia","bo"],["Chile","cl"],["Colombia","co"],["Costa Rica","cr"],["Cuba","cu"],["Dominican Republic","do"],["Ecuador","ec"],["El Salvador","sv"],["Equatorial Guinea","gq"],["Guatemala","gt"],["Honduras","hn"],["Mexico","mx"],["Nicaragua","ni"],["Panama","pa"],["Paraguay","py"],["Peru","pe"],["Puerto Rico","pr"],["Spain","es"],["Uruguay","uy"],["Venezuela","ve"]];document.querySelector("#flags").replaceChildren(...countries.map(([name,code])=>{const item=document.createElement("div");item.className="country";const img=document.createElement("img");img.src=`https://flagcdn.com/${code}.svg`;img.alt=`Flag of ${name}`;const label=document.createElement("span");label.textContent=name;item.append(img,label);return item}))</script>
</body>
</html>
