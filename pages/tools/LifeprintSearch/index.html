<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lifeprint Picker (LLM Top 5 Only)</title>
	<style>
		:root{
			--bg:#0b0f14;
			--panel:#111823;
			--ink:#e9eef4;
			--muted:#9aa6b2;
			--border:#223044;
			--btn:#1a2535;
			--btn2:#22324a;
			--accent:#36c269;
			--bad:#ff5c5c;
			--shadow: 0 12px 30px rgba(0,0,0,.35);
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
		}
		html, body{ height:100%; margin:0; background:var(--bg); color:var(--ink); }
		.wrap{ max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
		.card{
			background:var(--panel);
			border:1px solid var(--border);
			border-radius:14px;
			box-shadow:var(--shadow);
			padding:16px;
		}
		.row{ display:flex; gap:10px; align-items:center; }
		input[type="text"]{
			flex:1;
			height:44px;
			border-radius:10px;
			border:1px solid var(--border);
			background:#0d131c;
			color:var(--ink);
			padding:0 12px;
			font-size:16px;
			outline:none;
		}
		button{
			height:44px;
			border-radius:10px;
			border:1px solid var(--border);
			background:var(--btn);
			color:var(--ink);
			padding:0 14px;
			font-size:15px;
			cursor:pointer;
		}
		button:hover{ background:var(--btn2); }
		.status{ margin-top:10px; font-size:13px; color:var(--muted); min-height: 18px; }
		.results{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
		.resultBtn{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			width:100%;
			text-align:left;
			height:auto;
			padding:12px 12px;
		}
		.meta{ display:flex; flex-direction:column; gap:4px; overflow:hidden; }
		.meta .label{
			font-size:14px;
			color:var(--ink);
			white-space:nowrap;
			overflow:hidden;
			text-overflow:ellipsis;
		}
		.meta .url{
			font-size:12px;
			color:var(--muted);
			white-space:nowrap;
			overflow:hidden;
			text-overflow:ellipsis;
		}
		.badge{
			font-size:12px;
			padding:4px 8px;
			border-radius:999px;
			border:1px solid var(--border);
			color:var(--muted);
			white-space:nowrap;
		}
		.badge.good{ border-color: rgba(54,194,105,.35); color: var(--accent); }
		.badge.warn{ border-color: rgba(255,92,92,.35); color: var(--bad); }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="card">
			<div class="row">

			<div class="status" id="status"></div>
			<div class="results" id="results"></div>

		// =============================
		// Config
		// =============================
		const MODEL_ID = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
		const LIFEPRINT_SIGN_BASE = "https://www.lifeprint.com/asl101/pages-signs";
		const PREFILTER_LIMIT = 25;	// keep prompt small for small local models
		const TOP_N = 5;			// show only top 5 LLM results

		// =============================
		// UI
		// =============================
		const $q = document.getElementById("q");
		const $go = document.getElementById("go");
		const $status = document.getElementById("status");
		const $results = document.getElementById("results");

		function setStatus(text){ $status.textContent = text || ""; }
		function clearResults(){ $results.innerHTML = ""; }
		function openNewTab(url){ window.open(url, "_blank", "noopener,noreferrer"); }

		// =============================
		// Dictionary parsing & normalization
		// =============================
		function normalizeQuery(s){
			return (s || "")
				.trim()
				.replace(/\s+/g, " ")
				.replace(/[“”]/g, '"')
				.replace(/[‘’]/g, "'")
				.toLowerCase();
		}

		function stripNotes(entry){
			let s = entry.trim();
			s = s.replace(/\s*\(\d+\)\s*$/g, "");
			s = s.replace(/\s*\[[^\]]*\]\s*/g, " ");
			s = s.replace(/\s*-\s*\[[^\]]*\]\s*/g, " ");
			s = s.replace(/\s*Also see:.*$/i, "");
			s = s.replace(/\s+/g, " ").trim();
			return s;
		}

		function explodeAlternates(core){
			const parts = [];
			const slashParts = core.split("/").map(x => x.trim()).filter(Boolean);
			for (const sp of slashParts){
				const colonParts = sp.split(":").map(x => x.trim()).filter(Boolean);
				for (const cp of colonParts) parts.push(cp);
			}
			if (!parts.length) parts.push(core);

			const keys = [];
			const seen = new Set();
			for (const p of parts){
				const k = normalizeQuery(p)
					.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
					.trim();
				if (k && !seen.has(k)){
					seen.add(k);
					keys.push(k);
				}
			}
			return keys.length ? keys : [normalizeQuery(core)];
		}

		function parseDictionary(raw){
			const lines = raw.split("\n").map(l => l.trim()).filter(l => l.length > 0);
			const entries = [];
			for (const line of lines){
				const core = stripNotes(line);
				if (!core) continue;
				entries.push({ original: line, core, keys: explodeAlternates(core) });
			}
			return entries;
		}

		const DICTIONARY = parseDictionary(DICTIONARY_RAW);

		// =============================
		// URL generation from entry
		// =============================
		function slugifyForLifeprint(s){
			return (s || "")
				.toLowerCase()
				.replace(/&/g, "and")
				.replace(/["']/g, "")
				.replace(/[^a-z0-9]+/g, "-")
				.replace(/^-+|-+$/g, "");
		}

		function letterFolderFromSlug(slug){
			const m = slug.match(/[a-z]/i);
			return m ? m[0].toLowerCase() : "misc";
		}

		function buildLifeprintUrl(slug){
			const letter = letterFolderFromSlug(slug);
			return `${LIFEPRINT_SIGN_BASE}/${letter}/${slug}.htm`;
		}

		function entryToUrl(entry){
			// Primary URL only (keep UI simple)
			const slug = slugifyForLifeprint(entry.core);
			if (!slug) return "";
			return buildLifeprintUrl(slug);
		}

		// =============================
		// Prefilter (keeps prompt small; LLM does semantic ranking)
		// =============================
		function scoreEntry(query, entry){
			const q = normalizeQuery(query);
			if (!q) return 0;

			const qTokens = q.split(" ").filter(Boolean);
			let best = 0;

			for (const key of entry.keys){
				if (!key) continue;

				if (key === q) best = Math.max(best, 1000);
				if (key.startsWith(q)) best = Math.max(best, 650);
				if (q.startsWith(key)) best = Math.max(best, 600);
				if (key.includes(q)) best = Math.max(best, 420);

				const kTokens = key.split(" ").filter(Boolean);
				let overlap = 0;
				for (const t of qTokens){
					if (kTokens.includes(t)) overlap++;
				}
				best = Math.max(best, overlap * 120);

				const lenDelta = Math.abs(key.length - q.length);
				best = Math.max(best, Math.max(0, 120 - lenDelta * 8));
			}

			return best;
		}

		function prefilterCandidates(query){
			const q = normalizeQuery(query);

			const scoredAll = DICTIONARY
				.map(e => ({ e, s: scoreEntry(q, e) }))
				.sort((a,b) => b.s - a.s);

			const filtered = scoredAll
				.filter(x => x.s > 0)
				.slice(0, PREFILTER_LIMIT)
				.map(x => x.e);

			if (filtered.length) return filtered;

			// Weak fallback: still provide candidates so LLM can do semantic approximation
			return scoredAll.slice(0, PREFILTER_LIMIT).map(x => x.e);
		}

		// =============================
		// LLM (local) + robust parsing
		// =============================
		let engine = null;
		let engineReady = false;
		let engineLoading = false;

		async function ensureEngine(){
			if (engineReady) return engine;
			if (engineLoading) return null;

			engineLoading = true;
			setStatus("Loading local LLM (first run downloads model assets) …");

			try{
				const initProgressCallback = (p) => {
					const pct = (p.progress * 100).toFixed(0);
					setStatus(`Loading local LLM: ${pct}% — ${p.text || ""}`.trim());
				};
				engine = await webllm.CreateMLCEngine(MODEL_ID, { initProgressCallback });
				engineReady = true;
				setStatus("LLM ready.");
				return engine;
			}catch(err){
				console.error(err);
				setStatus("LLM failed to load.");
				engine = null;
				engineReady = false;
				return null;
			}finally{
				engineLoading = false;
			}
		}

function extractJsonIntArray(text){
	if (!text) return null;
	let s = String(text).trim();

	// Remove fenced code blocks, keep inner content
	s = s.replace(/```[\s\S]*?```/g, (block) => {
		return block.replace(/^```[a-zA-Z]*\n?/, "").replace(/```$/, "");
	}).trim();

	// Grab first bracketed array
	const m = s.match(/\[[\s\S]*\]/);
	if (!m) return null;

	let candidate = m[0].trim();

	// Remove trailing commas
	candidate = candidate.replace(/,\s*\]/g, "]");

	try{
		const parsed = JSON.parse(candidate);
		if (!Array.isArray(parsed)) return null;

		// Accept numbers or numeric strings
		const ints = parsed.map(v => {
			if (typeof v === "number") return v;
			if (typeof v === "string" && v.trim().match(/^\d+$/)) return Number(v.trim());
			return NaN;
		});

		if (ints.some(n => !Number.isFinite(n))) return null;
		return ints;
	}catch{
		return null;
	}
}


async function llmRankByMeaning(engine, phrase, candidates){
	// Candidates are numbered 1..N in the prompt.
	const N = candidates.length;

	const system = [
		"You are selecting the closest-matching ASL dictionary entry by MEANING.",
		"",
		"Critical rules:",
		"1) Choose by meaning, not by shared letters or first word.",
		"2) Strongly avoid function-word matches like: in, on, at, to, of, the, a, an, and, or, but, as, is, are, was, were.",
		"   Only choose a function word if the user is explicitly asking about that function word itself.",
		"3) For phrases like 'in reality' choose the closest single-word meaning (e.g., REALLY / ACTUALLY) if available.",
		"",
		"Output format (MANDATORY):",
		"- Output ONLY a JSON array of INTEGERS.",
		"- Each integer must be between 1 and " + N + " (inclusive).",
		"- Return EXACTLY 5 integers, ranked best to worst.",
		"- First character must be '[' and last character must be ']'.",
		"- No markdown, no commentary, no extra text."
	].join("\n");

	const user = [
		`English input (meaning to match): "${phrase}"`,
		"",
		"Candidate entries (choose by number ONLY):",
		...candidates.map((c, i) => `${i + 1}. ${c.core}`),
		"",
		"Return the JSON array of 5 integers now."
	].join("\n");

	// First attempt
	let reply = await engine.chat.completions.create({
		messages: [
			{ role: "system", content: system },
			{ role: "user", content: user },
		],
		temperature: 0.0,
	});

	let text = reply?.choices?.[0]?.message?.content || "";
	let arr = extractJsonIntArray(text);

	// One hard retry if needed
	if (!arr){
		reply = await engine.chat.completions.create({
			messages: [
				{ role: "system", content: system },
				{ role: "user", content: user },
				{ role: "user", content: "Output ONLY the JSON array of 5 integers. No other text." },
			],
			temperature: 0.0,
		});
		text = reply?.choices?.[0]?.message?.content || "";
		arr = extractJsonIntArray(text);
	}

	if (!arr) return null;

	// sanitize to [1..N], unique, preserve order
	const out = [];
	const seen = new Set();
	for (const x of arr){
		const n = Number(x);
		if (Number.isInteger(n) && n >= 1 && n <= N && !seen.has(n)){
			seen.add(n);
			out.push(n);
		}
		if (out.length >= TOP_N) break;
	}

	// Ensure we always return 5 indexes (fallback to 1..N)
	for (let i = 1; out.length < TOP_N && i <= N; i++){
		if (!seen.has(i)) out.push(i);
	}

	return out; // integer indexes
}


		// =============================
		// Render top 5 only (from LLM)
		// =============================
		function renderTop5(entries, topCore){
			clearResults();

			if (!entries.length){
				const div = document.createElement("div");
				div.style.color = "var(--muted)";
				div.style.fontSize = "14px";
				div.textContent = "No results.";
				$results.appendChild(div);

			}

			for (const entry of entries.slice(0, TOP_N)){
				const url = entryToUrl(entry);

				const btn = document.createElement("button");
				btn.className = "resultBtn";
				btn.type = "button";

				const meta = document.createElement("div");
				meta.className = "meta";

				const label = document.createElement("div");
				label.className = "label";
				label.textContent = entry.core;

				const u = document.createElement("div");
				u.className = "url";
				u.textContent = url || "(no URL generated)";

				meta.appendChild(label);
				meta.appendChild(u);

				const badge = document.createElement("div");
				badge.className = "badge";
				if (topCore && entry.core === topCore){
					badge.classList.add("good");
					badge.textContent = "Top match";
				}else{
					badge.textContent = "Open";
				}

				btn.appendChild(meta);
				btn.appendChild(badge);

				btn.addEventListener("click", () => {
					if (url) openNewTab(url);
				});

				$results.appendChild(btn);
			}
		}

		// =============================
		// Search flow (NO pre-LLM display)
		// =============================
		async function runSearch(){
			clearResults();

			if (!DICTIONARY.length || (DICTIONARY.length === 1 && DICTIONARY[0].core === "PASTE YOUR LIST HERE")){
				setStatus("Paste your dictionary list into DICTIONARY_RAW in the HTML file first.");
				return;

			const phrase = normalizeQuery($q.value);

			setStatus("Finding best matches…");

				setStatus("No candidates available.");
				return;
			}

			const eng = await ensureEngine();
			if (!eng){
				setStatus("LLM unavailable.");
				return;
			}

			setStatus("Ranking by meaning (LLM)…");

			const rankedIdx = await llmRankByMeaning(eng, phrase, candidates);
if (!rankedIdx){
	setStatus("LLM response could not be parsed.");
	return;
}

// Map indexes -> entries (1-based -> 0-based)
const rankedEntries = rankedIdx
	.map(i => candidates[i - 1])
	.filter(Boolean);

setStatus(`Showing top ${Math.min(TOP_N, rankedEntries.length)} results.`);
renderTop5(rankedEntries, rankedEntries[0]?.core || null);

		}

		$go.addEventListener("click", runSearch);
		$q.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
