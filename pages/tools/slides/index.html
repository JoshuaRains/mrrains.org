<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Class Timeline + Slides</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,500,0,0"
		rel="stylesheet">

	<style>
		:root {
			color-scheme: dark;
			--green: #36c269;
			--green-weak: #2a9b53;
			--ink: #e9eef4;
			--panel: #111111;
			--muted: #b8bec6;
			--shadow: 4px 4px 0 rgba(0, 0, 0, .8);
			--edge-pad-l: max(3px, env(safe-area-inset-left));
			--edge-pad-r: max(3px, env(safe-area-inset-right));
			--subtitle-h: 88px;
			--controls-clearance: 58px;

			--bar-h: 36px;
			--topbar-pad-x: 4px;
			--topbar-pad-top: 18px;
			--sidebar-clearance: 58px;
			--timer-panel-w: 470px;
			--slides-fit-w: calc(100vw - var(--edge-pad-l) - var(--edge-pad-r));
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			color: var(--ink);
			font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
			background: url('../../assets/Machu_Picchu.jpg') center/cover no-repeat fixed;
		}

		.material-symbols-outlined {
			color: #000;
			display: block;
			font-size: 20px;
			line-height: 1;
			font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
		}

		/* Layout: top progress, middle slides, floating controls */
		.app {
			height: 100svh;
			display: grid;
			grid-template-rows: auto 1fr;
			position: relative;
			overflow: hidden;
		}

		/* ---------- Top progress bar ---------- */
		.topbar {
			padding:
				var(--topbar-pad-top) var(--edge-pad-r) 2px var(--edge-pad-l);
		}

		.progress-wrap {
			position: relative;
			height: 126px;
			/* room for staggered labels */
			width: 100%;
			max-width: none;
			margin-inline: auto;
		}

		/* Track */
		.progress-track {
			position: absolute;
			left: 0;
			right: 0;
			top: 50%;
			transform: translateY(-50%);
			height: var(--bar-h);
			border-radius: 0;
			/* Soft square */
			background: #151515;
			border: 2px solid #000;
			box-shadow: none;
			overflow: hidden;
		}

		/* Fill */
		.progress-fill {
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			width: 0%;
			background: var(--green);
			border-radius: 0;
			/* Match track */
			transition: width .25s linear;
			z-index: 2;
			box-shadow: none;
		}

		/* No more caps */
		.progress-fill::before,
		.progress-fill::after {
			display: none;
		}

		/* Checkpoints */
		.checklayer {
			position: absolute;
			inset: 0;
			pointer-events: none;
			z-index: 10;
		}

		.cp {
			position: absolute;
			top: 50%;
			transform: translate(-50%, -50%);
		}

		/* No offsets for first/last - pixel perfect math */
		.cp.first {
			transform: translate(-50%, -50%);
		}

		.cp.last {
			transform: translate(-50%, -50%);
		}

		.cp-dot {
			width: 2px;
			height: 36px;
			/* Taller than bar for tick mark effect */
			background: #4b5563;
			transition: background .25s ease, transform .3s ease, box-shadow .25s ease;
			border-radius: 1px;
		}

		.cp.completed .cp-dot {
			background: #fff;
			box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
			transform: scaleY(1.1);
		}

		.cp-label {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			white-space: nowrap;
			font-weight: 900;
			font-size: 2.35rem;
			line-height: 1;
			/* Slightly smaller for cleaner look */
			color: #9ca3af;
			opacity: .9;
			background: #111;
			border: 2px solid #000;
			border-radius: 0;
			/* Square-ish */
			padding: 3px 10px;
			pointer-events: auto;
			transition: color .2s, border-color .2s, opacity .2s;
		}

		.cp-label.top {
			bottom: calc(100% + 6px);
			/* More spacing for ticks */
		}

		.cp-label.bottom {
			top: calc(100% + 2px);
		}

		.cp-label.active {
			color: #ffffff;
			border-color: rgba(255, 255, 255, .3);
			opacity: 1;
		}

		.cp-label.completed {
			color: var(--green);
			border-color: rgba(54, 194, 105, .3);
		}

		.cp.first .cp-label {
			transform: none;
			left: 0;
		}

		.cp.last .cp-label {
			transform: translateX(-100%);
			left: 100%;
		}

		/* Slides */
		.slides-area {
			min-height: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 4px;
			padding: 2px var(--edge-pad-r) 3px max(var(--edge-pad-l), var(--sidebar-clearance));
			overflow: hidden;
			transition: padding-left .22s ease;
		}

		.app.timer-panel-open {
			--slides-fit-w: calc(100vw - var(--timer-panel-w) - var(--edge-pad-l) - var(--edge-pad-r));
		}

		.app.timer-panel-open .slides-area {
			padding-left: calc(var(--timer-panel-w) + max(var(--edge-pad-l), var(--sidebar-clearance)));
		}

		.slides-frame {
			aspect-ratio: 16 / 9;
			height: min(100%, calc(var(--slides-fit-w) * 9 / 16));
			width: auto;
			max-width: 100%;
			border: 0;
			border-radius: 0;
			box-shadow: var(--shadow);
			background: rgba(0, 0, 0, .15);
			transition: height .22s ease;
		}

		.file-slide-viewer {
			position: relative;
			aspect-ratio: 16 / 9;
			height: min(100%, calc(var(--slides-fit-w) * 9 / 16));
			width: auto;
			max-width: 100%;
			border: 0;
			border-radius: 0;
			box-shadow: var(--shadow);
			background: #fff;
			color: #000;
			overflow: hidden;
			transition: height .22s ease;
		}

		.file-slide-viewer[hidden] {
			display: none;
		}

		.slides-area.subtitles-live .slides-frame {
			height: min(calc(100% - var(--subtitle-h) - var(--controls-clearance) - 4px), calc(var(--slides-fit-w) * 9 / 16));
		}

		.slides-area.subtitles-live .file-slide-viewer {
			height: min(calc(100% - var(--subtitle-h) - var(--controls-clearance) - 4px), calc(var(--slides-fit-w) * 9 / 16));
		}

		.slides-area.translator-mode {
			justify-content: flex-start;
		}

		.slides-area.translator-mode .slides-frame,
		.slides-area.translator-mode .file-slide-viewer {
			height: 0;
			opacity: 0;
			pointer-events: none;
		}

		.file-slide {
			position: absolute;
			inset: 0;
			overflow: hidden;
			background: #fff;
		}

		.file-slide canvas,
		.file-slide img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: block;
		}

		.file-slide-message {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			text-align: center;
			font: 900 28px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
			color: #111;
		}

		.file-slide-nav {
			position: absolute;
			bottom: 8px;
			left: 8px;
			display: flex;
			align-items: center;
			gap: 6px;
			z-index: 4;
		}

		.file-slide-nav button {
			width: 34px;
			height: 34px;
			display: grid;
			place-items: center;
			border: 2px solid #000;
			background: #fff;
			color: #000;
			padding: 0;
			cursor: pointer;
		}

		.subtitle-bar {
			width: calc(100% - var(--sidebar-clearance));
			height: 0;
			opacity: 0;
			overflow: hidden;
			display: flex;
			position: relative;
			align-items: center;
			justify-content: center;
			background: #050505;
			color: #fff;
			border: 3px solid #000;
			box-shadow: var(--shadow);
			transition: height .22s ease, opacity .15s ease;
		}

		.slides-area.subtitles-live .subtitle-bar {
			height: var(--subtitle-h);
			margin-bottom: var(--controls-clearance);
			opacity: 1;
		}

		.slides-area.translator-mode .subtitle-bar {
			align-items: flex-start;
			justify-content: flex-start;
			flex-direction: column;
			width: 100%;
			height: calc(100% - var(--controls-clearance));
			margin-bottom: var(--controls-clearance);
			padding-top: 26px;
		}

		.subtitle-text {
			width: 100%;
			padding: 6px 14px 8px;
			white-space: nowrap;
			overflow: hidden;
			text-align: center;
			font-weight: 900;
			line-height: 1.18;
			color: #fff;
			font-size: 56px;
		}

		.slides-area.translator-mode .subtitle-text {
			display: none;
		}

		.translator-stage {
			position: relative;
			width: 100%;
			flex: 1 1 auto;
			min-height: 0;
			display: none;
			overflow: hidden;
			pointer-events: auto;
		}

		.slides-area.translator-mode .translator-stage {
			display: block;
		}

		.translator-source {
			position: absolute;
			top: 16px;
			left: 0;
			right: 0;
			display: flex;
			justify-content: center;
			gap: 14px;
			flex-wrap: wrap;
			padding: 0 28px;
			z-index: 2;
		}

		.translator-word {
			background: transparent;
			border: 0;
			color: #fff;
			font-size: clamp(42px, 5vw, 82px);
			font-weight: 900;
			line-height: 1;
			padding: 0 2px;
			pointer-events: none;
		}

		.translator-word.grouped {
			color: #ffeb3b;
		}

		.translator-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 7;
			cursor: crosshair;
			pointer-events: auto;
			touch-action: none;
			display: block;
		}

		.translator-lines {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 1;
		}

		.translator-lines line {
			stroke: #fff;
			stroke-width: 6;
			stroke-linecap: round;
		}

		.translator-callouts {
			position: absolute;
			inset: 0;
			z-index: 6;
			pointer-events: none;
		}

		.translation-callout {
			position: absolute;
			color: #fff;
			font-size: clamp(30px, 3.2vw, 52px);
			font-weight: 900;
			line-height: 1.05;
			max-width: min(680px, 80vw);
			text-align: center;
			transform: translateX(-50%);
			pointer-events: none;
		}

		.translation-callout .translation-main {
			white-space: nowrap;
		}

		.translator-panel {
			display: none;
			align-items: center;
			justify-content: center;
			gap: 10px;
			width: 100%;
			min-height: 58px;
			padding: 8px 12px;
			background: #111;
			border-top: 3px solid #000;
			z-index: 4;
		}

		.slides-area.translator-mode .translator-panel {
			display: flex;
		}

		.translator-panel-btn {
			width: 42px;
			height: 42px;
			display: inline-grid;
			place-items: center;
			background: #ffeb3b;
			color: #000;
			border: 2px solid #000;
			border-radius: 0;
			padding: 0;
			font-weight: 900;
			cursor: pointer;
		}

		.translator-panel-btn:not(.active) {
			background: #fff;
		}

		.translator-panel-btn .material-symbols-outlined {
			color: #000;
		}

		.translator-nav {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			width: 44px;
			height: 72px;
			display: none;
			place-items: center;
			background: #fff;
			border: 3px solid #000;
			z-index: 8;
			cursor: pointer;
		}

		.slides-area.translator-mode .translator-nav {
			display: grid;
		}

		.translator-nav.prev {
			left: 8px;
		}

		.translator-nav.next {
			right: 8px;
		}

		.translator-nav:disabled {
			opacity: .3;
			cursor: not-allowed;
		}

		.translation-orb {
			position: absolute;
			width: 42px;
			height: 42px;
			border-radius: 50%;
			background: #ffeb3b;
			border: 3px solid #fff;
			box-shadow: 0 0 22px rgba(255, 235, 59, .85);
			transform: translate(-50%, -50%);
			z-index: 6;
			pointer-events: none;
		}

		.subtitle-btn.active {
			background: var(--green);
			color: #000;
		}

		.subtitle-btn.listening {
			background: #ffeb3b;
			color: #000;
		}

		.translator-btn:disabled {
			background: #777;
			color: #222;
			border-color: #333;
			cursor: not-allowed;
			opacity: .65;
		}

		.translator-btn.active {
			background: #ffeb3b;
			color: #000;
		}

		/* Controls */
		.controls {
			position: fixed;
			bottom: 4px;
			left: 50%;
			transform: translateX(-50%) scale(calc(1 / var(--zoom)));
			transform-origin: center;

			display: flex;
			align-items: center;
			/* ⬅ make all children vertically centered */
			gap: 6px;
			font-size: 14px;
			pointer-events: none;
			z-index: 9999;
			flex-wrap: nowrap;
			/* ⬅ never wrap onto multiple lines */
		}

		.btn,
		.btn,
		.btn-accent {
			pointer-events: auto;
			background: #ffffff;
			color: #000;
			border: 2px solid #000;
			border-radius: 0;
			padding: 8px 9px;
			font-weight: 800;
			font-size: 14px;
			line-height: 1;
			cursor: pointer;
			transition: none;

			/* 👇 NEW: never wrap the button text */
			white-space: nowrap;
		}

		.btn:hover,
		.btn-accent:hover {
			background: #e7e7e7;
			color: #000;
		}

		/* NEW: Bell button */
		.btn-bell {
			pointer-events: auto;
			background: #ffffff;
			color: #000;
			border: 2px solid #000;
			border-radius: 0;
			padding: 7px;
			font-weight: 700;
			font-size: 16px;
			line-height: 1;
			cursor: pointer;
			white-space: nowrap;
		}

		.btn-bell:hover {
			background: #e7e7e7;
			color: #000;
		}

		/* Button Groups */
		.btn-group {
			display: inline-flex;
			align-items: center;
			background: #ffffff;
			border-radius: 0;
			border: 2px solid #000;
			padding: 2px;
			gap: 2px;
			pointer-events: auto;

			/* 👇 NEW: don’t let the whole pill shrink */
			flex: 0 0 auto;
		}

		.btn-group .btn {
			border-radius: 0;
			border: 0;
			background: transparent;
			padding: 6px 10px;

			/* 👇 NEW: don’t let individual buttons collapse */
			flex: 0 0 auto;
		}

		.btn-group .btn:hover {
			background: #f0f0f0;
		}

		/* Pause Button */
		#pauseBtn {
			min-width: 80px;
		}

		#pauseBtn.timing {
			background: var(--green);
			color: #fff;
		}

		.vol {
			pointer-events: auto;
			appearance: none;
			height: 20px;
			/* ⬅ a bit taller so it matches button height visually */
			width: 160px;
			border-radius: 0;
			background: #111;
			border: 2px solid #000;
			outline: none;
			flex: 0 0 auto;
			/* ⬅ don’t let flexbox squish it */
			white-space: nowrap;
			/* ⬅ text in buttons stays on one line */
		}

		.vol::-webkit-slider-thumb {
			appearance: none;
			width: 18px;
			height: 18px;
			border-radius: 0;
			background: white;
			border: 2px solid #000;
			cursor: pointer;
		}

		/* Config Overlay */
		.overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, .72);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 4px;
			z-index: 20000;
			overflow: hidden;
		}

		.overlay.show {
			display: flex;
		}

		.cfg {
			width: min(100%, 980px);
			max-height: calc(100svh - 8px);
			overflow-y: auto;
			overscroll-behavior: contain;
			background: var(--panel);
			border: 3px solid #000;
			border-radius: 0;
			box-shadow: var(--shadow);
			padding: 10px;
			display: grid;
			gap: 10px;
		}

		.cfg .field {
			display: grid;
			gap: 8px;
		}

		.cfg label {
			font-size: .95rem;
			color: var(--muted);
			font-weight: 700;
		}

		.rows {
			display: grid;
			gap: 6px;
			max-height: none;
			overflow: visible;
			padding-right: 4px;
		}

		#schedRows {
			max-height: none !important;
		}

		.row {
			display: grid;
			grid-template-columns: 40px 1fr 100px 40px;
			gap: 6px;
			align-items: center;
		}

		.preset-schedule {
			display: grid;
			gap: 8px;
			padding: 10px;
			border: 2px solid #2a3445;
			background: #0f141e;
		}

		.check-row,
		.radio-row {
			display: flex;
			align-items: center;
			gap: 8px;
			color: var(--ink);
			font-weight: 800;
		}

		.check-row input,
		.radio-row input {
			width: 18px;
			height: 18px;
			accent-color: var(--green);
			flex: 0 0 auto;
		}

		.lunch-choice {
			display: flex;
			gap: 14px;
			flex-wrap: wrap;
			padding-left: 26px;
		}

		.preset-note {
			color: var(--muted);
			font-size: .9rem;
			line-height: 1.35;
			padding-left: 26px;
		}

		input[type="text"],
		input[type="url"],
		input[type="number"],
		input[type="time"],
		input[type="file"],
		select {
			width: 100%;
			background: #0f141e;
			color: var(--ink);
			border: 1px solid #2a3445;
			border-radius: 0;
			padding: 10px;
			font-size: 15px;
			outline: none;
		}

		input:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(54, 194, 105, .12);
		}

		.sound-select {
			width: 100%;
			background: #0f141e;
			color: var(--ink);
			border: 1px solid #2a3445;
			border-radius: 0;
			padding: 10px;
			font-size: 15px;
			outline: none;
		}

		.sound-select:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(54, 194, 105, .12);
		}

		.add-btn {
			padding: 10px 14px;
			border-radius: 0;
			border: 2px solid #2a3445;
			background: #0f141e;
			color: var(--ink);
			cursor: pointer;
		}

		.cfg-actions {
			display: flex;
			gap: 10px;
			justify-content: flex-end;
		}

		.primary {
			background: #193524;
			border: 2px solid rgba(54, 194, 105, .7);
			color: var(--ink);
			border-radius: 0;
			padding: 12px 18px;
			font-weight: 800;
			cursor: pointer;
		}

		.ghost {
			background: transparent;
			border: 1px solid #2a3445;
			color: var(--ink);
			border-radius: 0;
			padding: 12px 18px;
			cursor: pointer;
		}

		.keybind-row {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.keybind-btn {
			min-width: 120px;
			padding: 10px 14px;
			border-radius: 0;
			border: 2px solid #000;
			background: #fff;
			color: #000;
			font-weight: 900;
			cursor: pointer;
		}

		.keybind-btn.listening {
			background: #ffeb3b;
		}

		.total-time {
			font-size: 1.1rem;
			font-weight: 800;
			color: var(--green);
			text-align: right;
			padding: 10px 0;
			border-top: 1px solid rgba(255, 255, 255, .1);
			margin-top: 10px;
		}

		.move-btns {
			display: flex;
			flex-direction: column;
			gap: 3px;
		}

		.move-btn {
			background: #fff;
			border: 2px solid #000;
			color: #000;
			cursor: pointer;
			padding: 1px;
			line-height: 1;
		}

		.move-btn:hover {
			background: #e7e7e7;
		}

		.icon-btn {
			width: 40px;
			height: 40px;
			display: inline-grid;
			place-items: center;
			background: #fff;
			border: 2px solid #000;
			border-radius: 0;
			cursor: pointer;
			padding: 0;
		}

		.icon-btn:hover {
			background: #e7e7e7;
		}

		.page-tool-stack {
			position: fixed;
			left: 4px;
			bottom: 4px;
			display: grid;
			gap: 6px;
			z-index: 9999;
		}

		.page-tool-toggle {
			width: 40px;
			height: 40px;
			display: grid;
			place-items: center;
			background: transparent;
			color: #fff;
			border: 0;
			border-radius: 0;
			padding: 0;
			cursor: pointer;
		}

		.page-tool-toggle:hover {
			color: #e7e7e7;
		}

		.page-tool-toggle:disabled {
			color: rgba(255, 255, 255, .35);
			cursor: not-allowed;
		}

		.page-tool-toggle.active {
			color: #ffeb3b;
		}

		.page-tool-toggle.translator-btn,
		.page-tool-toggle.translator-btn:disabled,
		.page-tool-toggle.translator-btn.active {
			background: transparent;
			border: 0;
			opacity: 1;
		}

		.page-tool-toggle .material-symbols-outlined {
			color: currentColor;
			font-size: 40px;
		}

		.slide-timer-panel {
			position: fixed;
			left: 5px;
			top: 50%;
			transform: translateY(-50%);
			width: calc(var(--timer-panel-w) + var(--sidebar-clearance) - 10px);
			display: none;
			justify-items: center;
			align-items: center;
			gap: 16px;
			padding: 24px 5px;
			background: #2c3141;
			color: #fff;
			border-radius: 18px;
			box-shadow: 0 18px 48px rgba(0, 0, 0, .38);
			z-index: 9998;
		}

		.app.timer-panel-open~.slide-timer-panel {
			display: grid;
		}

		.slide-timer-ring {
			position: relative;
			width: calc(100% - 10px);
			aspect-ratio: 1;
			display: grid;
			place-items: center;
		}

		.slide-timer-ring svg {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			transform: rotate(-90deg);
		}

		.slide-timer-ring circle {
			fill: none;
			stroke-width: 10;
		}

		.slide-timer-track {
			stroke: rgba(255, 255, 255, .16);
		}

		.slide-timer-progress {
			stroke: #3b82f6;
			stroke-linecap: round;
			transition: stroke-dashoffset .2s linear;
		}

		.slide-timer-time {
			width: calc(100% - 10px);
			background: transparent;
			border: 0;
			border-bottom: 2px solid rgba(255, 255, 255, .18);
			padding: 0 0 12px;
			text-align: center;
			font: inherit;
			font-size: 58px;
			font-weight: 800;
			line-height: 1;
			color: #fff;
			outline: none;
		}

		.slide-timer-time:focus {
			border-bottom-color: #3b82f6;
		}

		.slide-timer-minutes {
			display: none;
		}

		.slide-timer-start {
			width: 160px;
			height: 42px;
			border: 0;
			border-radius: 22px;
			background: #3b82f6;
			color: #fff;
			font-weight: 900;
			font-size: 16px;
			cursor: pointer;
			justify-self: center;
		}

		.slide-timer-start:hover {
			background: #2563eb;
		}

		.slide-timer-actions {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			width: calc(100% - 10px);
		}

		.slide-timer-adjust {
			width: 100%;
			min-width: 0;
			height: 38px;
			border: 0;
			border-radius: 20px;
			background: #3b4054;
			color: #fff;
			font-weight: 800;
			font-size: 14px;
			cursor: pointer;
		}

		.slide-timer-adjust:hover {
			background: #4a5068;
		}

		.desk-overlay {
			position: fixed;
			inset: 0;
			display: block;
			visibility: hidden;
			pointer-events: none;
			opacity: 0;
			background-color: var(--panel);
			z-index: 22000;
			overflow: hidden;
		}

		.desk-overlay.show {
			visibility: visible;
			pointer-events: auto;
			opacity: 1;
		}

		.desk-wrap {
			width: 100vw;
			height: 100svh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.desk-svg {
			width: 100vw;
			height: 100svh;
			border: 0;
			display: block;
		}

		.desk-svg svg {
			width: 100%;
			height: 100%;
			display: block;
		}

		.desk-file-wrap {
			position: fixed;
			top: 10px;
			left: 10px;
			z-index: 22002;
			background: rgba(255, 255, 255, .72);
			backdrop-filter: blur(6px);
			border: 1px solid rgba(0, 0, 0, .10);
			border-radius: 8px;
			padding: 6px 8px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, .10);
		}

		.desk-file {
			font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
			color: #111827;
		}

		.desk-action {
			position: fixed;
			width: 48px;
			height: 48px;
			display: grid;
			place-items: center;
			background: #fff;
			color: #000;
			border: 2px solid #000;
			border-radius: 0;
			padding: 0;
			cursor: pointer;
			z-index: 22002;
		}

		.desk-action:hover {
			background: #e7e7e7;
		}

		.desk-action .material-symbols-outlined {
			color: currentColor;
			font-size: 30px;
		}

		.desk-close {
			left: 12px;
			bottom: 12px;
		}

		.desk-spin {
			left: 68px;
			bottom: 12px;
		}

		@media (max-width: 640px) {
			.progress-wrap {
				height: 118px;
			}

			.cp-label {
				font-size: 1.75rem;
				padding: 3px 8px;
			}

			.vol {
				width: 120px;
			}

			.slides-frame {
				height: min(100%, calc(var(--slides-fit-w) * 9 / 16));
			}

			.file-slide-viewer {
				height: min(100%, calc(var(--slides-fit-w) * 9 / 16));
			}

			.slides-area.subtitles-live .slides-frame {
				height: min(calc(100% - var(--subtitle-h) - var(--controls-clearance) - 4px), calc(var(--slides-fit-w) * 9 / 16));
			}

			.slides-area.subtitles-live .file-slide-viewer {
				height: min(calc(100% - var(--subtitle-h) - var(--controls-clearance) - 4px), calc(var(--slides-fit-w) * 9 / 16));
			}

			.slides-area.translator-mode .slides-frame,
			.slides-area.translator-mode .file-slide-viewer {
				height: 0;
			}
		}
	</style>
</head>

<body>
	<div class="app">
		<!-- Top progress bar -->
		<div class="topbar">
			<div class="progress-wrap">
				<div class="progress-track">
					<div class="progress-fill" id="progressFill"></div>
				</div>
				<div class="checklayer" id="checkLayer" aria-hidden="true"></div>
			</div>
		</div>

		<!-- Slides area -->
		<div class="slides-area">
			<iframe class="slides-frame" id="slidesFrame" loading="lazy"
				allow="autoplay; fullscreen; clipboard-write; encrypted-media; picture-in-picture; screen-wake-lock"
				sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-downloads"
				src="">
			</iframe>
			<div class="file-slide-viewer" id="fileSlideViewer" hidden>
				<div class="file-slide" id="fileSlide"></div>
				<div class="file-slide-nav" id="fileSlideNav" hidden>
					<button id="fileSlidePrev" type="button" aria-label="Previous slide">
						<span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
					</button>
					<button id="fileSlideNext" type="button" aria-label="Next slide">
						<span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
					</button>
				</div>
			</div>
			<div class="subtitle-bar" aria-live="polite">
				<div class="subtitle-text" id="subtitleText"></div>
				<div class="translator-stage" id="translatorStage">
					<svg class="translator-lines" id="translatorLines" aria-hidden="true"></svg>
					<div class="translator-source" id="translatorSource"></div>
					<div class="translator-callouts" id="translatorCallouts"></div>
					<canvas class="translator-canvas" id="translatorCanvas" aria-label="Draw around subtitle words"></canvas>
					<button class="translator-nav prev" id="translatorPrev" type="button" aria-label="Previous translation page">
						<span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
					</button>
					<button class="translator-nav next" id="translatorNext" type="button" aria-label="Next translation page">
						<span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
					</button>
				</div>
				<div class="translator-panel" id="translatorPanel">
					<button class="translator-panel-btn active" id="toolDraw" type="button" aria-label="Draw">
						<span class="material-symbols-outlined" aria-hidden="true">edit</span>
					</button>
					<button class="translator-panel-btn" id="toolMagic" type="button" aria-label="Magic translate">
						<span class="material-symbols-outlined" aria-hidden="true">auto_fix_high</span>
					</button>
					<button class="translator-panel-btn" id="toolErase" type="button" aria-label="Erase">
						<span class="material-symbols-outlined" aria-hidden="true">ink_eraser</span>
					</button>
				</div>
			</div>
		</div>

		<!-- Controls -->
		<div class="controls">
			<button class="btn" id="restartBtn">Restart</button>

			<div class="btn-group">
				<button class="btn" id="backBtn">-1m</button>
				<button class="btn" id="fwdBtn">+1m</button>
			</div>

			<button class="btn" id="pauseBtn">Pause</button>

			<button class="btn btn-accent" id="toggleBtn">Start</button>

			<button class="btn subtitle-btn" id="englishSubBtn" title="English captions">CC EN</button>
			<button class="btn subtitle-btn" id="spanishSubBtn" title="Spanish captions">CC ES</button>
			<button class="btn subtitle-btn" id="translateEnEsBtn" title="Translate English to Spanish">EN→ES</button>
			<button class="btn subtitle-btn" id="translateEsEnBtn" title="Translate Spanish to English">ES→EN</button>
			<input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.6" title="Volume" />
		</div>
	</div>

	<div class="page-tool-stack" aria-label="Page tools">
		<button class="page-tool-toggle" id="slideTimerToggle" type="button" title="Slide timer" aria-label="Slide timer">
			<span class="material-symbols-outlined" aria-hidden="true">timer</span>
		</button>
		<button class="page-tool-toggle translator-btn" id="translatorBtn" type="button" title="Open whiteboard" aria-label="Open whiteboard" disabled>
			<span class="material-symbols-outlined" aria-hidden="true">draw</span>
		</button>
		<button class="page-tool-toggle" id="bellBtn" type="button" title="Play bell" aria-label="Play bell">
			<span class="material-symbols-outlined" aria-hidden="true">notifications</span>
		</button>
		<button class="page-tool-toggle" id="deskPageToggle" type="button" title="Random desk selector" aria-label="Random desk selector">
			<span class="material-symbols-outlined" aria-hidden="true">casino</span>
		</button>
		<button class="page-tool-toggle" id="fullscreenToggle" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">
			<span class="material-symbols-outlined" id="fullscreenToggleIcon" aria-hidden="true">fullscreen</span>
		</button>
	</div>

	<div class="slide-timer-panel" id="slideTimerPanel" aria-live="polite">
		<div class="slide-timer-ring" aria-label="Slide timer countdown">
			<svg viewBox="0 0 120 120" aria-hidden="true">
				<circle class="slide-timer-track" cx="60" cy="60" r="52"></circle>
				<circle class="slide-timer-progress" id="slideTimerProgress" cx="60" cy="60" r="52"></circle>
			</svg>
		</div>
		<input class="slide-timer-time" id="slideTimerTime" type="text" value="5:00" inputmode="numeric" aria-label="Timer duration" />
		<div class="slide-timer-minutes" id="slideTimerMinutes" hidden>5 min left</div>
		<button class="slide-timer-start" id="slideTimerStartStop" type="button">Start</button>
		<div class="slide-timer-actions">
			<button class="slide-timer-adjust" type="button" data-timer-delta="-30">-0:30</button>
			<button class="slide-timer-adjust" type="button" data-timer-delta="30">+0:30</button>
			<button class="slide-timer-adjust" type="button" data-timer-delta="60">+1:00</button>
			<button class="slide-timer-adjust" type="button" data-timer-delta="-60">-1:00</button>
			<button class="slide-timer-adjust" type="button" data-timer-delta="300">+5:00</button>
			<button class="slide-timer-adjust" type="button" data-timer-delta="-300">-5:00</button>
		</div>
	</div>

	<!-- Config overlay -->
	<div class="overlay" id="overlay">
		<div class="cfg">
			<div class="field">
				<label for="slidesUrl">Slides URL (embed link)</label>
				<input type="url" id="slidesUrl" placeholder="https://…/embed?…" />
			</div>

			<div class="field">
				<label for="slideFiles">PDF or slide images</label>
				<input type="file" id="slideFiles" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.webp,.gif" multiple />
			</div>

			<div class="field">
				<label for="timerSoundSelect">Timer Sound</label>
				<select class="sound-select" id="timerSoundSelect">
					<option value="nfl">nfl.mp3</option>
					<option value="cave">cave.mp3</option>
					<option value="amongus">amongus.mp3</option>
					<option value="custom">Custom Upload…</option>
				</select>
				<input type="file" id="timerSoundFile" accept="audio/*" />
			</div>

			<div class="rows" id="rows"></div>

			<div class="total-time" id="totalTimeDisplay">Total: 0m</div>

			<div style="display:flex; align-items:center; justify-content:space-between;">
				<button class="add-btn" id="addRow">+ Add section</button>
				<div style="color:var(--muted); font-size:.9rem;">Minutes can be decimals (e.g., 7.5)</div>
			</div>

			<hr style="border:0; border-top:1px solid rgba(255,255,255,.1); margin:0; width:100%;">

			<div class="field preset-schedule">
				<label class="check-row" for="presetScheduleEnabled">
					<input type="checkbox" id="presetScheduleEnabled" />
					Use preset block schedule
				</label>
				<div class="lunch-choice" id="lunchChoice">
					<label class="radio-row" for="lunchA">
						<input type="radio" name="presetLunch" id="lunchA" value="A" />
						A Lunch
					</label>
					<label class="radio-row" for="lunchB">
						<input type="radio" name="presetLunch" id="lunchB" value="B" />
						B Lunch
					</label>
				</div>
				<div class="preset-note">
					Restarts at 8:00, 9:29, 10:08, 4th block, and 1:33. A Lunch starts 4th block at 12:04. B Lunch pauses from 12:04 to 12:36.
				</div>
			</div>

			<div class="field">
				<label>Schedule (Auto-Start/Pause)</label>
				<div class="rows" id="schedRows" style="max-height: 160px;"></div>
				<button class="add-btn" id="addSchedRow" style="width:fit-content;">+ Add Trigger</button>
			</div>

			<div class="field">
				<label>Caption mic toggle key</label>
				<div class="keybind-row">
					<button class="keybind-btn" id="pushToTalkKeyBtn" type="button">F13</button>
					<div style="color:var(--muted); font-size:.9rem;">Press once to open CC mic, press again to close</div>
				</div>
				<div class="keybind-row">
					<button class="keybind-btn" id="translatorKeyBtn" type="button">F14</button>
					<div style="color:var(--muted); font-size:.9rem;">Open/close translator canvas</div>
				</div>
				<div class="keybind-row">
					<button class="keybind-btn" id="chimeKeyBtn" type="button">F15</button>
					<div style="color:var(--muted); font-size:.9rem;">Play chime sound</div>
				</div>
				<div class="keybind-row">
					<button class="keybind-btn" id="deskKeyBtn" type="button">F16</button>
					<div style="color:var(--muted); font-size:.9rem;">Open random desk selector</div>
				</div>
			</div>

			<div class="cfg-actions">
				<button class="ghost" id="clearAll">Clear</button>
				<button class="primary" id="startNow">Start</button>
			</div>
		</div>
	</div>

	<audio id="ding" preload="auto" src="./sounds/nfl.mp3"></audio>
	<!-- clicker sound (ArrowRight) -->
	<audio id="clickerSound" preload="auto" src="./sounds/cave.mp3"></audio>
	<!-- NEW: bell sound button audio (always cave) -->
	<audio id="bellSound" preload="auto" src="./sounds/cave.mp3"></audio>

	<div class="desk-overlay" id="deskOverlay" aria-modal="true" role="dialog" tabindex="-1">
		<div class="desk-file-wrap" title="Choose a different SVG seating chart">
			<input class="desk-file" id="deskFilePick" type="file" accept=".svg,image/svg+xml" />
		</div>
		<button class="desk-action desk-close" id="deskCloseBtn" type="button" title="Close" aria-label="Close random desk selector">
			<span class="material-symbols-outlined" aria-hidden="true">close</span>
		</button>
		<button class="desk-action desk-spin" id="deskSpinBtn" type="button" title="Pick desk" aria-label="Pick random desk">
			<span class="material-symbols-outlined" aria-hidden="true">casino</span>
		</button>
		<div class="desk-wrap" id="deskWrap">
			<div class="desk-svg" id="deskSvgMount"></div>
		</div>
	</div>

	<script type="module">
		const pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
		pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

		function getZoom() {
			return window.devicePixelRatio || 1;
		}

		function updateZoomVar() {
			document.documentElement.style.setProperty('--zoom', getZoom());
		}
		window.addEventListener('resize', updateZoomVar);
		updateZoomVar();

		/* ---------- State ---------- */
		let sections = [];
		let schedule = []; // { time: "HH:MM", action: "start"|"pause" }
		let presetScheduleEnabled = false;
		let presetLunch = "B";
		let slidesURL = "";

		let timerSoundChoice = "nfl"; // "nfl" | "cave" | "amongus" | "custom"
		let customTimerSoundDataUrl = ""; // data:audio/...;base64,...
		let pushToTalkKeyCode = "F13";
		let pushToTalkKeyLabel = "F13";
		let translatorToggleKeyCode = "F14";
		let translatorToggleKeyLabel = "F14";
		let chimeKeyCode = "F15";
		let chimeKeyLabel = "F15";
		let deskPickerKeyCode = "F16";
		let deskPickerKeyLabel = "F16";
		let capturingKeybind = "";

		let running = false;
		let paused = false;
		let subtitleMode = ""; // caption-en | caption-es | translate-en-es | translate-es-en
		let subtitleListening = false;
		let translatorMode = false;
		let slideTimerOpen = false;
		let slideTimerRunning = false;
		let slideTimerTotalSeconds = 300;
		let slideTimerRemainingSeconds = 300;
		let slideTimerLastTs = 0;
		let slideTimerRafId = null;
		let subtitleRecognition = null;
		let subtitleFinalText = "";
		let liveTranslationRequestId = 0;
		let currentSubtitleText = "";
		let translatorGroups = [];
		let normalStrokes = [];
		let translatorEntries = [];
		let translatorEntryIndex = -1;
		let subtitleCaptureEntryIndex = -1;
		let activeDrawPoints = [];
		let activeDragGroup = null;
		let translatorInteraction = "";
		let translatorTool = "draw";
		let nextTranslatorGroupId = 1;
		const translationCache = new Map();
		let startTs = 0;
		let elapsedMs = 0;
		let rafId = null;

		let totalMs = 0;
		let starts = [];
		let ends = [];
		let lastChimedIndex = -1;
		const EPS = 60;

		const TIMER_SOUNDS = {
			nfl: "./sounds/nfl.mp3",
			cave: "./sounds/cave.mp3",
			amongus: "./sounds/amongus.mp3",
		};

		let fileDeck = null;
		let fileSlideIndex = 0;
		const fileDeckObjectUrls = [];

		/* ---------- Elements ---------- */
		const overlay = document.getElementById('overlay');
		const rowsEl = document.getElementById('rows');
		const schedRowsEl = document.getElementById('schedRows');
		const addRowBtn = document.getElementById('addRow');
		const addSchedRowBtn = document.getElementById('addSchedRow');
		const startNowBtn = document.getElementById('startNow');
		const clearAllBtn = document.getElementById('clearAll');
		const presetScheduleEnabledEl = document.getElementById('presetScheduleEnabled');
		const lunchChoiceEl = document.getElementById('lunchChoice');
		const lunchRadioEls = document.querySelectorAll('input[name="presetLunch"]');
		const toggleBtn = document.getElementById('toggleBtn');
		const restartBtn = document.getElementById('restartBtn');
		const backBtn = document.getElementById('backBtn');
		const fwdBtn = document.getElementById('fwdBtn');
		const pauseBtn = document.getElementById('pauseBtn');
		const englishSubBtn = document.getElementById('englishSubBtn');
		const spanishSubBtn = document.getElementById('spanishSubBtn');
		const translateEnEsBtn = document.getElementById('translateEnEsBtn');

		function clearFileDeck() {
			fileDeckObjectUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
			fileDeck = null;

		function getPdfJs() {
			return pdfjsLib;
		}

		async function loadSlideFiles(files) {
			const fileList = [...files];
			if (!fileList.length) return;
			clearFileDeck();
			showFileSlideMessage('Loading slides...');

			try {
				const slides = [];
				for (const file of fileList) {
					if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
						const pdfjsLib = getPdfJs();
						if (!pdfjsLib) throw new Error('PDF renderer not loaded.');
						const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
						for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
							slides.push({ type: 'pdf', pdf, pageNumber });
						}
					} else if (file.type.startsWith('image/')) {
						const url = URL.createObjectURL(file);
						fileDeckObjectUrls.push(url);
						slides.push({ type: 'image', url });
					}
				}

				if (!slides.length) throw new Error('No supported PDF or image slides were found.');
				fileDeck = { slides };
				fileSlideIndex = 0;
				slidesFrame.hidden = true;
				fileSlideViewer.hidden = false;
				await renderFileSlide();
			} catch (err) {
				console.warn('Slide file load failed:', err);
				showFileSlideMessage('These files could not be loaded. Use PDF files or slide images like PNG, JPG, or WebP.');
			}
		}

		async function renderFileSlide() {
			if (!fileDeck) return;
			const slide = fileDeck.slides[fileSlideIndex];
			fileSlide.innerHTML = "";

			if (slide.type === 'image') {
				const img = document.createElement('img');
				img.src = slide.url;
				fileSlide.appendChild(img);
			} else if (slide.type === 'pdf') {
				const page = await slide.pdf.getPage(slide.pageNumber);
				const viewport = page.getViewport({ scale: 2 });
				const canvas = document.createElement('canvas');
				canvas.width = viewport.width;
				canvas.height = viewport.height;
				await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
				fileSlide.appendChild(canvas);
			}

			fileSlideNav.hidden = fileDeck.slides.length <= 1;
			fileSlidePrev.disabled = fileSlideIndex <= 0;
			fileSlideNext.disabled = fileSlideIndex >= fileDeck.slides.length - 1;
		}

		function moveFileSlide(delta) {
			if (!fileDeck) return;
			fileSlideIndex = Math.max(0, Math.min(fileDeck.slides.length - 1, fileSlideIndex + delta));
			renderFileSlide();
		}

						customTimerSoundDataUrl = typeof data.customTimerSoundDataUrl === 'string' ? data.customTimerSoundDataUrl : "";

		/* ---------- Time math ---------- */
		function computeTotals() {
			totalMs = sections.reduce((sum, s) => sum + (Number(s.minutes) || 0) * 60000, 0);

			starts = [];
			ends = [];
			let acc = 0;
			for (let i = 0; i < sections.length; i++) {
				starts.push(acc);
				const len = (Number(sections[i].minutes) || 0) * 60000;
				acc += len;
				ends.push(acc);
			}
		}

		function updateTotalTime() {
			let sectionTotal = sections.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
			totalTimeDisplay.textContent = `Total: ${sectionTotal.toFixed(1)}m`;
		}

		function buildTimeline() {

			sections.forEach((s, i) => {

				dot.dataset.index = i;

				label.className = 'cp-label ' + (i % 2 === 0 ? 'top' : 'bottom');

				cp.appendChild(dot);

		/* ---------- Slide Timer ---------- */
		const slideTimerRadius = 52;
		const slideTimerCircumference = 2 * Math.PI * slideTimerRadius;
		slideTimerProgress.style.strokeDasharray = `${slideTimerCircumference}`;

		function formatTimerSeconds(seconds) {
			const safeSeconds = Math.max(0, Math.ceil(seconds));
			const mins = Math.floor(safeSeconds / 60);
			const secs = safeSeconds % 60;
			return `${mins}:${String(secs).padStart(2, "0")}`;
		}

		function parseTimerInput(value) {
			const raw = String(value || "").trim();
			if (!raw) return null;
			if (raw.includes(":")) {
				const [minsRaw, secsRaw = "0"] = raw.split(":");
				const mins = Number(minsRaw);
				const secs = Number(secsRaw);
				if (!Number.isFinite(mins) || !Number.isFinite(secs)) return null;
				return Math.max(0, Math.round(mins * 60 + secs));
			}
			const mins = Number(raw);
			if (!Number.isFinite(mins)) return null;
			return Math.max(0, Math.round(mins * 60));
		}

		function commitSlideTimerInput() {
			const parsedSeconds = parseTimerInput(slideTimerTime.value);
			if (parsedSeconds === null) {
				updateSlideTimerUI();
				return;
			}
			stopSlideTimer();
			slideTimerRemainingSeconds = parsedSeconds;
			slideTimerTotalSeconds = Math.max(1, parsedSeconds);
			updateSlideTimerUI();
		}

		function previewSlideTimerInput() {
			stopSlideTimer();
			const parsedSeconds = parseTimerInput(slideTimerTime.value);
			if (parsedSeconds === null) {
				updateSlideTimerUI();
				return;
			}
			slideTimerRemainingSeconds = parsedSeconds;
			slideTimerTotalSeconds = Math.max(1, parsedSeconds);
			updateSlideTimerUI();
		}

		function updateSlideTimerUI() {
			const remaining = Math.max(0, slideTimerRemainingSeconds);
			const total = Math.max(1, slideTimerTotalSeconds);
			const pct = Math.max(0, Math.min(1, remaining / total));
			slideTimerProgress.style.strokeDashoffset = `${slideTimerCircumference * (1 - pct)}`;
			if (document.activeElement !== slideTimerTime) {
				slideTimerTime.value = formatTimerSeconds(remaining);
			}
			const minuteText = Math.ceil(remaining / 60);
			slideTimerMinutes.textContent = `${minuteText} min left`;
			slideTimerStartStop.textContent = slideTimerRunning ? "Stop" : "Start";
			slideTimerToggle.classList.toggle('active', slideTimerOpen);
		}

		function stopSlideTimer() {
			slideTimerRunning = false;
			cancelAnimationFrame(slideTimerRafId);
			slideTimerRafId = null;
		}

		function tickSlideTimer(ts) {
			if (!slideTimerRunning) return;
			if (!slideTimerLastTs) slideTimerLastTs = ts;
			const elapsed = (ts - slideTimerLastTs) / 1000;
			slideTimerLastTs = ts;
			slideTimerRemainingSeconds = Math.max(0, slideTimerRemainingSeconds - elapsed);
			updateSlideTimerUI();
			if (slideTimerRemainingSeconds <= 0) {
				stopSlideTimer();
				return;
			}
			slideTimerRafId = requestAnimationFrame(tickSlideTimer);
		}

		function startSlideTimer() {
			if (slideTimerRemainingSeconds <= 0) {
				slideTimerRemainingSeconds = 300;
				slideTimerTotalSeconds = 300;
			}
			slideTimerRunning = true;
			slideTimerLastTs = 0;
			cancelAnimationFrame(slideTimerRafId);
			slideTimerRafId = requestAnimationFrame(tickSlideTimer);
		}

		function setSlideTimerOpen(open) {
			if (translatorMode && open) return;
			slideTimerOpen = open;
			document.querySelector('.app').classList.toggle('timer-panel-open', slideTimerOpen);
			if (!slideTimerOpen) stopSlideTimer();
			updateSlideTimerUI();
		}

		function adjustSlideTimer(deltaSeconds) {
			const nextRemaining = Math.max(0, slideTimerRemainingSeconds + deltaSeconds);
			const totalAdjustment = deltaSeconds > 0 ? deltaSeconds : 0;
			slideTimerRemainingSeconds = nextRemaining;
			slideTimerTotalSeconds = Math.max(1, slideTimerTotalSeconds + totalAdjustment);
			if (slideTimerRemainingSeconds > slideTimerTotalSeconds) slideTimerTotalSeconds = slideTimerRemainingSeconds;
			updateSlideTimerUI();
		}

		function updateSlideTimerAvailability() {
			const enabled = !translatorMode;
			slideTimerToggle.disabled = !enabled;
			if (!enabled) setSlideTimerOpen(false);
		}

		slideTimerToggle.addEventListener('click', () => {
			if (slideTimerToggle.disabled) return;
			setSlideTimerOpen(!slideTimerOpen);
		});

		slideTimerStartStop.addEventListener('click', () => {
			if (slideTimerRunning) stopSlideTimer();
			else startSlideTimer();
			updateSlideTimerUI();
		});

		slideTimerTime.addEventListener('focus', () => {
			stopSlideTimer();
			slideTimerTime.select();
			updateSlideTimerUI();
		});
		slideTimerTime.addEventListener('input', previewSlideTimerInput);
		slideTimerTime.addEventListener('blur', commitSlideTimerInput);
		slideTimerTime.addEventListener('keydown', event => {
			if (event.key === "Enter") {
				event.preventDefault();
				slideTimerTime.blur();
			}
		});

		slideTimerAdjustBtns.forEach(btn => {
			btn.addEventListener('click', () => adjustSlideTimer(Number(btn.dataset.timerDelta) || 0));
		});

		updateSlideTimerUI();

		function getBBoxSafe(el) {
			try { return el.getBBox(); } catch { return null; }
		}

		function isDeskFill(el) {
			const attrFill = String(el.getAttribute("fill") || "").trim().toUpperCase();
			if (attrFill === "#F5DE5B") return true;

			try {
				const fill = window.getComputedStyle(el).fill;
				const match = fill.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/i);
				if (!match) return false;
				const r = Number(match[1]).toString(16).padStart(2, "0");
				const g = Number(match[2]).toString(16).padStart(2, "0");
				const b = Number(match[3]).toString(16).padStart(2, "0");
				return `#${r}${g}${b}`.toUpperCase() === "#F5DE5B";
			} catch {
				return false;
			}
		}

		function computeDeskSpinOrder(desks, svg) {
			let frontPoint = null;
			const texts = Array.from(svg.querySelectorAll("text"));
			const frontText = texts.find(t => (t.textContent || "").trim().toLowerCase() === "front");
			if (frontText) {
				const bb = getBBoxSafe(frontText);
				if (bb) frontPoint = { x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 };
			}

			const center = desks.reduce((acc, desk) => ({ x: acc.x + desk.cx, y: acc.y + desk.cy }), { x: 0, y: 0 });
			center.x /= Math.max(1, desks.length);
			center.y /= Math.max(1, desks.length);

			const refVec = frontPoint ? { x: frontPoint.x - center.x, y: frontPoint.y - center.y } : { x: 0, y: 1 };
			const refAng = Math.atan2(refVec.y, refVec.x);

			function angleClockwiseFromRef(desk) {
				const vx = desk.cx - center.x;
				const vy = desk.cy - center.y;
				const ang = Math.atan2(vy, vx);
				let rel = refAng - ang;
				while (rel < 0) rel += Math.PI * 2;
				while (rel >= Math.PI * 2) rel -= Math.PI * 2;
				return rel;
			}

			desks.sort((a, b) => {
				const aa = angleClockwiseFromRef(a);
				const bb = angleClockwiseFromRef(b);
				if (aa !== bb) return aa - bb;
				const ra = (a.cx - center.x) ** 2 + (a.cy - center.y) ** 2;
				const rb = (b.cx - center.x) ** 2 + (b.cy - center.y) ** 2;
				return ra - rb;
			});

			return desks;
		}

		function randInt(min, maxInclusive) {
			return Math.floor(Math.random() * (maxInclusive - min + 1)) + min;
		}

		function buildDeskDelaySchedule(totalSteps, totalMs) {
			const p = 3.0;
			const base = 0.35;
			const extra = 3.2;
			let weights = new Array(totalSteps).fill(1);
			let sum = 0;

			for (let i = 0; i < totalSteps; i++) {
				const t = totalSteps <= 1 ? 1 : i / (totalSteps - 1);
				const weight = base + Math.pow(t, p) * extra;
				weights[i] = weight;
				sum += weight;
			}

			let delays = weights.map(weight => (weight / sum) * totalMs);
			let floored = delays.map(delay => Math.floor(delay));
			let used = floored.reduce((a, b) => a + b, 0);
			let remainder = totalMs - used;
			let frac = delays.map((delay, i) => ({ i, f: delay - Math.floor(delay) }));
			frac.sort((a, b) => b.f - a.f);

			for (let k = 0; k < remainder; k++) {
				floored[frac[k % frac.length].i] += 1;
			}

			for (let i = 0; i < floored.length; i++) {
				if (floored[i] < 8) floored[i] = 8;
			}

			let sum2 = floored.reduce((a, b) => a + b, 0);
			if (sum2 !== totalMs) {
				let scaled = floored.map(delay => (delay / sum2) * totalMs);
				let f2 = scaled.map(delay => Math.floor(delay));
				let used2 = f2.reduce((a, b) => a + b, 0);
				let rem2 = totalMs - used2;
				let frac2 = scaled.map((delay, i) => ({ i, f: delay - Math.floor(delay) })).sort((a, b) => b.f - a.f);
				for (let k = 0; k < rem2; k++) {
					f2[frac2[k % frac2.length].i] += 1;
				}
				floored = f2;
			}

			return floored;
		}

		function bootDeskSvg(svg) {
			deskStartSpin = () => { };
			if (!svg) {
				console.warn("No <svg> root found in the loaded desk chart.");
				return;
			}

			svg.setAttribute("tabindex", "0");
			try { svg.focus({ preventScroll: true }); } catch { }
			injectDeskSvgStyle(svg);

			const shapeSelector = "path, polygon, rect, circle, ellipse, line, polyline";
			let candidates = Array.from(svg.querySelectorAll(shapeSelector)).filter(isDeskFill);

			const seen = new Set();
			const deskEls = candidates.filter(el => seen.has(el) ? false : (seen.add(el), true));
			let allDesks = [];

			for (const el of deskEls) {
				const bb = getBBoxSafe(el);
				if (!bb || bb.width <= 0 || bb.height <= 0) continue;
				el.classList.add("desk-shape");
				allDesks.push({ el, bb, cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2 });
			}

			if (allDesks.length === 0) {
				console.warn('No desks detected in SVG. Desk shapes must use fill="#F5DE5B".');
				return;
			}

			allDesks = computeDeskSpinOrder(allDesks, svg);
			const excluded = new Set();
			let recent = [];
			let spinning = false;
			let currentIndexInActive = -1;

			function isRecent(desk) { return recent.includes(desk); }
			function getActiveDesks() { return allDesks.filter(desk => !excluded.has(desk) && !isRecent(desk)); }

			function clearHighlightClasses() {
				for (const desk of allDesks) {
					desk.el.classList.remove("desk-active");
					desk.el.classList.remove("desk-final");
				}
			}

			function refreshExcludedClass(desk) {
				if (excluded.has(desk)) desk.el.classList.add("desk-excluded");
				else desk.el.classList.remove("desk-excluded");
			}

			for (const desk of allDesks) {
				desk.el.addEventListener("click", event => {
					event.stopPropagation();
					if (spinning) return;
					if (excluded.has(desk)) excluded.delete(desk);
					else excluded.add(desk);
					refreshExcludedClass(desk);
					desk.el.classList.remove("desk-active");
					desk.el.classList.remove("desk-final");
					grabDeskFocus();
				});
				refreshExcludedClass(desk);
			}

			function setActiveDesk(activeList, idx) {
				for (const desk of allDesks) desk.el.classList.remove("desk-active");
				const desk = activeList[idx];
				if (desk) desk.el.classList.add("desk-active");
			}

			function setFinalDesk(activeList, idx) {
				clearHighlightClasses();
				const desk = activeList[idx];
				if (desk) desk.el.classList.add("desk-final");
			}

			function pushRecent(desk) {
				if (DESK_RECENT_EXCLUDE_COUNT <= 0) return;
				recent = recent.filter(item => item !== desk);
				recent.unshift(desk);
				if (recent.length > DESK_RECENT_EXCLUDE_COUNT) recent.length = DESK_RECENT_EXCLUDE_COUNT;
			}

			deskStartSpin = () => {
				if (spinning) return;
				const active = getActiveDesks();
				const n = active.length;

				if (n === 0) {
					console.warn("No selectable desks (all excluded or blocked by recent picks).");
					return;
				}

				spinning = true;
				clearHighlightClasses();

				const target = randInt(0, n - 1);
				const hopsPerDesk = 0.8;
				let totalSteps = Math.max(n + 6, Math.round(n * hopsPerDesk) + 12);
				const startIdx = currentIndexInActive < 0 || currentIndexInActive >= n ? randInt(0, n - 1) : currentIndexInActive;
				let endIdx = (startIdx + totalSteps) % n;
				let adjust = (target - endIdx + n) % n;
				totalSteps += adjust;

				const delays = buildDeskDelaySchedule(totalSteps, DESK_SPIN_DURATION_MS);
				let step = 0;
				let idx = startIdx;
				setActiveDesk(active, idx);

				function tickDesk() {
					idx = (idx + 1) % n;
					currentIndexInActive = idx;
					setActiveDesk(active, idx);

					if (step >= totalSteps - 1) {
						setFinalDesk(active, idx);
						spinning = false;
						const chosen = active[idx];
						if (chosen) pushRecent(chosen);
						return;
					}

					const delay = delays[step] || 16;
					step++;
					setTimeout(tickDesk, delay);
				}

				setTimeout(tickDesk, 10);
			};

			svg.addEventListener("pointerdown", grabDeskFocus);
			grabDeskFocus();
		}

		function loadDeskSvgText(svgText) {
			const svgDoc = new DOMParser().parseFromString(svgText, "image/svg+xml");
			const parserError = svgDoc.querySelector("parsererror");
			if (parserError) {
				console.warn("Could not parse desk SVG.", parserError.textContent);
				return;
			}
			const svg = svgDoc.querySelector("svg");
			if (!svg) {
				console.warn("No <svg> root found in the loaded desk chart.");
				return;
			}
			const importedSvg = document.importNode(svg, true);
			deskSvgMount.replaceChildren(importedSvg);
			bootDeskSvg(importedSvg);
		}

		async function loadDefaultDeskSvg() {
			try {
				const response = await fetch(DESK_DEFAULT_SVG);
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				loadDeskSvgText(await response.text());

		deskFilePick.addEventListener("change", () => {

		/* ---------- Live Subtitles ---------- */
		const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
		function normalizeTranslationText(text) {
			return text
				.toLowerCase()
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
				.replace(/[^\w\s']/g, "")
				.replace(/\s+/g, " ")
				.trim();
		}

		function getSubtitleWords() {
			return currentSubtitleText.match(/[\p{L}\p{N}']+/gu) || [];
		}

		function uniqueSortedIndexes(indexes) {
			return [...new Set(indexes)].sort((a, b) => a - b);
		}

		function getWordsForIndexes(indexes) {
			const words = getSubtitleWords();
			return uniqueSortedIndexes(indexes).map(index => words[index]).filter(Boolean).join(" ");
		}

		function getTranslationPair() {
			if (subtitleMode === "caption-es" || subtitleMode === "translate-es-en") {
				return { sourceLanguage: "es", targetLanguage: "en" };
			}
			return { sourceLanguage: "en", targetLanguage: "es" };
		}

		function isCaptionMode() {
			return subtitleMode === "caption-en" || subtitleMode === "caption-es";
		}

		function isLiveTranslateMode() {
			return subtitleMode === "translate-en-es" || subtitleMode === "translate-es-en";
		}

		function getRecognitionLanguage() {
			if (subtitleMode === "caption-es" || subtitleMode === "translate-es-en") return "es-ES";
			return "en-US";
		}

		function getCacheKey(text) {
			const { sourceLanguage, targetLanguage } = getTranslationPair();
			return `${sourceLanguage}:${targetLanguage}:${normalizeTranslationText(text)}`;
		}

		async function translateWithGoogle(text, sourceLanguage, targetLanguage) {
			const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLanguage)}&tl=${encodeURIComponent(targetLanguage)}&dt=t&q=${encodeURIComponent(text)}`;
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Google Translate ${response.status}`);
			const data = await response.json();
			return Array.isArray(data?.[0])
				? data[0].map(item => item?.[0] || "").join("").trim()
				: "";
		}

		async function translateText(text) {
			const cleanText = text.trim();
			if (!cleanText) return "";

			const cacheKey = getCacheKey(cleanText);
			if (translationCache.has(cacheKey)) return translationCache.get(cacheKey);

			const { sourceLanguage, targetLanguage } = getTranslationPair();
			let translated = "";

			try {
				translated = await translateWithGoogle(cleanText, sourceLanguage, targetLanguage);
			} catch (err) {
				console.warn('Google translation failed:', err);
			}

			const result = translated || cleanText;
			translationCache.set(cacheKey, result);
			return result;
		}

		function clonePoints(points) {
			return points.map(point => ({ x: point.x, y: point.y }));
		}

		function cloneGroup(group) {
			return {
				...group,
				indexes: [...group.indexes],
				path: clonePoints(group.path || []),
				callout: group.callout ? { ...group.callout } : null,
				orb: null
			};
		}

		function makeTranslatorEntry(text = currentSubtitleText) {
			return { text, groups: [], strokes: [] };
		}

		function saveCurrentTranslatorEntry() {
			if (translatorEntryIndex < 0) return;
			const entry = translatorEntries[translatorEntryIndex];
			if (!entry) return;
			entry.text = currentSubtitleText;
			entry.groups = translatorGroups.map(cloneGroup);
			entry.strokes = normalStrokes.map(clonePoints);
		}

		function loadTranslatorEntry(index) {
			if (index < 0 || index >= translatorEntries.length) return;
			saveCurrentTranslatorEntry();
			translatorEntryIndex = index;
			const entry = translatorEntries[translatorEntryIndex];
			currentSubtitleText = entry.text || "";
			subtitleText.textContent = currentSubtitleText;
			translatorGroups = (entry.groups || []).map(cloneGroup);
			normalStrokes = (entry.strokes || []).map(clonePoints);
			renderTranslatorView();
		}

		function createTranslatorEntryAtEnd(text = currentSubtitleText) {
			saveCurrentTranslatorEntry();
			const entry = makeTranslatorEntry(text);
			translatorEntries.push(entry);
			translatorEntryIndex = translatorEntries.length - 1;
			subtitleCaptureEntryIndex = translatorEntryIndex;
			currentSubtitleText = text;
			translatorGroups = [];
			normalStrokes = [];
			return entry;
		}

		function startFreshTranslatorSpeechEntry() {
			createTranslatorEntryAtEnd("");
			subtitleText.textContent = "";
			if (translatorMode) renderTranslatorView();
		}

		function ensureTranslatorEntryForSpeech(text) {
			if (subtitleCaptureEntryIndex < 0) {
				createTranslatorEntryAtEnd(text);
			} else {
				translatorEntryIndex = subtitleCaptureEntryIndex;
				const entry = translatorEntries[translatorEntryIndex];
				entry.text = text;
				currentSubtitleText = text;
				if (translatorMode) {
					translatorGroups = (entry.groups || []).map(cloneGroup);
					normalStrokes = (entry.strokes || []).map(clonePoints);
				}
			}
		}

			translateEsEnBtn.classList.toggle('active', subtitleMode === "translate-es-en");
			englishSubBtn.classList.toggle('listening', subtitleListening && subtitleMode === "caption-en");
			spanishSubBtn.classList.toggle('listening', subtitleListening && subtitleMode === "caption-es");
			translateEnEsBtn.classList.toggle('listening', subtitleListening && subtitleMode === "translate-en-es");
			translateEsEnBtn.classList.toggle('listening', subtitleListening && subtitleMode === "translate-es-en");
			translatorBtn.disabled = !isCaptionMode();

		function toggleTranslatorMode() {
			if (!isCaptionMode()) return;
			if (translatorMode) saveCurrentTranslatorEntry();
			translatorMode = !translatorMode;
			slidesArea.classList.add('subtitles-live');
			if (translatorMode) {
				setTranslatorTool("draw");
				if (translatorEntries.length) {
					loadTranslatorEntry(translatorEntries.length - 1);
				} else {
					createTranslatorEntryAtEnd(currentSubtitleText);

			updateSubtitleButtons();
			fitSubtitleText();

		function setSubtitleMode(mode) {
			if (subtitleMode === mode) {
				stopSubtitles();
				subtitleMode = "";
				translatorMode = false;
				translatorGroups = [];
				normalStrokes = [];
				subtitleText.textContent = "";
				currentSubtitleText = "";
				slidesArea.classList.remove('subtitles-live');
				slidesArea.classList.remove('translator-mode');
			} else {
				stopSubtitles();
				subtitleMode = mode;
				if (!isCaptionMode()) {
					translatorMode = false;
					slidesArea.classList.remove('translator-mode');
				}
				setSubtitleText("");

		function fitSubtitleText() {
			const max = translatorMode ? 82 : 56;

			while (subtitleText.scrollWidth > subtitleText.clientWidth && parseFloat(subtitleText.style.fontSize) > min) {
				subtitleText.style.fontSize = `${parseFloat(subtitleText.style.fontSize) - 2}px`;
			}
		}

		function setSubtitleText(text) {
			const nextText = text.trim();
			if (nextText !== currentSubtitleText) {
				if (translatorMode && subtitleListening && nextText) {
					ensureTranslatorEntryForSpeech(nextText);
				} else {
					currentSubtitleText = nextText;

		function setLiveTranslatedSubtitleText(text) {

			if (!sourceText) {

				return;
			}

			const requestId = ++liveTranslationRequestId;
			translateText(sourceText).then(translated => {
				if (requestId !== liveTranslationRequestId || !isLiveTranslateMode()) return;
				setSubtitleText(translated || sourceText);

			translatorSource.innerHTML = "";
			translatorCallouts.innerHTML = "";
			translatorLines.innerHTML = "";

		function createTranslatorGroup(indexes, skipAutoTranslate = false) {
			const cleanIndexes = uniqueSortedIndexes(indexes);
			const existing = translatorGroups.find(group => cleanIndexes.join(",") === group.indexes.join(","));
			if (existing) return existing;

			const group = {
				id: nextTranslatorGroupId++,
				indexes: cleanIndexes,
				source: getWordsForIndexes(cleanIndexes),
				translation: "",
				status: skipAutoTranslate ? "pending" : "translating",
				path: activeDrawPoints.slice(),
				callout: null,
				orb: null,
				revealed: false
			};
			translatorGroups.push(group);
			saveCurrentTranslatorEntry();

			if (!skipAutoTranslate) {
				translateText(group.source).then(translated => {
					group.translation = translated;
					group.status = "ready";
					saveCurrentTranslatorEntry();
					renderTranslatorView();
				}).catch(err => {
					group.translation = group.source;
					group.status = "ready";
					console.warn('Grouped translation API failed:', err);
					saveCurrentTranslatorEntry();
					renderTranslatorView();
				});
			}

			return group;
		}

		function drawTranslatorOverlay() {
			if (!translatorMode) return;
			translatorCallouts.innerHTML = "";
			translatorLines.innerHTML = "";
			const stageRect = translatorStage.getBoundingClientRect();
			resizeTranslatorCanvas();
			redrawTranslatorCanvas();

			translatorGroups.forEach(group => {
				if (!group.revealed || !group.callout) return;

				const center = getGroupCenter(group);
				const targetX = group.callout.x;
				const targetY = group.callout.y;

				const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
				line.setAttribute("x1", String(center.x));
				line.setAttribute("y1", String(center.y));
				line.setAttribute("x2", String(targetX));
				line.setAttribute("y2", String(targetY - 12));
				translatorLines.appendChild(line);

				const callout = document.createElement('div');
				callout.className = "translation-callout";
				const main = document.createElement('div');
				main.className = "translation-main";
				main.textContent = group.translation || "Translating...";
				callout.appendChild(main);
				callout.style.left = `${targetX}px`;
				callout.style.top = `${targetY}px`;
				translatorCallouts.appendChild(callout);
			});

			if (activeDragGroup?.orb) {
				const orb = document.createElement('div');
				orb.className = "translation-orb";
				orb.style.left = `${activeDragGroup.orb.x}px`;
				orb.style.top = `${activeDragGroup.orb.y}px`;
				translatorCallouts.appendChild(orb);
			}
		}

		function resizeTranslatorCanvas() {
			const rect = translatorStage.getBoundingClientRect();
			const dpr = window.devicePixelRatio || 1;
			const width = Math.max(1, Math.round(rect.width * dpr));
			const height = Math.max(1, Math.round(rect.height * dpr));
			if (translatorCanvas.width !== width || translatorCanvas.height !== height) {
				translatorCanvas.width = width;
				translatorCanvas.height = height;
			}
			translatorCanvas.style.width = `${rect.width}px`;
			translatorCanvas.style.height = `${rect.height}px`;
			translatorCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}

		function redrawTranslatorCanvas() {
			const rect = translatorStage.getBoundingClientRect();
			translatorCtx.clearRect(0, 0, rect.width, rect.height);

			normalStrokes.forEach(stroke => {
				drawPath(stroke, "#fff", 5, false);
			});

			translatorGroups.forEach(group => {
				drawPath(group.path, "#ffeb3b", 5, true);
			});

			if (translatorInteraction === "draw") {
				drawPath(activeDrawPoints, translatorTool === "magic" ? "#ffeb3b" : "#fff", 5, translatorTool === "magic");
				if (activeDrawPoints.length === 1) {
					drawPoint(activeDrawPoints[0], translatorTool === "magic" ? "#ffeb3b" : "#fff");
				}
			}
		}

		function drawPath(points, stroke, width, closed) {
			if (points.length < 2) return;
			translatorCtx.save();
			translatorCtx.strokeStyle = stroke;
			translatorCtx.lineWidth = width;
			translatorCtx.lineCap = "round";
			translatorCtx.lineJoin = "round";
			translatorCtx.beginPath();
			translatorCtx.moveTo(points[0].x, points[0].y);
			points.slice(1).forEach(point => translatorCtx.lineTo(point.x, point.y));
			if (closed) translatorCtx.closePath();
			translatorCtx.stroke();
			translatorCtx.restore();
		}

		function drawPoint(point, stroke, radius = 3) {
			translatorCtx.save();
			translatorCtx.fillStyle = stroke;
			translatorCtx.beginPath();
			translatorCtx.arc(point.x, point.y, radius, 0, Math.PI * 2);
			translatorCtx.fill();
			translatorCtx.restore();
		}

		function getCanvasPoint(event) {
			const rect = translatorStage.getBoundingClientRect();
			return {
				x: event.clientX - rect.left,
				y: event.clientY - rect.top
			};
		}

		function pointInPolygon(point, polygon) {
			let inside = false;
			for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
				const xi = polygon[i].x;
				const yi = polygon[i].y;
				const xj = polygon[j].x;
				const yj = polygon[j].y;
				const intersects = ((yi > point.y) !== (yj > point.y)) && point.x < ((xj - xi) * (point.y - yi)) / (yj - yi) + xi;
				if (intersects) inside = !inside;
			}
			return inside;
		}

		function getWordCenter(index) {
			const wordEl = translatorSource.querySelector(`[data-index="${index}"]`);
			if (!wordEl) return null;
			const stageRect = translatorStage.getBoundingClientRect();
			const wordRect = wordEl.getBoundingClientRect();
			return {
				x: wordRect.left + wordRect.width / 2 - stageRect.left,
				y: wordRect.top + wordRect.height / 2 - stageRect.top
			};
		}

		function getGroupCenter(group) {
			const centers = group.indexes.map(getWordCenter).filter(Boolean);
			if (!centers.length) {
				return group.path[0] || { x: 0, y: 0 };
			}
			return {
				x: centers.reduce((sum, point) => sum + point.x, 0) / centers.length,
				y: centers.reduce((sum, point) => sum + point.y, 0) / centers.length
			};
		}

		function findGroupAtPoint(point) {
			return [...translatorGroups].reverse().find(group => group.path.length >= 3 && pointInPolygon(point, group.path));
		}

		function getCircledWordIndexes(points) {
			const words = getSubtitleWords();
			return words
				.map((_, index) => ({ index, center: getWordCenter(index) }))
				.filter(item => item.center && pointInPolygon(item.center, points))
				.map(item => item.index);
		}

		function distanceToSegment(point, a, b) {
			const dx = b.x - a.x;
			const dy = b.y - a.y;
			if (dx === 0 && dy === 0) return Math.hypot(point.x - a.x, point.y - a.y);
			const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy)));
			return Math.hypot(point.x - (a.x + t * dx), point.y - (a.y + t * dy));
		}

		function pathNearPoint(path, point, threshold = 18) {
			for (let i = 1; i < path.length; i++) {
				if (distanceToSegment(point, path[i - 1], path[i]) <= threshold) return true;
			}
			return false;
		}

		function eraseAtPoint(point) {
			const beforeGroups = translatorGroups.length;
			const beforeStrokes = normalStrokes.length;
			translatorGroups = translatorGroups.filter(group => !pathNearPoint(group.path, point));
			normalStrokes = normalStrokes.filter(stroke => !pathNearPoint(stroke, point));
			if (beforeGroups !== translatorGroups.length || beforeStrokes !== normalStrokes.length) {
				saveCurrentTranslatorEntry();
				renderTranslatorView();
			}
		}

		function beginTranslatorPointer(event) {
			if (!translatorMode) return;
			if (event.target.closest?.('.translator-nav')) return;
			event.preventDefault();
			try {
				translatorCanvas.setPointerCapture(event.pointerId);
			} catch { }
			const point = getCanvasPoint(event);
			if (translatorTool === "erase") {
				translatorInteraction = "erase";
				eraseAtPoint(point);
			} else if (translatorTool === "magic" && (findGroupAtPoint(point))) {
				const group = findGroupAtPoint(point);
				translatorInteraction = "drag";
				activeDragGroup = group;
				activeDragGroup.orb = { ...point };
			} else {
				translatorInteraction = "draw";
				activeDrawPoints = [point];
			}
			drawTranslatorOverlay();
		}

		function moveTranslatorPointer(event) {
			if (!translatorInteraction) return;
			event.preventDefault();
			const point = getCanvasPoint(event);
			if (translatorInteraction === "draw") {
				activeDrawPoints.push(point);
			} else if (translatorInteraction === "drag" && activeDragGroup) {
				activeDragGroup.orb = point;
			} else if (translatorInteraction === "erase") {
				eraseAtPoint(point);
			}
			drawTranslatorOverlay();
		}

		function finishTranslatorPointer(event) {
			if (!translatorInteraction) return;
			event.preventDefault();
			if (translatorInteraction === "draw") {
				if (translatorTool === "magic") {
					const indexes = getCircledWordIndexes(activeDrawPoints);
					if (indexes.length) createTranslatorGroup(indexes);
				} else {
					normalStrokes.push(clonePoints(activeDrawPoints));
				}
			} else if (translatorInteraction === "drag" && activeDragGroup?.orb) {
				activeDragGroup.callout = { ...activeDragGroup.orb };
				activeDragGroup.revealed = true;
				activeDragGroup.orb = null;
			}
			translatorInteraction = "";
			activeDrawPoints = [];
			activeDragGroup = null;
			saveCurrentTranslatorEntry();
			renderTranslatorView();
		}

		translatorStage.addEventListener('pointerdown', beginTranslatorPointer);
		window.addEventListener('pointermove', moveTranslatorPointer);
		window.addEventListener('pointerup', finishTranslatorPointer);
		window.addEventListener('pointercancel', finishTranslatorPointer);
		translatorCanvas.addEventListener('dblclick', event => {
			if (!translatorMode) return;
			event.preventDefault();
			const point = getCanvasPoint(event);
			const group = findGroupAtPoint(point);
			if (!group) return;
			translatorGroups = translatorGroups.filter(item => item.id !== group.id);
			saveCurrentTranslatorEntry();
			renderTranslatorView();
		});

		function startSubtitles() {
			if (!subtitleMode || subtitleListening) return;
			if (!SpeechRecognition) {
				alert('Live subtitles need a browser with speech recognition support.');
				return;
			}

			stopSubtitles();
			subtitleFinalText = "";
			if (isCaptionMode()) startFreshTranslatorSpeechEntry();
			setSubtitleText("");
			slidesArea.classList.add('subtitles-live');

			subtitleRecognition = new SpeechRecognition();
			subtitleRecognition.lang = getRecognitionLanguage();
			subtitleRecognition.continuous = true;
			subtitleRecognition.interimResults = true;
			subtitleRecognition.maxAlternatives = 1;

			subtitleRecognition.onresult = event => {
				let interimText = "";
				let finalText = "";
				for (let i = event.resultIndex; i < event.results.length; i++) {
					const phrase = event.results[i][0].transcript;
					if (event.results[i].isFinal) {
						finalText += `${phrase} `;
					} else {
						interimText += phrase;
					}
				}
				if (isLiveTranslateMode()) {
					const spokenText = `${finalText || ""}${interimText}`.trim();
					if (spokenText) setLiveTranslatedSubtitleText(spokenText);
				} else {
					if (finalText) subtitleFinalText += finalText;
					setSubtitleText(`${subtitleFinalText}${interimText}`);
				}
			};

			subtitleRecognition.onerror = event => {
				console.warn('Subtitle recognition error:', event.error);
			};

			subtitleRecognition.onend = () => {
				const shouldRestart = subtitleListening;
				if (shouldRestart && subtitleRecognition) {
					try {
						subtitleRecognition.start();
					} catch { }
				}
			};

			subtitleListening = true;
			updateSubtitleButtons();
			try {
				subtitleRecognition.start();
			} catch (err) {
				subtitleListening = false;
				updateSubtitleButtons();
				console.warn('Subtitle recognition start error:', err);
			}
		}

		function stopSubtitles() {
			subtitleListening = false;
			updateSubtitleButtons();
			if (!subtitleRecognition) return;
			const recog = subtitleRecognition;
			subtitleRecognition = null;
			try {
				recog.onend = null;
				recog.stop();
			} catch { }
		}

			if (translatorMode) requestAnimationFrame(drawTranslatorOverlay);

		/* ---------- Scheduler ---------- */
		let lastTriggeredTime = "";
		setInterval(() => {
			const now = new Date();
			const hh = String(now.getHours()).padStart(2, '0');
			const mm = String(now.getMinutes()).padStart(2, '0');
			const timeStr = `${hh}:${mm}`;

			if (timeStr === lastTriggeredTime) return;

			const presetAction = getPresetAction(timeStr);
			if (presetAction) {
				lastTriggeredTime = timeStr;
				if (presetAction === "restart") {
					resetTimer();
					startTimer();
				} else if (presetAction === "pause") {
					if (running) pauseTimer();
				} else if (presetAction === "resume") {
					if (paused) startTimer();
				}
				return;
			}

			const item = presetScheduleEnabled ? null : schedule.find(x => x.time === timeStr);
			if (item) {
				lastTriggeredTime = timeStr;
				if (item.action === 'start') {
					if (!running) startTimer();
				} else if (item.action === 'pause') {
					if (running) pauseTimer();
				}
			}
		}, 1000);

		/* ---------- Timer Logic ---------- */
		function tick() {
			if (!running) return;
			const now = Date.now();
			elapsedMs = now - startTs;

			if (elapsedMs >= totalMs && totalMs > 0) {
				elapsedMs = totalMs;
				pauseTimer();
				if (lastChimedIndex < starts.length) {
					audioEl.currentTime = 0;
					audioEl.play().catch(() => { });
					lastChimedIndex = starts.length;
				}
			}

			updateCompletionUI();
			rafId = requestAnimationFrame(tick);
		}

		function updateCompletionUI(force = false) {
			if (!totalMs) {
				progressFill.style.width = '0%';
				return;
			}

			const pct = (Math.min(elapsedMs, totalMs) / totalMs) * 100;
			progressFill.style.width = `${pct}%`;

			let currentIdx = -1;
			for (let i = 0; i < starts.length; i++) {
				if (elapsedMs >= starts[i] - EPS) currentIdx = i;
			}

			if (currentIdx > lastChimedIndex && running) {
				if (lastChimedIndex !== -1) {
					audioEl.currentTime = 0;
					audioEl.play().catch(() => { });
				}
				lastChimedIndex = currentIdx;
			}

			const labels = document.querySelectorAll('.cp-label');
			labels.forEach((lbl, i) => {
				if (i < sections.length) {
					if (elapsedMs >= starts[i] && elapsedMs < ends[i]) {
						lbl.classList.add('active');
						lbl.classList.remove('completed');
					} else if (elapsedMs >= ends[i]) {
						lbl.classList.remove('active');
						lbl.classList.add('completed');
					} else {
						lbl.classList.remove('active');
						lbl.classList.remove('completed');
					}
				}
			});

			const dots = document.querySelectorAll('.cp');
			dots.forEach((dot, i) => {
				let time = starts[i];
				if (elapsedMs >= time) {
					dot.classList.add('completed');
				} else {
					dot.classList.remove('completed');
				}
			});
		}

		function startTimer() {
			if (running) return;
			if (elapsedMs >= totalMs) {
				elapsedMs = 0;
				lastChimedIndex = -1;
				updateCompletionUI();
			}
			running = true;
			paused = false;
			startTs = Date.now() - elapsedMs;
			toggleBtn.textContent = "Stop";
			toggleBtn.style.background = "#e54d2e";
			toggleBtn.style.color = "#fff";
			pauseBtn.textContent = "Pause";
			pauseBtn.classList.remove('timing');
			overlay.classList.remove('show');
			tick();
		}

		function pauseTimer() {
			running = false;
			paused = true;
			cancelAnimationFrame(rafId);
			toggleBtn.textContent = "Start";
			toggleBtn.style.background = "#ffffff";
			toggleBtn.style.color = "#2f2f2f";
			pauseBtn.textContent = "Resume";
			pauseBtn.classList.add('timing');
		}

		function putTimerInPausedMode() {
			if (running) {
				pauseTimer();
				return;
			}
			paused = true;
			cancelAnimationFrame(rafId);
			toggleBtn.textContent = "Start";
			toggleBtn.style.background = "#ffffff";
			toggleBtn.style.color = "#2f2f2f";
			pauseBtn.textContent = "Resume";
			pauseBtn.classList.add('timing');
		}

		function resetTimer() {
			running = false;
			paused = false;
			cancelAnimationFrame(rafId);
			elapsedMs = 0;
			lastChimedIndex = -1;
			updateCompletionUI();
			toggleBtn.textContent = "Start";
			toggleBtn.style.background = "#ffffff";
			toggleBtn.style.color = "#2f2f2f";
			pauseBtn.textContent = "Pause";
			pauseBtn.classList.remove('timing');
		}

		function adjustTime(deltaMs) {
			elapsedMs += deltaMs;
			if (elapsedMs < 0) elapsedMs = 0;
			if (elapsedMs > totalMs) elapsedMs = totalMs;
			if (running) {
				startTs = Date.now() - elapsedMs;
			}
			updateCompletionUI();
		}

			if (deskOverlay.classList.contains('show')) {

				if (e.code === "Space" || e.key === " ") {
					e.preventDefault();
					if (!e.repeat) deskStartSpin();

				}
			}

			if (e.code === pushToTalkKeyCode) {

				if (!e.repeat && isCaptionMode()) {
					if (subtitleListening) stopSubtitles();
					else startSubtitles();

			if (e.code === translatorToggleKeyCode) {

					}
				}
			}

			if (e.key === 'ArrowLeft' && !isTyping && fileDeck) {
				e.preventDefault();
				moveFileSlide(-1);
			}
		});

		document.addEventListener('keyup', e => {
			if (e.code !== pushToTalkKeyCode) return;
			e.preventDefault();
		});

		/* ---------- Init ---------- */
		loadConfig();
		buildTimeline();
		buildConfigRows();
		buildScheduleRows();
		overlay.classList.add('show');
		setVolume(parseFloat(volEl.value) || 0.6);

	</script>
</body>

</html>
