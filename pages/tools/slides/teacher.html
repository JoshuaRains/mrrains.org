<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher PDF workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#202124;color:#fff;font-family:Inter,system-ui,sans-serif}button{font:inherit}.top,.bottom{position:fixed;z-index:20;display:flex;align-items:center;gap:6px;padding:6px;background:#101010;border:2px solid #000;border-radius:10px;box-shadow:0 4px 18px #0008}.top{top:8px;left:50%;transform:translateX(-50%)}.bottom{right:8px;bottom:8px}.top button,.bottom button{min-width:42px;height:42px;padding:0 10px;display:grid;place-items:center;color:#111;background:#fff;border:2px solid #000;border-radius:7px;cursor:pointer}.top button.active{color:#fff;background:#b91c1c}.top button:disabled,.bottom button:disabled{opacity:.4}.label{width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:700}.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.stage.drawing{cursor:crosshair}.stage.erasing{cursor:cell}.page{position:absolute;left:50%;top:50%;transform-origin:0 0}.page canvas{display:block;background:#fff;box-shadow:0 6px 32px #000c}.annotations{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.annotation-text,.annotation-text *{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}.text-interactions{position:absolute;inset:0;z-index:7;pointer-events:none}.text-hitbox{position:absolute;pointer-events:auto;cursor:text;background:transparent;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}.student-boundary{position:absolute;z-index:4;outline:4px solid #ef2b2b;background:#ef2b2b10;pointer-events:none}.status{position:fixed;left:10px;bottom:10px;z-index:10;padding:6px 10px;background:#000b;border-radius:7px;font-size:13px}.color{width:30px!important;min-width:30px!important}.red{background:#ef4444!important}.blue{background:#3b82f6!important}.black{background:#111!important;color:#fff!important}.tool-divider{width:1px;height:32px;background:#555}.history-count{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}.page-nav{position:fixed;left:8px;bottom:8px;z-index:20;display:flex;gap:5px;padding:5px;background:#111;border:2px solid #000;border-radius:9px}.page-nav button{width:42px;height:42px;background:#fff;border:2px solid #000;border-radius:7px}.page-count{min-width:72px;display:grid;place-items:center}.zoom-value{min-width:56px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.font-size-control{height:42px;display:flex;align-items:center;gap:3px;padding:0 7px;color:#111;background:#fff;border:2px solid #000;border-radius:7px;font-weight:800}.font-size-control input{width:48px;padding:2px;color:#111;background:#fff;border:0;border-bottom:1px solid #777;outline:0;text-align:center;font:700 14px system-ui}.font-size-control small{font-size:11px}.live-text-editor{position:absolute;z-index:8;min-width:40px;min-height:20px;margin:0;padding:0;resize:both;overflow:hidden;color:#ef4444;background:transparent;border:0;border-radius:0;outline:2px dashed currentColor;outline-offset:2px;font:18px/1.25 Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;transform-origin:top left;user-select:text;-webkit-user-select:text}.live-text-editor:empty::before{content:attr(data-placeholder);color:#555;pointer-events:none}.live-text-editor:focus{background:transparent;outline-style:solid}
  </style>
  <style>.live-text-editor{min-height:1.25em}</style>
</head>
<body>
  <div class="stage" id="stage"><div class="page" id="page"><canvas id="pdfCanvas"></canvas><svg class="annotations" id="annotations"></svg><div class="text-interactions" id="textInteractions"></div><div class="student-boundary" id="studentBoundary"></div></div></div>
  <nav class="top" aria-label="Teacher PDF tools">
    <button id="previousDocument" title="Previous document"><span class="material-symbols-outlined">chevron_left</span></button><div class="label" id="documentLabel">No document</div><button id="nextDocument" title="Next document"><span class="material-symbols-outlined">chevron_right</span></button>
    <span class="tool-divider"></span><button id="zoomOut" title="Zoom teacher view out"><span class="material-symbols-outlined">zoom_out</span></button><span class="zoom-value" id="zoomValue">100%</span><button id="zoomIn" title="Zoom teacher view in"><span class="material-symbols-outlined">zoom_in</span></button><button id="fitPage" title="Fit PDF page"><span class="material-symbols-outlined">fit_screen</span></button><span class="tool-divider"></span><button id="panTool" class="active" title="Right-drag to move teacher view"><span class="material-symbols-outlined">pan_tool</span></button><button id="studentViewTool" title="Right-drag the red student-view box"><span class="material-symbols-outlined">select_window</span></button><span class="tool-divider"></span><button id="drawTool" class="active" title="Left-drag to draw"><span class="material-symbols-outlined">draw</span></button><button id="textTool" title="Left-click the PDF and type"><span class="material-symbols-outlined">text_fields</span></button><label class="font-size-control" title="Document font size; automatically compensates for teacher zoom"><span>A</span><input id="fontSizeSelect" type="number" min="0.5" max="144" step="0.5" value="54" aria-label="Document font size"><small>pt</small></label><button id="eraseTool" title="Left-drag to remove strokes or textboxes"><span class="material-symbols-outlined">ink_eraser</span></button><button class="color red" data-color="#ef4444" title="Red"></button><button class="color blue" data-color="#2563eb" title="Blue"></button><button class="color black" data-color="#111111" title="Black"></button><button id="download" title="Download edited PDF"><span class="material-symbols-outlined">download</span></button>
  </nav>
  <nav class="page-nav"><button id="previousPage"><span class="material-symbols-outlined">navigate_before</span></button><div class="page-count" id="pageCount">0 / 0</div><button id="nextPage"><span class="material-symbols-outlined">navigate_next</span></button></nav>
  <nav class="bottom" aria-label="Edit history"><button id="historyStart" title="Beginning"><span class="material-symbols-outlined">first_page</span></button><button id="undo" title="Undo"><span class="material-symbols-outlined">undo</span></button><span class="history-count" id="historyCount">0 / 0</span><button id="redo" title="Redo"><span class="material-symbols-outlined">redo</span></button></nav>
  <div class="status" id="status">Teacher view</div>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>if(window.pdfjsLib?.GlobalWorkerOptions) window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';</script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="./teacher.js"></script>
</body>
</html>
