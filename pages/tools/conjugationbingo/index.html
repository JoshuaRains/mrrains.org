<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conjugation Bingo</title>
  <style>
    :root{color-scheme:dark;--yellow:#facc15;--panel:#171717;--ink:#fafafa}*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{height:100%;margin:0}body{overflow:hidden;background:#090909;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100%;display:grid;place-items:center;padding:4rem 8rem;text-align:center;cursor:pointer}.eyebrow{margin:0 0 1rem;color:var(--yellow);font-size:clamp(1rem,2vw,1.5rem);font-weight:900;letter-spacing:.18em;text-transform:uppercase}#conjugation{margin:0;max-width:14ch;font-size:clamp(3.4rem,10vw,9rem);line-height:.95;text-wrap:balance}#prompt{margin:1.2rem 0 0;color:#d4d4d4;font-size:clamp(1.25rem,3vw,2.2rem);font-weight:800}#count{margin:.75rem 0 0;color:#a3a3a3;font-size:clamp(1rem,2vw,1.25rem);font-weight:700}button{border:3px solid #000;border-radius:0;background:#fff;color:#111;box-shadow:4px 4px 0 #000;cursor:pointer;font:900 1rem/1 system-ui}button:hover,button:focus-visible{background:var(--yellow);outline:3px solid #fff}.side-controls{position:fixed;left:14px;top:50%;z-index:3;display:grid;gap:12px;transform:translateY(-50%)}.side-controls button{width:64px;min-height:58px;padding:8px 5px;font-size:1.8rem}#next{position:fixed;right:22px;bottom:22px;min-width:150px;min-height:58px;padding:0 22px;background:var(--yellow)}dialog{width:min(560px,calc(100vw - 32px));height:min(650px,82vh);padding:0;border:3px solid #000;border-radius:0;background:var(--panel);color:var(--ink);box-shadow:8px 8px 0 #000;overflow:hidden}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#222;border-bottom:2px solid #000}.dialog-head h2{margin:0}.dialog-head button{padding:12px 16px}#historyList{height:calc(100% - 69px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:0;padding:16px;list-style:none}#historyList li{flex:0 0 auto;padding:14px;border:1px solid #404040;background:#111;font-size:1.05rem;font-weight:800}.history-answer{color:var(--yellow);font-size:1.2rem}.empty{color:#a3a3a3}@media(max-width:650px){main{padding:4rem 1rem 8rem 5.5rem}.side-controls{left:8px}.side-controls button{width:58px}#next{right:12px;bottom:12px}}
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"><div><p class="eyebrow">Conjugation Bingo</p><h1 id="conjugation">Click to start</h1><p id="prompt">English prompt</p><p id="count">0 of 145 combinations</p></div></main>
  <div class="side-controls" aria-label="Bingo controls"><button id="history" type="button" aria-label="View previous prompts" title="View previous prompts">☰</button><button id="reset" type="button" aria-label="Reset bingo" title="Reset bingo">↻</button></div>
  <button id="next" type="button">Next prompt</button>
  <dialog id="historyDialog"><div class="dialog-head"><h2>Previous prompts</h2><button id="close" type="button">Close</button></div><ul id="historyList"></ul></dialog>
  <script>
    const VERBS=[
      {spanish:'hablar',english:'speak',third:'speaks'},{spanish:'comer',english:'eat',third:'eats'},{spanish:'vivir',english:'live',third:'lives'},{spanish:'caminar',english:'walk',third:'walks'},{spanish:'beber',english:'drink',third:'drinks'},{spanish:'escribir',english:'write',third:'writes'},{spanish:'trabajar',english:'work',third:'works'},{spanish:'leer',english:'read',third:'reads'},{spanish:'abrir',english:'open',third:'opens'},{spanish:'estudiar',english:'study',third:'studies'},{spanish:'aprender',english:'learn',third:'learns'},{spanish:'recibir',english:'receive',third:'receives'},{spanish:'mirar',english:'look',third:'looks'},{spanish:'vender',english:'sell',third:'sells'},{spanish:'compartir',english:'share',third:'shares'},{spanish:'usar',english:'use',third:'uses'},{spanish:'correr',english:'run',third:'runs'},{spanish:'decidir',english:'decide',third:'decides'},{spanish:'escuchar',english:'listen',third:'listens'},{spanish:'responder',english:'respond',third:'responds'},{spanish:'asistir',english:'attend',third:'attends'},{spanish:'enseñar',english:'teach',third:'teaches'},{spanish:'comprender',english:'understand',third:'understands'},{spanish:'sufrir',english:'suffer',third:'suffers'},{spanish:'sacar',english:'take out',third:'takes out'},{spanish:'prometer',english:'promise',third:'promises'},{spanish:'permitir',english:'allow',third:'allows'},{spanish:'tocar',english:'play',third:'plays'},{spanish:'deber',english:'owe',third:'owes'}
    ];
    const SUBJECTS=[{spanish:'yo',english:'I',index:0},{spanish:'tú',english:'you',index:1},{spanish:'él',english:'he',index:2},{spanish:'nosotros',english:'we',index:3},{spanish:'ellos',english:'they',index:5}];
    const ENDINGS={ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']};
    function conjugate(verb,index){const group=verb.slice(-2),stem=verb.slice(0,-2);return stem+ENDINGS[group][index]}
    const conjugation=document.querySelector('#conjugation'),prompt=document.querySelector('#prompt'),count=document.querySelector('#count'),list=document.querySelector('#historyList'),dialog=document.querySelector('#historyDialog');let remaining=[],called=[];
    function renderHistory(){list.innerHTML='';if(!called.length){const li=document.createElement('li');li.className='empty';li.textContent='No prompts yet.';list.append(li);return}[...called].reverse().forEach(item=>{const li=document.createElement('li');li.innerHTML=`${item.englishPrompt}<br><span class="history-answer">${item.subject.spanish} + ${item.verb.spanish}: ${item.answer}</span>`;list.append(li)})}
    function reset(){remaining=VERBS.flatMap(verb=>SUBJECTS.map(subject=>({verb,subject,englishPrompt:`${subject.english} ${subject.index===2?verb.third:verb.english}`,answer:conjugate(verb.spanish,subject.index)})));called=[];conjugation.textContent='Click to start';prompt.textContent='English prompt';count.textContent=`0 of ${remaining.length} combinations`;renderHistory()}
    function draw(){if(!remaining.length){conjugation.textContent='All combinations called';prompt.textContent='Great work!';return}const i=Math.floor(Math.random()*remaining.length),item=remaining.splice(i,1)[0];called.push(item);conjugation.textContent=item.englishPrompt;prompt.textContent='Find the matching verb and pronoun';count.textContent=`${called.length} of ${called.length+remaining.length} combinations`;renderHistory()}
    document.querySelector('#next').addEventListener('click',draw);document.querySelector('#stage').addEventListener('click',draw);document.querySelector('#history').addEventListener('click',()=>dialog.showModal());document.querySelector('#close').addEventListener('click',()=>dialog.close());document.querySelector('#reset').addEventListener('click',()=>{if(!called.length||confirm('Reset the bingo game and clear the history?'))reset()});addEventListener('keydown',e=>{if(!dialog.open&&(e.code==='Space'||e.code==='ArrowRight')){e.preventDefault();draw()}});addEventListener('contextmenu',e=>e.preventDefault());reset();
  </script>
</body></html>
