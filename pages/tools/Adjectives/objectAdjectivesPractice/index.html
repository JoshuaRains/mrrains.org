<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board – Picture Practice</title>
<style>
	:root{
		--bg-top:#4f7a62; --bg-bot:#5d8b6f;
		--panel:#ffffff; --ink:#0f172a;
		--border:#dfece5; --radius:22px;
		--right:#16a34a; --right-soft:#e8f8ee;
	}
	*{box-sizing:border-box}
	html,body{height:100%;margin:0}
	body{
		background:linear-gradient(to bottom,var(--bg-top),var(--bg-bot));
		font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
		color:var(--ink);
		overflow:hidden;
	}
	.app{
		height:100dvh;
		display:grid;
		grid-template-rows: minmax(0, 1fr) auto 40px;
		gap:clamp(8px,2dvh,20px);
		padding: clamp(8px,2dvh,28px);
		max-width:1400px;
		margin:0 auto;
		position:relative;
	}
	.figure{
		background:var(--panel);
		border:1px solid var(--border);
		border-radius:var(--radius);
		box-shadow:0 18px 36px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
		padding: clamp(6px,1.2dvh,14px);
		display:flex;
		align-items:center;
		justify-content:center;
		overflow:hidden;
	}
	.figure-inner{
		width:100%;
		height:100%;
		display:flex;
		align-items:center;
		justify-content:center;
		overflow:hidden;
		border-radius:calc(var(--radius) - 8px);
		background:#f8fafc;
		border:1px solid var(--border);
	}
	.figure img{
		width:100%;
		height:100%;
		object-fit:contain;
		transition:opacity .18s ease;
	}

	.choices-wrap{
		background:var(--panel);
		border:1px solid var(--border);
		border-radius:var(--radius);
		box-shadow:0 12px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
		padding: clamp(10px,2dvh,24px);
	}
	.choices{
		display:grid;
		grid-template-columns: repeat(2, 1fr);
		gap: clamp(12px,2.5dvh,28px);
	}
	.choice{
		position:relative;
		display:flex; align-items:center; gap:clamp(16px,2dvh,24px);
		border:3px solid var(--border);
		background:#fff;
		border-radius:22px;
		padding: clamp(18px,3dvh,32px) clamp(20px,3dvh,40px);
		font-size: clamp(24px, 4dvh, 48px);
		font-weight:800;
		line-height:1.1;
		user-select:none;
		transition: transform .08s ease, box-shadow .08s ease, border-color .12s ease, background .12s ease;
		box-shadow:0 8px 18px rgba(0,0,0,.08);
		min-height: clamp(60px, 10dvh, 140px);
	}
	.choice:hover{ transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.12) }
	.choice .key{
		display:inline-grid; place-items:center;
		border-radius:16px; min-width: clamp(48px,5.5dvh,72px); height: clamp(48px,5.5dvh,72px);
		background:#f1f5f9; font-size:.9em; flex:0 0 auto;
	}
	.choice.correct{
		border-color:var(--right);
		background:var(--right-soft);
		outline: clamp(4px,0.8dvh,8px) solid color-mix(in oklab, var(--right) 55%, white 45%);
		box-shadow:
			0 0 0 clamp(5px,1dvh,10px) rgba(22,163,74,.18),
			0 clamp(14px,3dvh,28px) clamp(24px,4dvh,48px) rgba(22,163,74,.35);
		transform:translateY(-1px) scale(1.01);
	}
	.app.reveal-pending{ cursor:pointer }

	.progress{
		font-size: clamp(16px,2.2dvh,24px);
		color:#e8f8ee;
		font-weight:600;
		opacity:0.9;
		align-self:end;
	}
</style>
</head>
<body>
<div class="app" id="app">
	<div class="figure">
		<div class="figure-inner">
			<img id="pic" alt="" draggable="false" />
		</div>
	</div>
	<div class="choices-wrap">
		<div class="choices" id="choices"></div>
	</div>
	<div class="progress" id="progress"></div>
</div>

<script>
/* ===============================
   Inline question configuration
   =============================== */
const QUESTIONS = [
	{ img:"alto2.jpg", options:["alto/alta","ancho/ancha","corto/corta","grande"], answerIndex:0 },
	{ img:"ancho.jpg", options:["ancho/ancha","alto/alta","delgado/delgada","grueso/gruesa"], answerIndex:0 },
	{ img:"corto.jpg", options:["corto/corta","largo/larga","bajo/baja","ancho/ancha"], answerIndex:0 },
	{ img:"de_madera.jpg", options:["de madera","de plástico","metálico/metálica","de vidrio"], answerIndex:0 },
	{ img:"de_plastico.jpg", options:["de plástico","de madera","metálico/metálica","de vidrio"], answerIndex:0 },
	{ img:"delgado2.jpg", options:["delgado/delgada","grueso/gruesa","ancho/ancha","bajo/baja"], answerIndex:0 },
	{ img:"grande1.jpg", options:["grande","pequeño/pequeña","alto/alta","largo/larga"], answerIndex:0 },
	{ img:"grueso.png", options:["grueso/gruesa","delgado/delgada","ancho/ancha","bajo/baja"], answerIndex:0 },
	{ img:"joven.jpg", options:["joven","viejo/vieja","nuevo/nueva","pequeño/pequeña"], answerIndex:0 },
	{ img:"largo.jpg", options:["largo/larga","corto/corta","ancho/ancha","alto/alta"], answerIndex:0 },
	{ img:"limpio.jpg", options:["limpio/limpia","sucio/sucia","roto/rota","nuevo/nueva"], answerIndex:0 },
	{ img:"metálico.jpg", options:["metálico/metálica","de plástico","de madera","de vidrio"], answerIndex:0 },
	{ img:"pequeño2.png", options:["pequeño/pequeña","grande","joven","delgado/delgada"], answerIndex:0 },
	{ img:"roto.jpg", options:["roto/rota","limpio/limpia","sucio/sucia","nuevo/nueva"], answerIndex:0 },
	{ img:"sucio.jpg", options:["sucio/sucia","limpio/limpia","roto/rota","viejo/vieja"], answerIndex:0 },
	{ img:"viejo.jpg", options:["viejo/vieja","joven","nuevo/nueva","bajo/baja"], answerIndex:0 },
	{ img:"alto.avif", options:["alto/alta","bajo/baja","grande","largo/larga"], answerIndex:0 },
	{ img:"pequeño.jpg", options:["pequeño/pequeña","grande","delgado/delgada","joven"], answerIndex:0 },
	{ img:"pequeño3.png", options:["pequeño/pequeña","grande","joven","nuevo/nueva"], answerIndex:0 },
	{ img:"grande.jpg", options:["grande","pequeño/pequeña","alto/alta","largo/larga"], answerIndex:0 }
];

/* ===============================
   Core logic
   =============================== */
const IMG_DIR = "./pictures/";
const appEl = document.getElementById("app");
const picEl = document.getElementById("pic");
const choicesEl = document.getElementById("choices");
const progressEl = document.getElementById("progress");

let qPtr = 0;
let state = "idle";
let current = null;
let nextImgEl = null;

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a; };
const preloadImage = url => new Promise(res=>{ const im=new Image(); im.onload=()=>res({ok:true,img:im}); im.onerror=()=>res({ok:false}); im.src=url; });

function realizeQuestion(qRaw){
	const paired = qRaw.options.map((t,idx)=>({t,idx}));
	shuffle(paired);
	const options = paired.map(p=>p.t);
	const answerIndex = paired.findIndex(p=>p.idx===qRaw.answerIndex);
	return { img:qRaw.img, options, answerIndex };
}

function renderQuestion(q){
	choicesEl.innerHTML = "";
	const labels = ["A","B","C","D"];
	q.options.forEach((opt,i)=>{
		const div = document.createElement("div");
		div.className = "choice";
		div.dataset.idx = i;
		div.innerHTML = `<span class="key">${labels[i]}</span><span class="txt">${opt}</span>`;
		choicesEl.appendChild(div);
	});

	if (nextImgEl){
		picEl.style.opacity = "0";
		requestAnimationFrame(()=>{
			picEl.src = nextImgEl.src;
			picEl.alt = "";
			picEl.style.opacity = "1";
		});
	} else {
		picEl.src = IMG_DIR + q.img;
	}

	progressEl.textContent = `Question ${qPtr+1} / ${QUESTIONS.length}`;
	state = "idle";
	current = q;
	appEl.classList.add("reveal-pending");
}

function reveal(){
	if (!current) return;
	const nodes = [...choicesEl.querySelectorAll(".choice")];
	const correct = nodes.find(n => Number(n.dataset.idx) === current.answerIndex);
	if (correct) correct.classList.add("correct");
	state = "revealed";
	appEl.classList.remove("reveal-pending");
}

async function next(){
	state = "transition";
	qPtr++;
	if (qPtr >= QUESTIONS.length) qPtr = 0;
	const raw = QUESTIONS[qPtr];
	const pre = await preloadImage(IMG_DIR + raw.img);
	nextImgEl = pre.ok ? pre.img : null;
	const q = realizeQuestion(raw);
	renderQuestion(q);
	const nextIdx = (qPtr + 1) % QUESTIONS.length;
	preloadImage(IMG_DIR + QUESTIONS[nextIdx].img);
}

function clickFlow(){
	if (state === "idle") reveal();
	else if (state === "revealed") next();
}

/* -------------------------------
   Initialize
   ------------------------------- */
(async function init(){
	const first = QUESTIONS[qPtr];
	const pre = await preloadImage(IMG_DIR + first.img);
	nextImgEl = pre.ok ? pre.img : null;
	renderQuestion(realizeQuestion(first));

	appEl.addEventListener("click", clickFlow);
	window.addEventListener("keydown",(e)=>{
		if (e.code === "Space" || e.code === "Enter"){
			e.preventDefault();
			clickFlow();
		}
	});
})();
</script>
</body>
</html>
