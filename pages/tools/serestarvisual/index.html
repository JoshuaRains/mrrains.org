<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ser vs Estar — Proceso de traducción</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; background: #0d0f12; color: #e9eef4; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
	.page {
		min-height: 100%;
		display: grid;
		grid-template-rows: 1fr auto; /* main + footer */
	}
	.wrap {
		display: grid;
		grid-template-rows: 1fr;
		place-items: center;
		gap: 2rem;
		padding: 6vh 4vw 2vh;
		text-align: center;
	}
	.brand {
		position: fixed; top: 10px; left: 14px;
		font-weight: 800; font-size: 14px; letter-spacing: .06em;
		opacity: .55; user-select: none;
	}
	main { max-width: 1100px; }
	.line { margin: .3em 0; }
	.eng { font-size: clamp(20px, 3.6vw, 34px); opacity: .95; font-weight: 800; letter-spacing: .01em; }
	.spa { font-size: clamp(28px, 5vw, 56px); font-weight: 800; letter-spacing: .01em; }
	.reveal { font-size: clamp(18px, 2.4vw, 24px); opacity: 0; transform: translateY(6px);
		transition: opacity 180ms ease-out, transform 180ms ease-out; margin-top: .4em; }
	.reveal.show { opacity: 1; transform: translateY(0); }

	/* Spanish sentence blank + verb */
	.blank {
		display: inline-block;
		border-bottom: 3px solid #4a5568;
		vertical-align: baseline;
		line-height: 0.9;
	}
	/* The correct conjugation lives inside .verb. Initially invisible but occupies space. */
	.verb {
		color: transparent; /* keeps width so the blank fits exactly */
		transition: color 160ms ease-out;
	}
	.verb.visible { color: #e9eef4; }

	.meta {
		display: grid; gap: 8px; margin-top: .6em;
		justify-items: center;
	}
	.badge {
		display: inline-block; padding: 6px 10px; border-radius: 999px;
		background: #1a2430; border: 1px solid #334155; font-weight: 800; letter-spacing: .02em;
	}
	.badge .tag { opacity: .75; margin-left: 6px; font-weight: 700; }
	.muted { opacity: .85; }

	/* Footer with buttons pinned to bottom */
	.footer {
		position: sticky;
		bottom: 0;
		background: rgba(13,15,18,0.9);
		backdrop-filter: blur(4px);
		border-top: 1px solid #334155;
		padding: 10px 14px;
		display: flex;
		justify-content: center;
		gap: 10px;
	}
	button.meta-btn {
		background:#16202a; color:#e9eef4; border:1px solid #334155; border-radius:10px;
		font-weight:800; padding:10px 14px; cursor:pointer;
	}
	button.meta-btn:active { transform: translateY(1px); }
    /* Bigger badges for the acronym part and for SER/ESTAR */
#acr, #which {
  font-size: clamp(28px, 4.5vw, 48px); /* was ~18–24px */
  padding: 10px 16px;                  /* a bit more breathing room */
  line-height: 1.05;                   /* keeps them compact but readable */
}

</style>
</head>
<body>
	<div class="brand">SER vs ESTAR — PROCESO</div>

	<div class="page">
		<div class="wrap">
			<main aria-live="polite">
				<div id="eng" class="line eng">Pulsa Espacio para empezar</div>
				<div id="spa" class="line spa">—</div>

				<div class="meta">
					<div id="acr" class="reveal badge">—</div>
					<div id="which" class="reveal badge">—</div>
				</div>
			</main>
		</div>

		<footer class="footer">
			<button id="nextBtn" class="meta-btn" title="Advance (Space)">Advance (Space)</button>
			<button id="skipBtn" class="meta-btn" title="Skip to another sentence">Skip</button>
		</footer>
	</div>

<script>
(() => {
	// --- URL param handling ---
	const params = new URLSearchParams(location.search);
	// Preferred: ?json=./path/file.json
	// Convenience: ?set=name -> ./data/name.json
	const jsonParam = params.get('json');
	const setParam  = params.get('set');
	const sourceUrl = jsonParam || (setParam ? `./${setParam}.json` : null);

	// Map for displaying DOCTOR/PLACE parts nicely
	const PART_ALIASES = {
		// DOCTOR
		"Description":"DOCTOR — Description",
		"Occupation":"DOCTOR — Occupation",
		"Characteristic":"DOCTOR — Characteristic",
		"Time/Date":"DOCTOR — Time/Date",
		"Origin":"DOCTOR — Origin",
		"Relationship":"DOCTOR — Relationship",
		// PLACE
		"Position":"PLACE — Position",
		"Location":"PLACE — Location",
		"Action":"PLACE — Action (present progressive)",
		"Condition":"PLACE — Condition",
		"Emotion":"PLACE — Emotion"
	};

	// Elements
	const engEl   = document.getElementById('eng');
	const spaEl   = document.getElementById('spa');
	const acrEl   = document.getElementById('acr');
	const whichEl = document.getElementById('which');
	const nextBtn = document.getElementById('nextBtn');
	const skipBtn = document.getElementById('skipBtn');

	// State machine: idle -> stage1 -> stage2 -> stage3 -> stage4 -> stage1(new item)
	let state = "idle";
	let items = [];
	let lastIndex = -1;
	let current = null;

	// Fallback sample if no file provided (or load fails)
	const FALLBACK = [
		{
			english: "She is my sister.",
			spanish: "Ella [VERB] mi hermana.",
			part: "Relationship",
			verb: "ser",
			conjugated: "es"
		},
		{
			english: "We are tired today.",
			spanish: "Nosotros [VERB] cansados hoy.",
			part: "Condition",
			verb: "estar",
			conjugated: "estamos"
		},
		{
			english: "The books are on the desk.",
			spanish: "Los libros [VERB] en el escritorio.",
			part: "Position",
			verb: "estar",
			conjugated: "están"
		},
		{
			english: "I am from Spain.",
			spanish: "Yo [VERB] de España.",
			part: "Origin",
			verb: "ser",
			conjugated: "soy"
		},
		{
			english: "Mr. Rains is a teacher.",
			spanish: "El Sr. Rains [VERB] profesor.",
			part: "Occupation",
			verb: "ser",
			conjugated: "es"
		}
	];

	// Load JSON then init
	(async function init(){
		try {
			if (sourceUrl) {
				const res = await fetch(sourceUrl, {cache: "no-store"});
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const data = await res.json();
				// Expect an array of items with fields: english, spanish (with [VERB]), part, verb ("ser"/"estar"), conjugated
				if (Array.isArray(data) && data.length) {
					items = data;
				} else {
					throw new Error("JSON format unexpected or empty");
				}
			} else {
				items = FALLBACK;
			}
		} catch (e) {
			console.warn("Falling back to built-in samples:", e);
			items = FALLBACK;
		}
		engEl.textContent = "Pulsa Espacio para mostrar la primera oración";
		spaEl.textContent = "—";
		acrEl.textContent = "—";
		whichEl.textContent = "—";
	})();

	function chooseItem() {
		if (!items.length) return null;
		let i;
		do { i = Math.floor(Math.random() * items.length); } while (items.length > 1 && i === lastIndex);
		lastIndex = i;
		return items[i];
	}

	// Build the Spanish line with a sized blank that already contains the correct conjugation (invisible)
	function buildSpanishWithBlank(spanishTemplate, conjugated) {
		const token = "[VERB]";
		const idx = spanishTemplate.indexOf(token);
		if (idx === -1) return spanishTemplate;
		const before = spanishTemplate.slice(0, idx);
		const after  = spanishTemplate.slice(idx + token.length);
		const blank = `<span class="blank"><span class="verb" id="verbSlot">${escapeHtml(conjugated)}</span></span>`;
		return before + blank + after;
	}

	function escapeHtml(s) {
		return String(s)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;")
			.replace(/'/g, "&#039;");
	}

	function instantHide(el){
		el.style.transition = 'none';
		el.classList.remove('show');
		void el.offsetWidth;
		el.style.transition = '';
	}

	function startRound() {
		current = chooseItem();
		if (!current) return;

		// Reset reveal elements
		instantHide(acrEl);
		instantHide(whichEl);

		// 1) Show English + Spanish with blank (verb invisible but sized)
		engEl.textContent = current.english;
		spaEl.innerHTML = buildSpanishWithBlank(current.spanish, current.conjugated);

		// Reset verb visibility
		const verbSlot = document.getElementById('verbSlot');
		if (verbSlot) verbSlot.classList.remove('visible');

		// Reset meta lines
		acrEl.textContent = "—";
		whichEl.textContent = "—";

		state = "stage1";
	}

	function revealPart() {
  // Show only the acronym part exactly as provided in the JSON
  // e.g., "Relationship", "Occupation", "Location", "Condition", etc.
  const label = current.part || "—";
  acrEl.textContent = label;
  acrEl.classList.add('show');
  state = "stage2";
}


	function revealWhichVerb() {
		const v = (current.verb || "").toLowerCase() === "estar" ? "estar" : "ser";
		whichEl.textContent = v;
		whichEl.classList.add('show');
		state = "stage3";
	}

	function revealConjugation() {
		const verbSlot = document.getElementById('verbSlot');
		if (verbSlot) verbSlot.classList.add('visible');
		state = "stage4";
	}

	function advance() {
		if (state === "idle" || state === "stage4") startRound();
		else if (state === "stage1") revealPart();
		else if (state === "stage2") revealWhichVerb();
		else if (state === "stage3") revealConjugation();
	}

	// Controls
	function onSpace(e){
		if (e.code === 'Space') {
			e.preventDefault();
			advance();
		}
	}
	window.addEventListener('keydown', onSpace, {passive:false});

	// Click anywhere (except buttons) to advance
	window.addEventListener('click', (e) => {
		if (e.target.closest('button')) return;
		advance();
	});
	document.getElementById('nextBtn').addEventListener('click', advance);
	document.getElementById('skipBtn').addEventListener('click', startRound);

	// Helpful: start immediately if you pass &autostart=1
	if (new URLSearchParams(location.search).get('autostart') === '1') {
		state = "idle";
		startRound();
	}
})();
</script>
</body>
</html>
