<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spanish-Speaking Countries Flag Game</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8dee9;--blue:#2563eb;--green:#16845b;--red:#c93c37;--paper:#fff;--bg:#f3f6fb}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(760px,100%);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}h1{margin:0;font-size:clamp(24px,4vw,38px)}.stats{display:flex;gap:16px;white-space:nowrap;font-weight:800}
    .game-card{padding:clamp(20px,4vw,38px);border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 14px 38px rgba(26,42,73,.1);text-align:center;overflow:hidden}
    .progress{height:9px;margin-bottom:24px;overflow:hidden;border-radius:99px;background:#e8edf5}.progress>div{width:0;height:100%;background:var(--blue);transition:width .2s ease}
    #round{display:flex;flex-direction:column;gap:0}.flag-frame{width:100%;height:clamp(180px,34vh,300px);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:0 0 26px;overflow:hidden}.flag-frame img{display:block;width:100%;height:100%;max-width:560px;object-fit:contain;border:0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.18))}
    .prompt{position:relative;z-index:1;margin:0 0 18px;padding:0;background:var(--paper);font-size:clamp(20px,3vw,28px);font-weight:800}.answers{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--paper)}
    .answer{min-height:58px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:700 17px/1.2 Arial,sans-serif;cursor:pointer}.answer:hover{border-color:var(--blue);background:#f5f8ff}
    .answer:focus-visible,.restart:focus-visible,.reference:focus-visible{outline:3px solid #f5b700;outline-offset:3px}.answer.correct{border-color:var(--green);background:#e8f7f0;color:#0c6543}.answer.wrong{border-color:var(--red);background:#fff0ef;color:#9e2925}
    .feedback{min-height:25px;margin:16px 0 0;color:var(--muted);font-weight:700}.end{padding:30px 0 10px}.end h2{margin:0 0 10px;font-size:clamp(32px,6vw,54px)}.end p{font-size:20px;line-height:1.5}
    .restart,.reference{display:inline-block;margin:8px 4px;padding:13px 20px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}.reference{background:#eef2f7;color:var(--ink)}[hidden]{display:none!important}
    @media(max-width:560px){body{padding:14px}.topbar{align-items:flex-start;flex-direction:column}.flag-frame{height:210px;margin-bottom:22px}.answers{grid-template-columns:1fr}.stats{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <main>
    <div class="topbar"><h1>Flag Challenge</h1><div class="stats" aria-live="polite"><span id="timer">Time: 0:00</span><span id="score">0 / 21</span></div></div>
    <section class="game-card" aria-live="polite">
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      <div id="round"><div class="flag-frame"><img id="flag" alt="Country flag"></div><p class="prompt">Which country has this flag?</p><div id="answers" class="answers"></div><p id="feedback" class="feedback">Choose the country name.</p></div>
      <div id="end" class="end" hidden><h2>¡Excelente!</h2><p id="summary"></p><button id="restart" class="restart" type="button">Play again</button><a class="reference" href="../countryflags/index.html">Study all flags</a></div>
    </section>
  </main>
  <script>
    const countries=[["Argentina","ar"],["Bolivia","bo"],["Chile","cl"],["Colombia","co"],["Costa Rica","cr"],["Cuba","cu"],["Dominican Republic","do"],["Ecuador","ec"],["El Salvador","sv"],["Equatorial Guinea","gq"],["Guatemala","gt"],["Honduras","hn"],["Mexico","mx"],["Nicaragua","ni"],["Panama","pa"],["Paraguay","py"],["Peru","pe"],["Puerto Rico","pr"],["Spain","es"],["Uruguay","uy"],["Venezuela","ve"]].map(([name,code])=>({name,code}));
    const els={flag:document.querySelector("#flag"),answers:document.querySelector("#answers"),feedback:document.querySelector("#feedback"),timer:document.querySelector("#timer"),score:document.querySelector("#score"),bar:document.querySelector("#progressBar"),round:document.querySelector("#round"),end:document.querySelector("#end"),summary:document.querySelector("#summary"),restart:document.querySelector("#restart")};
    let queue=[],current=null,solved=0,attempts=0,startedAt=0,timerId=0,locked=false;
    function shuffle(list){const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
    function time(){const s=Math.floor((Date.now()-startedAt)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
    function updateStats(){els.timer.textContent=`Time: ${time()}`;els.score.textContent=`${solved} / ${countries.length}`;els.bar.style.width=`${solved/countries.length*100}%`}
    function next(){if(!queue.length){clearInterval(timerId);updateStats();const accuracy=Math.round(countries.length/attempts*100);els.round.hidden=true;els.end.hidden=false;els.summary.textContent=`You identified all ${countries.length} flags in ${time()} with ${accuracy}% accuracy.`;return}locked=false;current=queue.shift();els.flag.src=`https://flagcdn.com/${current.code}.svg`;els.flag.alt=`Flag to identify, question ${solved+1} of ${countries.length}`;els.feedback.textContent="Choose the country name.";const choices=shuffle([current,...shuffle(countries.filter(c=>c!==current)).slice(0,3)]);els.answers.replaceChildren(...choices.map(country=>{const button=document.createElement("button");button.type="button";button.className="answer";button.textContent=country.name;button.addEventListener("click",()=>guess(button,country));return button}))}
    function guess(button,country){if(locked)return;attempts++;if(country===current){locked=true;button.classList.add("correct");solved++;updateStats();els.feedback.textContent="Correct!";setTimeout(next,450)}else{button.classList.add("wrong");button.disabled=true;els.feedback.textContent="Not quite—try again."}}
    function start(){clearInterval(timerId);queue=shuffle(countries);solved=0;attempts=0;startedAt=Date.now();els.round.hidden=false;els.end.hidden=true;updateStats();timerId=setInterval(updateStats,1000);next()}
    els.restart.addEventListener("click",start);start();
  </script>
</body>
</html>
