<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo de la hora</title>
  <style>
    :root{color-scheme:dark;--yellow:#facc15;--panel:#171717;--ink:#fafafa}*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{height:100%;margin:0}body{overflow:hidden;background:#090909;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100%;display:grid;place-items:center;padding:5rem 8rem;text-align:center;cursor:pointer}.eyebrow{margin:0 0 1rem;color:var(--yellow);font-size:clamp(1rem,2vw,1.5rem);font-weight:900;letter-spacing:.18em;text-transform:uppercase}#timeWord{margin:0;max-width:16ch;font-size:clamp(3.2rem,9vw,8rem);line-height:.98;text-wrap:balance}#count{margin:1.5rem 0 0;color:#a3a3a3;font-size:clamp(1rem,2vw,1.35rem);font-weight:700}button{border:3px solid #000;border-radius:0;background:#fff;color:#111;box-shadow:4px 4px 0 #000;cursor:pointer;font:900 1rem/1 system-ui}button:hover,button:focus-visible{background:var(--yellow);outline:3px solid #fff}.side-controls{position:fixed;left:14px;top:50%;z-index:3;display:grid;gap:12px;transform:translateY(-50%)}.side-controls button{width:64px;min-height:58px;padding:8px 5px;font-size:1.8rem}#next{position:fixed;right:22px;bottom:22px;min-width:150px;min-height:58px;padding:0 22px;background:var(--yellow)}dialog{width:min(560px,calc(100vw - 32px));height:min(650px,82vh);padding:0;border:3px solid #000;border-radius:0;background:var(--panel);color:var(--ink);box-shadow:8px 8px 0 #000;overflow:hidden}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#222;border-bottom:2px solid #000}.dialog-head h2{margin:0}.dialog-head button{padding:12px 16px}#historyList{height:calc(100% - 69px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:0;padding:16px;list-style:none}#historyList li{flex:0 0 auto;padding:14px;border:1px solid #404040;background:#111;font-size:1.1rem;font-weight:800}.history-time{color:var(--yellow);margin-left:.5rem}.empty{color:#a3a3a3}@media(max-width:650px){main{padding:5rem 1rem 8rem 5.5rem}.side-controls{left:8px}.side-controls button{width:58px}#next{right:12px;bottom:12px}}
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"><div><p class="eyebrow">Bingo de la hora</p><h1 id="timeWord">Toca para empezar</h1><p id="count">0 de 70 horas</p></div></main>
  <div class="side-controls" aria-label="Controles del bingo"><button id="history" type="button" aria-label="Ver horas anteriores" title="Ver horas anteriores">☰</button><button id="reset" type="button" aria-label="Reiniciar el bingo" title="Reiniciar el bingo">↻</button></div>
  <button id="next" type="button">Otra hora</button>
  <dialog id="historyDialog"><div class="dialog-head"><h2>Horas anteriores</h2><button id="close" type="button">Cerrar</button></div><ul id="historyList"></ul></dialog>
  <script>
    const TIMES=['12:00','12:15','12:30','12:45','12:55','1:00','1:10','1:15','1:25','1:30','1:40','2:00','2:05','2:15','2:20','2:30','2:45','3:00','3:10','3:15','3:25','3:30','3:50','4:00','4:05','4:15','4:20','4:30','4:45','5:00','5:10','5:15','5:25','5:30','5:55','6:00','6:05','6:15','6:20','6:30','6:45','7:00','7:10','7:15','7:25','7:30','7:50','8:00','8:05','8:15','8:20','8:30','8:45','9:00','9:10','9:15','9:25','9:30','9:55','10:00','10:05','10:15','10:20','10:30','10:45','11:00','11:10','11:15','11:25','11:30'];
    const HOURS=['doce','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once'];
    const MINUTES={5:'cinco',10:'diez',15:'cuarto',20:'veinte',25:'veinticinco',30:'media'};
    function spanishTime(time){let[hour,minute]=time.split(':').map(Number);const subtract=minute>30;if(subtract)hour=hour%12+1;const opening=hour===1?'Es la una':`Son las ${HOURS[hour%12]}`;if(minute===0)return opening+" en punto";const amount=subtract?60-minute:minute;return `${opening} ${subtract?'menos':'y'} ${MINUTES[amount]}`}
    const timeWord=document.querySelector('#timeWord'),count=document.querySelector('#count'),list=document.querySelector('#historyList'),dialog=document.querySelector('#historyDialog');let remaining=[],called=[];
    function renderHistory(){list.innerHTML='';if(!called.length){const li=document.createElement('li');li.className='empty';li.textContent='Todavía no hay horas.';list.append(li);return}[...called].reverse().forEach(time=>{const li=document.createElement('li'),words=document.createElement('span');li.textContent=time;words.className='history-time';words.textContent=spanishTime(time);li.append(words);list.append(li)})}
    function reset(){remaining=[...TIMES];called=[];timeWord.textContent='Toca para empezar';count.textContent=`0 de ${TIMES.length} horas`;renderHistory()}
    function draw(){if(!remaining.length){timeWord.textContent='Todas las horas';return}const i=Math.floor(Math.random()*remaining.length),time=remaining.splice(i,1)[0];called.push(time);timeWord.textContent=spanishTime(time);count.textContent=`${called.length} de ${TIMES.length} horas`;renderHistory()}
    document.querySelector('#next').addEventListener('click',draw);document.querySelector('#stage').addEventListener('click',draw);document.querySelector('#history').addEventListener('click',()=>dialog.showModal());document.querySelector('#close').addEventListener('click',()=>dialog.close());document.querySelector('#reset').addEventListener('click',()=>{if(!called.length||confirm('¿Reiniciar el bingo y borrar la lista?'))reset()});addEventListener('keydown',e=>{if(!dialog.open&&(e.code==='Space'||e.code==='ArrowRight')){e.preventDefault();draw()}});addEventListener('contextmenu',e=>e.preventDefault());reset();
  </script>
</body></html>
