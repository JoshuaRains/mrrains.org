<!DOCTYPE html>

  <style>

      position: fixed;
      top: 0; left: 0;

      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;

    .modal-content {
      background: #fff;

      border-radius: 8px;

      min-width: 260px;
      box-shadow: 0 2px 14px rgba(0,0,0,.17);

    .modal-content input,
    .modal-content select,

      width: 90%;
      margin-top: 12px;
      padding: 8px;
      border-radius: 5px;

    }
    .modal-content .error-msg {
      color: #d32f2f;
      min-height: 1.2em;
      margin-top: 6px;
      font-size: 0.99em;
    }
    /* --- (Your other styles unchanged, omitted for brevity) --- */
    /* Add your .input-container, .vocabulary-item, etc., here as before. */
    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;

      flex: 1;
      padding: 10px;

      padding: 10px 20px;

      border-radius: 5px;

      transition: background-color 0.3s;

    .section-header {

      color: #333;
    }
    .accent-button:hover { background-color: #dee2e6; }
    input[type="text"]:focus {
      outline: none;
      border-color: #80bdff;
      box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
    }
  </style>
</head>
<body>
  <!-- Login modal (step 1) -->
  <div id="loginModal" class="modal-backdrop" style="display:flex;">
    <div class="modal-content">
      <h2>Enter Class Password</h2>

  <!-- Teacher password modal (step 2) -->

  <!-- Class period modal (step 3) -->
  <div id="classModal" class="modal-backdrop" style="display:none;">
    <div class="modal-content">
      <h2>Select Class Period</h2>
      <select id="classSelect">
        <option value="1">1st Period</option>
        <option value="2">2nd Period</option>

  <!-- Main content (hidden until authentication passes) -->
  <div class="container">
    <h1>Vocabulary List - Teacher View</h1>
    <div class="input-container">
      <input type="text" id="spanishWord" placeholder="Spanish word">
      <div class="accent-buttons">
        <button class="accent-button" onclick="insertAccent('á')">á</button>
        <button class="accent-button" onclick="insertAccent('é')">é</button>
        <button class="accent-button" onclick="insertAccent('í')">í</button>

        <button class="accent-button" onclick="insertAccent('ú')">ú</button>
        <button class="accent-button" onclick="insertAccent('ñ')">ñ</button>
        <button class="accent-button" onclick="insertAccent('ü')">ü</button>

    <button id="voteBtn" style="margin-left:10px;">Start Vote</button>
<input type="number" id="voteCount" value="5" min="2" max="20" style="width:60px;margin-left:8px;" title="Number of words to vote for">
<button id="resetBtn" style="margin-left:10px;background:#9e9e9e;">Reset Votes</button>
<span id="ballotCount" style="margin-left:12px;font-weight:bold;"></span>




    <h2 class="section-header">Pending Approval</h2>

    <h2 class="section-header">Approved Vocabulary</h2>
    <div id="approvedList"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
    import {
      getDatabase, ref, push,
      onValue, remove, update, get, set
    } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

    // Firebase config and constants
    const firebaseConfig = {
      apiKey: "AIzaSyBBxUdOHCB1fJI9mZgYHJ0HCg6p_8R_1-s",
      authDomain: "interactive-whiteboard-8bc1e.firebaseapp.com",
      projectId: "interactive-whiteboard-8bc1e",
      storageBucket: "interactive-whiteboard-8bc1e.firebasestorage.app",
      messagingSenderId: "403793324386",
      appId: "1:403793324386:web:c5f8da9579cd97f935a43b"
    };
    const SHARED_EMAIL = "classroom@myapp.com"; // <-- use your shared classroom email
    const TEACHER_PW_PATH = "teacher_password"; // Location in DB for teacher password

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const auth = getAuth(app);

    // Modal DOM
    const loginModal = document.getElementById('loginModal');
    const loginPassword = document.getElementById('loginPassword');
    const loginButton = document.getElementById('loginButton');
    const loginError = document.getElementById('loginError');
    const teacherPwModal = document.getElementById('teacherPwModal');
    const teacherPwInput = document.getElementById('teacherPwInput');
    const teacherPwButton = document.getElementById('teacherPwButton');
    const teacherPwError = document.getElementById('teacherPwError');
    const classModal = document.getElementById('classModal');
    const select = document.getElementById('classSelect');
    const mainContainer = document.querySelector('.container');

    // Modal flow
    function showModal(id) {
      loginModal.style.display = 'none';
      teacherPwModal.style.display = 'none';
      classModal.style.display = 'none';
      if (id === 'login') loginModal.style.display = 'flex';
      if (id === 'teacher') teacherPwModal.style.display = 'flex';
      if (id === 'class') classModal.style.display = 'flex';
    }

    // ---- Login Modal (step 1) ----
    loginButton.onclick = tryLogin;
    loginPassword.onkeydown = e => { if(e.key==='Enter') tryLogin(); };
    function tryLogin() {
      const email = SHARED_EMAIL;
      const pass  = loginPassword.value;
      loginError.textContent = '';
      if (!pass) {
        loginError.textContent = "Please enter the password.";
        return;
      }
      loginButton.disabled = true;
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => {
          loginButton.disabled = false;
          loginPassword.value = '';
          showModal('teacher');
          setTimeout(() => teacherPwInput.focus(), 100);
        })
        .catch(err => {
          loginError.textContent = "Incorrect password. Try again.";
          loginButton.disabled = false;
        });
    }

    // ---- Teacher Password Modal (step 2) ----
    teacherPwButton.onclick = tryTeacherPassword;
    teacherPwInput.onkeydown = e => { if(e.key==='Enter') tryTeacherPassword(); };
    function tryTeacherPassword() {
      teacherPwError.textContent = '';
      teacherPwButton.disabled = true;
      const typedPw = teacherPwInput.value.trim();
      if (!typedPw) {
        teacherPwError.textContent = "Please enter the teacher password.";
        teacherPwButton.disabled = false;
        return;
      }
      get(ref(db, TEACHER_PW_PATH)).then(snap => {
        const teacherPw = snap.val();
        if (teacherPw === typedPw) {
          teacherPwInput.value = '';
          showModal('class');
          setTimeout(() => select.focus(), 100);
        } else {
          teacherPwError.textContent = "Incorrect teacher password.";
          teacherPwButton.disabled = false;
          teacherPwInput.focus();
        }
      }).catch(err => {
        teacherPwError.textContent = "Could not verify password. Try again.";
        teacherPwButton.disabled = false;
        teacherPwInput.focus();
      });
    }

    // ---- Class Modal (step 3) ----
    document.getElementById('confirmClass').onclick = () => {
      showModal(null);
      mainContainer.style.display = '';
      initApp(select.value);
    };

    // On load, show login modal and hide everything else
    showModal('login');
    mainContainer.style.display = 'none';

    // --- Main app logic (your code) ---
   function initApp(classPeriod) {
  const pendingVocabRef  = ref(db, `pending_vocabulary/period${classPeriod}`);
  const approvedVocabRef = ref(db, `approved_vocabulary/period${classPeriod}`);
  const timerRef = ref(db, `timer/period${classPeriod}`);
  const voteRef = ref(db, `vote/period${classPeriod}`);
  const votesRef = ref(db, `votes/period${classPeriod}`);
  let voteActive = false;
  let voteWords = [];
  let voteCount = 5;

      mainContainer.style.display = 'block';


  // Voting controls
  const voteBtn = document.getElementById('voteBtn');
  const voteCountInput = document.getElementById('voteCount');
  
  const resultsList = document.getElementById('resultsList');

const ballotCountEl = document.getElementById('ballotCount');
const submissionsRef = ref(db, `submissions/period${classPeriod}`);

onValue(submissionsRef, snap => {
  const all = snap.val() || {};
  ballotCountEl.textContent = `Ballots: ${Object.keys(all).length}`;
});



voteBtn.onclick = async function() {
  if (!voteActive) {
    // Start Vote (no resetting here)
    voteCount = Math.max(2, Math.min(20, parseInt(voteCountInput.value)||5));
    const snapshot = await get(approvedVocabRef);
    const vocabData = snapshot.val();
    if (!vocabData) { alert("No approved vocabulary to vote on."); return; }

    const entries = Object.entries(vocabData)
      .sort(([,a],[,b]) => b.timestamp - a.timestamp);

    if (entries.length < voteCount) {
      alert(`Not enough words to vote. Need at least ${voteCount}.`);
      return;
    }

    const voteWords = entries.map(([id]) => id);
    await set(voteRef, { active: true, words: voteWords, count: voteCount, timestamp: Date.now() });
    voteActive = true;
  } else {
    // Stop Vote (don’t wipe words unless you want to)
    await set(voteRef, { active: false });
    voteActive = false;
  }
};

const resetBtn = document.getElementById('resetBtn');
resetBtn.onclick = async () => {
  const ok = confirm('Reset all votes and clear all submitted ballots for this class?');
  if (!ok) return;

  // 1) Zero the votes for all approved vocabulary in this period
  const approvedSnap = await get(approvedVocabRef);
  const approved = approvedSnap.val() || {};
  const updates = {};
  for (const id of Object.keys(approved)) {
    updates[`approved_vocabulary/period${classPeriod}/${id}/votes`] = 0;
  }
  if (Object.keys(updates).length) {
    await update(ref(db), updates);
  }

  // 2) Clear submissions and per-user ballots for this period
  await Promise.all([
    remove(ref(db, `submissions/period${classPeriod}`)),
    remove(ref(db, `votes/period${classPeriod}`))
  ]);

  // (Optional) keep current vote state as-is (active or not). No change here.
};




  // Listen for vote state changes
  onValue(voteRef, snap => {
    const data = snap.val();
    voteActive = !!(data && data.active);
    voteWords = data && data.words ? data.words : [];
    voteCount = data && data.count ? data.count : 5;

    voteBtn.textContent = voteActive ? "Stop Vote" : "Start Vote";
    voteBtn.style.background = voteActive ? "#d32f2f" : "#4CAF50";
    voteBtn.style.color = voteActive ? "#fff" : "";
    voteCountInput.disabled = voteActive;
  });



  // --- Existing logic for adding/editing/approving vocab, timer, etc ---
  // (No changes from your existing logic!)
  window.addWord = function() {
  const s = document.getElementById('spanishWord').value.trim();
  const e = document.getElementById('englishTranslation').value.trim();
  if (!s || !e) return;
  push(approvedVocabRef, {
    spanish: s,
    english: e,
    timestamp: Date.now(),
    votes: 0
  });
  document.getElementById('spanishWord').value = '';
  document.getElementById('englishTranslation').value = '';
};


  window.editWord = function(btn, id) {
    const info = btn.closest('.vocabulary-item').querySelector('.word-info');
    const [os, oe] = info.querySelector('.original-text').textContent.split('|');
    info.innerHTML = `
      <input type="text" class="edit-spanish" value="${os}" />
      <input type="text" class="edit-english" value="${oe}" />
      <button onclick="saveEdit(this,'${id}')">Save</button>
    `;
  };

  window.saveEdit = function(btn, id) {
    const item = btn.closest('.vocabulary-item');
    const newS = item.querySelector('.edit-spanish').value.trim();
    const newE = item.querySelector('.edit-english').value.trim();
    if (!newS || !newE) return;
    const wr = ref(db, `pending_vocabulary/period${classPeriod}/${id}`);
    update(wr, { spanish: newS, english: newE })
      .then(() => {
        const info = item.querySelector('.word-info');
        info.innerHTML = `
          <strong>${newS}</strong> – ${newE}
          <p class="original-text" style="display:none;">
            ${newS}|${newE}
          </p>`;
      })
      .catch(console.error);
  };

window.approveWord = function(id) {
  const wr = ref(db, `pending_vocabulary/period${classPeriod}/${id}`);
  get(wr).then(snap => {
    const w = snap.val();
    if (!w) return;
    push(approvedVocabRef, {
      spanish: w.spanish,
      english: w.english,
      originalSpanish: w.originalSpanish || w.spanish,
      originalEnglish: w.originalEnglish || w.english,
      timestamp: Date.now(),
      votes: 0
    });
    remove(wr);
  });
};


  window.deleteWord = function(id, list) {
    remove(ref(db, `${list}/period${classPeriod}/${id}`));
  };

  function createVocabularyItem(w, id, isPending) {
    const d = document.createElement('div');
    d.className = `vocabulary-item ${isPending ? 'pending' : ''}`;
    d.innerHTML = `
      <div class="word-info">
        <strong>${w.spanish}</strong> – ${w.english}
        ${isPending ? `<p class="original-text" style="display:none;">
          ${w.spanish}|${w.english}
        </p>` : ''}
      </div>
      <div class="actions">
        <button class="translate"
          onclick="window.open(
            'https://www.spanishdict.com/translate/${encodeURIComponent(w.spanish)}',
            '_blank'
          )">SpanishDict</button>
        <button class="lightbulb">💡</button>
        ${isPending ? `
          <button class="edit" onclick="editWord(this,'${id}')">✏️</button>
          <button class="approve" onclick="approveWord('${id}')">✓</button>
        ` : ``}
        <button class="deny"
          onclick="deleteWord(
            '${id}',
            '${isPending ? 'pending_vocabulary' : 'approved_vocabulary'}'
          )">🗑️</button>
      </div>`;
    return d;
  }

  onValue(pendingVocabRef, snap => {
    const list = document.getElementById('pendingList');
    list.innerHTML = '';
    const words = snap.val();
    if (words) {
      Object.entries(words)
        .sort(([,a],[,b]) => b.timestamp - a.timestamp)
        .forEach(([id, w]) => list.appendChild(createVocabularyItem(w, id, true)));
    }
  });

onValue(approvedVocabRef, snap => {
  const list = document.getElementById('approvedList');
  list.innerHTML = '';
  const words = snap.val();
  if (!words) return;

  // Normalize votes to 0 when missing, then sort by votes desc, timestamp desc
  const entries = Object.entries(words)
    .map(([id, w]) => [id, { ...w, votes: w.votes || 0, timestamp: w.timestamp || 0 }])
    .sort(([,a],[,b]) => (b.votes - a.votes) || (b.timestamp - a.timestamp));

  entries.forEach(([id, w]) => {
    const d = document.createElement('div');
    d.className = 'vocabulary-item';
    d.innerHTML = `
      <div class="word-info">
        <strong>${w.spanish}</strong> – ${w.english}
      </div>
      <div class="actions">
        <span style="margin-right:8px;">${w.votes} pts</span>
        <button class="translate"
          onclick="window.open('https://www.spanishdict.com/translate/${encodeURIComponent(w.spanish)}','_blank')">
          SpanishDict
        </button>
        <button class="deny" onclick="deleteWord('${id}','approved_vocabulary')">🗑️</button>
      </div>`;
    list.appendChild(d);
  });
});



  // --- Timer logic (as before) ---
  setupTimer(classPeriod);

  function setupTimer(classPeriod) {
    const timerRef = ref(db, `timer/period${classPeriod}`);
    const minutesSelect = document.getElementById('timerMinutes');
    const startBtn = document.getElementById('startTimer');
    const cancelBtn = document.getElementById('cancelTimer');
    const status = document.getElementById('timerStatus');
    const timerDisplay = document.getElementById('timerDisplay');
    let timerInterval;

    function setDisabled(disabled) {
      minutesSelect.disabled = disabled;
      startBtn.disabled = disabled;
    }

    function updateTimer(ts) {
      clearInterval(timerInterval);
      function render() {
        const now = Date.now();
        let diff = Math.max(0, ts - now);
        if (diff <= 0) {
          timerDisplay.textContent = '⏰ Time is up!';
          clearInterval(timerInterval);
          return;
        }
        const min = Math.floor(diff/60000);
        const sec = Math.floor((diff%60000)/1000);
        timerDisplay.textContent = `⏳ Time left: ${min}:${sec.toString().padStart(2,'0')}`;
      }
      render();
      timerInterval = setInterval(render, 1000);
    }

    startBtn.onclick = () => {
      const mins = parseInt(minutesSelect.value, 10);
      const endTimestamp = Date.now() + mins * 60 * 1000;
      set(timerRef, endTimestamp);
      setDisabled(true);
      status.textContent = `Timer started for ${mins} min${mins > 1 ? 's' : ''}`;
    };

    cancelBtn.onclick = () => {
      set(timerRef, Date.now());
      setDisabled(false);
      status.textContent = 'Timer cancelled.';
      timerDisplay.textContent = '';
    };

    onValue(timerRef, snap => {
      const ts = snap.val();
      if (!ts || ts <= Date.now()) {
        setDisabled(false);
        status.textContent = 'Timer not running.';
        timerDisplay.textContent = '';
        clearInterval(timerInterval);
        return;
      }
      setDisabled(true);
      updateTimer(ts);
      const mins = Math.round((ts - Date.now()) / 60000);
      status.textContent = `Timer running: ends in ${mins} min${mins !== 1 ? 's' : ''}`;
    });
  }
}

    // Accent button
    window.insertAccent = function(accent) {
      const input = document.getElementById('spanishWord');
      if (!input) return;
      const [start, end] = [input.selectionStart, input.selectionEnd];
      input.value = input.value.slice(0, start) + accent + input.value.slice(end);
      input.focus();
      input.setSelectionRange(start + 1, start + 1);
    };
  </script>
</body>
</html>
