<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classroom POS Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
	--mono: Consolas, Menlo, Monaco, "Courier New", monospace;
	--shadow: rgba(0,0,0,.55);
}

/* === PAGE LAYOUT === */
html, body{
	height:100%;
	margin:0;
	background:#0a0c10;
	font-family:system-ui, Arial, sans-serif;
}

/* 5% top/bottom margin, center horizontally */
.wrap{
	min-height:100%;
	display:flex;
	justify-content:center;
	align-items:flex-start;
	padding-top:5vh;
	padding-bottom:5vh;
	box-sizing:border-box;
}

/* WIDTH UNCHANGED */
.terminal{
	width:1080px;
	height:90vh;                 /* total height = screen minus margins */
	background:linear-gradient(#202834,#141a22);
	border-radius:22px;
	padding:16px;
	box-shadow:0 18px 50px var(--shadow);
	box-sizing:border-box;
	display:flex;
}

.screen{
	flex:1;
	background:linear-gradient(#d7dee6,#c9d2db);
	border-radius:14px;
	padding:12px;
	border:2px solid #3a4656;
	box-shadow:inset 0 0 0 2px #91a1b3;
	display:flex;
	flex-direction:column;
	gap:10px;
	box-sizing:border-box;
}

/* === TOP BAR === */
.topbar{
	background:linear-gradient(#f7f2a4,#e6dd74);
	border:1px solid #9b9244;
	border-radius:8px;
	padding:6px 10px;
	display:flex;
	justify-content:space-between;
	align-items:center;
	font-family:var(--mono);
	font-size:13px;
}

/* === MAIN GRID === */
.main{
	flex:1;
	display:grid;
	grid-template-columns:1.1fr 1fr;
	gap:10px;
	min-height:0;   /* CRITICAL for inner scrolling */
}

/* === LEFT === */
.leftPane{
	background:linear-gradient(#f2f6fb,#e6edf5);
	border:1px solid #8ea0b2;
	border-radius:10px;
	padding:8px;
	display:flex;
	flex-direction:column;
	gap:8px;
	min-height:0;
	box-sizing:border-box;
}

/* Journal takes remaining height */
.journal{
	flex:1;
	border:1px solid #8ea0b2;
	border-radius:8px;
	background:#f7fbff;
	display:flex;
	flex-direction:column;
	overflow:hidden;
	min-height:0;
}

.journalHeader{
	background:linear-gradient(#ffffff,#e7eef6);
	border-bottom:1px solid #9eb0c2;
	padding:6px 8px;
	font-family:var(--mono);
	font-size:12px;
}

/* ✅ ONLY THIS SCROLLS */
.lines{
	flex:1;
	font-family:var(--mono);
	font-size:12px;
	overflow-y:auto;
	overflow-x:hidden;
	background:#fbfdff;
}

.lineRow{
	display:grid;
	grid-template-columns:1fr 50px 70px;
	gap:6px;
	padding:4px 8px;
	border-bottom:1px solid #e1e8f0;
	background:#fbfdff;
}
.lineRow:nth-child(odd){ background:#f7fbff; }
.lineRow.active{
	background:#e8f0ff;
	outline:2px solid rgba(47,102,181,.4);
}
.lineRow.modifier{
	background:#edf1f6;
}
.lineRow.modifier .name{
	padding-left:18px;
	color:#3a4b5d;
}
.lineRow .qty,
.lineRow .price{
	text-align:right;
}

/* Totals never scroll */
.totals{
	border-top:1px solid #9eb0c2;
	background:linear-gradient(#ffffff,#e7eef6);
	padding:8px;
	font-family:var(--mono);
	font-size:12px;
}

.totalRow{
	display:flex;
	justify-content:space-between;
}
.totalBig{
	font-weight:800;
	color:#8c1d1d;
}

.mini{
	display:flex;
	gap:10px;
	margin-top:6px;
}
.mini .field{
	display:flex;
	gap:6px;
	align-items:center;
	font-family:var(--mono);
	font-size:12px;
}
input{
	font-family:var(--mono);
	font-size:12px;
	padding:4px 6px;
	width:120px;
	border:1px solid #8ea0b2;
	border-radius:4px;
}
.changeBox{
	width:120px;
	padding:4px 6px;
	border:1px solid #8ea0b2;
	border-radius:4px;
	background:#eef3f9;
	font-family:var(--mono);
	text-align:right;
}

/* Status bar fixed height */
.status{
	background:linear-gradient(#ffffff,#e7eef6);
	border:1px solid #93a6ba;
	border-radius:8px;
	padding:6px 10px;
	font-family:var(--mono);
	font-size:12px;
	display:flex;
	justify-content:space-between;
}

/* === RIGHT === */
.rightPane{
	background:linear-gradient(#edf3fb,#dde7f2);
	border:1px solid #8ea0b2;
	border-radius:10px;
	padding:8px;
	display:grid;
	grid-template-rows:1fr auto;
	gap:8px;
	min-height:0;
	box-sizing:border-box;
}

.keys{
	display:grid;
	grid-template-columns:1fr 150px;
	gap:8px;
	min-height:0;
}

.itemGrid{
	display:grid;
	grid-template-columns:repeat(3,1fr);
	grid-auto-rows:56px;
	gap:8px;
	align-content:start;
	overflow:hidden;
}

.sideCol{
	display:grid;
	grid-auto-rows:44px;
	gap:8px;
}

.key{
	display:flex;
	align-items:center;
	justify-content:center;
	text-align:center;
	font-family:var(--mono);
	font-size:14px;
	background:linear-gradient(#e2e7ef,#cfd8e3);
	border:1px solid #7f90a3;
	border-radius:8px;
	cursor:pointer;
	user-select:none;
}
.key.categoryActive{
	background:linear-gradient(#4d83d6,#2d63b3);
	color:#fff;
	border-color:#1c3e73;
}
.key:active{ transform:translateY(1px); }

/* Big bottom buttons restored */
.bottomKeys{
	display:grid;
	grid-template-columns:repeat(5,1fr);
	gap:8px;
}
.bottomKeys .key{
	height:56px;
}

.red{background:linear-gradient(#d24a4a,#a92f2f);color:#fff;}
.dark{background:linear-gradient(#343f4c,#1e2731);color:#e8eef7;}
.amber{background:linear-gradient(#d7a33d,#b07c16);}

</style>
</head>

<body>
<div class="wrap">
<div class="terminal">
<div class="screen">

<div class="topbar">
	<div>Seat 1 : Cash Only</div>
	<div id="catLabel">Category: Main</div>
</div>

<div class="main">

<!-- LEFT -->
<div class="leftPane">
	<div class="journal">
		<div class="journalHeader">Order Journal</div>
		<div class="lines" id="lines"></div>
		<div class="totals">
			<div class="totalRow"><span>Subtotal</span><span id="sub">$0.00</span></div>
			<div class="totalRow"><span>Tax</span><span id="tax">$0.00</span></div>
			<div class="totalRow totalBig"><span>Total</span><span id="total">$0.00</span></div>

			<div class="mini">
				<div class="field">
					<span>Cash Received:</span>
					<input id="cashInput" type="number" step="0.01">
				</div>
				<div class="field">
					<span>Change Due:</span>
					<div class="changeBox" id="changeDue">$0.00</div>
				</div>
			</div>
		</div>
	</div>

	<div class="status">
		<div id="statusMsg">Ready.</div>
		<div id="clock"></div>
	</div>
</div>

<!-- RIGHT -->
<div class="rightPane">
	<div class="keys">
		<div class="itemGrid" id="itemGrid"></div>
		<div class="sideCol" id="sideCol"></div>
	</div>

	<div class="bottomKeys">
		<div class="key red" id="voidLast">Void Last</div>
		<div class="key amber" id="voidItem">Void Item</div>
		<div class="key dark" id="qtyPlus">Qty +</div>
		<div class="key dark" id="qtyMinus">Qty -</div>
		<div class="key dark" id="clearCheck">Clear</div>
	</div>
</div>

</div>
</div>
</div>
</div>

<script>
(function(){
	const TAX_RATE = 0.0875;

	const MENU = {
	Main: [
		{name:"Hamburger",price:1.10},
		{name:"Cheeseburger",price:1.45},
		{name:"Combo Meal",price:5.49}
	],

	Sides: [
		{name:"Fries (Reg)",price:1.29},
		{name:"Fries (Lrg)",price:1.79},
		{name:"Rings (Reg)",price:1.39},
		{name:"Rings (Lrg)",price:1.89}
	],

	Drinks: [
		{name:"Coca-Cola (Reg)",price:1.59},
		{name:"Coca-Cola (Lrg)",price:2.09},

		{name:"Diet Coke (Reg)",price:1.59},
		{name:"Diet Coke (Lrg)",price:2.09},

		{name:"Coke Zero (Reg)",price:1.59},
		{name:"Coke Zero (Lrg)",price:2.09},

		{name:"Sprite (Reg)",price:1.59},
		{name:"Sprite (Lrg)",price:2.09},

		{name:"Fanta (Reg)",price:1.59},
		{name:"Fanta (Lrg)",price:2.09},

		{name:"Dr Pepper (Reg)",price:1.59},
		{name:"Dr Pepper (Lrg)",price:2.09},

		{name:"Water",price:0.00}
	],

	"Add-ons": [

		{name:"Add Cheese",price:0.35,modifier:true},
		{name:"Add Bacon",price:0.75,modifier:true},

		{name:"Add Lettuce",price:0.00,modifier:true},
		{name:"Add Tomato",price:0.00,modifier:true},
		{name:"Add Onion",price:0.00,modifier:true},
		{name:"Add Pickles",price:0.00,modifier:true},

		{name:"Add Mayo",price:0.00,modifier:true},
		{name:"Add Ketchup",price:0.00,modifier:true},
		{name:"Add Mustard",price:0.00,modifier:true},

		{name:"Add Jalapeños",price:0.10,modifier:true},

		{name:"Extra Ice",price:0.00,modifier:true},
		{name:"No Ice",price:0.00,modifier:true}
	],

	Remove: [
		{name:"No Lettuce",price:0.00,modifier:true},
		{name:"No Tomato",price:0.00,modifier:true},
		{name:"No Onion",price:0.00,modifier:true},
		{name:"No Pickles",price:0.00,modifier:true},

		{name:"No Mayo",price:0.00,modifier:true},
		{name:"No Ketchup",price:0.00,modifier:true},
		{name:"No Mustard",price:0.00,modifier:true},

		{name:"No Cheese",price:0.00,modifier:true},
		{name:"No Bacon",price:0.00,modifier:true},

		{name:"No Jalapeños",price:0.00,modifier:true}
	]
};


	let category="Main";
	let lines=[];
	let selected=-1;

	const el={
		lines:document.getElementById("lines"),
		itemGrid:document.getElementById("itemGrid"),
		sideCol:document.getElementById("sideCol"),
		sub:document.getElementById("sub"),
		tax:document.getElementById("tax"),
		total:document.getElementById("total"),
		cash:document.getElementById("cashInput"),
		change:document.getElementById("changeDue"),
		status:document.getElementById("statusMsg"),
		cat:document.getElementById("catLabel")
	};

	function fmt(n){return "$"+n.toFixed(2);}

	function totals(){
		let s=0;
		lines.forEach(l=>s+=l.price*l.qty);
		return {sub:s,tax:s*TAX_RATE,total:s*(1+TAX_RATE)};
	}

	function updateChange(){
		let c=parseFloat(el.cash.value);
		if(!isFinite(c)){el.change.textContent="$0.00";return;}
		let d=c-totals().total;
		el.change.textContent=d>=0?fmt(d):"OWES "+fmt(-d);
	}

	function renderTotals(){
		let t=totals();
		el.sub.textContent=fmt(t.sub);
		el.tax.textContent=fmt(t.tax);
		el.total.textContent=fmt(t.total);
		updateChange();
	}

	function renderLines(){
		el.lines.innerHTML="";
		lines.forEach((l,i)=>{
			let r=document.createElement("div");
			r.className="lineRow"+(l.modifier?" modifier":"")+(i===selected?" active":"");
			r.innerHTML="<div class='name'>"+l.name+"</div><div class='qty'>"+(l.modifier?"":l.qty)+"</div><div class='price'>"+fmt(l.price*l.qty)+"</div>";
			r.onclick=function(){selected=i;renderLines();};
			el.lines.appendChild(r);
		});
	}

	function renderItems(){
		el.itemGrid.innerHTML="";
		MENU[category].forEach(it=>{
			let k=document.createElement("div");
			k.className="key";
			k.textContent=it.name;
			k.onclick=function(){
				if(it.modifier){
					if(selected<0 || lines[selected].modifier){el.status.textContent="Select base item first.";return;}
					lines.splice(selected+1,0,{name:it.name,price:it.price,qty:1,modifier:true});
				}else{
					lines.push({name:it.name,price:it.price,qty:1});
					selected=lines.length-1;
				}
				renderLines();renderTotals();
			};
			el.itemGrid.appendChild(k);
		});
	}

	function renderCats(){
		el.sideCol.innerHTML="";
		Object.keys(MENU).forEach(c=>{
			let k=document.createElement("div");
			k.className="key"+(c===category?" categoryActive":"");
			k.textContent=c;
			k.onclick=function(){
				category=c;
				el.cat.textContent="Category: "+c;
				renderCats();
				renderItems();
			};
			el.sideCol.appendChild(k);
		});
	}

	document.getElementById("voidLast").onclick=function(){
		lines.pop();renderLines();renderTotals();
	};
	document.getElementById("voidItem").onclick=function(){
		if(selected>=0){lines.splice(selected,1);selected=-1;renderLines();renderTotals();}
	};
	document.getElementById("qtyPlus").onclick=function(){
		if(selected>=0&&!lines[selected].modifier){lines[selected].qty++;renderLines();renderTotals();}
	};
	document.getElementById("qtyMinus").onclick=function(){
		if(selected>=0&&!lines[selected].modifier&&lines[selected].qty>1){lines[selected].qty--;renderLines();renderTotals();}
	};
	document.getElementById("clearCheck").onclick=function(){
		lines=[];selected=-1;el.cash.value="";el.change.textContent="$0.00";renderLines();renderTotals();
	};

	el.cash.addEventListener("input",updateChange);

	setInterval(function(){
		document.getElementById("clock").textContent=new Date().toLocaleTimeString();
	},500);

	renderCats();
	renderItems();
	renderTotals();
})();
</script>

</body>
</html>
