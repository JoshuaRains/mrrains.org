<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classroom POS Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
	--mono: Consolas, Menlo, Monaco, "Courier New", monospace;
	--shadow: rgba(0,0,0,.55);
}

/* === PAGE LAYOUT === */
html, body{
	height:100%;
	margin:0;
	background:#0a0c10;
	font-family:system-ui, Arial, sans-serif;
}

/* 5% top/bottom margin, center horizontally */
.wrap{
	min-height:100%;
	display:flex;
	justify-content:center;
	align-items:flex-start;
	padding-top:5vh;
	padding-bottom:5vh;
	box-sizing:border-box;
}

/* WIDTH UNCHANGED */
.terminal{
	width:1080px;
	height:90vh;
	background:linear-gradient(#202834,#141a22);
	border-radius:22px;
	padding:16px;
	box-shadow:0 18px 50px var(--shadow);
	box-sizing:border-box;
	display:flex;
}

.screen{
	flex:1;
	background:linear-gradient(#d7dee6,#c9d2db);
	border-radius:14px;
	padding:12px;
	border:2px solid #3a4656;
	box-shadow:inset 0 0 0 2px #91a1b3;
	display:flex;
	flex-direction:column;
	gap:10px;
	box-sizing:border-box;
}

/* === TOP BAR === */
.topbar{
	background:linear-gradient(#f7f2a4,#e6dd74);
	border:1px solid #9b9244;
	border-radius:8px;
	padding:6px 10px;
	display:flex;
	justify-content:space-between;
	align-items:center;
	font-family:var(--mono);
	font-size:13px;
}

/* === MAIN GRID === */
.main{
	flex:1;
	display:grid;
	grid-template-columns:1.1fr 1fr;
	gap:10px;
	min-height:0;
}

/* === LEFT === */
.leftPane{
	background:linear-gradient(#f2f6fb,#e6edf5);
	border:1px solid #8ea0b2;
	border-radius:10px;
	padding:8px;
	display:flex;
	flex-direction:column;
	gap:8px;
	min-height:0;
	box-sizing:border-box;
}

/* Journal takes remaining height */
.journal{
	flex:1;
	border:1px solid #8ea0b2;
	border-radius:8px;
	background:#f7fbff;
	display:flex;
	flex-direction:column;
	overflow:hidden;
	min-height:0;
}

.journalHeader{
	background:linear-gradient(#ffffff,#e7eef6);
	border-bottom:1px solid #9eb0c2;
	padding:6px 8px;
	font-family:var(--mono);
	font-size:12px;
}

/* ✅ ONLY THIS SCROLLS */
.lines{
	flex:1;
	font-family:var(--mono);
	font-size:12px;
	overflow-y:auto;
	overflow-x:hidden;
	background:#fbfdff;
}

.lineRow{
	display:grid;
	grid-template-columns:1fr 50px 70px;
	gap:6px;
	padding:4px 8px;
	border-bottom:1px solid #e1e8f0;
	background:#fbfdff;
}
.lineRow:nth-child(odd){ background:#f7fbff; }
.lineRow.active{
	background:#e8f0ff;
	outline:2px solid rgba(47,102,181,.4);
}
.lineRow.modifier{
	background:#edf1f6;
}
.lineRow.modifier .name{
	padding-left:18px;
	color:#3a4b5d;
}
.lineRow .qty,
.lineRow .price{
	text-align:right;
}

/* Name cell layout for modifier rows (text + minus button) */
.nameWrap{
	display:flex;
	align-items:center;
	justify-content:space-between;
	gap:8px;
}
.minusBtn{
	width:22px;
	height:18px;
	display:flex;
	align-items:center;
	justify-content:center;
	border-radius:6px;
	border:1px solid #7a2c2c;
	background:linear-gradient(#d24a4a,#a92f2f);
	color:#fff;
	cursor:pointer;
	user-select:none;
	font-family:var(--mono);
	font-size:12px;
	line-height:1;
	flex:0 0 auto;
}
.minusBtn:active{ transform:translateY(1px); }

/* Totals never scroll */
.totals{
	border-top:1px solid #9eb0c2;
	background:linear-gradient(#ffffff,#e7eef6);
	padding:8px;
	font-family:var(--mono);
	font-size:12px;
}

.totalRow{
	display:flex;
	justify-content:space-between;
}
.totalBig{
	font-weight:800;
	color:#8c1d1d;
}

.mini{
	display:flex;
	gap:10px;
	margin-top:6px;
}
.mini .field{
	display:flex;
	gap:6px;
	align-items:center;
	font-family:var(--mono);
	font-size:12px;
}
input{
	font-family:var(--mono);
	font-size:12px;
	padding:4px 6px;
	width:120px;
	border:1px solid #8ea0b2;
	border-radius:4px;
}
.changeBox{
	width:120px;
	padding:4px 6px;
	border:1px solid #8ea0b2;
	border-radius:4px;
	background:#eef3f9;
	font-family:var(--mono);
	text-align:right;
}

/* Status bar fixed height */
.status{
	background:linear-gradient(#ffffff,#e7eef6);
	border:1px solid #93a6ba;
	border-radius:8px;
	padding:6px 10px;
	font-family:var(--mono);
	font-size:12px;
	display:flex;
	justify-content:space-between;
}

/* === RIGHT === */
.rightPane{
	background:linear-gradient(#edf3fb,#dde7f2);
	border:1px solid #8ea0b2;
	border-radius:10px;
	padding:8px;
	display:grid;
	grid-template-rows:1fr auto;
	gap:8px;
	min-height:0;
	box-sizing:border-box;
}

.keys{
	display:grid;
	grid-template-columns:1fr 150px;
	gap:8px;
	min-height:0;
}

.itemGrid{
	display:grid;
	grid-template-columns:repeat(3,1fr);
	grid-auto-rows:56px;
	gap:8px;
	align-content:start;
	overflow:hidden;
}

.sideCol{
	display:grid;
	grid-auto-rows:44px;
	gap:8px;
}

.key{
	display:flex;
	align-items:center;
	justify-content:center;
	text-align:center;
	font-family:var(--mono);
	font-size:14px;
	background:linear-gradient(#e2e7ef,#cfd8e3);
	border:1px solid #7f90a3;
	border-radius:8px;
	cursor:pointer;
	user-select:none;
}
.key.categoryActive{
	background:linear-gradient(#4d83d6,#2d63b3);
	color:#fff;
	border-color:#1c3e73;
}
.key:active{ transform:translateY(1px); }

/* Big bottom buttons restored */
.bottomKeys{
	display:grid;
	grid-template-columns:repeat(5,1fr);
	gap:8px;
}
.bottomKeys .key{
	height:56px;
}

.red{background:linear-gradient(#d24a4a,#a92f2f);color:#fff;}
.dark{background:linear-gradient(#343f4c,#1e2731);color:#e8eef7;}
.amber{background:linear-gradient(#d7a33d,#b07c16);}
</style>
</head>

<body>
<div class="wrap">
<div class="terminal">
<div class="screen">

<div class="topbar">
	<div>Seat 1 : Cash Only</div>
	<div id="catLabel">Category: Main</div>
</div>

<div class="main">

<!-- LEFT -->
<div class="leftPane">
	<div class="journal">
		<div class="journalHeader">Order Journal</div>
		<div class="lines" id="lines"></div>
		<div class="totals">
			<div class="totalRow"><span>Subtotal</span><span id="sub">$0.00</span></div>
			<div class="totalRow"><span>Tax</span><span id="tax">$0.00</span></div>
			<div class="totalRow totalBig"><span>Total</span><span id="total">$0.00</span></div>

			<div class="mini">
				<div class="field">
					<span>Cash Received:</span>
					<input id="cashInput" type="number" step="0.01">
				</div>
				<div class="field">
					<span>Change Due:</span>
					<div class="changeBox" id="changeDue">$0.00</div>
				</div>
			</div>
		</div>
	</div>

	<div class="status">
		<div id="statusMsg">Ready.</div>
		<div id="clock"></div>
	</div>
</div>

<!-- RIGHT -->
<div class="rightPane">
	<div class="keys">
		<div class="itemGrid" id="itemGrid"></div>
		<div class="sideCol" id="sideCol"></div>
	</div>

	<div class="bottomKeys">
		<div class="key red" id="voidLast">Void Last</div>
		<div class="key amber" id="voidItem">Void Item</div>
		<div class="key dark" id="qtyPlus">Qty +</div>
		<div class="key dark" id="qtyMinus">Qty -</div>
		<div class="key dark" id="clearCheck">Clear</div>
	</div>
</div>

</div>
</div>
</div>
</div>

<script>
(function(){
	const TAX_RATE = 0.0875;

	/* Every ingredient has a specific price.
	   Sauces are only a few cents, and all different. */
	const ING = {
		cheese:		{label:"Cheese",	price:0.75},
		bacon:		{label:"Bacon",		price:1.25},
		lettuce:	{label:"Lettuce",	price:0.15},
		tomato:		{label:"Tomato",	price:0.20},
		onion:		{label:"Onion",		price:0.15},
		pickles:	{label:"Pickles",	price:0.15},
		mayo:		{label:"Mayo",		price:0.05}, // sauce cents
		ketchup:	{label:"Ketchup",	price:0.03}, // sauce cents
		mustard:	{label:"Mustard",	price:0.02}, // sauce cents
		jalapenos:	{label:"Jalapeños",	price:0.35}
	};

	const DEFAULT_BUILD = {
		"Hamburger": ["lettuce","tomato","pickles","onion","ketchup","mustard"],
		"Cheeseburger": ["cheese","tomato","lettuce","pickles","onion","ketchup","mustard"],
		"Chicken Sandwich": ["lettuce","tomato","pickles","mayo"]
	};

	function extraName(key){ return "Extra " + ING[key].label; }

	const MENU = {
		Main: [
			{name:"Hamburger",price:4.29},
			{name:"Cheeseburger",price:4.79},
			{name:"Chicken Sandwich",price:5.69},

			{name:"Chicken Nuggets (5 pc)",price:3.50},
			{name:"Chicken Nuggets (10 pc)",price:7.00},
			{name:"Chicken Nuggets (20 pc)",price:14.00}

		],

		Sides: [
			{name:"Fries (Reg)",price:2.49},
			{name:"Fries (Lrg)",price:3.29},
			{name:"Rings (Reg)",price:2.79},
			{name:"Rings (Lrg)",price:3.59}
		],

		Drinks: [
			{name:"Coca-Cola (Reg)",price:2.29},
			{name:"Coca-Cola (Lrg)",price:2.89},

			{name:"Diet Coke (Reg)",price:2.29},
			{name:"Diet Coke (Lrg)",price:2.89},

			{name:"Coke Zero (Reg)",price:2.29},
			{name:"Coke Zero (Lrg)",price:2.89},

			{name:"Sprite (Reg)",price:2.29},
			{name:"Sprite (Lrg)",price:2.89},

			{name:"Fanta (Reg)",price:2.29},
			{name:"Fanta (Lrg)",price:2.89},

			{name:"Dr Pepper (Reg)",price:2.29},
			{name:"Dr Pepper (Lrg)",price:2.89},

			{name:"Water",price:0.00}
		],

		"Add-ons": [] // built below (extras only)
	};

	(function buildAddOns(){
		const add = [];
		Object.keys(ING).forEach(key=>{
			add.push({
				name: extraName(key),
				price: ING[key].price,
				modifier: true,
				modType: "extra",
				ingKey: key
			});
		});
		// Optional drink ice modifiers (priced)
		add.push({name:"Extra Ice", price:0.01, modifier:true, modType:"drink"});
		add.push({name:"No Ice", price:0.00, modifier:true, modType:"drink"});
		MENU["Add-ons"] = add;
	})();

	let category="Main";
	let lines=[];
	let selected=-1;
	let nextGroupId=1;

	const el={
		lines:document.getElementById("lines"),
		itemGrid:document.getElementById("itemGrid"),
		sideCol:document.getElementById("sideCol"),
		sub:document.getElementById("sub"),
		tax:document.getElementById("tax"),
		total:document.getElementById("total"),
		cash:document.getElementById("cashInput"),
		change:document.getElementById("changeDue"),
		status:document.getElementById("statusMsg"),
		cat:document.getElementById("catLabel")
	};

	function fmt(n){
		const sign = n < 0 ? "-" : "";
		return sign + "$" + Math.abs(n).toFixed(2);
	}

	function baseIndexFromSelection(idx){
		if(idx < 0) return -1;
		if(!lines[idx]) return -1;
		if(!lines[idx].modifier) return idx;
		let i = idx-1;
		while(i >= 0 && lines[i].modifier) i--;
		return i;
	}

	function getBlockRange(baseIndex){
		let start = baseIndex;
		let end = baseIndex;
		while(end+1 < lines.length && lines[end+1].modifier) end++;
		return {start, end};
	}

	function blockUnitTotal(baseIndex){
		const r = getBlockRange(baseIndex);
		let unit = 0;
		for(let i=r.start;i<=r.end;i++){
			unit += lines[i].price; // base + modifiers (per 1 item)
		}
		return unit;
	}

	function totals(){
		let s = 0;
		for(let i=0;i<lines.length;i++){
			if(lines[i].modifier) continue;
			const unit = blockUnitTotal(i);
			s += unit * lines[i].qty;
		}
		return {sub:s,tax:s*TAX_RATE,total:s*(1+TAX_RATE)};
	}

	function updateChange(){
		let c=parseFloat(el.cash.value);
		if(!isFinite(c)){el.change.textContent="$0.00";return;}
		let d=c-totals().total;
		el.change.textContent=d>=0?fmt(d):"OWES "+fmt(-d);
	}

	function renderTotals(){
		let t=totals();
		el.sub.textContent=fmt(t.sub);
		el.tax.textContent=fmt(t.tax);
		el.total.textContent=fmt(t.total);
		updateChange();
	}

	function insertModifierAfterBlock(baseIdx, obj){
		const r = getBlockRange(baseIdx);
		lines.splice(r.end+1, 0, obj);
	}

	function addBaseItem(it){
		const groupId = nextGroupId++;
		const build = DEFAULT_BUILD[it.name] || null;

		if(build && build.length){
			let buildSum = 0;
			build.forEach(k=>buildSum += ING[k].price);
			const core = Math.max(0, it.price - buildSum);

			lines.push({
				name: it.name,
				price: core,         // core portion
				qty: 1,
				modifier: false,
				groupId,
				buildable: true
			});
			selected = lines.length-1;

			build.forEach(k=>{
				lines.push({
					name: ING[k].label,
					price: ING[k].price, // show real price
					qty: 1,
					modifier: true,
					modKind: "included",
					ingKey: k,
					groupId
				});
			});
		}else{
			// Non-build item: no default sublist
			lines.push({
				name: it.name,
				price: it.price,
				qty: 1,
				modifier: false,
				groupId,
				buildable: false
			});
			selected = lines.length-1;
		}
	}

	function removeModifierAt(index){
		if(index < 0 || index >= lines.length) return;
		if(!lines[index].modifier) return;

		// Remove the modifier line entirely
		lines.splice(index, 1);

		// Adjust selection safely
		if(selected >= lines.length) selected = lines.length-1;
	}

	function renderLines(){
		el.lines.innerHTML="";

		for(let i=0;i<lines.length;i++){
			const l = lines[i];
			const r = document.createElement("div");

			const isActive = (i===selected);
			r.className = "lineRow" + (l.modifier ? " modifier" : "") + (isActive ? " active" : "");

			// Determine base qty for display of modifier totals
			const baseIdx = l.modifier ? baseIndexFromSelection(i) : i;
			const baseQty = (baseIdx >= 0 && lines[baseIdx] && !lines[baseIdx].modifier) ? lines[baseIdx].qty : 1;

			let qtyCell = l.modifier ? "" : l.qty;

			// Price display:
			// - Base line shows the FULL item total (unit block total * qty)
			// - Modifier line shows its own (price * base qty)
			let priceDisplay = 0;
			if(!l.modifier){
				priceDisplay = blockUnitTotal(i) * l.qty;
			}else{
				priceDisplay = l.price * baseQty;
			}

			if(l.modifier){
				const nameCell = document.createElement("div");
				nameCell.className = "name";

				const wrap = document.createElement("div");
				wrap.className = "nameWrap";

				const txt = document.createElement("div");
				txt.textContent = l.name;

				const btn = document.createElement("div");
				btn.className = "minusBtn";
				btn.textContent = "−";
				btn.title = "Remove";

				btn.onclick = function(ev){
					ev.stopPropagation();
					removeModifierAt(i);
					renderLines();
					renderTotals();
					el.status.textContent = "Removed " + l.name + ".";
				};

				wrap.appendChild(txt);
				wrap.appendChild(btn);
				nameCell.appendChild(wrap);

				r.appendChild(nameCell);
			}else{
				r.innerHTML =
					"<div class='name'>"+l.name+"</div>" +
					"<div class='qty'>"+qtyCell+"</div>" +
					"<div class='price'>"+fmt(priceDisplay)+"</div>";
				r.onclick = function(){ selected=i; renderLines(); };
				el.lines.appendChild(r);
				continue;
			}

			const qtyDiv = document.createElement("div");
			qtyDiv.className = "qty";
			qtyDiv.textContent = "";

			const priceDiv = document.createElement("div");
			priceDiv.className = "price";
			priceDiv.textContent = fmt(priceDisplay);

			r.appendChild(qtyDiv);
			r.appendChild(priceDiv);

			r.onclick = function(){ selected=i; renderLines(); };
			el.lines.appendChild(r);
		}
	}

	function renderItems(){
		el.itemGrid.innerHTML="";
		MENU[category].forEach(it=>{
			let k=document.createElement("div");
			k.className="key";
			k.textContent=it.name;

			k.onclick=function(){
				const baseIdx = baseIndexFromSelection(selected);

				if(it.modifier){
					if(baseIdx < 0){
						el.status.textContent="Select a base item first.";
						return;
					}

					if(it.modType === "extra"){
						if(!lines[baseIdx].buildable){
							el.status.textContent="This item can't take burger condiments.";
							return;
						}
						insertModifierAfterBlock(baseIdx, {
							name: extraName(it.ingKey),
							price: it.price,
							qty: 1,
							modifier: true,
							modKind: "extra",
							ingKey: it.ingKey,
							groupId: lines[baseIdx].groupId
						});
						el.status.textContent="Added "+extraName(it.ingKey)+".";
					}else if(it.modType === "drink"){
						// Keep simple drink modifiers available (optional)
						insertModifierAfterBlock(baseIdx, {
							name: it.name,
							price: it.price,
							qty: 1,
							modifier: true,
							modKind: "drink",
							groupId: lines[baseIdx].groupId
						});
						el.status.textContent="Added "+it.name+".";
					}
				}else{
					addBaseItem(it);
					el.status.textContent="Added "+it.name+".";
				}

				renderLines();
				renderTotals();
			};

			el.itemGrid.appendChild(k);
		});
	}

	function renderCats(){
		el.sideCol.innerHTML="";
		Object.keys(MENU).forEach(c=>{
			let k=document.createElement("div");
			k.className="key"+(c===category?" categoryActive":"");
			k.textContent=c;
			k.onclick=function(){
				category=c;
				el.cat.textContent="Category: "+c;
				renderCats();
				renderItems();
			};
			el.sideCol.appendChild(k);
		});
	}

	document.getElementById("voidLast").onclick=function(){
		if(!lines.length) return;
		const last = lines.length-1;
		if(lines[last].modifier){
			lines.pop();
		}else{
			const r = getBlockRange(last);
			lines.splice(r.start, r.end-r.start+1);
		}
		selected = Math.min(selected, lines.length-1);
		renderLines();
		renderTotals();
	};

	document.getElementById("voidItem").onclick=function(){
		if(selected<0) return;
		const baseIdx = baseIndexFromSelection(selected);
		if(baseIdx < 0) return;
		const r = getBlockRange(baseIdx);
		lines.splice(r.start, r.end-r.start+1);
		selected = -1;
		renderLines();
		renderTotals();
	};

	document.getElementById("qtyPlus").onclick=function(){
		if(selected>=0){
			const baseIdx = baseIndexFromSelection(selected);
			if(baseIdx >= 0 && !lines[baseIdx].modifier){
				lines[baseIdx].qty++;
				renderLines();
				renderTotals();
			}
		}
	};

	document.getElementById("qtyMinus").onclick=function(){
		if(selected>=0){
			const baseIdx = baseIndexFromSelection(selected);
			if(baseIdx >= 0 && !lines[baseIdx].modifier && lines[baseIdx].qty>1){
				lines[baseIdx].qty--;
				renderLines();
				renderTotals();
			}
		}
	};

	document.getElementById("clearCheck").onclick=function(){
		lines=[];
		selected=-1;
		el.cash.value="";
		el.change.textContent="$0.00";
		el.status.textContent="Ready.";
		renderLines();
		renderTotals();
	};

	el.cash.addEventListener("input",updateChange);

	setInterval(function(){
		document.getElementById("clock").textContent=new Date().toLocaleTimeString();
	},500);

	renderCats();
	renderItems();
	renderTotals();
})();
</script>

</body>
</html>
