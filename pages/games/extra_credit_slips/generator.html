<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Extra Credit Slip Generator</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
<style>
	:root{
		--ink:#1e1f22;
		--ink-2:#3b3f44;
		--bg:#f7f7f8;
		--paper:#ffffff;
		--line:#d7dbdf;
		--shadow:0 8px 24px rgba(0,0,0,.08);
	}
	body{
		margin:0;
		background:var(--bg);
		font-family: system-ui, Arial, sans-serif;
		color:var(--ink);
		display:flex; align-items:center; justify-content:center;
		padding:24px; gap:18px; flex-direction:column;
	}
	#slip{
		width: 8.5in; max-width: 100%;
		height: 2.75in;
		background: var(--paper);
		border-radius: 16px;
		box-shadow: var(--shadow);
		border: 1px solid var(--line);
		position: relative; overflow:hidden;
	}
	#slip::before{
		content:""; position:absolute; inset:10px;
		border-radius:12px; border:1px dashed rgba(81,120,96,.45);
	}
	.slip-grid{
		position: absolute; inset: 18px 18px 24px 18px;
		display:grid; grid-template-columns: minmax(320px,1fr) auto;
		gap:18px; align-items: center;
	}
	.brand{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
	.badge{
		width:34px; height:34px; border-radius:10px;
		background: radial-gradient(circle at 30% 30%, #9bc2a6 0 35%, #6e9c7e 36% 60%, #4e6f59 61% 100%);
		border:1px solid rgba(0,0,0,.08);
	}
	.heading{ display:flex; flex-direction:column; }
	.title{ font-weight: 800; text-transform: uppercase; font-size: 1.15rem; }
	.subtitle{ color: var(--ink-2); font-size:.88rem; margin-top:4px; }
	.term-chip{
		background: #eef4ef; color:#24412f;
		border:1px solid #cfe1d6;
		border-radius:999px; padding:6px 10px;
		font-size:.85rem;
	}
	.terms{ margin:10px 0 12px 0; display:flex; flex-wrap:wrap; gap:10px 16px; }
	.serial{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:.9rem; }
	.serial .label{ color:#5a5f66; font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:.75rem; }
	.serial .value{ font-variant-numeric: tabular-nums; }
	.qr-card{
		background:#fff; border:1px solid var(--line);
		border-radius:14px; padding:12px;
		display:flex; align-items:center; justify-content:center;
	}
	#qrcode{ background:#fff; padding:8px; border-radius:10px; box-shadow:0 0 0 1px rgba(0,0,0,.08) inset; }
	.controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
	button, input[type="text"]{
		background:#fff; border:1px solid #c9cdd3;
		border-radius:10px; padding:10px 12px; font:inherit;
	}
	button{ cursor:pointer; }
	.helper{ color:#59606a; font-size:.9rem; }
	@media print{
		.controls, .helper{ display:none !important; }
		#slip{ box-shadow:none; }
	}
</style>
</head>
<body>

	<div id="slip">
		<div class="slip-grid">
			<div>
				<div class="brand">
					<div class="badge"></div>
					<div class="heading">
						<div class="title">Extra Credit Slip</div>
						<div class="subtitle">Redeemable once • See teacher for details</div>
					</div>
				</div>

				<div class="terms">
					<span class="term-chip">Non-transferable</span>
					<span class="term-chip">One-time redemption</span>
					<span class="term-chip">Verify in class</span>
				</div>

				<div class="serial">
					<div>
						<div class="label">Activity Completed</div>
						<div class="value" id="statusValue">default</div>
					</div>
					<div>
						<div class="label">Issued</div>
						<div class="value" id="timeValue">—</div>
					</div>
				</div>
			</div>

			<div class="qr-card">
				<div id="qrcode"></div>
			</div>
		</div>
	</div>

	<div class="controls">
		<input id="customValue" type="text" value="default" />
		<button id="regenerate">Regenerate slip</button>
		<button id="download">Download PDF</button>
	</div>
	<div class="helper">QR encodes: {"time": ms, "id": hex, "value": textbox}</div>

<script>
	function deterministicID(timestamp){
		let hash=0, str=String(timestamp);
		for(let i=0;i<str.length;i++){ hash=(hash*31+str.charCodeAt(i))>>>0; }
		return hash.toString(16);
	}
	function formatTime(ms){
		return new Date(ms).toLocaleString('en-US',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
	}
	function generateSlip(){
		const now=Date.now();
		const id=deterministicID(now);
		const value=document.getElementById('customValue').value||'default';
		const payload={time:now,id,value};
		document.getElementById('timeValue').textContent=formatTime(now);
		document.getElementById('statusValue').textContent=value;
		const qrWrap=document.getElementById('qrcode'); qrWrap.innerHTML='';
		new QRCode(qrWrap,{text:JSON.stringify(payload),width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
	}
	document.getElementById('regenerate').addEventListener('click',generateSlip);
	document.getElementById('download').addEventListener('click',()=>{
		html2pdf().set({margin:0,filename:'extra-credit-slip.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2},jsPDF:{unit:'in',format:'letter',orientation:'portrait'}}).from(document.getElementById('slip')).save();
	});
	generateSlip();
</script>
</body>
</html>
