<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Vamos a pescar — Conjugaciones</title>
	<style>
		:root{
			--bg1:#87c3f8; --bg2:#b4e0ff; --lake:#79b2e3; --card:#fffdf7;
			--ink:#1b1b1b; --muted:#6b7280; --green:#13a10e; --red:#d11a2a;
			--accent:#3a6ea5; --shadow:#1f2a44;
		}
		html,body{
			height:100%; margin:0;
			font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";
			color:var(--ink);
			background: linear-gradient(#c6e6ff,#eaffff 40%) fixed, linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--lake) 56%) fixed;
			background-attachment: fixed;
		}
		.pixel-card{
			background:var(--card);
			box-shadow:
				0 0 0 4px #000 inset, 0 0 0 8px #fff inset,
				0 8px 0 #000, 0 12px 0 var(--shadow);
			border-radius:0;
		}
		.pixel-btn{
			background:var(--accent); color:white; border:0; padding:.9rem 1.1rem;
			font-weight:700; text-transform:uppercase; letter-spacing:.02em;
			box-shadow: 0 0 0 3px #000 inset, 0 4px 0 #000, 0 8px 0 var(--shadow);
			cursor:pointer;
		}
		.pixel-btn:active{ transform: translateY(2px); box-shadow: 0 0 0 3px #000 inset, 0 2px 0 #000, 0 4px 0 var(--shadow); }

		.wrapper{ max-width:900px; margin:48px auto; padding:0 16px 72px; }

		.hud{
			position:sticky; top:0; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
			backdrop-filter: blur(4px); z-index:5;
		}
		.hud .left{ display:flex; align-items:center; gap:10px; }
		.hud .worms{
			display:flex; align-items:center; gap:8px; font-weight:800;
			background:rgba(255,255,255,.8); padding:6px 10px; border-radius:8px;
			box-shadow: 0 0 0 3px #000 inset, 0 3px 0 #000;
		}
		.hud .team{
			background:rgba(255,255,255,.8); padding:6px 10px; border-radius:8px;
			box-shadow: 0 0 0 3px #000 inset, 0 3px 0 #000; font-weight:700;
		}
		img.pixel{ image-rendering: pixelated; height:24px; width:auto; display:block; }

		/* Slides */
		#pages{ max-width:820px; margin:20px auto; overflow:hidden; }
		#pagesTrack{ display:flex; width:200%; transition: transform 420ms cubic-bezier(.22,.72,.18,1); }
		.slide{ width:100%; }

		/* Quiz card */
		#gameCard{ margin:0; padding:24px 20px 28px; }
		#titleRow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
		#progress{ height:10px; background:#e5e7eb; box-shadow: inset 0 0 0 3px #000; position:relative; overflow:hidden; }
		#progressFill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:repeating-linear-gradient(45deg,#6ee7b7 0,#6ee7b7 8px,#34d399 8px,#34d399 16px); transition:width .25s ease; }
		#prompt{ font-size:clamp(22px,4vw,34px); line-height:1.45; margin:20px 0 6px; word-wrap:break-word; }
		#prompt input.answer{
			display:inline-block; min-width:7ch; max-width:50vw; padding:6px 8px; margin:0 6px; font:inherit;
			border:0; outline:none; border-bottom:4px solid #000; color:#111; background:#fff; box-shadow: 0 0 0 3px #000 inset;
		}
		#prompt input.answer.correct{ color:var(--green); }
		#prompt input.answer.wrong{ color:var(--red); }
		#prompt input.answer.typing{ color:#111; }
		#feedback{ min-height:1.4em; font-size:clamp(14px,2.2vw,18px); color:var(--muted); }
		#feedback .solution{ color:var(--green); font-weight:700; font-size:.95em; }
		.hidden{ display:none !important; }

		/* Modal */
		.modal{ position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.35); padding:18px; z-index:10; }
		.modal-card{ max-width:680px; width:100%; padding:22px 18px 18px; }
		.modal-card h1{ margin:0 0 10px 0; font-size:clamp(26px,5vw,40px); }
		.modal-card p{ margin:8px 0; color:#374151; }
		.modal-card label{ font-weight:700; display:block; margin:14px 0 6px; }
		select{ width:100%; padding:12px 10px; font-size:16px; border:0; box-shadow: 0 0 0 3px #000 inset; background:#fff; }
		.modal-actions{ margin-top:16px; display:flex; gap:10px; justify-content:flex-end; }

		/* +1 worms outside the box, next to counter */
		#wormFx{ display:inline-block; position:relative; width:auto; }
		.worm-burst{ display:inline-flex; align-items:center; gap:4px; opacity:0; animation:floatfade 1.1s ease-out forwards; }
		@keyframes floatfade{ 0%{opacity:0; transform:translateY(0)} 15%{opacity:1} 100%{opacity:0; transform:translateY(-12px)} }

		/* End view */
		#endView{ text-align:center; padding:38px 10px; }
		#endView h2{ font-size:clamp(24px,5vw,36px); margin-top:0; }

		/* Tab bar */
		.tabbar{ position:sticky; bottom:0; margin:16px auto 0; display:flex; gap:10px; justify-content:center; max-width:820px; z-index:4; }
		.tabbar .pixel-btn.active{ outline:3px solid #000; filter:brightness(1.05); }

		/* Fishing iframe wrapper */
		#fishWrap.pixel-card{ padding:0; }
		#fishFrame{ width:100%; height:560px; border:0; display:block; background: transparent; }
	</style>
</head>
<body>

	<div class="wrapper">
		<header class="hud">
			<div class="left">
				<div class="worms">
					<img class="pixel" id="wormIcon" alt="worm" />
					<span id="wormCount">0</span>
				</div>
				<div id="wormFx" aria-hidden="true"></div>
			</div>
			<div class="team" id="teamDisplay">Equipo: —</div>
		</header>

		<!-- Sliding pages -->
		<section id="pages" class="hidden">
			<div id="pagesTrack">
				<!-- Slide 1: Quiz -->
				<div class="slide">
					<section id="gameCard" class="pixel-card">
						<div id="titleRow">
							<div id="lessonTitle" style="font-weight:800">Conjugaciones</div>
							<div id="lessonMeta" style="color:var(--muted)"></div>
						</div>
						<div id="progress"><div id="progressFill"></div></div>

						<div id="prompt"></div>
						<div id="feedback" aria-live="polite"></div>

						<div id="endView" class="hidden">
							<h2>¡Buen trabajo! 🐟</h2>
							<p>Gusanos conseguidos: <strong id="finalWorms">0</strong></p>
							<div style="margin-top:16px">
								<button class="pixel-btn" id="playAgain">Volver a empezar</button>
							</div>
						</div>
					</section>
				</div>

				<!-- Slide 2: Fishing (iframe) -->
				<div class="slide">
					<section id="fishWrap" class="pixel-card">
						<iframe id="fishFrame" src="fishing.html" title="Pescar"></iframe>
					</section>
				</div>
			</div>
		</section>

		<!-- Bottom tabs -->
		<nav class="tabbar hidden" id="tabbar">
			<button class="pixel-btn active" id="tabQuiz">Actividad</button>
			<button class="pixel-btn" id="tabFish">Pescar</button>
		</nav>
	</div>

	<!-- Start modal -->
	<div id="startModal" class="modal">
		<div class="pixel-card modal-card">
			<h1>vamos a pescar… 🎣</h1>
			<p>Elige tu equipo y empieza la actividad.</p>

			<label for="teamSelect">Equipo (país):</label>
			<select id="teamSelect">
				<option value="" selected disabled>— Selecciona un equipo —</option>
				<option>🇲🇽 México</option><option>🇪🇸 España</option><option>🇦🇷 Argentina</option>
				<option>🇨🇴 Colombia</option><option>🇵🇪 Perú</option><option>🇨🇱 Chile</option>
				<option>🇻🇪 Venezuela</option><option>🇪🇨 Ecuador</option><option>🇺🇾 Uruguay</option>
				<option>🇵🇾 Paraguay</option><option>🇧🇴 Bolivia</option><option>🇬🇹 Guatemala</option>
				<option>🇭🇳 Honduras</option><option>🇸🇻 El Salvador</option><option>🇳🇮 Nicaragua</option>
				<option>🇨🇷 Costa Rica</option><option>🇵🇦 Panamá</option><option>🇨🇺 Cuba</option>
				<option>🇩🇴 República Dominicana</option><option>🇵🇷 Puerto Rico</option><option>🇬🇶 Guinea Ecuatorial</option>
			</select>

			<p style="margin-top:14px; font-size:14px; color:var(--muted)">
				Carga el set con <code>?set=estar_presente.json</code>
			</p>

			<div class="modal-actions">
				<button class="pixel-btn" id="startBtn">Comenzar</button>
			</div>
		</div>
	</div>

	<script>
	// inline worm icon
	const WORM_SVG = encodeURI(
`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="16" viewBox="0 0 28 16">
  <rect width="28" height="16" fill="#000" rx="2"/>
  <rect x="1" y="1" width="26" height="14" fill="#fef3c7" rx="1"/>
  <rect x="3" y="5" width="22" height="6" fill="#f87171"/>
  <rect x="6" y="7" width="16" height="2" fill="#ef4444"/>
</svg>`);
	const WORM_DATA_URI = `data:image/svg+xml;utf8,${WORM_SVG}`;
	document.addEventListener('DOMContentLoaded', ()=> {
		document.getElementById('wormIcon').src = WORM_DATA_URI;
	});

	// helpers
	const qs = (s, r=document) => r.querySelector(s);
	const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
	const getParam = name => new URL(location.href).searchParams.get(name);

	function spawnWormFX(){
		const fx = qs('#wormFx');
		const el = document.createElement('div');
		el.className = 'worm-burst';
		el.innerHTML = `<img class="pixel" src="${WORM_DATA_URI}" alt=""><span>+1</span>`;
		fx.appendChild(el);
		setTimeout(()=> el.remove(), 1100);
	}

	// state
	const state = { raw:null, items:[], i:0, worms:0, locked:false, afterWrong:false, team:'—', page:'quiz' };

	// UI refs
	const startModal = qs('#startModal');
	const pages = qs('#pages'), track = qs('#pagesTrack'), tabbar=qs('#tabbar');
	const teamSelect = qs('#teamSelect'), teamDisplay = qs('#teamDisplay'), wormCountEl=qs('#wormCount');
	const gameCard = qs('#gameCard'), progressFill = qs('#progressFill'), lessonTitle=qs('#lessonTitle'), lessonMeta=qs('#lessonMeta');
	const prompt=qs('#prompt'), feedback=qs('#feedback'), endView=qs('#endView'), finalWorms=qs('#finalWorms');
	const tabQuiz=qs('#tabQuiz'), tabFish=qs('#tabFish');
	const fishFrame=qs('#fishFrame');

	function sendToFishing(msg){
		const win = fishFrame && fishFrame.contentWindow; if(!win) return;
		win.postMessage({source:'vamos', ...msg}, '*');
	}

	function updateHUD(){
		wormCountEl.textContent = state.worms;
		teamDisplay.textContent = `Equipo: ${state.team}`;
		const pct = state.items.length ? (state.i/state.items.length)*100 : 0;
		progressFill.style.width = `${pct}%`;
		// keep iframe informed (it uses this to allow/deny casting)
		sendToFishing({type:'worms', value: state.worms});
		sendToFishing({type:'team',  value: state.team});
	}

	function setLessonMeta(){
		lessonTitle.textContent = state.raw?.title || 'Conjugaciones';
		lessonMeta.textContent  = `${state.items.length} preguntas`;
	}

	function showEnd(){
		endView.classList.remove('hidden');
		finalWorms.textContent = state.worms;
		prompt.classList.add('hidden'); feedback.classList.add('hidden');
		// auto-switch to fishing (space to cast there)
		goTo('fish');
	}

	function hideEnd(){
		endView.classList.add('hidden');
		prompt.classList.remove('hidden'); feedback.classList.remove('hidden');
	}

	function renderQuestion(){
		updateHUD(); hideEnd(); feedback.innerHTML='';
		const item = state.items[state.i]; if(!item){ showEnd(); return; }
		state.locked=false; state.afterWrong=false;

		const parts = item.sentence.split('_');
		prompt.innerHTML='';
		const left = document.createElement('span'); left.textContent = parts[0]||'';
		const right = document.createElement('span'); right.textContent = parts[1]||'';
		const input = document.createElement('input');
		input.type='text'; input.autocomplete='off'; input.spellcheck=false; input.className='answer'; input.setAttribute('aria-label','Respuesta');

		function markCorrect(){
			if(state.locked) return; state.locked=true;
			input.classList.remove('typing','wrong'); input.classList.add('correct');
			state.worms += 1; spawnWormFX(); updateHUD();
			setTimeout(next, 1200);
		}
		function checkLive(){
			const a = norm(item.answer), v = norm(input.value);
			if(v.length===0){ input.classList.remove('correct','wrong'); if(state.afterWrong) input.classList.add('typing'); return; }
			if(v===a){ markCorrect(); return; }
			if(state.afterWrong){ input.classList.remove('correct','wrong'); input.classList.add('typing'); }
			else{ input.classList.remove('correct','wrong','typing'); }
		}
		input.addEventListener('input', checkLive);
		input.addEventListener('keydown', (e)=>{
			if(e.key==='Enter'){
				if(state.locked) return;
				const correct = norm(input.value)===norm(item.answer);
				if(correct){ input.blur(); input.classList.add('correct'); markCorrect(); }
				else{
					state.afterWrong=true;
					input.classList.remove('correct','typing'); input.classList.add('wrong');
					feedback.innerHTML = `<div class="solution">Respuesta: ${item.answer}</div>`;
				}
			}
		});

		prompt.append(left,input,right);
		setTimeout(()=> input.focus(), 0);
	}

	function next(){
		state.i++;
		if(state.i >= state.items.length){ updateHUD(); showEnd(); }
		else{ renderQuestion(); }
	}

	// data load
	async function loadSet(){
		const setName = getParam('set') || 'estar_presente.json';
		const res = await fetch(setName, {cache:'no-store'});
		if(!res.ok) throw new Error(`No se pudo cargar el set: ${setName}`);
		const json = await res.json();
		if(json.type !== 'conjugation_fill_blank'){ throw new Error(`Tipo de set no compatible: ${json.type}`); }
		state.raw = json; state.items = json.dataset||[]; state.i=0; setLessonMeta();
		// NOTE: do not reset worms here so progress carries across sets if desired
	}

	// start flow
	qs('#startBtn').addEventListener('click', async ()=>{
		const t = teamSelect.value; if(!t){ alert('Elige un equipo para empezar.'); return; }
		state.team = t; updateHUD();
		try{ await loadSet(); }catch(err){ alert(err.message||err); return; }
		startModal.classList.add('hidden'); pages.classList.remove('hidden'); tabbar.classList.remove('hidden');
		goTo('quiz', false); renderQuestion();
		// send initial state to iframe
		sendToFishing({type:'init', team: state.team, worms: state.worms});
	});

	qs('#playAgain').addEventListener('click', ()=>{
		state.i=0; updateHUD(); hideEnd(); goTo('quiz'); renderQuestion();
	});

	// tabs / sliding
	function updateTabs(){ qs('#tabQuiz').classList.toggle('active', state.page==='quiz'); qs('#tabFish').classList.toggle('active', state.page==='fish'); }
	function goTo(page, animate=true){
		if(page!=='quiz' && page!=='fish') return;
		state.page = page; updateTabs();
		if(!animate){
			track.style.transition='none';
			track.style.transform = page==='quiz' ? 'translateX(0%)' : 'translateX(-50%)'; /* ✅ two slides */
			track.getBoundingClientRect(); track.style.transition='';
		}else{
			track.style.transform = page==='quiz' ? 'translateX(0%)' : 'translateX(-50%)';
		}
		// we don't auto-start fishing; casting is space-only
		if(page==='fish'){
			sendToFishing({type:'init', team: state.team, worms: state.worms});
		}
	}
	tabQuiz.addEventListener('click', ()=> goTo('quiz'));
	tabFish.addEventListener('click', ()=> goTo('fish'));

	// receive messages from fishing iframe
	window.addEventListener('message', (e)=>{
		const data = e.data || {};
		if(data && data.source==='fishing'){
			if(data.type === 'worms_delta'){
				state.worms = Math.max(0, state.worms + (data.delta|0)); // delta is negative when spent
				updateHUD();
				// send canonical total back so iframe gate-keeping stays in sync
				sendToFishing({type:'worms', value: state.worms});
			}
			else if(data.type === 'worms'){ // not strictly needed, but supported
				state.worms = Math.max(0, data.value|0);
				updateHUD();
			}
			else if(data.type === 'caught' || data.type === 'escaped'){
				// placeholder: later we can toast or record a catch
			}
		}
	});
	</script>
</body>
</html>
