<!DOCTYPE html>
<html lang="en" translate="no">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Spanish Vocab Adventure — Layers & Animation</title>
	<style>
		:root { color-scheme: dark; }
		html, body {
			margin: 0; height: 100%;
			background: #0d0f12; color: #e9eef4;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
			overflow: hidden;
		}
		#gameWrap {
			position: fixed; inset: 0;
			display: grid; grid-template-rows: 1fr auto;
		}
		canvas {
			width: 100%; height: 100%;
			background:#1a1f25; display:block;
			image-rendering: pixelated;
			image-rendering: -moz-crisp-edges;
			image-rendering: crisp-edges;
		}
		#hud {
			display:flex; justify-content:center; gap:.5rem;
			padding:.75rem; background:linear-gradient(180deg,#0d0f12,#11161b 60%,#0d0f12);
			border-top:1px solid #222a31;
		}
		button {
			background:#2b3440; color:#e9eef4; border:1px solid #3b4654;
			padding:.5rem .75rem; border-radius:.5rem; font-weight:600; cursor:pointer;
		}
		button:active { transform: translateY(1px); }
		#info {
			position:absolute; top:.5rem; left:.5rem; font-size:.875rem; opacity:.85;
			background:#0008; padding:.35rem .5rem; border-radius:.375rem; border:1px solid #ffffff22;
			pointer-events:none; white-space:pre;
		}
	</style>
</head>
<body>
	<div id="gameWrap">
		<canvas id="game"></canvas>
		<div id="hud">
			<button id="zoomOut" title="Zoom Out">−</button>
			<button id="zoomIn" title="Zoom In">+</button>
		</div>
	</div>
	<div id="info"></div>

	<script>
	// ---------------------------------------
	// URL, Canvas, Utilities
	// ---------------------------------------
	const qs = new URLSearchParams(location.search);
	const MAP_URL = qs.get('map') || './assets/demo.json';

	const canvas = document.getElementById('game');
	const ctx = canvas.getContext('2d');

	function resizeCanvas() {
		const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
		canvas.width  = Math.floor(canvas.clientWidth  * dpr);
		canvas.height = Math.floor(canvas.clientHeight * dpr);
	}
	window.addEventListener('resize', resizeCanvas);

	function aabbIntersects(ax, ay, aw, ah, bx, by, bw, bh) {
		return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
	}

	function loadImage(src) {
		return new Promise((resolve, reject) => {
			const img = new Image();
			img.onload = () => resolve(img);
			img.onerror = (e) => reject(new Error('Failed to load image: ' + src));
			img.src = src;
		});
	}

	// ---------------------------------------
	// Global timing / animation constants
	// ---------------------------------------
	const LOOP_FPS = 6; // hard-coded global rate for all "loop" textures
	const SEC_PER_FRAME_LOOP = 1 / LOOP_FPS;

	// ---------------------------------------
	// World / Player State
	// ---------------------------------------
	const keys = new Set();
	let scale = 2, minScale = 1, maxScale = 6, scaleStep = 0.5;

	const world = {
		width:  2000,
		height: 2000,
		bgColor: '#2a3139',
		objects: [],    // array of GameEntity
	};

	// Entity schema (runtime):
	// {
	//   id, type: 'static'|'loop'|'animated', layer: number,
	//   x, y, collides: bool, w, h,
	//   textures (static|loop): [Image,...]
	//   animations (animated): { [name]: { frames:[Image,...], fps:number } }
	//   currentAnim: string, currentFrame: number, frameTimeAcc: number
	// }

	const player = {
		id: 'player',
		type: 'animated',
		layer: 100,     // default; can be overridden by map
		x: 100, y: 100, collides: true,
		w: 16, h: 16,
		animations: {}, currentAnim: 'idleDown', currentFrame: 0, frameTimeAcc: 0,
		speed: 120,
		lastDir: 'Down' // 'Up' | 'Down' | 'Left' | 'Right'
	};

	const camera = { x: 0, y: 0 };

	// ---------------------------------------
	// Input
	// ---------------------------------------
	window.addEventListener('keydown', (e) => {
		if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',' '].includes(e.code)) e.preventDefault();
		keys.add(e.code);
	});
	window.addEventListener('keyup', (e) => keys.delete(e.code));

	document.getElementById('zoomIn').addEventListener('click', () => scale = Math.min(maxScale, scale + scaleStep));
	document.getElementById('zoomOut').addEventListener('click', () => scale = Math.max(minScale, scale - scaleStep));

	// ---------------------------------------
	// Map Loading & Asset Preparation
	// ---------------------------------------
	async function prepareStaticOrLoop(def) {
		const frames = await Promise.all((def.textures || [def.src]).map(loadImage));
		const w = frames[0].width, h = frames[0].height;
		return {
			id: def.id ?? crypto.randomUUID(),
			type: def.textureType || 'static',
			layer: def.layer ?? 0,
			x: def.x ?? 0, y: def.y ?? 0,
			collides: !!def.collides,
			w, h,
			textures: frames,
			currentFrame: 0,
			frameTimeAcc: 0
		};
	}

	async function prepareAnimated(def) {
		const anims = {};
		const animDefs = def.animations || {};
		let w=16, h=16;
		for (const [name, a] of Object.entries(animDefs)) {
			const frames = await Promise.all((a.frames || []).map(loadImage));
			anims[name] = { frames, fps: a.fps || 6 };
			// use the first available frame found to set a stable collision box
			if (frames.length && w===undefined) { w = frames[0].width; h = frames[0].height; }
		}
		// if none loaded yet, attempt to set from first anim with frames
		for (const a of Object.values(anims)) {
			if (a.frames.length) { w = a.frames[0].width; h = a.frames[0].height; break; }
		}
		// fallback to a single sprite if provided
		if ((!w || !h) && def.src) {
			const img = await loadImage(def.src);
			w = img.width; h = img.height;
			anims.idleDown = { frames:[img], fps: 1 };
		}
		return {
			id: def.id ?? crypto.randomUUID(),
			type: 'animated',
			layer: def.layer ?? 0,
			x: def.x ?? 0, y: def.y ?? 0,
			collides: !!def.collides,
			w, h,
			animations: anims,
			currentAnim: def.defaultAnim || 'idleDown',
			currentFrame: 0,
			frameTimeAcc: 0
		};
	}

	async function loadMap(url) {
		const res = await fetch(url, { cache: 'no-cache' });
		if (!res.ok) throw new Error(`Failed to load map JSON: ${res.status}`);
		const data = await res.json();

		// World settings
		world.width   = data.world?.width  ?? world.width;
		world.height  = data.world?.height ?? world.height;
		world.bgColor = data.world?.bgColor ?? world.bgColor;

		// Player from map (animated)
		if (data.player) {
			player.layer = data.player.layer ?? player.layer;
			player.x = data.player.x ?? player.x;
			player.y = data.player.y ?? player.y;
			player.speed = data.player.speed ?? player.speed;
			// load player animations
			const prepared = await prepareAnimated({
				layer: player.layer,
				x: player.x, y: player.y, collides: true,
				animations: data.player.animations,
				defaultAnim: data.player.defaultAnim || 'idleDown'
			});
			Object.assign(player, prepared); // copy fields onto player
			player.speed = data.player.speed ?? player.speed; // keep speed
		} else {
			// fallback: a single sprite becomes idleDown
			const img = await loadImage('./assets/player.png');
			player.animations = { idleDown: { frames:[img], fps: 1 } };
			player.w = img.width; player.h = img.height;
		}

		// Objects
		world.objects = [];
		for (const def of (data.objects || [])) {
			const tt = (def.textureType || 'static');
			if (tt === 'animated') {
				world.objects.push(await prepareAnimated(def));
			} else {
				world.objects.push(await prepareStaticOrLoop(def));
			}
		}
	}

	// ---------------------------------------
	// Animation helpers
	// ---------------------------------------
	function updateLoopEntity(ent, dt) {
		// global hard-coded loop rate
		ent.frameTimeAcc += dt;
		const frameDur = SEC_PER_FRAME_LOOP;
		while (ent.frameTimeAcc >= frameDur) {
			ent.frameTimeAcc -= frameDur;
			ent.currentFrame = (ent.currentFrame + 1) % ent.textures.length;
		}
	}

	function updateAnimatedEntity(ent, dt) {
		const anim = ent.animations[ent.currentAnim];
		if (!anim || anim.frames.length === 0) return;
		const frameDur = 1 / (anim.fps || 6);
		ent.frameTimeAcc += dt;
		while (ent.frameTimeAcc >= frameDur) {
			ent.frameTimeAcc -= frameDur;
			ent.currentFrame = (ent.currentFrame + 1) % anim.frames.length;
		}
	}

	function currentFrameImage(ent) {
		if (ent.type === 'static') {
			return ent.textures[0];
		} else if (ent.type === 'loop') {
			return ent.textures[ent.currentFrame % ent.textures.length];
		} else {
			const anim = ent.animations[ent.currentAnim];
			if (!anim || anim.frames.length === 0) return null;
			return anim.frames[ent.currentFrame % anim.frames.length];
		}
	}

	// ---------------------------------------
	// Movement & Collision
	// ---------------------------------------
	function tryMove(dt) {
		let vx = 0, vy = 0;
		if (keys.has('KeyW') || keys.has('ArrowUp'))    vy -= 1;
		if (keys.has('KeyS') || keys.has('ArrowDown'))  vy += 1;
		if (keys.has('KeyA') || keys.has('ArrowLeft'))  vx -= 1;
		if (keys.has('KeyD') || keys.has('ArrowRight')) vx += 1;

		// Set animation direction based on input
		const moving = (vx !== 0 || vy !== 0);
		if (moving) {
			if (Math.abs(vx) > Math.abs(vy)) {
				player.lastDir = vx > 0 ? 'Right' : 'Left';
			} else {
				player.lastDir = vy > 0 ? 'Down' : 'Up';
			}
			const targetAnim = 'walk' + player.lastDir;
			if (player.currentAnim !== targetAnim) {
				player.currentAnim = targetAnim;
				player.currentFrame = 0;
				player.frameTimeAcc = 0;
			}
		} else {
			const targetAnim = 'idle' + player.lastDir;
			if (player.currentAnim !== targetAnim) {
				player.currentAnim = targetAnim;
				player.currentFrame = 0;
				player.frameTimeAcc = 0;
			}
		}

		// Normalize diagonal
		if (vx !== 0 && vy !== 0) { const inv = 1/Math.sqrt(2); vx*=inv; vy*=inv; }

		const moveX = vx * player.speed * dt;
		const moveY = vy * player.speed * dt;

		let newX = player.x + moveX;
		let newY = player.y + moveY;

		// world bounds
		newX = Math.max(0, Math.min(world.width  - player.w, newX));
		newY = Math.max(0, Math.min(world.height - player.h, newY));

		// collide X then Y
		let tX = newX, tY = player.y;
		for (const o of world.objects) {
			if (!o.collides) continue;
			if (aabbIntersects(tX, tY, player.w, player.h, o.x, o.y, o.w, o.h)) {
				if (moveX > 0) tX = o.x - player.w;
				else if (moveX < 0) tX = o.x + o.w;
			}
		}
		tX = Math.max(0, Math.min(world.width - player.w, tX));

		let tX2 = tX, tY2 = newY;
		for (const o of world.objects) {
			if (!o.collides) continue;
			if (aabbIntersects(tX2, tY2, player.w, player.h, o.x, o.y, o.w, o.h)) {
				if (moveY > 0) tY2 = o.y - player.h;
				else if (moveY < 0) tY2 = o.y + o.h;
			}
		}
		tY2 = Math.max(0, Math.min(world.height - player.h, tY2));

		player.x = tX2; player.y = tY2;
	}

	// ---------------------------------------
	// Render
	// ---------------------------------------
	function render() {
		ctx.imageSmoothingEnabled = false;
		ctx.fillStyle = world.bgColor;
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		const viewW = canvas.width  / scale;
		const viewH = canvas.height / scale;

		let camX = player.x + player.w/2 - viewW/2;
		let camY = player.y + player.h/2 - viewH/2;
		camX = Math.max(0, Math.min(world.width  - viewW, camX));
		camY = Math.max(0, Math.min(world.height - viewH, camY));
		camera.x = Math.floor(camX);
		camera.y = Math.floor(camY);

		function drawSprite(img, wx, wy) {
			if (!img) return;
			const sx = Math.floor((wx - camera.x) * scale);
			const sy = Math.floor((wy - camera.y) * scale);
			const sw = Math.floor(img.width  * scale);
			const sh = Math.floor(img.height * scale);
			ctx.drawImage(img, sx, sy, sw, sh);
		}

		// Build render list with layers
		const renderables = [];
		for (const o of world.objects) {
			const img = currentFrameImage(o);
			renderables.push({ layer: o.layer ?? 0, y: o.y, img, x: o.x, yPos: o.y });
		}
		{
			const img = currentFrameImage(player);
			renderables.push({ layer: player.layer ?? 0, y: player.y, img, x: player.x, yPos: player.y });
		}

		// Sort strictly by layer (then by y to reduce overlap artifacts inside same layer)
		renderables.sort((a,b) => (a.layer - b.layer) || (a.y - b.y));

		for (const r of renderables) {
			drawSprite(r.img, r.x, r.yPos);
		}
	}

	// ---------------------------------------
	// Main Loop
	// ---------------------------------------
	let lastTime = performance.now();
	function loop(now) {
		const dt = Math.min(0.05, (now - lastTime) / 1000);
		lastTime = now;

		// movement & collisions
		tryMove(dt);

		// advance animations
		for (const o of world.objects) {
			if (o.type === 'loop') updateLoopEntity(o, dt);
			else if (o.type === 'animated') updateAnimatedEntity(o, dt);
		}
		updateAnimatedEntity(player, dt);

		// draw
		render();

		// debug panel
		document.getElementById('info').textContent =
			`map: ${MAP_URL}\n` +
			`zoom: ${scale.toFixed(2)}x\n` +
			`player: (${Math.round(player.x)}, ${Math.round(player.y)})\n` +
			`layer(player): ${player.layer}`;
		requestAnimationFrame(loop);
	}

	// ---------------------------------------
	// Boot
	// ---------------------------------------
	(async function start() {
		resizeCanvas();
		try {
			await loadMap(MAP_URL);
		} catch (err) {
			console.error(err);
			// minimal fallback
			const img = await loadImage('./assets/player.png');
			player.animations = { idleDown: { frames:[img], fps:1 } };
			player.w = img.width; player.h = img.height;
			world.objects = [];
		}
		lastTime = performance.now();
		requestAnimationFrame(loop);
	})();
	</script>
</body>
</html>
