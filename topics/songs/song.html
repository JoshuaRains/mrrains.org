<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Actividad de Canción</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root{
			--bg1:#eef6f0;
			--bg2:#d9eadf;
			--panel:#ffffff;
			--panelBorder:rgba(81,120,96,.18);
			--text:#173126;
			--muted:#6c7f74;

			--green1:#517860;
			--green2:#5c8a6d;
			--green3:#3f614d;

			--lineBg:#ffffff;
			--lineBorder:rgba(81,120,96,.12);
			--lineShadow:0 8px 20px rgba(42,73,56,.08);

			--buttonBg:#edf4ef;
			--buttonBorder:rgba(81,120,96,.18);
			--buttonHover:#e2eee6;

			--success:#3f8f54;
			--successDark:#327245;
			--danger:#d84f4f;

			--blankBorder:#9eb4a6;
			--blankFocus:#517860;
		}

		*{
			box-sizing:border-box;
		}

		html,body{
			margin:0;
			padding:0;
			min-height:100%;
			font-family:"Noto Sans", Arial, sans-serif;
			background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
			color:var(--text);
		}

		body{
			display:flex;
			flex-direction:column;
		}

		#header{
			position:sticky;
			top:0;
			z-index:1000;
			padding:16px 18px 12px;
			background:rgba(238,246,240,.9);
			backdrop-filter:blur(10px);
			border-bottom:1px solid rgba(81,120,96,.12);
		}

		#top-bar{
			max-width:1100px;
			margin:0 auto;
			display:flex;
			align-items:center;
			justify-content:flex-end;
			gap:16px;
			padding:14px 16px;
			border-radius:18px;
			background:rgba(255,255,255,.78);
			border:1px solid var(--panelBorder);
			box-shadow:0 10px 28px rgba(32,59,45,.08);
		}

		#symbol-buttons{
			display:flex;
			align-items:center;
			gap:8px;
			flex-wrap:wrap;
		}

		#symbol-buttons button{
			appearance:none;
			border:none;
			border-radius:12px;
			padding:10px 14px;
			font-size:18px;
			font-weight:700;
			cursor:pointer;
			background:var(--buttonBg);
			color:var(--green3);
			border:1px solid var(--buttonBorder);
			box-shadow:0 2px 8px rgba(32,59,45,.06);
			transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
		}

		#symbol-buttons button:hover{
			background:var(--buttonHover);
			transform:translateY(-1px);
			box-shadow:0 6px 14px rgba(32,59,45,.10);
		}

		#progressBarContainer{
			max-width:1100px;
			margin:12px auto 0;
			height:12px;
			border-radius:999px;
			background:rgba(81,120,96,.12);
			overflow:hidden;
			box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
		}

		#progressBar{
			height:100%;
			width:0%;
			border-radius:999px;
			background:linear-gradient(90deg, var(--green1), var(--green2));
			transition:width .25s ease;
		}

		#scrollable-area{
			padding:24px 20px 48px;
		}

		#song-shell{
			max-width:1100px;
			margin:0 auto;
			background:rgba(255,255,255,.55);
			border:1px solid rgba(81,120,96,.10);
			border-radius:28px;
			padding:26px 22px 28px;
			box-shadow:0 16px 40px rgba(36,64,49,.08);
		}

		#song-title{
			margin:0 0 24px;
			font-size:clamp(28px, 3vw, 40px);
			line-height:1.1;
			font-weight:800;
			text-align:center;
			color:var(--green3);
			letter-spacing:-0.02em;
		}

		#song-container{
			display:flex;
			flex-direction:column;
			gap:12px;
		}

		.sentence{
			display:grid;
			grid-template-columns:auto 1fr;
			align-items:center;
			gap:12px;
			padding:12px 14px;
			border-radius:18px;
			background:var(--lineBg);
			border:1px solid var(--lineBorder);
			box-shadow:var(--lineShadow);
		}

		.sentence-line{
			font-size:25px;
			line-height:1.6;
			min-width:0;
			word-break:break-word;
		}

		.line-btn{
			appearance:none;
			border:none;
			border-radius:14px;
			height:48px;
			min-width:48px;
			padding:0 14px;
			display:inline-flex;
			align-items:center;
			justify-content:center;
			font-size:20px;
			font-weight:800;
			cursor:pointer;
			background:var(--buttonBg);
			color:var(--green3);
			border:1px solid var(--buttonBorder);
			box-shadow:0 2px 8px rgba(32,59,45,.06);
			transition:transform .15s ease, background .15s ease, box-shadow .15s ease, color .15s ease;
		}

		.line-btn:hover{
			background:var(--buttonHover);
			transform:translateY(-1px);
			box-shadow:0 6px 14px rgba(32,59,45,.10);
		}

		.line-btn.playing{
			background:linear-gradient(180deg, var(--green1), var(--green2));
			color:#fff;
			border-color:transparent;
			box-shadow:0 8px 18px rgba(63,143,84,.22);
		}

		.blank{
			min-width:175px;
			padding:4px 6px 5px;
			border:none;
			border-bottom:3px solid var(--blankBorder);
			background:transparent;
			outline:none;
			font:inherit;
			font-weight:700;
			color:var(--text);
			text-align:center;
			transition:border-color .15s ease, background .15s ease, color .15s ease;
		}

		.blank:focus{
			border-bottom-color:var(--blankFocus);
			background:rgba(81,120,96,.05);
		}

		.blank.correct{
			border-bottom-color:var(--success);
			color:var(--successDark);
			background:rgba(63,143,84,.07);
		}

		.blank.incorrect{
			border-bottom-color:var(--danger);
			background:rgba(216,79,79,.06);
		}

		.blank:disabled{
			opacity:1;
		}

		.clickable{
			cursor:help;
			text-decoration:underline;
			text-decoration-style:dotted;
			text-decoration-color:rgba(81,120,96,.45);
			text-underline-offset:4px;
		}

		#translationBox{
			position:absolute;
			display:none;
			max-width:260px;
			padding:10px 12px;
			border-radius:12px;
			background:#ffffff;
			border:1px solid rgba(81,120,96,.18);
			box-shadow:0 14px 30px rgba(26,48,37,.16);
			color:var(--text);
			font-size:15px;
			line-height:1.4;
			z-index:2000;
		}

		#widthTester{
			position:absolute;
			visibility:hidden;
			white-space:pre;
			font:inherit;
			font-size:25px;
			font-weight:700;
		}

		@media (max-width:800px){
			#header{
				padding:12px 12px 10px;
			}

			#top-bar{
				padding:12px;
				justify-content:center;
			}

			#scrollable-area{
				padding:16px 12px 32px;
			}

			#song-shell{
				padding:18px 14px 22px;
				border-radius:22px;
			}

			.sentence{
				grid-template-columns:44px 1fr;
				gap:10px;
				padding:10px;
				border-radius:16px;
			}

			.sentence-line{
				font-size:21px;
				line-height:1.5;
			}

			.line-btn{
				min-width:44px;
				height:44px;
				padding:0 10px;
				font-size:18px;
				border-radius:12px;
			}
		}
	</style>
</head>

			return String(value || "")

				.toLowerCase()
				.trim()
				.replace(/\s+/g, " ");

			}

			const correctCount = allBlanks.filter(blank => blank.dataset.correct === "true").length;
			const percent = (correctCount / allBlanks.length) * 100;
			progressBar.style.width = percent + "%";
		}

		function showTranslation(target, text){
			translationBox.textContent = text;
			translationBox.style.display = "block";

			const rect = target.getBoundingClientRect();
			const scrollX = window.scrollX;
			const scrollY = window.scrollY;

			requestAnimationFrame(() => {
				const boxWidth = translationBox.offsetWidth;
				const left = Math.max(12, rect.left + scrollX + rect.width / 2 - boxWidth / 2);
				const top = rect.bottom + scrollY + 8;
				translationBox.style.left = left + "px";
				translationBox.style.top = top + "px";
			});
		}

		function hideTranslation(){
			translationBox.style.display = "none";
		}

		function insertSymbol(symbol){
			if(!activeInput) return;

			const start = activeInput.selectionStart ?? activeInput.value.length;
			const end = activeInput.selectionEnd ?? activeInput.value.length;
			const value = activeInput.value;

			activeInput.value = value.slice(0, start) + symbol + value.slice(end);
			activeInput.focus();
			activeInput.setSelectionRange(start + symbol.length, start + symbol.length);
			activeInput.dispatchEvent(new Event("input", { bubbles:true }));
		}

		function getAnswerData(blankIndex){
			if(!answers || !answers.answers) return null;
			return answers.answers.find(item => String(item.blankIndex) === String(blankIndex)) || null;
		}

		function clearPlayingState(){
			if(activePlayBtn){
				activePlayBtn.classList.remove("playing");
				activePlayBtn.textContent = "▶";
				activePlayBtn = null;
			}
		}

		function stopCurrentClip(){
			if(clipStopHandler){
				audioPlayer.removeEventListener("timeupdate", clipStopHandler);
				clipStopHandler = null;
			}
			audioPlayer.pause();
			clearPlayingState();
		}

		function playLineClip(lineIndex, buttonEl){
			if(typeof lineTimestamps === "undefined" || !lineTimestamps[lineIndex]){
				console.warn("No timestamps defined for line", lineIndex);
				return;
			}

			const timestamps = lineTimestamps[lineIndex];
			stopCurrentClip();

			activePlayBtn = buttonEl;
			activePlayBtn.classList.add("playing");
			activePlayBtn.textContent = "❚❚";

			audioPlayer.currentTime = timestamps.start;

			clipStopHandler = function(){
				if(audioPlayer.currentTime >= timestamps.end){
					stopCurrentClip();
				}
			};

			audioPlayer.addEventListener("timeupdate", clipStopHandler);
			audioPlayer.play();
		}

		function buildLineContent(lineText, lineIndex){
			const fragment = document.createDocumentFragment();
			const words = lineText.split(" ");
			const blanksForLine = blanksMapping[lineIndex] || [];

			words.forEach((word, wordIndex) => {
				const blankData = blanksForLine.find(b => b.wordIndex === wordIndex);

				if(blankData){
					const answerData = getAnswerData(blankData.blankIndex) || blankData;

					const input = document.createElement("input");
					input.type = "text";
					input.className = "blank";
					input.setAttribute("data-blank-index", blankData.blankIndex);
					input.dataset.answer = answerData.text || blankData.answer || "";
					input.dataset.correct = "false";
					input.placeholder = answerData.hint || blankData.hint || "";
					input.autocomplete = "off";
					input.spellcheck = false;
					input.style.width = measureInputWidth(input.dataset.answer) + "px";

					input.addEventListener("focus", () => {
						activeInput = input;
					});

					input.addEventListener("input", () => {
						const isCorrect = normalizeAnswer(input.value) === normalizeAnswer(input.dataset.answer);

						input.classList.remove("incorrect");

						if(isCorrect){
							input.classList.add("correct");
							input.dataset.correct = "true";
						}else{
							input.classList.remove("correct");
							input.dataset.correct = "false";
						}

						const newWidth = Math.max(measureInputWidth(input.value || input.dataset.answer), 88);
						input.style.width = newWidth + "px";

						updateProgress();
					});

					input.addEventListener("blur", () => {
						const value = normalizeAnswer(input.value);
						const correct = normalizeAnswer(input.dataset.answer);

						if(value && value !== correct){
							input.classList.add("incorrect");
						}
					});

					input.addEventListener("click", e => {
						e.stopPropagation();
						const answerInfo = getAnswerData(input.getAttribute("data-blank-index"));
						if(answerInfo && answerInfo.english){
							showTranslation(input, answerInfo.english);
						}
					});

					fragment.appendChild(input);
				}else{
					const span = document.createElement("span");
					const cleanWord = word.replace(/[.,!?;:¿¡]/g, "").toLowerCase();
					const translation = (wordTranslations && wordTranslations[cleanWord]) ? wordTranslations[cleanWord] : null;

					if(translation){
						span.className = "clickable";
						span.textContent = word;
						span.addEventListener("click", e => {
							e.stopPropagation();
							showTranslation(span, translation);
						});
					}else{
						span.textContent = word;
					}

					fragment.appendChild(span);
				}

				if(wordIndex < words.length - 1){
					fragment.appendChild(document.createTextNode(" "));
				}
			});

			return fragment;
		}

		function renderSong(){
			if(
				typeof songLyrics === "undefined" ||
				typeof blanksMapping === "undefined" ||
				typeof answers === "undefined" ||
				typeof wordTranslations === "undefined" ||
				typeof lineTimestamps === "undefined"
			){
				songContainer.innerHTML = "<p style='margin:0;color:#b00020;font-weight:700;'>Paste your full original data block first, including lineTimestamps.</p>";
				return;
			}

			const lines = songLyrics.split("\n").filter(line => line.trim() !== "");
			songContainer.innerHTML = "";

			lines.forEach((lineText, lineIndex) => {
				const sentence = document.createElement("div");
				sentence.className = "sentence";

				const playBtn = document.createElement("button");
				playBtn.type = "button";
				playBtn.className = "line-btn";
				playBtn.textContent = "▶";
				playBtn.addEventListener("click", () => {
					const isSameButtonPlaying = activePlayBtn === playBtn;
					if(isSameButtonPlaying){
						stopCurrentClip();
					}else{
						playLineClip(lineIndex, playBtn);
					}
				});

				const sentenceLine = document.createElement("div");
				sentenceLine.className = "sentence-line";
				sentenceLine.appendChild(buildLineContent(lineText, lineIndex));

				sentence.appendChild(playBtn);
				sentence.appendChild(sentenceLine);

				songContainer.appendChild(sentence);
			});

			updateProgress();
		}

		document.querySelectorAll(".symbolBtn").forEach(btn => {
			btn.addEventListener("mousedown", e => {
				e.preventDefault();
			});
			btn.addEventListener("click", () => insertSymbol(btn.dataset.symbol));
		});

		document.addEventListener("click", e => {
			if(
				!e.target.classList.contains("clickable") &&
				!e.target.classList.contains("symbolBtn") &&
				!e.target.classList.contains("blank")
			){
				hideTranslation();
			}
		});

		audioPlayer.addEventListener("ended", () => {
			stopCurrentClip();
		});

		renderSong();
	</script>
</body>
</html>
