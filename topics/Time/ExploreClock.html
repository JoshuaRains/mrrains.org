<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock Practice</title>

  <!-- Noto Sans to match your other pages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Theme */
      --bg-grad-start: #517860;
      --bg-grad-end:   #5c8a6d;

      /* Panel behind the clock for contrast */
      --panel-bg: #e8f4ec; /* light green */

      /* Text/ink */
      --ink: #0f1d14;
      --muted: #2e4a3a;

      /* Color-coding */
      --verb-color: #c62828;     /* red for son/es & are/is */
      --hour-color: #1565c0;     /* blue for hour */
      --minute-color: #6a1b9a;   /* purple for minutes */

      /* Clock sizing */
      --clock-size: 360px;
      --tick-distance: 135px;
      --clock-tick-color: #1a1a1a;
      --clock-font-color: #1a1a1a;
    }

    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Noto Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(to bottom, var(--bg-grad-start), var(--bg-grad-end));
      color: var(--ink);
      display: grid;
      place-items: center;
    }

    /* Centered content card (light green for contrast with white clock) */
    .stage {
      width: min(92vw, 820px);
      padding: clamp(16px, 3vw, 28px);
      background: var(--panel-bg);
      border-radius: 18px;
      box-shadow:
        0 10px 24px rgba(0,0,0,.20),
        0 2px 6px rgba(0,0,0,.08);
      display: grid;
      justify-items: center;
      gap: 14px;
      border: 1px solid rgba(15,29,20,0.06);
    }

    .title {
      font-weight: 800;
      letter-spacing: .2px;
      font-size: clamp(22px, 2.8vw, 28px);
      color: var(--muted);
      margin: 4px 0 2px;
      text-align: center;
      user-select: none;
    }

    /* Clock */
    .clock-container {
      position: relative;
      width: var(--clock-size);
      height: var(--clock-size);
      border-radius: 50%;
      background: #fff; /* high contrast against panel */
      box-shadow: inset 0 0 10px rgba(0,0,0,0.08), 0 0 12px rgba(0,0,0,0.10);
      --radius: calc(var(--clock-size) / 2);
    }

    .tick {
      position: absolute;
      width: 3px;
      height: 16px;
      background-color: var(--clock-tick-color);
      left: 50%;
      top: 50%;
      transform-origin: center center;
      z-index: 1;
    }
    .minute-tick {
      position: absolute;
      width: 2px;
      height: 8px;
      background-color: var(--clock-tick-color);
      left: 50%;
      top: 50%;
      transform-origin: center center;
      z-index: 0;
      opacity: .7;
    }
    .number {
      position: absolute;
      color: var(--clock-font-color);
      font-weight: 700;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      z-index: 2;
      user-select: none;
    }

    .hand {
      position: absolute;
      background-color: var(--clock-font-color);
      left: 50%;
      transform-origin: bottom center;
      border-radius: 2px;
      z-index: 3;
    }
    .hour-hand {
      width: 4px;
      height: calc(var(--radius) * 0.5);
      top: calc(50% - (var(--radius) * 0.5));
    }
    .minute-hand {
      width: 2px;
      height: calc(var(--radius) * 0.7);
      top: calc(50% - (var(--radius) * 0.7));
    }

    /* Controls + readouts */
    .hint {
      margin-top: 2px;
      font-size: .95rem;
      color: var(--muted);
      user-select: none;
      text-align: center;
    }
    #timeSlider {
      width: min(86vw, 680px);
      margin: 8px 0 4px;
    }
    .time-display {
      font-size: clamp(18px, 2.1vw, 22px);
      margin: 2px 0;
      text-align: center;
    }
    .time-display.ital { font-style: italic; }

    /* Color-coding spans */
    .verb   { color: var(--verb-color); font-weight: 700; }
    .hour   { color: var(--hour-color); font-weight: 700; }
    .minute { color: var(--minute-color); font-weight: 700; }

    @media (max-width: 480px){
      :root { --clock-size: 68vw; --tick-distance: calc((68vw)/2 - 40px); }
      .stage { padding: 14px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="title">¿Qué hora es?</div>

    <!-- Analog Clock -->
    <div id="clockContainer" class="clock-container" aria-label="Analog clock face">
      <!-- Hour ticks -->
      <div class="tick" style="transform: translate(-50%, -50%) rotate(0deg)   translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(30deg)  translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(60deg)  translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(90deg)  translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(120deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(150deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(180deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(210deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(240deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(270deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(300deg) translateY(calc(-1 * var(--tick-distance)))"></div>
      <div class="tick" style="transform: translate(-50%, -50%) rotate(330deg) translateY(calc(-1 * var(--tick-distance)))"></div>

      <!-- Numbers -->
      <div class="number" style="transform: translate(-50%, -50%) rotate(0deg)   translateY(calc(-1 * var(--radius) + 22px)) rotate(-0deg);">12</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(30deg)  translateY(calc(-1 * var(--radius) + 22px)) rotate(-30deg);">1</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(60deg)  translateY(calc(-1 * var(--radius) + 22px)) rotate(-60deg);">2</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(90deg)  translateY(calc(-1 * var(--radius) + 22px)) rotate(-90deg);">3</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(120deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-120deg);">4</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(150deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-150deg);">5</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(180deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-180deg);">6</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(210deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-210deg);">7</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(240deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-240deg);">8</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(270deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-270deg);">9</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(300deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-300deg);">10</div>
      <div class="number" style="transform: translate(-50%, -50%) rotate(330deg) translateY(calc(-1 * var(--radius) + 22px)) rotate(-330deg);">11</div>

      <!-- Hands -->
      <div id="hourHand" class="hand hour-hand" aria-hidden="true"></div>
      <div id="minuteHand" class="hand minute-hand" aria-hidden="true"></div>
    </div>

    <!-- Controls -->
    <input type="range" id="timeSlider" min="0" max="720" step="1" value="0" aria-label="Time slider (0-720 minutes)"/>
    <div class="hint">Use ← → to move by 1 minute • Shift+←/→ for 5 minutes</div>

    <!-- Readouts -->
    <p id="spanishTime" class="time-display"></p>
    <p id="numericTime" class="time-display"></p>
    <p id="literalEnglishTime" class="time-display ital"></p>
  </main>

  <script>
    /*************** Build minute ticks dynamically ***************/
    const clockContainer = document.getElementById('clockContainer');
    for (let i = 1; i < 60; i++) {
      if (i % 5 === 0) continue;
      const tick = document.createElement('div');
      tick.className = 'minute-tick';
      tick.style.transform = `
        translate(-50%, -50%)
        rotate(${i * 6}deg)
        translateY(calc(-1 * var(--tick-distance)))
      `;
      clockContainer.appendChild(tick);
    }

    /**************** Helpers to wrap colored parts ****************/
    const wrapVerb    = (txt) => `<span class="verb">${txt}</span>`;
    const wrapHour    = (txt) => `<span class="hour">${txt}</span>`;
    const wrapMinute  = (txt) => `<span class="minute">${txt}</span>`;

    /**************** Spanish time helpers ****************/
    function numberToSpanish(num) {
      const units = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
      const teens = ["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
      const tens  = ["", "", "veinte","treinta","cuarenta","cincuenta"];
      if (num < 10) return units[num];
      if (num < 20) return teens[num - 10];
      if (num < 30) return num === 20 ? "veinte" : "veinti" + units[num % 10];
      if (num < 60) {
        const t = tens[Math.floor(num / 10)];
        const u = units[num % 10];
        return u ? `${t} y ${u}` : t;
      }
      return String(num);
    }

function formatTimeToSpanish(hours, minutes) {
  const hourNames = ["","una","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce"];
  let h = hourNames[hours];
  let part = "";

  if (minutes === 0) part = wrapMinute("en punto");
  else if (minutes === 15) part = "y " + wrapMinute("cuarto");
  else if (minutes === 30) part = "y " + wrapMinute("media");
  else if (minutes === 45) { h = hourNames[(hours % 12) + 1]; part = "menos " + wrapMinute("cuarto"); }
  else if (minutes < 30) part = "y " + wrapMinute(numberToSpanish(minutes));
  else { h = hourNames[(hours % 12) + 1]; part = "menos " + wrapMinute(numberToSpanish(60 - minutes)); }

  // Build with colored verb + hour
  let phrase = `${wrapVerb("Son")} las ${wrapHour(h)} ${part}`.trim();
  // Correct singular case: "Es la una ..."
  phrase = phrase.replace(`${wrapVerb("Son")} las ${wrapHour("una")}`, `${wrapVerb("Es")} la ${wrapHour("una")}`);
  return phrase;
}


function formatLiteralEnglish(hours, minutes) {
  const isSingular = (h) => h === 1;
  const nextHour = hours === 12 ? 1 : hours + 1;

  const verb = isSingular(hours) ? wrapVerb("is") : wrapVerb("are");
  const nextVerb = isSingular(nextHour) ? wrapVerb("is") : wrapVerb("are");

  if (minutes === 0)  
    return `(the ${isSingular(hours) ? "hour" : "hours"}) ${verb} ${wrapHour(String(hours))}, ${wrapMinute("on the dot")}`;
  if (minutes === 15) 
    return `(the ${isSingular(hours) ? "hour" : "hours"}) ${verb} ${wrapHour(String(hours))}, and ${wrapMinute("a quarter")} <i>(hour)</i>`;
  if (minutes === 30) 
    return `(the ${isSingular(hours) ? "hour" : "hours"}) ${verb} ${wrapHour(String(hours))}, and a ${wrapMinute("30")} <i>(minutes)</i>`;
  if (minutes === 45) 
    return `(the ${isSingular(nextHour) ? "hour" : "hours"}) ${nextVerb} ${wrapHour(String(nextHour))}, minus ${wrapMinute("a quarter")} <i>(hour)</i>`;
  if (minutes < 30)   
    return `(the ${isSingular(hours) ? "hour" : "hours"}) ${verb} ${wrapHour(String(hours))}, and ${wrapMinute(String(minutes))} <i>(minutes)</i>`;
  return `(the ${isSingular(nextHour) ? "hour" : "hours"}) ${nextVerb} ${wrapHour(String(nextHour))}, minus ${wrapMinute(String(60 - minutes))} <i>(minutes)</i>`;
}



    /**************** Clock wiring ****************/
    const timeSlider = document.getElementById("timeSlider");
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const spanishTime = document.getElementById("spanishTime");
    const numericTime = document.getElementById("numericTime");
    const literalEnglishTime = document.getElementById("literalEnglishTime");

    timeSlider.addEventListener("input", updateClock);

    function updateClock() {
      const totalMinutes = parseInt(timeSlider.value, 10);
      const hoursRaw = Math.floor(totalMinutes / 60); // 0–12
      const minutes = totalMinutes % 60;
      const displayHours = hoursRaw === 0 ? 12 : hoursRaw;

      const hourAngle = (displayHours % 12) * 30 + (minutes * 0.5);
      const minuteAngle = minutes * 6;

      hourHand.style.transform = `translate(-50%, 0) rotate(${hourAngle}deg)`;
      minuteHand.style.transform = `translate(-50%, 0) rotate(${minuteAngle}deg)`;

      // Spanish (HTML with colored parts)
      spanishTime.innerHTML = formatTimeToSpanish(displayHours, minutes);

      // Numeric (color hour/minute sides too)
      numericTime.innerHTML = `${wrapHour(String(displayHours))}:<span class="minute">${String(minutes).padStart(2, "0")}</span>`;

      // Literal English (HTML with colored parts)
      literalEnglishTime.innerHTML = formatLiteralEnglish(displayHours, minutes);
    }

    // Arrow keys: ±1 minute; Shift+Arrow: ±5 minutes
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const step = e.shiftKey ? 5 : 1;
      const dir = e.key === 'ArrowLeft' ? -step : step;
      const min = parseInt(timeSlider.min, 10);
      const max = parseInt(timeSlider.max, 10);
      let val = parseInt(timeSlider.value, 10) + dir;
      if (val < min) val = min;
      if (val > max) val = max;
      timeSlider.value = String(val);
      updateClock();
      e.preventDefault();
    });

    // Init
    updateClock();
  </script>
</body>
</html>
