<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regular Verbs • Listening Side</title>
  <style>
    /* Page + print setup */
    @page { size: Letter portrait; margin: 0.5in; }
    :root{
      --ink: #111;
      --muted: #444;
      --rule: #222;
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:#fff; color:var(--ink);
      font-family: "Times New Roman", Georgia, serif;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .page{ max-width: 8.5in; margin: 0 auto; padding: 0.5in; }

    /* Header */
    .header{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
    .title{ font-size: 20pt; font-weight:700; letter-spacing: .2px; }
    .subtitle{ font-size: 14pt; font-weight:700; }
    .rule{ height:1px; background:var(--rule); margin: 10px 0 12px; }

    /* Instructions */
    .instructions{ font-size: 12pt; line-height:1.35; margin: 0 0 14px; }

    /* Two-column layout */
    .columns{ display:grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items:start; }

    /* Left column: numbered audio prompts */
    .items{ list-style:none; margin:0; padding:0; counter-reset: q; }
    .items li{ display:flex; align-items:center; gap:8px; padding:2px 0; }
    .items .num{ width: 2ch; text-align:right; font-weight:700; }
    .items audio{ width:100%; max-width:100%; }

    /* Add a bit of breathing room every five */
    .items li.group{ margin-top: 6px; }

    /* Right column: letter bank */
    .bank{ display:block; font-size: 12pt; }
    .sect{ break-inside: avoid; margin-bottom: 12px; }
    .sect h3{ margin:0 0 6px; font-size: 12pt; font-weight:700; }
    .alpha{ list-style-type: upper-alpha; padding-left: 22px; margin:0; }
    .alpha li{ margin:2px 0; }

    /* Print helpers */
    @media print{
      audio{ display:none; }
      .audio-print{ display:inline-block; width:100%; height:18px; border:1px solid #000; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="title">Querer Quiz</div>
      <div class="subtitle">Listening Side</div>
    </div>
    <div class="rule"></div>

    <p class="instructions">
      Press play on each audio sample. Students may listen as many times as needed. They will attempt to select the correct translation of each audio sample.
    </p>

    <div class="columns">
      <!-- LEFT: 1–20 audio players -->
      <ol class="items">
  <li><span class="num">1.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer1.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>
<li><span class="num">2.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer2.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>
  <li><span class="num">3.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer3.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>
  <li><span class="num">4.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer4.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>
  <li><span class="num">5.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer5.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>
  <li><span class="num">6.</span><audio controls preload="none" src="./pages/tools/record_quiz_audio/querer/Querer6.mp3"></audio><span class="audio-print" aria-hidden="true"></span></li>

  
</ol>


      
    </div>
  </div>
</body>
</html>
