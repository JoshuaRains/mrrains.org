<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="google" content="notranslate">
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Lesson Demo</title>

	<style>
		@import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,0,0");

		:root{
			--bg:#0f1b22;
			--panel:#12232b;
			--panel2:#0f2027;
			--line:rgba(255,255,255,.10);
			--line2:rgba(255,255,255,.16);
			--text:#e9f0f6;
			--muted:rgba(233,240,246,.70);
			--muted2:rgba(233,240,246,.55);

			--green:#58cc02;
			--red:#ff4b4b;
			--blue:#1cb0f6;

			--radius:18px;
			--tileRadius:14px;

			--font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
		}

		*{box-sizing:border-box}
		html,body{height:100%}
		body{
			margin:0;
			font-family:var(--font);
			background:var(--bg);
			color:var(--text);
			font-family: Arial, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
		}

		.material-symbols-rounded{
			font-variation-settings: "FILL" 0, "wght" 700, "GRAD" 0, "opsz" 24;
			font-size:22px;
			line-height:1;
			color:rgba(233,240,246,.90);
			user-select:none;
		}

		#appView{
			min-height:100vh;
			display:flex;
			flex-direction:column;
			padding-bottom:120px;
		}

		header{
	display:flex;
	flex-direction:column;
	align-items:center;
	padding:18px 18px 8px;
}

.topbar{
	width:min(980px, 100%);
	display:grid;
	grid-template-columns: 112px 1fr 112px;
	align-items:center;
	gap:14px;
}

.lessonMetaBar{
	width:min(980px, 100%);
	display:grid;
	grid-template-columns: 112px 1fr 112px;
	gap:14px;
	margin-top:8px;
}

.lessonMetaBar > *{
	grid-column:2;
	grid-row:1;
	align-self:center;
}

.lessonMetaTitle{
	justify-self:start;
	font-size:14px;
	letter-spacing:.02em;
	color:var(--muted2);
	font-weight:800;
	text-transform:uppercase;
	line-height:1.1;
}

.lessonMetaSubtitle{
	justify-self:end;
	font-size:14px;
	letter-spacing:.02em;
	color:var(--muted2);
	font-weight:800;
	line-height:1.1;
	text-align:right;
}

.titleBlock{
	text-align:center;
	margin-top:6px;
}

		.lessonPrompt{
	margin-top:18px;
	font-size:26px;
	font-weight:900;
	color:var(--text);
}

		.lessonDoneCard{
			display:none;
			width:min(760px, 100%);
			margin-top:18px;
			padding:28px 24px;
			border-radius:24px;
			border:1px solid rgba(88,204,2,.22);
			background:
				linear-gradient(180deg, rgba(88,204,2,.16), rgba(88,204,2,.06)),
				rgba(255,255,255,.03);
			text-align:center;
			box-shadow:0 18px 32px rgba(0,0,0,.20);
		}
		.lessonDoneCard.show{
			display:block;
		}
		.lessonDoneIcon{
			width:72px;
			height:72px;
			margin:0 auto 16px;
			border-radius:999px;
			display:grid;
			place-items:center;
			background:rgba(255,255,255,.10);
			border:1px solid rgba(255,255,255,.14);
			font-size:34px;
		}
		.lessonDoneTitle{
			font-size:28px;
			font-weight:1000;
			line-height:1.05;
			color:rgba(233,240,246,.97);
		}
		.lessonDoneBody{
			margin-top:10px;
			color:var(--muted);
			font-weight:850;
			line-height:1.35;
		}
		.lessonDoneMeta{
			margin-top:16px;
			display:inline-flex;
			align-items:center;
			justify-content:center;
			gap:8px;
			padding:10px 14px;
			border-radius:999px;
			background:rgba(255,255,255,.08);
			border:1px solid rgba(255,255,255,.12);
			font-weight:900;
			color:rgba(233,240,246,.92);
		}

		.leftControls{
			display:flex;
			align-items:center;
			justify-content:flex-end;
			gap:10px;
			opacity:.95;
		}

		.iconBtn{
			width:36px; height:36px;
			border-radius:12px;
			border:none;
			background:transparent;
			display:grid; place-items:center;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease;
		}
		.iconBtn:hover{background:rgba(255,255,255,.06)}
		.iconBtn:active{transform:translateY(1px)}
		.iconBtn svg{opacity:.85}

		.historyBtn{
			width:36px; height:36px;
			border-radius:999px;
			border:1px solid rgba(88,204,2,.25);
			background:rgba(88,204,2,.12);
			display:grid; place-items:center;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
		}
		.historyBtn:hover{background:rgba(88,204,2,.16); border-color:rgba(88,204,2,.34)}
		.historyBtn:active{transform:translateY(1px)}

		.progressWrap{
			display:flex; align-items:center; gap:12px;
			min-width:0;
		}
		.progressTrack{
			height:14px;
			border-radius:999px;
			background:rgba(255,255,255,.07);
			border:1px solid var(--line);
			overflow:hidden;
			position:relative;
			width:100%;
		}
		.progressFill{
			height:100%;
			width:0%;
			background:var(--green);
			border-radius:999px;
			transition:width .25s ease;
		}

		.rightMeta{
			display:flex;
			align-items:center;
			justify-content:flex-start;
			gap:10px;
		}

		.printIconBtn,.infoBtn{
			width:38px; height:38px;
			border-radius:999px;
			border:1px solid var(--line);
			background:rgba(255,255,255,.03);
			display:grid; place-items:center;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
		}
		.printIconBtn:hover,.infoBtn:hover{background:rgba(255,255,255,.05); border-color:var(--line2)}
		.printIconBtn:active,.infoBtn:active{transform:translateY(1px)}
		.infoBtn:disabled{
			opacity:.35;
			cursor:not-allowed;
		}
		.infoBtn:disabled:hover{
			background:rgba(255,255,255,.03);
			border-color:var(--line);
		}

		.historyOverlay{
			position:fixed;
			inset:0;
			background:rgba(0,0,0,.35);
			opacity:0;
			pointer-events:none;
			transition:opacity .22s ease;
			z-index:40;
		}
		.historyOverlay.open{
			opacity:1;
			pointer-events:auto;
		}

		.historyPanel{
			position:fixed;
			top:0; left:0; bottom:0;
			width:min(420px, 88vw);
			background:rgba(15,27,34,.98);
			border-right:1px solid rgba(255,255,255,.08);
			transform:translateX(-102%);
			transition:transform .28s ease;
			z-index:50;
			display:flex;
			flex-direction:column;
		}
		.historyPanel.open{ transform:translateX(0); }

		.historyHeader{
			padding:16px 16px 12px;
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:10px;
			border-bottom:1px solid rgba(255,255,255,.08);
		}
		.historyTitle{
			font-weight:1000;
			letter-spacing:.01em;
			font-size:14px;
			color:rgba(233,240,246,.92);
			text-transform:uppercase;
		}
		.historyClose{
			width:34px;height:34px;
			border-radius:12px;
			border:none;
			background:rgba(255,255,255,.06);
			color:rgba(233,240,246,.85);
			cursor:pointer;
			display:grid;
			place-items:center;
		}
		.historyClose:hover{background:rgba(255,255,255,.09)}
		.historyClose:active{transform:translateY(1px)}

		.historyList{
			padding:10px 12px 14px;
			overflow:auto;
			display:flex;
			flex-direction:column;
			gap:8px;
		}
		.historyItem{
			border:1px solid rgba(255,255,255,.10);
			background:rgba(255,255,255,.03);
			border-radius:14px;
			padding:10px 10px;
			display:flex;
			gap:10px;
			align-items:flex-start;
		}
		.historyMetaLine{
			display:flex;
			gap:10px;
			align-items:center;
			margin-bottom:4px;
			flex-wrap:wrap;
		}
		.historyQ{
			font-weight:1000;
			color:rgba(233,240,246,.92);
		}
		.historyEn{
			opacity:.75;
			font-weight:850;
			line-height:1.1;
		}
		.historyAns{
			color:rgba(233,240,246,.80);
			font-weight:850;
			line-height:1.25;
			word-break:break-word;
		}

		.statusCircle{
			width:26px; height:26px;
			border-radius:999px;
			display:grid;
			place-items:center;
			flex:0 0 auto;
			border:1px solid rgba(255,255,255,.12);
			background:rgba(255,255,255,.04);
			margin-top:2px;
		}
		.statusCircle.correct{
			border-color:rgba(88,204,2,.25);
			background:rgba(88,204,2,.12);
		}
		.statusCircle.wrong{
			border-color:rgba(255,75,75,.25);
			background:rgba(255,75,75,.12);
		}
		.statusCircle svg{opacity:.95}

		.infoOverlay{
			position:fixed;
			inset:0;
			background:rgba(0,0,0,.35);
			opacity:0;
			pointer-events:none;
			transition:opacity .22s ease;
			z-index:35;
		}
		.infoOverlay.open{
			opacity:1;
			pointer-events:auto;
		}

		.infoPanel{
			position:fixed;
			left:0; right:0;
			bottom:0px;
			height:calc(100vh - 260px);
			max-height:560px;
			background:rgba(15,27,34,.98);
			border-top:1px solid rgba(255,255,255,.10);
			transform:translateY(calc(100% + 140px));
			opacity:0;
			pointer-events:none;
			transition:transform .28s ease, opacity .18s ease;
			z-index:45;
			display:flex;
			flex-direction:column;
		}

		.infoPanel.open{
			transform:translateY(0);
			opacity:1;
			pointer-events:auto;
		}

		.infoHeader{
			padding:12px 16px;
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:10px;
			border-bottom:1px solid rgba(255,255,255,.08);
		}
		.infoTitle{
			font-weight:1000;
			letter-spacing:.01em;
			font-size:14px;
			color:rgba(233,240,246,.92);
			text-transform:uppercase;
		}
		.infoClose{
			width:34px;height:34px;
			border-radius:12px;
			border:none;
			background:rgba(255,255,255,.06);
			color:rgba(233,240,246,.85);
			cursor:pointer;
			display:grid;
			place-items:center;
		}
		.infoClose:hover{background:rgba(255,255,255,.09)}
		.infoClose:active{transform:translateY(1px)}
		.infoBody{
			padding:14px 16px 18px;
			overflow:auto;
			color:rgba(233,240,246,.85);
			font-weight:800;
			line-height:1.35;
		}
		.infoPlaceholder{
			opacity:.75;
			font-weight:850;
		}
		.infoBody iframe{
			width:100%;
			height:100%;
			border:none;
		}
		.infoBody h1,.infoBody h2,.infoBody h3,.infoBody h4{
			margin-top:0;
			color:rgba(233,240,246,.96);
		}
		.infoBody p{margin:0 0 12px}
		.infoBody ul,.infoBody ol{padding-left:22px}
		.infoBody img{
			max-width:100%;
			height:auto;
			border-radius:12px;
		}
		.infoBody table{
			width:100%;
			border-collapse:collapse;
		}
		.infoBody td,.infoBody th{
			border:1px solid rgba(255,255,255,.12);
			padding:8px 10px;
		}

		main{
			flex:1;
			display:flex;
			justify-content:center;
			padding:18px 18px 0;
		}

		.lesson{
			width:min(980px, 100%);
			display:flex;
			flex-direction:column;
			align-items:center;
			padding:18px 0 0;
			gap:18px;
		}





		.audioRow{
			margin-top:10px;
			display:flex;
			gap:12px;
			align-items:center;
			justify-content:center;
		}
		.audioBtn{
			border:1px solid rgba(28,176,246,.25);
			background:rgba(28,176,246,.16);
			color:var(--text);
			border-radius:18px;
			padding:14px 18px;
			cursor:pointer;
			display:flex;
			align-items:center;
			justify-content:center;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
			box-shadow:none;
			font-weight:1000;
			min-width:56px;
		}
		.audioBtn:active{transform:translateY(1px)}
		.audioBtn:hover{background:rgba(28,176,246,.20); border-color:rgba(28,176,246,.34)}
		.audioBtn.small{padding:14px 14px; border-radius:16px; opacity:.92; min-width:52px;}
		.audioBtn[disabled]{opacity:.35; cursor:not-allowed;}
		.audioBtn.isHidden{
			visibility:hidden;
			pointer-events:none;
			cursor:default;
		}

		.answerArea{
			width:min(760px, 100%);
			margin-top:22px;
			padding:0;
			background:transparent;
			border:none;
		}
		.answerArea.hidden{
			display:none;
		}

		.answerLines{
			display:flex;
			flex-direction:column;
			gap:18px;
			padding:10px 6px;
		}
		.answerLine{
			height:0;
			border-top:2px solid rgba(255,255,255,.16);
			background:transparent;
			margin-top:38px;
		}
		.answerTiles{
			margin-top:-115px;
			display:flex;
			flex-wrap:wrap;
			gap:10px;
			min-height:110px;
			align-content:flex-start;
			padding:0 6px;
		}

		.bankArea{
			width:min(760px, 100%);
			display:flex;
			justify-content:center;
			margin-top:6px;
		}
		.bankTiles{
			display:flex;
			flex-wrap:wrap;
			justify-content:center;
			gap:10px;
			padding:10px 6px;
			width:100%;
		}

		.tile{
			user-select:none;
			cursor:pointer;
			padding:10px 14px;
			border-radius:var(--tileRadius);
			border:1px solid rgba(255,255,255,.14);
			border-bottom:2px solid rgba(255,255,255,.22);
			background:rgba(255,255,255,.03);
			color:rgba(233,240,246,.95);
			font-weight:800;
			letter-spacing:.01em;
			transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
			box-shadow:none;
		}
		.tile:hover{
			background:rgba(255,255,255,.05);
			border-color:rgba(255,255,255,.20);
			border-bottom-color:rgba(255,255,255,.28);
		}
		.tile:active{transform:translateY(1px)}
		.tile.disabled{
			opacity:.45;
			cursor:not-allowed;
		}
		.tile.selected{
			background:rgba(28,176,246,.18);
			border-color:rgba(28,176,246,.34);
			border-bottom-color:rgba(28,176,246,.44);
			box-shadow:0 0 0 2px rgba(28,176,246,.18) inset;
		}

		.gridTiles{
			display:grid;
			width:min(760px, 100%);
			gap:10px;
			padding:10px 6px;
		}
		.gridTile{
			min-height:64px;
			display:flex;
			align-items:center;
			justify-content:center;
			text-align:center;
			white-space:normal;
			line-height:1.2;
			padding:12px 10px;
			font-size:15px;
		}

		.bottomSheet{
			position:fixed;
			left:0; right:0; bottom:0;
			display:flex;
			justify-content:center;
			padding:14px 18px 16px;
			border-top:1px solid rgba(255,255,255,.06);
			background:rgba(15,27,34,.98);
			z-index:10;
		}

		.sheetInner{
			width:min(980px, 100%);
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:16px;
		}

		.sheetLeft{
			display:flex;
			align-items:flex-start;
			gap:14px;
			min-height:54px;
			flex:1;
		}

		.sheetIcon{
			width:44px; height:44px;
			border-radius:999px;
			display:grid;
			place-items:center;
			flex:0 0 auto;
			border:1px solid rgba(255,255,255,.12);
			background:rgba(255,255,255,.04);
		}

		.sheetText{
			display:flex;
			flex-direction:column;
			gap:6px;
			padding-top:2px;
		}

		.sheetTitle{
			font-weight:1000;
			letter-spacing:.01em;
			font-size:18px;
			line-height:1.05;
		}
		.sheetBody{
			color:var(--muted);
			font-weight:800;
			line-height:1.25;
		}

		.bottomSheet.answering .sheetLeft{opacity:0; pointer-events:none;}
		.bottomSheet.answering .sheetIcon{display:none;}
		.bottomSheet.answering .sheetText{display:none;}

		.bottomSheet.correct .sheetTitle{color:rgba(88,204,2,.95);}
		.bottomSheet.correct .sheetIcon{
			border-color:rgba(88,204,2,.25);
			background:rgba(88,204,2,.12);
		}

		.bottomSheet.wrong .sheetTitle{color:rgba(255,75,75,.95);}
		.bottomSheet.wrong .sheetIcon{
			border-color:rgba(255,75,75,.25);
			background:rgba(255,75,75,.12);
		}

		.bottomSheet.done .sheetTitle{color:rgba(233,240,246,.95);}
		.bottomSheet.done .sheetIcon{
			border-color:rgba(255,255,255,.18);
			background:rgba(255,255,255,.06);
		}

		.sheetBtn{
			border-radius:16px;
			padding:14px 22px;
			border:1px solid rgba(255,255,255,.14);
			background:rgba(255,255,255,.06);
			color:rgba(233,240,246,.75);
			font-weight:1000;
			letter-spacing:.02em;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
			min-width:150px;
			text-align:center;
		}
		.sheetBtn:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.20)}
		.sheetBtn:active{transform:translateY(1px)}
		.sheetBtn:disabled{opacity:.35; cursor:not-allowed}

		.bottomSheet.correct .sheetBtn,
		.bottomSheet.wrong .sheetBtn,
		.bottomSheet.done .sheetBtn{
			background:#ffffff;
			border-color:#ffffff;
			color:#0f1b22;
		}

		.typedArea{
	width:min(760px, 100%);
	margin-top:22px;
	display:none;
	justify-content:center;
}

.typedArea.show{
	display:flex;
}

.typedInput{
	width:100%;
	padding:18px 20px;
	border-radius:18px;
	border:1px solid rgba(255,255,255,.14);
	border-bottom:2px solid rgba(255,255,255,.22);
	background:rgba(255,255,255,.04);
	color:rgba(233,240,246,.96);
	font-size:22px;
	font-weight:800;
	outline:none;
	transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
}

.typedInput::placeholder{
	color:rgba(233,240,246,.42);
}

.typedInput:focus{
	background:rgba(255,255,255,.06);
	border-color:rgba(28,176,246,.34);
	border-bottom-color:rgba(28,176,246,.44);
	box-shadow:0 0 0 2px rgba(28,176,246,.14);
}

.typedInput[disabled]{
	opacity:.65;
	cursor:not-allowed;
}

/* existing request: double size if a table tile is only one character / emoji */
.gridTile .emojiChar{
	font-size:2em;
	line-height:1;
	display:inline-block;
	vertical-align:-0.12em;
}

		.encourageWrap{
			position:fixed;
			left:max(20px, calc(50% - 470px));
			bottom:90px;
			width:170px;
			height:150px;
			pointer-events:none;
			overflow:hidden;
			z-index:9;
		}
		.encourageGif{
			position:absolute;
			left:0;
			bottom:-170px;
			width:150px;
			height:auto;
			opacity:0;
			filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));
		}
		.encourageGif.play{
			animation:catPeek 2.1s ease-in-out forwards;
		}
		.gridTile.singleChar{
	font-size:30px;
	line-height:1;
}
		@keyframes catPeek{
			0%{
				transform:translateY(0);
				opacity:0;
			}
			15%{

		function shuffle(arr){
			const a = arr.slice();
			for(let i=a.length-1;i>0;i--){
				const j = Math.floor(Math.random()*(i+1));
				[a[i],a[j]] = [a[j],a[i]];
			}
			return a;
		}

		function normalizeTokens(tokens){
			const out = [];
			for(const t of tokens){
				const punct = /^[\.\,\!\?\:\;]+$/.test(t);
				if(punct && out.length){
					out[out.length-1] = out[out.length-1] + t;
				}else{
					out.push(t);
				}
			}
			return out.join(" ").trim();
		}

		function tokensToText(tokens){

		async function resolveAudioUrlForKey(key){
			for(const ext of AUDIO_EXTS){
				const url = `${AUDIO_DIR}/${key}.${ext}`;
				try{
					const res = await fetch(url, { method:"HEAD", cache:"no-store" });
					if(res.ok) return url;
				}catch(_e){}
			}
			return null;
		}

		async function getAudioForKey(key){
			if(!key) return null;

			if(audioCache.has(key)){
				const entry = audioCache.get(key);
				return entry.ok ? entry.audio : null;
			}

			const url = await resolveAudioUrlForKey(key);
			if(!url){
				audioCache.set(key, { audio:null, ok:false });
				return null;
			}

			const a = new Audio(url);
			a.preload = "auto";
			audioCache.set(key, { audio:a, ok:true });
			return a;
		}

		async function playAudioKey(key, { rate=1.0 } = {}){
			const a = await getAudioForKey(key);
			if(!a) return;

			try{
				if(currentlyPlayingAudio && currentlyPlayingAudio !== a){
					currentlyPlayingAudio.pause();
					currentlyPlayingAudio.currentTime = 0;
				}
				a.pause();
				a.currentTime = 0;
				a.playbackRate = rate;

				currentlyPlayingAudio = a;
				await a.play();
			}catch(_e){}
		}

				.replaceAll(">","&gt;")
				.replaceAll('"',"&quot;")
				.replaceAll("'","&#039;");

		function getTableTiles(q){

		function getTableTileText(tile){
			if(tile && typeof tile === "object"){
				return String(tile.text || tile.label || "").trim();
			}
			return String(tile || "").trim();
		}

		function getCorrectTableIndex(q){
			const tiles = getTableTiles(q);

			if(typeof q.correctIndex === "number") return q.correctIndex;

			if(typeof q.correctTile === "string"){
				const want = q.correctTile.trim();
				const idx = tiles.findIndex(t => getTableTileText(t) === want);
				if(idx >= 0) return idx;
			}

			if(Array.isArray(q.answer) && q.answer.length){
				const want = normalizeTokens(q.answer);
				const idx = tiles.findIndex(t => getTableTileText(t) === want);
				if(idx >= 0) return idx;
			}

			return -1;
		}

		function rebuildSentenceTiles(){
			els.answerTiles.innerHTML = "";

					if(slot) slot.used = false;

				});

				t.type = "button";
				t.className = "tile" + (item.used ? " disabled" : "");
				t.textContent = item.text;
				t.disabled = item.used || mode !== "answering";
				t.addEventListener("click", () => {

					if(item.used) return;

					item.used = true;
					chosen.push(item.text);

					rebuildSentenceTiles();

					if(canPlayTileAudio){

function rebuildTableSelectTiles(q){
	const cfg = getGridConfig(q);
	const tiles = getTableTiles(q);

	els.answerTiles.innerHTML = "";
	els.bankTiles.innerHTML = "";
	els.bankTiles.className = "gridTiles";
	els.bankTiles.style.gridTemplateColumns = `repeat(${cfg.cols}, minmax(0, 1fr))`;

	for(let i=0;i<tiles.length;i++){
		const tileText = getTableTileText(tiles[i]);
		const btn = document.createElement("button");
		btn.type = "button";

		const trimmed = tileText.trim();
		const graphemeCount = [...new Intl.Segmenter().segment(trimmed)].length;
		const singleChar = graphemeCount === 1;
		const hasEmoji = containsEmoji(trimmed);

		let extraClass = "";
		if(!hasEmoji && singleChar){
			extraClass = " singleChar";
		}

		btn.className =
			"tile gridTile" +
			extraClass +
			(selectedGridIndex === i ? " selected" : "");

		if(hasEmoji){
			btn.innerHTML = renderTileTextWithEmoji(tileText);
		}else{
			btn.textContent = tileText;
		}

		btn.disabled = mode !== "answering";

		btn.addEventListener("click", () => {
			if(mode !== "answering") return;
			selectedGridIndex = i;
			rebuildTableSelectTiles(q);
			updateMainButton();
			saveState();
		});

		els.bankTiles.appendChild(btn);
	}
}

			if(count > 0){
				chosenCounts.set(w, count - 1);

					let translation = "";
					if(typeof q.translation === "string" && q.translation.trim()){
						translation = q.translation.trim();
					}else if(spec.type === "listen-es-en"){
						translation = tokensToText(q.answer);
					}else{
						translation = (typeof q.sentence === "string") ? q.sentence.trim() : "";
					}
					body = translation ? `Translation: ${translation}` : "Translation: ";
				}

				setBottomSheet("correct", "Correct!", body);
				updateMainButton();
			}else{
				queue.push(currentIndex);
				mode = "feedback";
				lastResult = "wrong";
				setBottomSheet("wrong", "Not quite...", "This question will come back later.");
				updateMainButton();
			}

			const qNumber = `Q${currentIndex + 1}`;
			const englishText = isRight ? getEnglishForHistory(q) : "";

			responseHistory.push({
				qIndex: currentIndex,
				qNumber,

			});

function onMainButton(){
	if(mode === "answering"){
		const q = lesson.questions[currentIndex];
		const spec = getQuestionSpec(q);

		let isRight = false;
		let attempt = "";

		if(isTableQuestion(q)){
			const tiles = getTableTiles(q);
			const correctIndex = getCorrectTableIndex(q);
			const picked = (selectedGridIndex !== null && tiles[selectedGridIndex] != null)
				? getTableTileText(tiles[selectedGridIndex])
				: "";
			attempt = picked;
			isRight = (selectedGridIndex === correctIndex);
		}else if(isTypedQuestion(q)){
			attempt = els.typedInput.value.trim();

			const normalizedAttempt = normalizeTypedText(attempt);
			const accepted = [];

			if(typeof q.answerText === "string" && q.answerText.trim()){
				accepted.push(q.answerText);
			}

			if(Array.isArray(q.answerTexts)){
				for(const a of q.answerTexts){
					if(typeof a === "string" && a.trim()) accepted.push(a);
				}
			}

			if(Array.isArray(q.answer) && q.answer.length){
				accepted.push(tokensToText(q.answer));
			}

			if(Array.isArray(q.answerAlternates)){
				for(const alt of q.answerAlternates){
					if(Array.isArray(alt) && alt.length){
						accepted.push(tokensToText(alt));
					}else if(typeof alt === "string" && alt.trim()){
						accepted.push(alt);
					}
				}
			}

			for(const ans of accepted){
				if(normalizedAttempt === normalizeTypedText(ans)){
					isRight = true;
					break;
				}
			}
		}else{
			attempt = normalizeTokens(chosen);

			const candidates = [];
			if(Array.isArray(q.answer)) candidates.push(q.answer);
			if(Array.isArray(q.answerAlternates)){
				for(const alt of q.answerAlternates){
					if(Array.isArray(alt)) candidates.push(alt);
				}
			}

			for(const cand of candidates){
				const correct = normalizeTokens(cand);
				if(attempt === correct){
					isRight = true;
					break;
				}
			}
		}

		if(isRight){
			mastered.add(currentIndex);
		}

		showFeedback(isRight, attempt);
	}else if(mode === "feedback"){
		loadQuestion();
	}else if(mode === "done"){
		window.location.href = "./home";
	}
}

			els.printBtn.addEventListener("click", () => {
				buildPrintView();
				setTimeout(() => window.print(), 50);
			});

			const res = await fetch(lessonPath, { cache:"no-store" });
			lesson = await res.json();

			els.lessonTitle.textContent = lesson.title || "Lesson";
			els.lessonSubtitle.textContent = lesson.subtitle || "";

			const saved = loadState();
			if(saved && restoreFromSavedState(saved)){
				return;
			}

			queue = lesson.questions.map((_, i) => i);
			mastered = new Set();
			currentIndex = null;
			responseHistory = [];
			chosen = [];
			bank = [];
			selectedGridIndex = null;
			mode = "answering";
			lastResult = null;

			rebuildHistoryList();
			saveState();
			loadQuestion();
		}

		init().catch(err => {
	console.error(err);
	els.lessonTitle.textContent = "Error loading lesson JSON";
	els.lessonSubtitle.textContent = "";
	mode = "done";
	setBottomSheet("wrong", "Error:", "Could not load the lesson file. Serve this folder with a local web server.");
	els.mainBtn.disabled = false;
	els.mainBtn.textContent = "DONE";
	els.mainBtn.onclick = () => window.location.href = "./home";
});
	})();
	</script>
</body>
</html>
