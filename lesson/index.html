<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Lesson Demo</title>

	<style>
		:root{
			/* Dark Duolingo-ish */
			--bg:#0f1b22;
			--panel:#12232b;
			--panel2:#0f2027;
			--line:rgba(255,255,255,.10);
			--line2:rgba(255,255,255,.16);
			--text:#e9f0f6;
			--muted:rgba(233,240,246,.70);
			--muted2:rgba(233,240,246,.55);

			--green:#58cc02;
			--green2:#4fb301;
			--red:#ff4b4b;
			--red2:#e23e3e;
			--blue:#1cb0f6;

			--radius:18px;
			--tileRadius:14px;

			--font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
		}

		*{box-sizing:border-box}
		html,body{height:100%}
		body{
			margin:0;
			font-family:var(--font);
			background:var(--bg); /* CLEAN: no gradients */
			color:var(--text);
		}

		#appView{
			min-height:100vh;
			display:flex;
			flex-direction:column;
			padding-bottom:120px; /* space for bottom sheet */
		}

		/* ======= TOP BAR ======= */
		header{
			display:flex;
			align-items:center;
			justify-content:center;
			padding:18px 18px 8px;
		}
		.topbar{
			width:min(980px, 100%);
			display:grid;
			grid-template-columns: 120px 1fr 160px;
			align-items:center;
			gap:14px;
		}
		.leftControls{
			display:flex;
			align-items:center;
			gap:10px;
			opacity:.9;
		}

		.iconBtn{
			width:36px; height:36px;
			border-radius:12px;
			border:none;                /* removed */
			background:transparent;     /* transparent */
			display:grid; place-items:center;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease;
		}
		.iconBtn:hover{background:rgba(255,255,255,.06)}
		.iconBtn:active{transform:translateY(1px)}
		.iconBtn svg{opacity:.85}

		.progressWrap{
			display:flex; align-items:center; gap:12px;
		}
		.progressTrack{
			height:14px;
			border-radius:999px;
			background:rgba(255,255,255,.07);
			border:1px solid var(--line);
			overflow:hidden;
			position:relative;
		}
		.progressFill{
			height:100%;
			width:0%;
			background:var(--green);
			border-radius:999px;
			transition:width .25s ease;
		}

		.rightMeta{
			display:flex;
			align-items:center;
			justify-content:flex-end;
			gap:10px;
		}

		.printBtn{
			border-radius:999px;
			padding:10px 14px;
			border:1px solid var(--line);
			background:rgba(255,255,255,.03);
			color:rgba(233,240,246,.80);
			font-weight:900;
			cursor:pointer;
			transition:background .15s ease, border-color .15s ease, transform .08s ease;
			white-space:nowrap;
		}
		.printBtn:hover{background:rgba(255,255,255,.05); border-color:var(--line2)}
		.printBtn:active{transform:translateY(1px)}

		/* ======= MAIN ======= */
		main{
			flex:1;
			display:flex;
			justify-content:center;
			padding:18px 18px 0;
		}

		.lesson{
			width:min(980px, 100%);
			display:flex;
			flex-direction:column;
			align-items:center;
			padding:18px 0 0;
			gap:18px;
		}

		.titleBlock{
			text-align:center;
			margin-top:6px;
		}
		.lessonTitle{
			font-size:14px;
			letter-spacing:.02em;
			color:var(--muted2);
			font-weight:800;
			text-transform:uppercase;
		}
		.lessonPrompt{
			margin-top:18px;
			font-size:26px;
			font-weight:900;
			color:var(--text);
		}

		.audioRow{
			margin-top:10px;
			display:flex;
			gap:12px;
			align-items:center;
			justify-content:center;
		}
		.audioBtn{
			border:1px solid rgba(28,176,246,.25);
			background:rgba(28,176,246,.16);
			color:var(--text);
			border-radius:18px;
			padding:14px 18px;
			cursor:pointer;
			display:flex;
			align-items:center;
			gap:12px;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
			box-shadow:none; /* CLEAN: remove glow */
		}
		.audioBtn:active{transform:translateY(1px)}
		.audioBtn:hover{background:rgba(28,176,246,.20); border-color:rgba(28,176,246,.34)}
		.audioBtn .soundIcon{width:22px; height:22px;}
		.audioBtn.small{padding:14px 14px; border-radius:16px; opacity:.92;}
		.audioBtn[disabled]{opacity:.35; cursor:not-allowed;}

		.answerArea{
			width:min(760px, 100%);
			margin-top:22px;
			padding:0;               /* no boxed padding */
			border-radius:0;
			background:transparent;  /* remove box */
			border:none;             /* remove border */
		}

		/* Rails container */
		.answerLines{
			display:flex;
			flex-direction:column;
			gap:18px;          /* space between rails */
			padding:10px 6px;  /* light breathing room */
		}

		/* Each rail: a thin line positioned so tiles "sit" on it */
		.answerLine{
			height:0;
			border-top:2px solid rgba(255,255,255,.16);
			border-radius:0;
			background:transparent;
			/* Place the line under where tiles rest */
			margin-top:38px;   /* tune: should land near tile bottom */
		}

		/* Put tiles on top of the rails with room for two rows */
		.answerTiles{
			margin-top:-115px;  /* pulls tiles up so they sit on rails */
			display:flex;
			flex-wrap:wrap;
			gap:10px;
			min-height:110px;  /* enough for ~2 tile rows */
			align-content:flex-start;
			padding:0 6px;
		}

		.bankArea{
			width:min(760px, 100%);
			display:flex;
			justify-content:center;
			margin-top:6px;
		}
		.bankTiles{
			display:flex;
			flex-wrap:wrap;
			justify-content:center;
			gap:10px;
			padding:10px 6px;
		}

		.tile{
			user-select:none;
			cursor:pointer;
			padding:10px 14px;
			border-radius:var(--tileRadius);

			/* top/sides border */
			border:1px solid rgba(255,255,255,.14);

			/* 3D bottom edge (2px) */
			border-bottom:2px solid rgba(255,255,255,.22);

			background:rgba(255,255,255,.03);
			color:rgba(233,240,246,.95);
			font-weight:800;
			letter-spacing:.01em;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
			box-shadow:none;
		}
		.tile:hover{
			background:rgba(255,255,255,.05);
			border-color:rgba(255,255,255,.20);
			border-bottom-color:rgba(255,255,255,.28);
		}
		.tile:active{transform:translateY(1px)}
		.tile.disabled{
			opacity:.45;
			cursor:not-allowed;
		}

		/* ======= BOTTOM SHEET (Duolingo-style feedback) ======= */
		.bottomSheet{
			position:fixed;
			left:0; right:0; bottom:0;
			display:flex;
			justify-content:center;
			padding:14px 18px 16px;
			border-top:1px solid rgba(255,255,255,.06);
			background:rgba(15,27,34,.98);
		}

		.sheetInner{
			width:min(980px, 100%);
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:16px;
		}

		.sheetLeft{
			display:flex;
			align-items:flex-start;
			gap:14px;
			min-height:54px;
			flex:1;
		}

		.sheetIcon{
			width:44px; height:44px;
			border-radius:999px;
			display:grid;
			place-items:center;
			flex:0 0 auto;
			border:1px solid rgba(255,255,255,.12);
			background:rgba(255,255,255,.04);
		}

		.sheetText{
			display:flex;
			flex-direction:column;
			gap:6px;
			padding-top:2px;
		}

		.sheetTitle{
			font-weight:1000;
			letter-spacing:.01em;
			font-size:18px;
			line-height:1.05;
		}
		.sheetBody{
			color:var(--muted);
			font-weight:800;
			line-height:1.25;
		}

		/* states */
		.bottomSheet.answering .sheetLeft{opacity:0; pointer-events:none;}
		.bottomSheet.answering .sheetIcon{display:none;}
		.bottomSheet.answering .sheetText{display:none;}

		.bottomSheet.correct{
			background:rgba(15,27,34,.98);
		}
		.bottomSheet.correct .sheetTitle{color:rgba(88,204,2,.95);}
		.bottomSheet.correct .sheetIcon{
			border-color:rgba(88,204,2,.25);
			background:rgba(88,204,2,.12);
		}

		.bottomSheet.wrong{
			background:rgba(15,27,34,.98);
		}
		.bottomSheet.wrong .sheetTitle{color:rgba(255,75,75,.95);}
		.bottomSheet.wrong .sheetIcon{
			border-color:rgba(255,75,75,.25);
			background:rgba(255,75,75,.12);
		}

		.bottomSheet.done .sheetTitle{color:rgba(233,240,246,.95);}
		.bottomSheet.done .sheetIcon{
			border-color:rgba(255,255,255,.18);
			background:rgba(255,255,255,.06);
		}

		.sheetBtn{
			border-radius:16px;
			padding:14px 22px;
			border:1px solid rgba(255,255,255,.14);
			background:rgba(255,255,255,.06);
			color:rgba(233,240,246,.75);
			font-weight:1000;
			letter-spacing:.02em;
			cursor:pointer;
			transition:transform .08s ease, background .15s ease, border-color .15s ease;
			min-width:150px;
			text-align:center;
		}
		.sheetBtn:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.20)}
		.sheetBtn:active{transform:translateY(1px)}
		.sheetBtn:disabled{opacity:.35; cursor:not-allowed}

		/* When feedback is showing, button becomes WHITE and says NEXT (like Duo) */
		.bottomSheet.correct .sheetBtn,
		.bottomSheet.wrong .sheetBtn,
		.bottomSheet.done .sheetBtn{
			background:#ffffff;
			border-color:#ffffff;
			color:#0f1b22;
		}

		/* ======= PRINT VIEW (HIDDEN ONSCREEN) ======= */
		#printView{display:none;}
		#lessonPrompt .promptPrefix{
	font-size:18px !important; /* slightly smaller than 26px */
	font-weight:900;
	opacity:0.9;
	margin-right:3px;
	letter-spacing:.01em;
	white-space:nowrap;
	display:inline-block;
}
/* ADD these styles */
.audioBtn.isHidden{
	visibility:hidden;   /* keeps spacing/layout exactly the same */
	pointer-events:none; /* no hover/click */
	cursor:default;      /* no pointer cursor */
}
.audioBtn.isHidden:hover{
	background:rgba(28,176,246,.16); /* prevent hover visual */
	border-color:rgba(28,176,246,.25);
}

		@media print{
			:root{
				--paperText:#0f1720;
				--paperMuted:#334155;
				--paperLine:#cbd5e1;
				--paperPanel:#f8fafc;
				--paperPanel2:#ffffff;
			}

			body{
				background:#fff !important;
				color:var(--paperText) !important;
				margin:0 !important;
				padding:0 !important;
			}

			#appView{display:none !important;}

			#printView{
				display:block !important;
				padding:0 !important;
				font-family: var(--font);
				font-size:11px;
			}

			.printPage{
				padding-top:0.5in;
				padding-left:0.5in;
				padding-right:0.5in;
				padding-bottom:0.5in;
				page-break-after:always;
				break-after:page;
			}
			.printPage:last-child{
				page-break-after:auto;
				break-after:auto;
			}

			.printHeader{
				display:flex;
				justify-content:space-between;
				align-items:flex-start;
				gap:14px;
				margin-bottom:10px;
				padding-bottom:8px;
				border-bottom:2px solid #e2e8f0;
			}

			.printTitle{
				font-size:14px;
				font-weight:1000;
				letter-spacing:.01em;
			}

			.nameRow{
				display:flex;
				gap:16px;
				align-items:baseline;
				margin-top:10px;
			}
			.nameRow .nameLine{
				margin-top:0;
				white-space:nowrap;
				font-weight:800;
				color:var(--paperMuted);
			}
			.nameRow .nameLine span{
				display:inline-block;
				min-width:240px;
				border-bottom:1.5px solid var(--paperLine);
				transform:none !important;
			}
			.nameRow .nameLine:last-child span{ min-width:140px; }

			.printMeta{
				text-align:right;
				color:var(--paperMuted);
				font-weight:800;
			}

			.printGrid{
				display:grid;
				grid-template-columns: 1fr 1fr;
				gap:10px;
				align-items:start;
			}

			.printCard{
				border:1.5px solid #e2e8f0;
				border-radius:12px;
				padding:8px 10px;
				background:var(--paperPanel2);
				break-inside:avoid;
				page-break-inside:avoid;
				margin:0;
			}

			.printPrompt{
				font-weight:1000;
				margin-bottom:6px;
				display:flex;
				align-items:center;
				gap:8px;
				font-size:11px;
			}

			.badge{
				display:inline-block;
				padding:2px 8px;
				border-radius:999px;
				font-weight:1000;
				font-size:10px;
				border:1.5px solid #e2e8f0;
				background:var(--paperPanel);
				color:var(--paperMuted);
			}

			.printSentence{
				font-size:11px;
				font-weight:900;
				margin-bottom:6px;
			}

			.blankLines{
				display:flex;
				flex-direction:column;
				gap:6px;
			}
			.blank{
				border-bottom:1.5px solid var(--paperLine);
				height:16px;
			}


		}
	</style>
</head>

<body>
	<div id="appView">
		<header>
			<div class="topbar">
				<div class="leftControls">
					<button class="iconBtn" id="closeBtn" title="Exit" aria-label="Exit">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none">
							<path d="M6 6L18 18M18 6L6 18" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
						</svg>
					</button>
				</div>

				<div class="progressWrap">
					<div class="progressTrack" style="width:100%">
						<div class="progressFill" id="progressFill"></div>
					</div>
				</div>

				<div class="rightMeta">
					<button class="printBtn" id="printBtn" title="Print / Save PDF">Print / Save PDF</button>
				</div>
			</div>
		</header>

		<main>
			<section class="lesson">
				<div class="titleBlock">
					<div class="lessonTitle" id="lessonTitle">Loading…</div>
					<div class="lessonPrompt" id="lessonPrompt"></div>

					<div class="audioRow">
						<button class="audioBtn" id="audioBtn" type="button" title="Listen">
							<img class="soundIcon" src="../assets/sound.svg" alt="" />
						</button>
						<button class="audioBtn small" id="audioSlowBtn" type="button" title="Slow">
							<img class="soundIcon" src="../assets/sound.svg" alt="" style="opacity:.85; transform:scale(.9)" />
						</button>
					</div>
				</div>

				<div class="answerArea">
					<div class="answerLines" aria-hidden="true">
						<div class="answerLine"></div>
						<div class="answerLine"></div>
					</div>
					<div class="answerTiles" id="answerTiles"></div>
				</div>

				<div class="bankArea">
					<div class="bankTiles" id="bankTiles"></div>
				</div>
			</section>
		</main>

		<div class="bottomSheet answering" id="bottomSheet">
			<div class="sheetInner">
				<div class="sheetLeft">
					<div class="sheetIcon" id="sheetIcon" aria-hidden="true"></div>
					<div class="sheetText">
						<div class="sheetTitle" id="sheetTitle"></div>
						<div class="sheetBody" id="sheetBody"></div>
					</div>
				</div>

				<button class="sheetBtn" id="mainBtn" type="button" disabled>CHECK</button>
			</div>
		</div>
	</div>

	<div id="printView"></div>

	<script>
	(() => {
		"use strict";

		const els = {
			lessonTitle: document.getElementById("lessonTitle"),
			lessonPrompt: document.getElementById("lessonPrompt"),
			bankTiles: document.getElementById("bankTiles"),
			answerTiles: document.getElementById("answerTiles"),
			progressFill: document.getElementById("progressFill"),
			printBtn: document.getElementById("printBtn"),
			printView: document.getElementById("printView"),

			closeBtn: document.getElementById("closeBtn"),
			audioBtn: document.getElementById("audioBtn"),
			audioSlowBtn: document.getElementById("audioSlowBtn"),

			bottomSheet: document.getElementById("bottomSheet"),
			sheetIcon: document.getElementById("sheetIcon"),
			sheetTitle: document.getElementById("sheetTitle"),
			sheetBody: document.getElementById("sheetBody"),
			mainBtn: document.getElementById("mainBtn")
		};

		let lesson = null;

		let queue = [];
		let mastered = new Set();
		let currentIndex = null;

		let chosen = []; // strings
		let bank = [];   // {text, used}
		let mode = "answering"; // "answering" | "feedback" | "done"
		let lastResult = null;  // "correct" | "wrong" | null

		// Audio
		const AUDIO_DIR = "./audio";
		const AUDIO_EXTS = ["mp3","wav","ogg","m4a"];
		const audioCache = new Map();
		let currentSentenceAudioKey = null;

		// NEW: only play audio for Spanish tiles (not English)
		let canPlayTileAudio = true;

		function shuffle(arr){
			const a = arr.slice();
			for(let i=a.length-1;i>0;i--){
				const j = Math.floor(Math.random()*(i+1));
				[a[i],a[j]] = [a[j],a[i]];
			}
			return a;
		}

		function normalizeTokens(tokens){
			const out = [];
			for(const t of tokens){
				const punct = /^[\.\,\!\?\:\;]+$/.test(t);
				if(punct && out.length){
					out[out.length-1] = out[out.length-1] + t;
				}else{
					out.push(t);
				}
			}
			return out.join(" ").trim();
		}

		function setProgress(){
			const total = lesson.questions.length;
			const done = mastered.size;
			const pct = total ? Math.round((done/total)*100) : 0;
			els.progressFill.style.width = pct + "%";
		}

		function setBottomSheet(state, title, body){
			els.bottomSheet.classList.remove("answering","correct","wrong","done");
			els.bottomSheet.classList.add(state);

			if(state === "answering"){
				els.sheetTitle.textContent = "";
				els.sheetBody.textContent = "";
				els.sheetIcon.innerHTML = "";
				els.mainBtn.textContent = "CHECK";
			}else if(state === "correct"){
				els.sheetTitle.textContent = title || "Correct!";
				els.sheetBody.textContent = body || "";
				els.sheetIcon.innerHTML = iconCheck();
				els.mainBtn.textContent = "NEXT";
			}else if(state === "wrong"){
				els.sheetTitle.textContent = title || "Not quite...";
				els.sheetBody.textContent = body || "This question will come back later.";
				els.sheetIcon.innerHTML = iconX();
				els.mainBtn.textContent = "NEXT";
			}else if(state === "done"){
				els.sheetTitle.textContent = title || "Lesson complete!";
				els.sheetBody.textContent = body || "You mastered every sentence.";
				els.sheetIcon.innerHTML = iconStar();
				els.mainBtn.textContent = "DONE";
			}
		}

		function iconX(){
			return `
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
					<path d="M7 7l10 10M17 7L7 17" stroke="white" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
				</svg>
			`;
		}
		function iconCheck(){
			return `
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
					<path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
				</svg>
			`;
		}
		function iconStar(){
			return `
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
					<path d="M12 3l2.6 5.8 6.4.6-4.8 4.2 1.4 6.2L12 16.9 6.4 20l1.4-6.2L3 9.4l6.4-.6L12 3Z"
						stroke="white" stroke-width="1.8" fill="none" opacity=".9" stroke-linejoin="round"/>
				</svg>
			`;
		}

		function safeAudioNameFromText(text){
			let s = String(text).trim().toLowerCase();
			s = s.replace(/[.,!?;:¿¡"“”'‘’()[\]{}<>]/g, "");
			s = s.replace(/\s+/g, "_");
			s = s.replace(/_+/g, "_");
			s = s.replace(/^_+|_+$/g, "");
			return s;
		}

		async function resolveAudioUrlForKey(key){
			for(const ext of AUDIO_EXTS){
				const url = `${AUDIO_DIR}/${key}.${ext}`;
				try{
					const res = await fetch(url, { method:"HEAD", cache:"no-store" });
					if(res.ok) return url;
				}catch(_e){}
			}
			return null;
		}

		async function getAudioForKey(key){
			if(!key) return null;

			if(audioCache.has(key)){
				const entry = audioCache.get(key);
				return entry.ok ? entry.audio : null;
			}

			const url = await resolveAudioUrlForKey(key);
			if(!url){
				audioCache.set(key, { audio:null, ok:false });
				return null;
			}

			const a = new Audio(url);
			a.preload = "auto";
			audioCache.set(key, { audio:a, ok:true });
			return a;
		}

		// 3) Make audio always stop any previous audio:
//    A) ADD this near your audio vars:
let currentlyPlayingAudio = null;

//    B) REPLACE playAudioKey() with this version:
async function playAudioKey(key, { rate=1.0 } = {}){
	const a = await getAudioForKey(key);
	if(!a) return;

	try{
		// Stop any other audio that might be playing (sentence or tile).
		if(currentlyPlayingAudio && currentlyPlayingAudio !== a){
			currentlyPlayingAudio.pause();
			currentlyPlayingAudio.currentTime = 0;
		}

		// Restart this audio cleanly.
		a.pause();
		a.currentTime = 0;
		a.playbackRate = rate;

		currentlyPlayingAudio = a;
		await a.play();
	}catch(_e){}
}

		// 1) REPLACE your getQuestionSpec(q) with this version
function getQuestionSpec(q){
	const type = (q && q.type) ? String(q.type) : "translate-en-es";

	let effectiveType = type;
	if(!q.type && q && q.direction){
		if(q.direction === "es-en") effectiveType = "translate-es-en";
		else if(q.direction === "en-es") effectiveType = "translate-en-es";
	}

	if(effectiveType === "translate-es-en"){
		const spanishText = q.sentence || "";
		const audioSource = q.audio ? q.audio : spanishText;
		return {
			type: effectiveType,
			badge: "ES → EN",
			promptText: spanishText,
			showSentence: true,
			audioKey: audioSource ? safeAudioNameFromText(audioSource) : null,
			audioRequired: false,
			tileLanguage: "en"
		};
	}

	if(effectiveType === "listen-es-en"){
		const spanishText = q.spanish || q.sentence || "";
		const audioSource = q.audio ? q.audio : spanishText;
		return {
			type: effectiveType,
			badge: "LISTEN ES → EN",
			promptText: "Listen and build the English translation.",
			showSentence: true,
			audioKey: audioSource ? safeAudioNameFromText(audioSource) : null,
			audioRequired: true,
			tileLanguage: "en"
		};
	}

	if(effectiveType === "listen-es-es"){
		const spanishText = q.spanish || q.sentence || "";
		const audioSource = q.audio ? q.audio : spanishText;
		return {
			type: effectiveType,
			// CHANGED: print badge should be just "LISTEN"
			badge: "LISTEN",
			promptText: "Listen and build the Spanish sentence.",
			showSentence: true,
			audioKey: audioSource ? safeAudioNameFromText(audioSource) : null,
			audioRequired: true,
			tileLanguage: "es"
		};
	}

	// Default: translate-en-es
	{
		const englishText = q.sentence || "";
		const audioSource = q.audio ? q.audio : (q.spanish || q.sentence || "");
		return {
			type: "translate-en-es",
			badge: "EN → ES",
			promptText: englishText,
			showSentence: true,
			audioKey: audioSource ? safeAudioNameFromText(audioSource) : null,
			audioRequired: false,
			tileLanguage: "es"
		};
	}
}

		function setAudioButtonsEnabled(enabled){
			els.audioBtn.disabled = !enabled;
			els.audioSlowBtn.disabled = !enabled;
		}

function setAudioButtonsVisible(visible){
	const method = visible ? "remove" : "add";
	els.audioBtn.classList[method]("isHidden");
	els.audioSlowBtn.classList[method]("isHidden");
}

		function rebuildTiles(){
			els.answerTiles.innerHTML = "";
			for(let i=0;i<chosen.length;i++){
				const t = document.createElement("button");
				t.type = "button";
				t.className = "tile";
				t.textContent = chosen[i];
				t.addEventListener("click", () => {
					if(mode !== "answering") return;
					const word = chosen.splice(i,1)[0];
					const slot = bank.find(b => b.text === word && b.used);
					if(slot) slot.used = false;
					rebuildTiles();
					updateMainButton();
				});
				els.answerTiles.appendChild(t);
			}

			els.bankTiles.innerHTML = "";
			for(const item of bank){
				const t = document.createElement("button");
				t.type = "button";
				t.className = "tile" + (item.used ? " disabled" : "");
				t.textContent = item.text;
				t.disabled = item.used || mode !== "answering";
				t.addEventListener("click", async () => {
					if(mode !== "answering") return;
					if(item.used) return;
					item.used = true;
					chosen.push(item.text);
					rebuildTiles();
					updateMainButton();

					// CHANGED: only play tile audio when the tiles are Spanish
					if(canPlayTileAudio){
						const key = safeAudioNameFromText(item.text);
						playAudioKey(key, { rate: 1.0 });
					}
				});
				els.bankTiles.appendChild(t);
			}
		}

		function updateMainButton(){
			if(mode === "answering"){
				els.mainBtn.disabled = (chosen.length === 0);
				els.mainBtn.textContent = "CHECK";
			}else{
				els.mainBtn.disabled = false;
			}
		}

		async function loadQuestion(){
			if(queue.length === 0){
				mode = "done";
				currentIndex = null;
				els.lessonPrompt.textContent = " ";
				els.bankTiles.innerHTML = "";
				els.answerTiles.innerHTML = "";
				setProgress();
				setBottomSheet("done", "Lesson complete!", "Click DONE to return to lessons.");
				updateMainButton();
				currentSentenceAudioKey = null;
				setAudioButtonsEnabled(false);
				return;
			}

			mode = "answering";
			lastResult = null;
			setBottomSheet("answering");

			currentIndex = queue.shift();
			// In loadQuestion(), put these lines in this exact order:

const q = lesson.questions[currentIndex];
const spec = getQuestionSpec(q);

// set audio key FIRST
currentSentenceAudioKey = spec.audioKey;

// SHOW only when the question is either a listening type OR the prompt itself is Spanish (translate-es-en)
const shouldShowAudioButtons =
	(spec.type === "listen-es-en") ||
	(spec.type === "listen-es-es") ||
	(spec.type === "translate-es-en");

setAudioButtonsVisible(shouldShowAudioButtons);
setAudioButtonsEnabled(shouldShowAudioButtons && !!currentSentenceAudioKey);
			canPlayTileAudio = (spec.tileLanguage === "es");

			
			/* In loadQuestion(), REPLACE whatever sets the prompt with THIS.
   (Make sure it's innerHTML, not textContent.) */

const qNumberText = `Q${currentIndex + 1}`;
const dot = "●";
const promptText = (spec.showSentence ? spec.promptText : "").trim();

els.lessonPrompt.innerHTML = `
	<span class="promptPrefix">${escapeHtml(qNumberText)} ${dot}</span>
	${escapeHtml(promptText)}
`;
			currentSentenceAudioKey = spec.audioKey;

			chosen = [];
			const bankWords = shuffle(q.bank || q.answer);
			bank = bankWords.map(w => ({ text:w, used:false }));

			rebuildTiles();
			updateMainButton();
			setProgress();

			setAudioButtonsEnabled(!!currentSentenceAudioKey);

			if(currentSentenceAudioKey) getAudioForKey(currentSentenceAudioKey);
		}

		function showFeedback(isRight){
			if(isRight){
				mode = "feedback";
				lastResult = "correct";
				setBottomSheet("correct", "Correct!", "Be sure to write that down.");
				updateMainButton();
			}else{
				queue.push(currentIndex);
				mode = "feedback";
				lastResult = "wrong";
				setBottomSheet("wrong", "Not quite...", "This question will come back later.");
				updateMainButton();
			}
		}

		function onMainButton(){
	if(mode === "answering"){
		const q = lesson.questions[currentIndex];

		const attempt = normalizeTokens(chosen);

		// Support multiple correct answers:
		// - q.answer (required) is one token array
		// - q.answerAlternates (optional) is an array of token arrays
		const candidates = [];
		if(Array.isArray(q.answer)) candidates.push(q.answer);
		if(Array.isArray(q.answerAlternates)){
			for(const alt of q.answerAlternates){
				if(Array.isArray(alt)) candidates.push(alt);
			}
		}

		let isRight = false;
		for(const cand of candidates){
			const correct = normalizeTokens(cand);
			if(attempt === correct){
				isRight = true;
				break;
			}
		}

		if(isRight){
			mastered.add(currentIndex);
		}
		showFeedback(isRight);
	}else if(mode === "feedback"){
		loadQuestion();
	}else if(mode === "done"){
		window.location.href = "../lessons";
	}
}

		function escapeHtml(s){
			return String(s)
				.replaceAll("&","&amp;")
				.replaceAll("<","&lt;")
				.replaceAll(">","&gt;")
				.replaceAll('"',"&quot;")
				.replaceAll("'","&#039;");
		}

		function buildPrintCard(q, i){
			const spec = getQuestionSpec(q);
			const card = document.createElement("div");
			card.className = "printCard";

			const sentenceLine = spec.promptText || "";

			card.innerHTML = `
				<div class="printPrompt">
					<span class="badge">${escapeHtml(spec.badge)}</span>
					<span>Q${i+1}</span>
				</div>
				<div class="printSentence">${escapeHtml(sentenceLine)}</div>
				<div class="blankLines">
					<div class="blank"></div>
					<div class="blank"></div>
				</div>
			`;
			return card;
		}

		function buildPrintHeader(title, subtitle){
			const header = document.createElement("div");
			header.className = "printHeader";

			const left = document.createElement("div");
			left.innerHTML = `
				<div class="printTitle">${escapeHtml(title)}</div>
				<div class="nameRow">
					<div class="nameLine">Name: <span>&nbsp;</span></div>
					<div class="nameLine">Date: <span>&nbsp;</span></div>
				</div>
			`;

			const right = document.createElement("div");
			right.className = "printMeta";
			right.innerHTML = `<div>${escapeHtml(subtitle)}</div>`;

			header.appendChild(left);
			header.appendChild(right);
			return header;
		}

		function estimateCardsPerPage(totalCards){
			return Math.min(16, totalCards);
		}

		function buildPrintView(){
			const title = lesson.title || "Lesson";
			const subtitle = lesson.subtitle || "";

			els.printView.innerHTML = "";

			const cardsPerPage = estimateCardsPerPage(lesson.questions.length);

			let pageIndex = 0;
			let cardIndex = 0;

			while(cardIndex < lesson.questions.length){
				const page = document.createElement("div");
				page.className = "printPage";

				if(pageIndex === 0){
					page.appendChild(buildPrintHeader(title, subtitle));
				}

				const grid = document.createElement("div");
				grid.className = "printGrid";
				page.appendChild(grid);

				const end = Math.min(cardIndex + cardsPerPage, lesson.questions.length);
				for(let i=cardIndex;i<end;i++){
					grid.appendChild(buildPrintCard(lesson.questions[i], i));
				}
				cardIndex = end;

				els.printView.appendChild(page);
				pageIndex++;
			}
		}

		async function init(){
			els.closeBtn.addEventListener("click", () => {
				window.location.href = "../lessons";
			});

			els.audioBtn.addEventListener("click", () => {
				if(!currentSentenceAudioKey) return;
				playAudioKey(currentSentenceAudioKey, { rate: 1.0 });
			});
			els.audioSlowBtn.addEventListener("click", () => {
				if(!currentSentenceAudioKey) return;
				playAudioKey(currentSentenceAudioKey, { rate: 0.75 });
			});

			els.mainBtn.addEventListener("click", onMainButton);

			els.printBtn.addEventListener("click", () => {
				buildPrintView();
				setTimeout(() => window.print(), 50);
			});

			const res = await fetch("./lesson.json", { cache:"no-store" });
			lesson = await res.json();

			els.lessonTitle.textContent = lesson.title || "Lesson";

			queue = lesson.questions.map((_, i) => i);
			mastered = new Set();

			loadQuestion();
		}

		init().catch(err => {
			console.error(err);
			els.lessonTitle.textContent = "Error loading lesson.json";
			mode = "done";
			setBottomSheet("wrong", "Error:", "Could not load lesson.json. Serve this folder with a local web server.");
			els.mainBtn.disabled = false;
			els.mainBtn.textContent = "DONE";
			els.mainBtn.onclick = () => window.location.href = "../lessons";
		});
	})();
	</script>
