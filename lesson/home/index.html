<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lessons</title>

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />

	<style>
		:root{
			--bg:#10181d;
			--panel:#17232a;
			--panel-2:#1d2d36;
			--panel-line:rgba(255,255,255,.08);
			--text:#edf6ff;
			--muted:rgba(237,246,255,.68);
			--muted-2:rgba(237,246,255,.52);
			--shadow:0 18px 36px rgba(0,0,0,.28);
			--green:#58cc02;
			--ring-bg:rgba(255,255,255,.10);
			--button:#22333d;
			--button-hover:#2a3d48;
		}

		*{ box-sizing:border-box; }
		html,body{ height:100%; }

		body{
			margin:0;
			font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
			background:var(--bg);
			color:var(--text);
		}

		.wrap{
			max-width:1220px;
			margin:0 auto;
			padding:28px 18px 56px;
		}

		.header{
			display:flex;
			flex-direction:column;
			align-items:flex-start;
			gap:10px;
			margin-bottom:26px;
		}

		.headerTitle{
			margin:0;
			font-size:38px;
			line-height:1.02;
			letter-spacing:.02em;
		}

		.headerSub{
			margin:0;
			max-width:760px;
			color:var(--muted);
			font-size:15px;
			line-height:1.4;
		}

		.topTools{
			display:flex;
			flex-wrap:wrap;
			align-items:center;
			gap:12px;
			width:100%;
			margin-top:8px;
		}

		.lessonCodeInline{
			display:flex;
			align-items:center;
			gap:8px;
			width:min(360px, 100%);
		}

		.lessonCodeInput{
			flex:1;
			min-width:0;
			height:42px;
			padding:0 14px;
			border-radius:14px;
			border:1px solid var(--panel-line);
			background:rgba(255,255,255,.04);
			color:var(--text);
			font-size:14px;
			outline:none;
			transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
		}

		.lessonCodeInput::placeholder{
			color:rgba(237,246,255,.38);
		}

		.lessonCodeInput:focus{
			background:rgba(255,255,255,.06);
			border-color:rgba(255,255,255,.18);
			box-shadow:0 0 0 4px rgba(255,255,255,.04);
		}

		.lessonCodeBtn{
			height:42px;
			padding:0 16px;
			border:none;
			border-radius:14px;
			background:#f5fbff;
			color:#122029;
			font-size:14px;
			font-weight:800;
			cursor:pointer;
			transition:transform .12s ease, filter .12s ease;
		}

		.lessonCodeBtn:hover{ filter:brightness(.97); }
		.lessonCodeBtn:active{ transform:translateY(1px); }

		.topicGrid{
			display:grid;
			grid-template-columns:repeat(auto-fit, minmax(270px, 1fr));
			gap:16px;
			align-items:stretch;
		}

		.topicCard{
			display:flex;
			flex-direction:column;
			gap:16px;
			padding:18px;
			border-radius:24px;
			background:
				linear-gradient(180deg, rgba(255,255,255,.03), transparent 34%),
				var(--panel);
			border:1px solid var(--panel-line);
			box-shadow:var(--shadow);
			min-height:250px;
		}

		.topicTop{
			display:flex;
			align-items:flex-start;
			gap:14px;
		}

		.topicMeter{
			--topic-progress:0;
			width:72px;
			height:72px;
			border-radius:999px;
			padding:6px;
			background:
				conic-gradient(
					var(--green) calc(var(--topic-progress) * 1turn),
					var(--ring-bg) 0
				);
			flex:0 0 auto;
		}

		.topicMeterInner{
			width:100%;
			height:100%;
			border-radius:999px;
			display:grid;
			place-items:center;
			background:var(--panel-2);
			border:1px solid rgba(255,255,255,.06);
			position:relative;
			overflow:hidden;
		}

		.topicMeterInner .material-symbols-rounded{
			font-variation-settings:'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 24;
			font-size:28px;
			line-height:1;
			color:#fff;
		}

		.topicBody{
			min-width:0;
		}

		.topicTitle{
			margin:0;
			font-size:21px;
			line-height:1.08;
			letter-spacing:.01em;
		}

		.topicProgressLine{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			font-size:13px;
			font-weight:800;
			color:var(--muted);
		}

		.topicProgressLine strong{
			color:var(--text);
			font-size:14px;
		}

		.progressBar{
			height:10px;
			border-radius:999px;
			background:rgba(255,255,255,.07);
			overflow:hidden;
			border:1px solid rgba(255,255,255,.06);
		}

		.progressBarFill{
			height:100%;
			width:0%;
			border-radius:999px;
			background:linear-gradient(90deg, #79e61b, var(--green));
			transition:width .2s ease;
		}

		.topicActions{
			display:flex;
			flex-wrap:wrap;
			gap:10px;
			margin-top:auto;
		}

		.primaryAction{
			display:inline-flex;
			align-items:center;
			justify-content:center;
			gap:8px;
			min-height:42px;
			padding:0 14px;
			border-radius:14px;
			background:#f3fbf4;
			color:#0f2010;
			text-decoration:none;
			font-size:14px;
			font-weight:900;
			letter-spacing:.01em;
			transition:transform .12s ease, filter .12s ease;
		}

		.primaryAction:hover{ filter:brightness(.97); }
		.primaryAction:active{ transform:translateY(1px); }

		.secondaryHint{
			color:var(--muted-2);
			font-size:12px;
			font-weight:700;
			align-self:center;
		}

		.lessonPicker{
			display:flex;
			flex-wrap:wrap;
			gap:8px;
		}

		.lessonChip{
			display:inline-flex;
			align-items:center;
			justify-content:center;
			min-height:36px;
			min-width:44px;
			padding:0 12px;
			border-radius:999px;
			border:1px solid rgba(255,255,255,.08);
			background:var(--button);
			color:var(--text);
			text-decoration:none;
			font-size:13px;
			font-weight:800;
			transition:background .15s ease, transform .12s ease, border-color .15s ease;
		}

		.lessonChip:hover{
			background:var(--button-hover);
			border-color:rgba(255,255,255,.15);
		}

		.lessonChip:active{
			transform:translateY(1px);
		}

		.lessonChip.done{
			background:rgba(88,204,2,.12);
			border-color:rgba(88,204,2,.24);
			color:#d7ffba;
		}

		.lessonChip.next{
			background:rgba(59,130,246,.14);
			border-color:rgba(59,130,246,.28);
			color:#d7ebff;
		}

		.topicComplete .topicCard,
		.topicCard.topicComplete{
			border-color:rgba(88,204,2,.16);
		}

		.emptyState{
			padding:24px;
			border-radius:22px;
			border:1px solid var(--panel-line);
			background:rgba(255,255,255,.03);
			color:var(--muted);
			font-weight:700;
		}

		.topicCount{
			color:var(--muted);
			font-size:13px;
			font-weight:800;
			margin-top:6px;
		}

		@media (max-width: 720px){
			.wrap{
				padding:20px 14px 42px;
			}

			.headerTitle{
				font-size:32px;
			}

			.topicGrid{
				grid-template-columns:1fr;
			}
		}
	</style>
</head>

<body>
	<div class="wrap">
		<div class="header">
			<h1 class="headerTitle">Lessons</h1>

			<div class="topTools">
				<div class="lessonCodeInline" aria-label="Open lesson by code">
					<input
						id="lessonCodeInput"
						class="lessonCodeInput"
						type="text"
						placeholder="Enter lesson code"
						autocomplete="off"
						autocapitalize="none"
						spellcheck="false"
					/>
					<button id="lessonCodeBtn" class="lessonCodeBtn" type="button">Go</button>
				</div>
			</div>
		</div>

		<div class="topicGrid" id="topicGrid"></div>
	</div>

	<script>
		const lessonCodeInput = document.getElementById("lessonCodeInput");
		const lessonCodeBtn = document.getElementById("lessonCodeBtn");
		const topicGrid = document.getElementById("topicGrid");

		const TOPICS = [
			{ title: "Noun gender", icon: "category", lessons: ["gender_1","gender_2","gender_3","gender_4"] },
			{ title: "Definite articles", icon: "article", lessons: ["definite_1","definite_2","definite_3","definite_4"] },
			{ title: "Indefinite articles", icon: "grid_view", lessons: ["indefinite_1","indefinite_2","indefinite_3","indefinite_4"] },
			{ title: "Subject pronouns", icon: "person", lessons: ["pronouns_1","pronouns_2","pronouns_3","pronouns_4"] },
			{ title: "Possessives", icon: "bookmark", lessons: ["possessive_1","possessive_2","possessive_3","possessive_4"] },
			{ title: "Question words", icon: "help", lessons: ["questions_1","questions_2","questions_3","questions_4"] },
			{ title: "Conjunctions", icon: "join_inner", lessons: ["conjunctions_1","conjunctions_2","conjunctions_3","conjunctions_4"] },
			{ title: "Adjectives", icon: "style", lessons: ["adjectives_1","adjectives_2","adjectives_3","adjectives_4"] },
			{ title: "Regular present tense", icon: "spellcheck", lessons: ["present_1","present_2","present_3","present_4"] },
			{ title: "Stem-changing verbs", icon: "alt_route", lessons: ["stemchange_1","stemchange_2","stemchange_3","stemchange_4"] },
			{ title: "Tener", icon: "bolt", lessons: ["tener_1","tener_2","tener_3","tener_4"] },
			{ title: "Ir", icon: "near_me", lessons: ["ir_1","ir_2","ir_3","ir_4"] },
			{ title: "Present progressive", icon: "timelapse", lessons: ["progressive_1","progressive_2","progressive_3","progressive_4"] },
			{ title: "Reflexive verbs", icon: "autorenew", lessons: ["reflexive_1","reflexive_2","reflexive_3","reflexive_4"] },
			{ title: "Preterite", icon: "event_available", lessons: ["preterite_1","preterite_2","preterite_3","preterite_4"] },
			{ title: "Irregular preterite", icon: "update", lessons: ["irregular_pret_diff_stem_1","irregular_pret_diff_stem_2","irregular_pret_diff_stem_3","irregular_pret_diff_stem_4","irregular_pret_diff_stem_5"] },
			{ title: "Imperfect tense", icon: "history_edu", lessons: ["imperfect_1","imperfect_2","imperfect_3","imperfect_4","imperfect_5"] }
		];

		function makeCompletionKey(code){
			return "duoCloneCompleted::" + encodeURIComponent(String(code || "lesson"));
		}

		function isLessonCompleted(code){
			return !!localStorage.getItem(makeCompletionKey(code));
		}

		function openLesson(code){
			window.location.href = `../index.html?l=${encodeURIComponent(code)}`;
		}

		function openLessonFromCode(){
			const code = lessonCodeInput.value.trim();
			if(!code) return;

			const safeCode = code.replace(/\s+/g, "");
			openLesson(safeCode);
		}

		function createLessonChip(code, index, nextLesson){
			const chip = document.createElement("a");
			chip.className = "lessonChip";
			chip.href = `../index.html?l=${encodeURIComponent(code)}`;
			chip.textContent = `L${index + 1}`;
			chip.title = code;

			if(isLessonCompleted(code)){
				chip.classList.add("done");
			}
			if(code === nextLesson && !isLessonCompleted(code)){
				chip.classList.add("next");
			}

			return chip;
		}

		function renderTopicCards(){
			topicGrid.innerHTML = "";

			for(const topic of TOPICS){
				const article = document.createElement("article");
				article.className = "topicCard";
				article.setAttribute("data-topic", topic.title);
				article.setAttribute("data-lessons", topic.lessons.join(","));
				article.innerHTML = `
					<div class="topicTop">
						<div class="topicMeter">
							<div class="topicMeterInner">
								<span class="material-symbols-rounded">${topic.icon}</span>
							</div>
						</div>
						<div class="topicBody">
							<h2 class="topicTitle">${topic.title}</h2>
							<div class="topicCount">${topic.lessons.length} lessons</div>
						</div>
					</div>
					<div class="topicProgressLine"><strong>0 / ${topic.lessons.length}</strong><span>completed</span></div>
					<div class="progressBar"><div class="progressBarFill"></div></div>
					<div class="topicActions">
						<a class="primaryAction" href="../index.html?l=${encodeURIComponent(topic.lessons[0])}">Start topic</a>
						<div class="secondaryHint">Choose any lesson below</div>
					</div>
					<div class="lessonPicker"></div>
				`;
				topicGrid.appendChild(article);
			}
		}

		function refreshTopicCards(){
			const cards = Array.from(topicGrid.querySelectorAll(".topicCard"));

			for(const card of cards){
				const rawLessons = (card.getAttribute("data-lessons") || "").trim();
				const lessons = rawLessons ? rawLessons.split(",").map(part => part.trim()).filter(Boolean) : [];
				const completed = lessons.filter(isLessonCompleted).length;
				const total = lessons.length;
				const nextLesson = lessons.find(code => !isLessonCompleted(code)) || lessons[0] || "";
				const ratio = total ? (completed / total) : 0;

				card.style.setProperty("--topic-progress", String(ratio));
				card.classList.toggle("topicComplete", total > 0 && completed === total);

				const progressLineStrong = card.querySelector(".topicProgressLine strong");
				const progressFill = card.querySelector(".progressBarFill");
				const primaryAction = card.querySelector(".primaryAction");
				const picker = card.querySelector(".lessonPicker");

				if(progressLineStrong){
					progressLineStrong.textContent = `${completed} / ${total}`;
				}

				if(progressFill){
					progressFill.style.width = `${Math.round(ratio * 100)}%`;
				}

				if(primaryAction && nextLesson){
					primaryAction.href = `../index.html?l=${encodeURIComponent(nextLesson)}`;
					primaryAction.textContent = completed === total ? "Review topic" : (completed === 0 ? "Start topic" : "Continue topic");
				}

				if(picker){
					picker.innerHTML = "";
					for(let i = 0; i < lessons.length; i++){
						picker.appendChild(createLessonChip(lessons[i], i, nextLesson));
					}
				}
			}
		}

		lessonCodeBtn.addEventListener("click", openLessonFromCode);

		lessonCodeInput.addEventListener("keydown", (e) => {
			if(e.key === "Enter"){
				e.preventDefault();
				openLessonFromCode();
			}
		});

		renderTopicCards();
		refreshTopicCards();
		window.addEventListener("focus", refreshTopicCards);
		window.addEventListener("storage", refreshTopicCards);
	</script>
</body>
</html>
