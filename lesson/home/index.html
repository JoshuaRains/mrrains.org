<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lesson Hub (Simple Duolingo-Style)</title>

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />

	<style>
		:root{
			--bg:#111b21;
			--text:#e7f2ff;
			--muted:rgba(231,242,255,.72);
			--shadow: 0 10px 18px rgba(0,0,0,.35);
		}

		*{ box-sizing:border-box; }
		html,body{ height:100%; }
		body{
			margin:0;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		.wrap{
			max-width: 520px;
			margin: 0 auto;
			padding: 18px 14px 44px;
		}

		.pathArea{
			position: relative;
			padding: 8px 0 16px;
		}

		.list{
			list-style:none;
			padding:0;
			margin:0;
			display:flex;
			flex-direction:column;
			gap: 22px;
			position:relative;
			z-index:1;
		}

		.rowLink{
			display:block;
			text-decoration:none;
			color:inherit;
			border-radius:18px;
			outline:none;
		}

		.row{
			display:grid;
			grid-template-columns: 160px 1fr;
			align-items:center;
			min-height: 74px;
		}

		.rowLink:focus-visible .node,
		.rowLink:hover .node{
			transform: translateY(-2px);
		}

		.rowLink:active .node{
			transform: translateY(0px) scale(.98);
		}

		.lane{
			position:relative;
			height: 74px;
		}

		.nodeWrap{
			position:absolute;
			left: calc(40px + var(--shift, 0px));
			top: 50%;
			transform: translateY(-50%);
		}

		.node{
			position:relative;
			width: 62px;
			height: 62px;
			border-radius: 999px;
			display:grid;
			place-items:center;
			box-shadow: var(--shadow);
			border: 1px solid rgba(255,255,255,.10);
			cursor:pointer;
			transition: transform .12s ease;
			outline:none;
		}

		.node::before{
			content:"";
			position:absolute;
			width: 16px;
			height: 16px;
			border-radius:999px;
			left: 14px;
			top: 12px;
			background: rgba(255,255,255,.22);
			pointer-events:none;
		}

		.material-symbols-rounded{
			font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
			color: rgba(255,255,255,.95);
			font-size: 30px;
			line-height: 1;
		}

		.title{
			font-size: 18px;
			letter-spacing: .2px;
			line-height: 1.1;
			margin: 0;
			color: var(--text);
		}

		.subtitle{
			margin: 6px 0 0;
			font-size: 12px;
			color: var(--muted);
		}

		.c-green { background:#35c759; }
		.c-blue  { background:#3b82f6; }
		.c-orange{ background:#f59e0b; }
		.c-pink  { background:#fb7185; }
		.c-purple{ background:#8b5cf6; }
		.c-teal  { background:#14b8a6; }

		@media (max-width: 420px){
			.row{ grid-template-columns: 138px 1fr; }
			.nodeWrap{ left: calc(26px + var(--shift, 0px)); }
			.title{ font-size: 16px; }
		}
	</style>
</head>

<body>
