<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Mrrains.org</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,700,1,0" rel="stylesheet">
	<style>
		:root{
			--green-1:#517860;
			--green-2:#5c8a6d;
			--green-3:#79b791;
			--green-4:#abd1b5;
			--line:#102016;
			--text:#eef5ef;
			--window-bg:#f3f7f4;
			--panel-dark:rgba(10,18,13,.82);
			--panel-line:rgba(255,255,255,.12);
			--danger:#d85e5e;
		}

		*{ box-sizing:border-box; }
		html,body{
			margin:0;
			width:100%;
			height:100%;
			font-family:'Noto Sans', sans-serif;
			background-image:url('https://i.pinimg.com/originals/b2/2a/a2/b22aa22b2f3f55b6468361158d52e2e7.gif');
			background-size:100% auto;
			background-repeat:no-repeat;
			background-color:#11222A;
			color:var(--text);
			overflow:hidden;
		}

		body.dragging-window,
		body.dragging-window *{
			user-select:none !important;
			-webkit-user-select:none !important;
			cursor:grabbing !important;
		}

		button,input{ font:inherit; }
		desktop-app{ display:none; }

		.desktop{
			position:relative;
			width:100%;
			height:100%;
			padding:18px;
		}

		.icon-grid{
			display:flex;
			flex-direction:column;
			gap:14px;
			align-items:flex-start;
			position:relative;
			z-index:1;
			padding-top:20px;
		}

		.desktop-icon{
			width:88px;
			background:transparent;
			border:none;
			color:var(--text);
			cursor:pointer;
			padding:6px;
			border-radius:12px;
			display:flex;
			flex-direction:column;
			align-items:center;
			gap:8px;
			text-align:center;
		}

		.desktop-icon:hover{ background:rgba(121,183,145,.14); }
		.desktop-icon-badge{ width:60px; height:54px; display:grid; place-items:center; flex:0 0 60px; }
		.desktop-icon-badge img{ width:60px; height:60px; object-fit:contain; display:block; }
		.desktop-icon-label{ font-size:15px; line-height:1.2; }

		.window-layer{
			position:absolute;
			inset:0;
			z-index:20;
			pointer-events:none;
		}

		.window-layer.drag-active .window:not(.dragging){ pointer-events:none; }

		.window{
			position:absolute;
			top:60px;
			left:120px;
			background:var(--window-bg);
			color:#162019;
			border:3px solid var(--line);
			border-radius:14px;
			box-shadow:0 24px 40px rgba(0,0,0,.45);
			overflow:hidden;
			pointer-events:auto;
			transform-origin:top left;
			animation:windowOpen .22s ease-out forwards;
		}

		.window.closing{ animation:windowClose .16s ease-in forwards; }
		.window.maximized{
			top:12px !important;
			left:12px !important;
			width:calc(100vw - 24px) !important;
			height:calc(100vh - 24px) !important;
		}

		.titlebar{
			height:38px;
			display:flex;
			align-items:center;
			justify-content:space-between;
			padding:0 8px 0 12px;
			background:linear-gradient(180deg, var(--green-2), var(--green-1));
			border-bottom:3px solid var(--line);
			cursor:grab;
		}

		.window.dragging,
		.window.dragging iframe{ pointer-events:none; }
		.window.dragging .titlebar{ cursor:grabbing; }
		.titlebar-left{ display:flex; align-items:center; gap:8px; min-width:0; }
		.titlebar-left img{ width:18px; height:18px; object-fit:contain; display:block; filter:none; }
		.titlebar-title{ font-size:14px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		.window-controls{ display:flex; gap:6px; }

		.win-btn{
			width:24px;
			height:24px;
			border:2px solid var(--line);
			border-radius:6px;
			background:#d9ebde;
			color:#102016;
			cursor:pointer;
			padding:0;
			display:grid;
			place-items:center;
		}

		.win-btn img{ width:14px; height:14px; object-fit:contain; display:block; filter:brightness(0); }
		.win-btn:hover{ background:#f6fcf7; }
		.win-btn.close:hover{ background:#f8d8d8; }

		.window-body{
			width:100%;
			height:calc(100% - 38px);
			background:#fff;
		}

		.window-body iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }

		.auth-app{
			height:100%;
			background:linear-gradient(180deg, #eef5ef 0%, #e4eee6 100%);
			padding:24px;
			display:flex;
			align-items:center;
			justify-content:center;
		}

		.auth-panel{
			width:min(100%, 380px);
			background:linear-gradient(180deg, rgba(81,120,96,.98), rgba(55,88,67,.98));
			border:3px solid var(--line);
			border-radius:22px;
			box-shadow:0 18px 30px rgba(0,0,0,.18);
			padding:22px;
			color:#fff;
		}

		.auth-panel h2{ margin:0 0 8px; font-size:28px; }
		.auth-panel p{ margin:0 0 18px; color:rgba(255,255,255,.86); font-size:14px; line-height:1.45; }
		.auth-status{
			margin:0 0 16px;
			padding:12px 14px;
			border-radius:16px;
			background:rgba(255,255,255,.12);
			border:1px solid rgba(255,255,255,.14);
			font-size:13px;
			line-height:1.45;
		}

		.auth-field-label{ display:block; margin-bottom:8px; font-size:13px; font-weight:700; }

		.auth-input{
			width:100%;
			height:48px;
			border-radius:14px;
			border:1px solid rgba(255,255,255,.14);
			background:rgba(255,255,255,.1);
			color:var(--text);
			padding:0 14px;
			outline:none;
		}

		.auth-input::placeholder{ color:rgba(255,255,255,.58); }
		.auth-input:focus{ border-color:var(--green-4); box-shadow:0 0 0 3px rgba(171,209,181,.18); }
		.auth-actions{ display:flex; gap:10px; margin-top:18px; }

		.auth-btn{
			border:none;
			border-radius:14px;
			height:46px;
			padding:0 16px;
			cursor:pointer;
			font-weight:700;
		}

		.auth-btn.primary{
			flex:1;
			background:#f2faf4;
			color:#254233;
		}

		.auth-btn.secondary{
			background:rgba(255,255,255,.12);
			color:#fff;
		}

		.auth-btn:disabled{ opacity:.5; cursor:not-allowed; }

		.auth-message{ min-height:22px; margin-top:12px; font-size:13px; color:#ffe0e0; }
		.auth-message.ok{ color:#def5e5; }

		@keyframes windowOpen{
			0%{ opacity:0; transform:translateY(12px) scale(.94); }
			100%{ opacity:1; transform:translateY(0) scale(1); }
		}

		@keyframes windowClose{
			0%{ opacity:1; transform:translateY(0) scale(1); }
			100%{ opacity:0; transform:translateY(10px) scale(.94); }
		}
	</style>
</head>
<body>
	<div class="desktop" id="desktop">
		<div class="icon-grid" id="iconGrid"></div>
		<div class="window-layer" id="windowLayer"></div>

		<desktop-app
			name="Login"
			icon="../assets/pixelart/profile.png"
			width="460"
			height="600"
			maximizable="false"
			newtab="false"
			authapp="true">
		</desktop-app>


		<desktop-app
			name="Music"
			icon="../assets/pixelart/disc.png"
			src="./music.html"
			width="420"
			height="720"
			maximizable="false"
			newtab="false">
		</desktop-app>

		<desktop-app
			name="Notes"
			icon="../assets/notepad.png"
			src="https://docs.google.com/document/d/1I9HiLNSHVk2UyMG52OxsewXdHC-971sikZQwMg83U2I/edit?tab=t.0"
			width="800"
			height="700"
			maximizable="true"
			newtab="true">
		</desktop-app>

		<desktop-app
			name="Grade Calculator"
			icon="../assets/calculator.png"
			src="../pages/tools/gradecalculator/index.html"
			width="850"
			height="600"
			maximizable="true"
			newtab="true">
		</desktop-app>

		<desktop-app
			name="Lessons"
			icon="../assets/pixelart/lesson.png"
			src="../pages/tools/gradecalculator/index.html"
			width="850"
			height="600"
			maximizable="true"
			newtab="true">
		</desktop-app>

		<desktop-app
			name="File Explorer"
			icon="../assets/pixelart/folder.png"
			src="./files.html"
			width="850"
			height="600"
			maximizable="true"
			newtab="true">
		</desktop-app>
	</div>


	<script type="module">
		import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
		import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

	
const firebaseConfig = {
  apiKey: "AIzaSyBJ2GgWuXk6SZRA1ZGO7FkfYjTvewqu3_4",
  authDomain: "homescreen-df0a1.firebaseapp.com",
  projectId: "homescreen-df0a1",
  storageBucket: "homescreen-df0a1.firebasestorage.app",
  messagingSenderId: "371920647149",
  appId: "1:371920647149:web:17f4f40918c03c4187ede4"
};

		const LOGIN_CANDIDATES = [
			{
				email: 'owner@mrrains.org',
				role: 'owner',
				label: 'Logged in as Mr. Rains'
			},
			{
				email: 'student@mrrains.org',
				role: 'student',
				label: 'Logged in as Student'
			}
		];

		const iconGrid = document.getElementById('iconGrid');
		const windowLayer = document.getElementById('windowLayer');
		let loginWindow = null;

		let zIndexCounter = 10;
		const openWindows = new Map();

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		await setPersistence(auth, browserLocalPersistence);

		function saveSessionMetadata(meta){
			localStorage.setItem('desktopAuthMeta', JSON.stringify(meta));
			window.dispatchEvent(new CustomEvent('desktop-auth-changed', { detail: meta }));
		}

		function clearSessionMetadata(){
			localStorage.removeItem('desktopAuthMeta');
			window.dispatchEvent(new CustomEvent('desktop-auth-changed', { detail: null }));
		}

		function readSessionMetadata(){
			try{
				return JSON.parse(localStorage.getItem('desktopAuthMeta') || 'null');
			}catch(err){
				return null;
			}
		}

		function getSessionSummary(){
			const meta = readSessionMetadata();
			const user = auth.currentUser;
			if(meta && user && user.email === meta.email){
				return {
					title: meta.label || (meta.role === 'owner' ? 'Logged in as Mr. Rains' : 'Logged in as Student'),
					email: user.email || meta.email || '',
					loggedIn: true
				};
			}
			return {
				title: 'Not signed in',
				email: 'Enter the shared password to sign in as the owner or student account.',
				loggedIn: false
			};
		}

		function renderAuthApp(){
			if(!loginWindow || !document.body.contains(loginWindow)) return;
			const body = loginWindow.querySelector('.window-body');
			const summary = getSessionSummary();
			body.innerHTML = `
				<div class="auth-app">
					<div class="auth-panel">
						<h2>Log in</h2>
						<p>This desktop uses one shared password box. It tries the owner account first, then the student account.</p>
						<div class="auth-status">
							<strong>${summary.title}</strong><br>${summary.email}
						</div>
						<label class="auth-field-label" for="loginPasswordInput">Password</label>
						<input class="auth-input" id="loginPasswordInput" type="password" autocomplete="current-password" placeholder="Enter password">
						<div class="auth-actions">
							<button class="auth-btn secondary" id="logoutBtn" type="button" ${summary.loggedIn ? '' : 'disabled'}>Log out</button>
							<button class="auth-btn primary" id="loginBtn" type="button">Log in</button>
						</div>
						<div class="auth-message" id="authMessage"></div>
					</div>
				</div>
			`;

			const passwordInput = body.querySelector('#loginPasswordInput');
			const authMessage = body.querySelector('#authMessage');
			const loginBtn = body.querySelector('#loginBtn');
			const logoutBtn = body.querySelector('#logoutBtn');

			loginBtn.addEventListener('click', () => handleLogin(passwordInput, authMessage, loginBtn));
			passwordInput.addEventListener('keydown', (e) => {
				if(e.key === 'Enter') handleLogin(passwordInput, authMessage, loginBtn);
			});

			logoutBtn?.addEventListener('click', async () => {
				await signOut(auth);
				clearSessionMetadata();
				renderAuthApp();
			});

			setTimeout(() => passwordInput.focus(), 20);
		}

		function getApps(){
			return [...document.querySelectorAll('desktop-app')].map((el, index) => ({
				id: `app-${index}`,
				name: el.getAttribute('name') || 'App',
				icon: el.getAttribute('icon') || '',
				src: el.getAttribute('src') || '',
				width: parseInt(el.getAttribute('width') || '700', 10),
				height: parseInt(el.getAttribute('height') || '500', 10),
				fixed: (el.getAttribute('fixed') || 'false') === 'true',
				maximizable: (el.getAttribute('maximizable') || 'true') !== 'false',
				newtab: (el.getAttribute('newtab') || 'false') === 'true',
				authApp: (el.getAttribute('authapp') || 'false') === 'true'
			}));
		}

		function renderIcons(){
			const apps = getApps();
			iconGrid.innerHTML = apps.map(app => `
				<button class="desktop-icon" data-app-id="${app.id}">
					<span class="desktop-icon-badge">
						<img src="${app.icon}" alt="" style="image-rendering:pixelated;">
					</span>
					<span class="desktop-icon-label">${app.name}</span>
				</button>
			`).join('');

			iconGrid.querySelectorAll('.desktop-icon').forEach(button => {
				button.addEventListener('click', () => {
					const app = apps.find(a => a.id === button.dataset.appId);
					if(app) openApp(app);
				});
			});
		}

		function openApp(app){
			if(openWindows.has(app.id)){
				focusWindow(openWindows.get(app.id));
				return;
			}

			const win = document.createElement('div');
			win.className = 'window';
			win.style.width = app.width + 'px';
			win.style.height = app.height + 'px';
			win.style.left = Math.max(120, 120 + openWindows.size * 24) + 'px';
			win.style.top = Math.max(60, 60 + openWindows.size * 24) + 'px';
			win.style.zIndex = ++zIndexCounter;
			win.dataset.appId = app.id;

			const controlsHtml = [
				app.newtab ? `<button class="win-btn newtab" aria-label="Open in new tab"><img src="../assets/vector_icons/open.svg" alt=""></button>` : '',
				app.maximizable ? `<button class="win-btn maximize" aria-label="Toggle full screen"><img src="../assets/vector_icons/toolbar.svg" alt=""></button>` : '',
				`<button class="win-btn close" aria-label="Close"><img src="../assets/vector_icons/close.svg" alt=""></button>`
			].join('');

			win.innerHTML = `
				<div class="titlebar">
					<div class="titlebar-left">
						<img src="${app.icon}" alt="">
						<span class="titlebar-title">${app.name}</span>
					</div>
					<div class="window-controls">${controlsHtml}</div>
				</div>
				<div class="window-body">${app.authApp ? '' : `<iframe src="${app.src}" title="${app.name}"></iframe>`}</div>
			`;

			if(app.authApp){
				loginWindow = win;
			}

			windowLayer.appendChild(win);
			openWindows.set(app.id, win);
			bindWindowControls(win, app);
			focusWindow(win);
			if(app.authApp) renderAuthApp();
		}

		function focusWindow(win){
			if(!win) return;
			win.style.zIndex = ++zIndexCounter;
		}

		function bindWindowControls(win, app){
			win.addEventListener('mousedown', () => focusWindow(win));

			const closeBtn = win.querySelector('.close');
			if(closeBtn){
				closeBtn.addEventListener('click', () => {
					win.classList.add('closing');
					setTimeout(() => {
						openWindows.delete(win.dataset.appId);
						if(loginWindow === win) loginWindow = null;
						win.remove();
					}, 150);
				});
			}

			const newTabBtn = win.querySelector('.newtab');
			if(newTabBtn){
				newTabBtn.addEventListener('click', () => {
					window.open(app.src, '_blank');
				});
			}

			const maximizeBtn = win.querySelector('.maximize');
			if(maximizeBtn){
				const maximizeImg = maximizeBtn.querySelector('img');
				maximizeBtn.addEventListener('click', () => {
					const isMaximized = win.classList.toggle('maximized');
					maximizeImg.src = isMaximized ? '../assets/vector_icons/stack.svg' : '../assets/vector_icons/toolbar.svg';
					focusWindow(win);
				});
			}

			const titlebar = win.querySelector('.titlebar');
			let isDragging = false;
			let dragOffsetX = 0;
			let dragOffsetY = 0;

			titlebar.addEventListener('mousedown', (e) => {
				if(e.button !== 0) return;
				if(e.target.closest('.window-controls')) return;
				if(win.classList.contains('maximized')) return;
				if(app.fixed) return;

				e.preventDefault();
				isDragging = true;
				dragOffsetX = e.clientX - win.offsetLeft;
				dragOffsetY = e.clientY - win.offsetTop;
				focusWindow(win);
				win.classList.add('dragging');
				windowLayer.classList.add('drag-active');
				document.body.classList.add('dragging-window');
				document.addEventListener('mousemove', onDrag, true);
				document.addEventListener('mouseup', stopDrag, true);
			});

			function onDrag(e){
				if(!isDragging) return;
				e.preventDefault();
				const maxLeft = Math.max(12, window.innerWidth - win.offsetWidth - 12);
				const maxTop = Math.max(12, window.innerHeight - win.offsetHeight - 12);
				const nextLeft = e.clientX - dragOffsetX;
				const nextTop = e.clientY - dragOffsetY;
				win.style.left = Math.min(Math.max(12, nextLeft), maxLeft) + 'px';
				win.style.top = Math.min(Math.max(12, nextTop), maxTop) + 'px';
			}

			function stopDrag(){
				if(!isDragging) return;
				isDragging = false;
				win.classList.remove('dragging');
				windowLayer.classList.remove('drag-active');
				document.body.classList.remove('dragging-window');
				document.removeEventListener('mousemove', onDrag, true);
				document.removeEventListener('mouseup', stopDrag, true);
			}
		}

		async function handleLogin(passwordInput, authMessage, loginBtn){
			const password = passwordInput.value.trim();

			if(!password){
				authMessage.textContent = 'Enter a password.';
				authMessage.classList.remove('ok');
				return;
			}

			loginBtn.disabled = true;
			authMessage.textContent = 'Signing in...';
			authMessage.classList.add('ok');

			let lastError = null;

			try{
				for(const candidate of LOGIN_CANDIDATES){
					try{
						await signInWithEmailAndPassword(auth, candidate.email, password);
						saveSessionMetadata({ email: candidate.email, role: candidate.role, label: candidate.label });
						authMessage.textContent = 'Logged in.';
						authMessage.classList.add('ok');
						passwordInput.value = '';
						renderAuthApp();
						return;
					}catch(err){
						lastError = err;
						const code = err?.code || '';
						if(code && code !== 'auth/invalid-credential' && code !== 'auth/wrong-password' && code !== 'auth/invalid-login-credentials' && code !== 'auth/user-not-found'){
							throw err;
						}
					}
				}

				authMessage.textContent = 'Password not recognized.';
				authMessage.classList.remove('ok');
			}catch(err){
				console.error(err);
				authMessage.textContent = err?.message || lastError?.message || 'Could not sign in.';
				authMessage.classList.remove('ok');
			}finally{
				loginBtn.disabled = false;
			}
		}


		onAuthStateChanged(auth, (user) => {
			const meta = readSessionMetadata();
			if(user && meta && user.email === meta.email){
				renderAuthApp();
			}else if(user && !meta){
				const fallbackMeta = { email: user.email || '', role: 'student', label: 'Logged in' };
				saveSessionMetadata(fallbackMeta);
				renderAuthApp();
			}else{
				clearSessionMetadata();
				renderAuthApp();
			}
		});

		renderIcons();
		const loginApp = getApps().find(app => app.authApp);
		if(loginApp){
			openApp(loginApp);
		}
	</script>
</body>
</html>
